---
# Single source of truth for the system inventory.
# Edit here, then run `make diagram` to regenerate topology.d2 + topology.svg.
#
# Provenance: every IP, FQDN and service below is taken from this repo's own
# manifests and docs (docs/install.md, clusters/*/README.md, clusters/*/apps*.yaml,
# clusters/platform/apps/*.yaml). Exceptions are marked TODO individually.
#
# Deliberately NOT tracked here: chart and app versions. Those live in
# clusters/**/*.yaml and would go stale the moment they are copied.

site:
  name: "stuttgart-things Harvester Demo Lab"
  subtitle: "Systems, hostnames, services and IP allocation"

# Optional. Used for grouping in the diagram and for a sanity check
# (does every IP fall inside a known network?).
# The cluster-internal ranges (pod 10.52.0.0/16, service 10.53.0.0/16) are
# deliberately left out - they never touch the LAN.
networks:
  - cidr: 192.168.10.0/24
    name: lab
    # Optional. Only the HTML view reads these two (address matrix);
    # gen.py ignores them. Values from docs/install.md (DD-WRT config).
    gateway: 192.168.10.1
    dhcp_pool: 192.168.10.100-192.168.10.149
    description: >-
      Flat lab and management network. Gateway, DNS and DHCP all live on the
      DD-WRT router (.1); the dynamic DHCP pool is .100-.149.
  - cidr: 192.168.8.0/24
    name: opal-lan
    # Values from clusters/sthings-edge/README.md, step 1 (Opal config).
    gateway: 192.168.8.1
    dhcp_pool: 192.168.8.100-192.168.8.249
    description: >-
      Table tennis network behind the GL.iNet Opal (Wi-Fi `sthings-edge`),
      travels with the sthings-edge box. Gateway, DNS and DHCP on the Opal
      (.1); uplink is a Wi-Fi repeater. The VIPs .20-.22 sit outside the
      DHCP pool .100-.249.
  - cidr: 10.100.136.0/24
    name: labda
    # foreign: another site's network. Only the addresses this lab uses there
    # are listed, so the page does not count the rest as free.
    foreign: true
    # Not this lab: the LabDA vSphere network the edge lab cluster runs in.
    # Gateway and DHCP pool are not recorded in this repo, so the matrix only
    # shows assigned vs. free. Addresses from clusters/edge/README.md.
    description: >-
      LabDA vSphere network (site outside this lab). Carries the edge lab
      cluster edge-tt-test1; addresses reserved in the LabDA Clusterbook,
      names under *.4sthings.tiab.ssc.sva.de.

# One entry per host. `system` groups them - entries sharing a system name
# end up in the same box in the diagram.
#
# `kind` is optional: host | k3s-cluster | rke2-cluster | hypervisor | router.
#
# `cluster` is optional and names the Kubernetes cluster a host and its
# services belong to. Values match the directories under clusters/, so the
# service index can be read against the GitOps tree. Hosts that are not part
# of a cluster (router, jump server) simply leave it out.
#
# `services` is optional and nests under the host that serves them. Services
# inherit the host's IP - that is the point: Vault and Clusterbook are both
# published on the same Cilium LB VIP and are told apart by FQDN, not address.
# Per service: `name` and `description` are required; `fqdn`, `port`, `ip` and
# `url` are optional. A service with an `fqdn` is linked as https://<fqdn>;
# set `url` when the real entry point differs (a path, a port, plain http). A service only needs its own `ip` when it gets a separate LB
# address - it then takes part in the duplicate-IP check just like a host.
hosts:
  - system: network
    hostname: ddwrt
    ip: 192.168.10.1
    kind: router
    description: >-
      DD-WRT router. Gateway, DNS (dnsmasq, *.sthings.lab) and DHCP for the lab.
    services:
      - name: dnsmasq
        port: 53
        description: >-
          DNS for *.sthings.lab. Clusterbook writes its host records here.
      - name: DHCP
        port: 67
        description: >-
          Dynamic pool .100-.149 plus the static reservation for the
          Harvester node.

  # TODO: confirm this IP - the jump server is not recorded in any repo doc.
  # .50 sits below the DHCP pool and docs/install.md names it as a free
  # static address.
  - system: jump-server
    hostname: geekom
    ip: 192.168.10.50
    kind: host
    description: >-
      Mini PC. Entry point into the lab network and launch point for
      Ansible and Dagger runs.

  - system: matrix
    hostname: matrix
    ip: 192.168.10.120
    kind: host
    description: >-
      Raspberry Pi 3B+ driving the homerun2 64x64 LED matrix (wlan0, MAC
      b8:27:eb:d9:33:db, static lease). No Kubernetes: homerun2-led-catcher
      runs under systemd, deployed by the sthings.container play. See
      hosts/matrix/README.md.
    services:
      - name: LED matrix demo UI and /display API
        fqdn: matrix.sthings.lab
        description: >-
          Caddy on 443 in front of homerun2-led-catcher (standalone mode),
          certificate from the OpenBao PKI on platform (role sthings-lab).
      - name: led-catcher (plain HTTP)
        port: 8080
        url: http://192.168.10.120:8080
        description: >-
          The catcher itself, also reachable without TLS on the LAN.

  - system: harvester
    hostname: harvester
    ip: 192.168.10.110
    kind: hypervisor
    cluster: harvester
    description: >-
      Harvester node (enp5s0, MAC 58:47:ca:7d:34:f0), statically addressed.
      Hosts the VMs of every cluster.
    services:
      - name: Harvester UI
        fqdn: harvester.sthings.lab
        description: >-
          Web UI, TLS certificate issued by openbao-pki on the platform cluster.

  - system: harvester
    hostname: harvester-vip
    ip: 192.168.10.139
    kind: host
    cluster: harvester
    description: >-
      Static cluster VIP for Harvester - UI and Kubernetes API.
      Must sit outside the DHCP pool .100-.149.
    services:
      - name: Kubernetes API
        port: 6443
        description: >-
          RKE2 API server of the Harvester cluster. Source of the kubeconfig
          fetched during install.

  - system: platform-sthings
    hostname: platform
    ip: 192.168.10.160
    kind: k3s-cluster
    cluster: platform
    description: >-
      Single-node k3s cluster `platform.sthings.lab` (Cilium LB VIP).
      Carries the developer-facing platform.
    services:
      - name: Argo CD
        fqdn: argocd.platform.sthings.lab
        description: Deploys the platform apps of this cluster.
      - name: Harbor
        fqdn: harbor.platform.sthings.lab
        description: >-
          Container registry including the project proxy for upstream images.
      - name: MinIO (S3)
        fqdn: artifacts.platform.sthings.lab
        description: >-
          S3 endpoint for the Packer golden images. Served by the sthings-lab
          private CA, referenced by harvester-images/golden-images.yaml.
      - name: MinIO console
        fqdn: artifacts-console.platform.sthings.lab
        description: Web UI for the artifact bucket.
      - name: Rancher
        fqdn: rancher.platform.sthings.lab
        description: Cluster management UI.
      - name: claim-machinery-api
        fqdn: claims.platform.sthings.lab
        description: >-
          Claim rendering API that Backstage calls for self-service
          provisioning.
      - name: Backstage
        fqdn: backstage.platform.sthings.lab
        description: >-
          Developer portal. Catalog entries come from the catalog-info.yaml
          files in this repo.
      - name: OpenBao
        fqdn: openbao.platform.sthings.lab
        description: >-
          PKI for sthings-lab (root CN=sthings.lab) and the Vault API the
          clusters use: openbao-pki ClusterIssuers log in with Kubernetes
          auth, Crossplane with AppRoles. Replaced the infra Vault (#152).
      - name: Clusterbook
        fqdn: clusterbook.platform.sthings.lab
        description: >-
          Reserves IP and FQDN for new clusters and writes the DNS records
          to the DD-WRT router. Moved here from the infra cluster.
      - name: Clusterbook operator
        description: >-
          Reconciles ClusterbookCluster resources against the Clusterbook API
          on this cluster. No ingress.
      - name: clusterscope
        fqdn: clusterscope.platform.sthings.lab
        description: >-
          Map of the lab's clusters from clusters/ in this repo, with live
          status and endpoint probes for platform itself.

  # The sthings-edge box (LattePanda) in SthingsNet: role `kiosk`, no k3s.
  # Address from clusters/sthings-edge/README.md (troubleshooting); inside the
  # DHCP pool like .110 and .139.
  - system: sthings-edge
    hostname: sthings-edge-kiosk
    ip: 192.168.10.111
    kind: host
    description: >-
      The sthings-edge box (MAC 00:e0:4c:0a:f6:ff) when it boots in SthingsNet:
      role `kiosk` (detected from the gateway), Firefox kiosk with the
      homerun2-dev tabs, k3s skipped. See clusters/sthings-edge/README.md.

  # ---------------------------------------------------------------------------
  # Table tennis network 192.168.8.0/24 (GL.iNet Opal). Everything below from
  # clusters/sthings-edge/README.md and clusters/sthings-edge/cluster-vars.yaml.
  # ---------------------------------------------------------------------------
  - system: network
    hostname: opal
    ip: 192.168.8.1
    kind: router
    description: >-
      GL.iNet Opal (GL-SFT1200, OpenWrt 18.06). Gateway, DNS (dnsmasq) and DHCP
      for the table tennis network, own Wi-Fi `sthings-edge`, uplink as a
      Wi-Fi repeater.
    services:
      - name: dnsmasq
        port: 53
        description: >-
          Local domain edge.sthings.lab: one address line per service name to
          the Gateway VIP .20, sthings-edge.com to the players' VIP .21, and
          matrix.sthings.lab to the LED matrix Pi.
      - name: DHCP
        port: 67
        description: >-
          Dynamic pool .100-.249 plus static leases for the box (.10) and the
          LED matrix Pi (.30).

  - system: sthings-edge
    hostname: sthings-edge
    ip: 192.168.8.10
    kind: k3s-cluster
    cluster: sthings-edge
    description: >-
      LattePanda Mu (N100, 8 GB, eMMC) on a LAN port of the Opal, static lease
      for enp1s0. Single-node k3s + Cilium + Flux (role `tt`) for the table
      tennis stack.
    services:
      - name: Kubernetes API
        port: 6443
        description: >-
          k3s API server; kubeconfig ~/.kube/sthings-edge, or through an SSH
          tunnel to 127.0.0.1:6443.

  - system: sthings-edge
    hostname: edge-gateway
    ip: 192.168.8.20
    kind: host
    cluster: sthings-edge
    description: >-
      Cilium L2 VIP of the Gateway `edge-gateway`, internal names
      *.edge.sthings.lab with certificates from the edge CA (OpenBao on the
      box). Resolves only inside the Opal LAN.
    services:
      - name: schmetterpause
        fqdn: schmetterpause.edge.sthings.lab
        description: Table tennis app, admin side.
      - name: Zählwerk
        fqdn: zaehlwerk.edge.sthings.lab
        description: Score counter (redirects to its login).
      - name: OpenBao
        fqdn: openbao.edge.sthings.lab
        description: >-
          PKI of the edge (intermediate signed by the edge root) and ACME
          directory under /v1/pki/acme/directory.
      - name: MinIO (S3)
        fqdn: minio.edge.sthings.lab
        description: S3 API; bucket for the CNPG backups of schmetterpause.
      - name: MinIO console
        fqdn: minio-console.edge.sthings.lab
        description: Web UI for MinIO.
      - name: led-catcher
        fqdn: led-catcher.edge.sthings.lab
        description: homerun2 LED catcher.
      - name: light-catcher
        fqdn: light-catcher.edge.sthings.lab
        description: homerun2 light catcher.
      - name: light-catcher-tabletennis
        fqdn: light-catcher-tabletennis.edge.sthings.lab
        description: >-
          homerun2 light catcher for the table; still sends to wled-mock
          until there is a real LED strip.
      - name: wled-mock
        fqdn: wled-mock.edge.sthings.lab
        description: Stand-in for the WLED strip.
      - name: config-viewer
        fqdn: config-viewer.edge.sthings.lab
        description: homerun2 config viewer.
      - name: demo-pitcher
        fqdn: demo-pitcher.edge.sthings.lab
        description: homerun2 demo pitcher.
      - name: scout
        fqdn: scout.edge.sthings.lab
        description: homerun2 scout.
      - name: core-catcher
        fqdn: core-catcher.edge.sthings.lab
        description: homerun2 core catcher.
      - name: omni-pitcher
        fqdn: omni-pitcher.edge.sthings.lab
        description: homerun2 omni pitcher (API only, no page on /).

  - system: sthings-edge
    hostname: edge-play-gateway
    ip: 192.168.8.21
    kind: host
    cluster: sthings-edge
    description: >-
      Cilium L2 VIP of the players' Gateway `edge-play-gateway`, public name
      sthings-edge.com with a Let's Encrypt wildcard (DNS-01 at Hetzner).
      Inside the Opal LAN the router answers the name locally.
    services:
      - name: schmetterpause (players)
        fqdn: schmetterpause.sthings-edge.com
        description: The players' side of schmetterpause, from their phones.

  - system: sthings-edge
    hostname: edge-redis
    ip: 192.168.8.22
    kind: host
    cluster: sthings-edge
    description: >-
      Cilium LB address of redis-stack-lb (clusters/sthings-edge/lan), own pool
      with exactly this IP. Only 6379, password-protected.
    services:
      - name: Redis
        port: 6379
        description: >-
          The `messages` stream the LED matrix Pi consumes when it is in the
          table tennis network.

  - system: matrix
    hostname: matrix-edge
    ip: 192.168.8.30
    kind: host
    description: >-
      The same LED matrix Pi (MAC b8:27:eb:d9:33:db) when it travels with the
      box: Wi-Fi `sthings-edge`, static lease on the Opal, Redis from
      edge-redis. matrix.sthings.lab points here via the Opal's dnsmasq.

  # ---------------------------------------------------------------------------
  # homerun2-dev: single-node RKE2 VM on Harvester. clusters/homerun2-dev/README.md,
  # static lease in docs/install.md.
  # ---------------------------------------------------------------------------
  - system: homerun2-dev
    hostname: homerun2-dev
    ip: 192.168.10.117
    kind: rke2-cluster
    cluster: homerun2-dev
    description: >-
      VM node of the RKE2 cluster homerun2-dev (12 vCPU / 12Gi / 50Gi,
      static lease for MAC BA:B3:3E:EA:51:F3; a rebuilt VM needs it updated).
      Flux syncs clusters/homerun2-dev. Runs the homerun2 and table tennis
      stacks of the lab.
    services:
      - name: Kubernetes API
        port: 6443
        description: RKE2 API server.

  - system: homerun2-dev
    hostname: homerun2-dev-gateway
    ip: 192.168.10.171
    kind: host
    cluster: homerun2-dev
    description: >-
      Cilium LB VIP (Clusterbook 171:ASSIGNED:DNS:homerun2-dev) of the
      Gateway homerun2-dev-sthings-gateway; *.homerun2-dev.sthings.lab with
      certificates from the OpenBao PKI on platform.
    services:
      - name: Headlamp
        fqdn: headlamp.homerun2-dev.sthings.lab
        description: Kubernetes UI.
      - name: Flux web
        fqdn: flux.homerun2-dev.sthings.lab
        description: Flux UI.
      - name: led-catcher
        fqdn: led-catcher.homerun2-dev.sthings.lab
        description: >-
          homerun2 LED catcher with its web simulator; switches between the
          `messages` and `tabletennis` streams.
      - name: light-catcher
        fqdn: light-catcher.homerun2-dev.sthings.lab
        description: homerun2 light catcher, drives the WLED strip (wled-matrix).
      - name: wled-mock
        fqdn: wled-mock.homerun2-dev.sthings.lab
        description: Stand-in for a WLED device.
      - name: core-catcher
        fqdn: core-catcher.homerun2-dev.sthings.lab
        description: homerun2 core catcher.
      - name: omni-pitcher
        fqdn: omni-pitcher.homerun2-dev.sthings.lab
        description: homerun2 omni pitcher; zaehlwerk pitches scores here.
      - name: demo-pitcher
        fqdn: demo-pitcher.homerun2-dev.sthings.lab
        description: homerun2 demo pitcher.
      - name: config-viewer
        fqdn: config-viewer.homerun2-dev.sthings.lab
        description: homerun2 config viewer.
      - name: scout
        fqdn: scout.homerun2-dev.sthings.lab
        description: homerun2 scout.
      - name: schmetterpause
        fqdn: schmetterpause.homerun2-dev.sthings.lab
        description: >-
          Table tennis league app; CNPG database backed up to MinIO on
          platform.
      - name: Zählwerk
        fqdn: zaehlwerk.homerun2-dev.sthings.lab
        description: Scoring API and panel.

  - system: homerun2-dev
    hostname: homerun2-dev-redis
    ip: 192.168.10.179
    kind: host
    cluster: homerun2-dev
    description: >-
      Cilium LB address of redis-stack-lb (clusters/homerun2-dev/redis-lb.yaml),
      own pool with only this IP; Clusterbook 179:ASSIGNED:homerun2-dev-redis,
      deliberately without DNS.
    services:
      - name: Redis
        port: 6379
        description: >-
          The `messages` stream the LED matrix Pi reads in SthingsNet
          (consumer group homerun2-led-matrix).

  - system: wled-matrix
    hostname: wled-matrix
    ip: 192.168.10.123
    kind: host
    description: >-
      WLED on an ESP32, 36 LEDs. Fed by the light-catcher on homerun2-dev
      (clusters/homerun2-dev/homerun2-light-catcher-profile.yaml).
    services:
      - name: WLED UI
        fqdn: wled-matrix.sthings.lab
        url: http://wled-matrix.sthings.lab
        description: The device's own web UI and JSON API.

  # ---------------------------------------------------------------------------
  # machinery-hv: Crossplane management cluster (ClusterStack), RKE2 VM.
  # clusters/machinery-hv/README.md, static lease in docs/install.md.
  # ---------------------------------------------------------------------------
  - system: machinery-hv
    hostname: machinery-hv
    ip: 192.168.10.105
    kind: rke2-cluster
    cluster: machinery-hv
    description: >-
      VM node of the RKE2 cluster machinery-hv (8 vCPU / 16Gi / 80Gi, static
      lease for MAC BE:64:F3:26:1A:60). Crossplane with the `machinery`
      profile and Tekton; orders whole clusters as ClusterStacks.
    services:
      - name: Kubernetes API
        port: 6443
        description: RKE2 API server.
      - name: Crossplane
        description: >-
          ClusterStack API; reached through the Kubernetes API, no ingress.

  - system: machinery-hv
    hostname: machinery-hv-gateway
    ip: 192.168.10.178
    kind: host
    cluster: machinery-hv
    description: >-
      Cilium LB VIP (Clusterbook 178:ASSIGNED:DNS:machinery-hv) of the cluster
      Gateway; *.machinery-hv.sthings.lab.
    services:
      - name: Headlamp
        fqdn: headlamp.machinery-hv.sthings.lab
        description: Kubernetes UI.
      - name: Flux web
        fqdn: flux.machinery-hv.sthings.lab
        description: Flux UI.
      - name: machinery
        fqdn: machinery.machinery-hv.sthings.lab
        description: >-
          Dashboard over the cluster's Crossplane claims (ClusterStack,
          RancherCluster, ...).

  # ---------------------------------------------------------------------------
  # crossplane-mgmt: Crossplane for the VM path, fed by Argo CD on platform.
  # Node address: static lease in docs/install.md. Distribution not recorded
  # in this repo, hence kind host.
  # ---------------------------------------------------------------------------
  - system: crossplane-mgmt
    hostname: crossplane-mgmt
    ip: 192.168.10.108
    kind: host
    cluster: crossplane-mgmt
    description: >-
      VM node of crossplane-mgmt (static lease for MAC BA:69:A8:A3:BA:28).
      Crossplane for the VM path (XVirtualMachine -> Harvester) and the
      RancherCluster order tabletennis; Argo CD on platform syncs
      clusters/crossplane-mgmt (showcase-crossplane-platform / -xrs).
    services:
      - name: Kubernetes API
        port: 6443
        description: >-
          API server; also the Argo CD cluster server URL (useFQDNAsServer:
          false).
      - name: Crossplane
        description: >-
          RancherCluster, XVirtualMachine and AnsibleRun claims; reached
          through the Kubernetes API, no ingress.

  # From the Clusterbook seed (clusters/platform-seeds/networkconfig-networks-labul.yaml,
  # 177:ASSIGNED:DNS:crossplane-mgmt). The seed is not the ledger -- confirm
  # against the live networks-labul CR on platform.
  - system: crossplane-mgmt
    hostname: crossplane-mgmt-vip
    ip: 192.168.10.177
    kind: host
    cluster: crossplane-mgmt
    description: >-
      Clusterbook reservation of crossplane-mgmt with DNS
      (*.crossplane-mgmt.sthings.lab), made by the ClusterbookCluster on
      platform for the Argo CD registration.

  # ---------------------------------------------------------------------------
  # app-dev-hv: the first ClusterStack ordered on machinery-hv
  # (clusters/machinery-hv/xrs/app-dev-hv.yaml). Address from
  # docs/demo/bare-metal-self-service.md.
  # TODO: every ClusterStack takes a second Clusterbook address for its
  # gateway/DNS reservation; app-dev-hv's is not recorded in this repo.
  # ---------------------------------------------------------------------------
  - system: app-dev-hv
    hostname: app-dev-hv
    ip: 192.168.10.176
    kind: k3s-cluster
    cluster: app-dev-hv
    description: >-
      Cluster built by Rancher on a Harvester machine pool (rancher-k3s,
      4 CPU / 8 GiB / 64 GiB), ordered as a ClusterStack on machinery-hv.
      Node address reserved in Clusterbook as app-dev-hv-node; Cilium,
      homerun2 and tabletennis come from the platform profiles via Argo CD
      on platform.
    services:
      - name: Kubernetes API
        port: 6443
        description: k3s API server, registered in Argo CD on platform.
      - name: homerun2 + tabletennis
        description: >-
          Platform profiles: homerun2 stack, schmetterpause (CNPG, backup to
          s3://app-dev-hv-schmetterpause-cnpg on platform's MinIO) and
          zaehlwerk.

  # TODO: tabletennis -- the k3s cluster ordered as a RancherCluster on
  # crossplane-mgmt (to be replaced by an order on machinery-hv; never both at once) (clusters/crossplane-mgmt/xrs/infra/tabletennis), names
  # *.tabletennis.sthings.lab. Clusterbook assigns its address automatically and
  # no repo file records it; add the node IP and the gateway VIP here once they
  # are read from the ledger (kubectl get networkconfig networks-labul -n
  # clusterbook on platform).

  # ---------------------------------------------------------------------------
  # edge (edge-tt-test1): the edge lab cluster in LabDA vSphere, the reference
  # for sthings-edge. clusters/edge/README.md.
  # ---------------------------------------------------------------------------
  - system: edge-tt-test1
    hostname: edge-tt-test1
    ip: 10.100.136.89
    kind: k3s-cluster
    cluster: edge
    description: >-
      LabDA vSphere VM (8 vCPU / 15Gi / 128Gi, Ubuntu 26.04), single-node k3s
      + Cilium + Flux; the first edge lab cluster and the reference for the
      others. Folder clusters/edge.
    services:
      - name: Kubernetes API
        port: 6443
        description: k3s API server; kubeconfig in secrets/edge (SOPS).

  - system: edge-tt-test1
    hostname: edge-tt-test1-gateway
    ip: 10.100.136.223
    kind: host
    cluster: edge
    description: >-
      Cilium L2 VIP of edge-gateway, internal names
      *.edge-tt-test1.4sthings.tiab.ssc.sva.de (LabDA Clusterbook), certificates
      from the edge CA.
    services:
      - name: schmetterpause
        fqdn: schmetterpause.edge-tt-test1.4sthings.tiab.ssc.sva.de
        description: Table tennis app, admin side.
      - name: Zählwerk
        fqdn: zaehlwerk.edge-tt-test1.4sthings.tiab.ssc.sva.de
        description: Score counter.
      - name: OpenBao
        fqdn: openbao.edge-tt-test1.4sthings.tiab.ssc.sva.de
        description: Edge PKI and ACME directory.
      - name: MinIO console
        fqdn: minio-console.edge-tt-test1.4sthings.tiab.ssc.sva.de
        description: Web UI for MinIO.
      - name: led-catcher
        fqdn: led-catcher.edge-tt-test1.4sthings.tiab.ssc.sva.de
