site_name: Systemübersicht
site_description: Generiert aus inventory.yaml
docs_dir: docs

theme:
  name: material
  language: de
  palette:
    - scheme: default
      primary: blue grey
  features:
    - navigation.top
    - content.code.copy

extra_css:
  - stylesheets/print.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: de
  - print-site:
      add_cover_page: true
      add_table_of_contents: true
      toc_title: Inhalt
      add_print_site_banner: true
      print_page_title: Gesamtdokumentation (druckbar)
      enumerate_headings: false
