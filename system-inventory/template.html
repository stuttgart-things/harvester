<title>Lab Address Book</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap">

<style>
/* Dark by design, matching the Clusterbook app - this page is a console for
   the same lab, so it wears the same clothes. No light variant on purpose:
   every colour below is painted explicitly so the page never borrows a host
   theme it was not built for. */
:root {
  color-scheme: dark;
  --ground:      #131a26;
  --surface:     #1b2432;
  --sunken:      #212c3c;
  --rule:        #2b3646;
  --rule-strong: #3d4a5d;
  --ink:         #e8edf5;
  --ink-2:       #95a3b8;
  --ink-3:       #6b7a90;
  /* Brand: violet from the logo headdress, amber from the cat, pink from the
     script. Green and orange follow the Clusterbook status language. */
  --accent:      #8b7cf0;
  --accent-deep: #a99bf6;
  --accent-wash: #262a4d;
  --violet-btn:  #5b4ae8;
  --green:       #4ade80;
  --orange:      #fb923c;
  --yellow:      #facc15;
  --pink:        #f489fb;
  /* Address matrix fills. Validated as a categorical pair on the dark
     surface - the brighter chrome orange sits outside the lightness band. */
  --static:      #8f74ff;
  --pool:        #c98500;
  --pool-soft:   #33260a;
  --free:        #222c3b;
  --shadow-sm:   0 1px 2px rgba(0, 0, 0, .5);
  --shadow-md:   0 1px 3px rgba(0, 0, 0, .5), 0 12px 32px -10px rgba(0, 0, 0, .7);
  --r-card: 14px;
  --r-ctl: 10px;
  --r-tag: 7px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.sheet {
  max-width: 1240px;
  margin: 0 auto;
  padding: 40px 28px 64px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* ---------- Masthead ---------- */

.masthead {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  text-align: center;
  padding: 8px 0 4px;
}
/* The logo sits straight on the ground rather than on a plaque: its letters
   are white and the cat is amber, both of which read on the dark. The glow
   ties it into the background instead of boxing it out of it. */
.logo-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px 0;
}
.logo-wrap::before {
  content: "";
  position: absolute;
  inset: -18% -6%;
  background: radial-gradient(ellipse at center,
    rgba(139, 124, 240, .30) 0%,
    rgba(139, 124, 240, .10) 45%,
    transparent 72%);
  filter: blur(6px);
  pointer-events: none;
}
.logo-wrap img {
  position: relative;
  display: block;
  width: 232px;
  height: auto;
}
.masthead h1 {
  margin: 0;
  font-family: "Silkscreen", "IBM Plex Mono", monospace;
  font-weight: 700;
  font-size: clamp(20px, 3.1vw, 34px);
  line-height: 1.25;
  letter-spacing: .01em;
  text-transform: uppercase;
  color: var(--accent-deep);
  text-shadow: 0 0 18px rgba(139, 124, 240, .55), 0 0 42px rgba(139, 124, 240, .25);
  text-wrap: balance;
}
.masthead .tagline {
  margin: 0;
  font-family: "Silkscreen", "IBM Plex Mono", monospace;
  font-size: clamp(10px, 1.15vw, 12px);
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--orange);
}

.stamp {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 4px;
}
.stat {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r-ctl);
  padding: 10px 18px 9px;
  min-width: 92px;
}
.stat b {
  display: block;
  font-family: "IBM Plex Mono", monospace;
  font-size: 22px;
  font-weight: 600;
  line-height: 1.1;
  color: var(--accent-deep);
  font-variant-numeric: tabular-nums;
}
.stat.is-free b { color: var(--green); }
.stat span {
  display: block;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-top: 4px;
}

.eyebrow {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent);
}

/* ---------- Tabs ---------- */

.tabs {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 3px;
  padding: 4px;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: calc(var(--r-ctl) + 5px);
  align-self: center;
}
.tabs button {
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-2);
  background: none;
  border: 0;
  border-radius: var(--r-ctl);
  padding: 9px 18px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: background .13s, color .13s;
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] {
  color: #ffffff;
  background: var(--violet-btn);
}
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tab-count {
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-3);
  background: var(--ground);
  border-radius: var(--r-tag);
  padding: 1px 7px;
  font-variant-numeric: tabular-nums;
}
.tabs button[aria-selected="true"] .tab-count {
  color: #ffffff;
  background: rgba(255, 255, 255, .2);
}

/* ---------- Cards ---------- */

.card {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r-card);
  box-shadow: var(--shadow-md);
  overflow: hidden;
}
.card-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px 24px;
  padding: 20px 24px;
  border-bottom: 1px solid var(--rule);
}
.card-head h2 {
  margin: 0;
  font-family: "Silkscreen", "IBM Plex Mono", monospace;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink);
}
.card-head .note {
  color: var(--ink-3);
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  gap: 14px;
}
#reset-layout {
  font: inherit;
  font-size: 12px;
  font-weight: 500;
  color: #ffffff;
  background: var(--violet-btn);
  border: 0;
  border-radius: var(--r-tag);
  padding: 5px 13px;
  cursor: pointer;
  transition: filter .13s;
}
#reset-layout:hover { filter: brightness(1.15); }
#reset-layout:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Topology ---------- */

.topo-layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; }
@media (max-width: 900px) {
  .topo-layout { grid-template-columns: minmax(0, 1fr); }
  .detail { border-left: 0 !important; border-top: 1px solid var(--rule); }
}

#graph { display: block; width: 100%; height: 600px; touch-action: none; }
#graph text { pointer-events: none; }

.link { stroke: var(--rule-strong); fill: none; }
.node-box { fill: var(--sunken); stroke: var(--rule-strong); stroke-width: 1.5px; }
.node-box.is-net { fill: var(--violet-btn); stroke: var(--accent); }
.node-box.is-system { fill: none; stroke: var(--rule-strong); stroke-dasharray: 3 4; }
.node-label {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 12px; font-weight: 600; fill: var(--ink);
}
.node-sub {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px; fill: var(--ink-2);
}
.node-sub.on-fill { font-size: 10px; }
.node-label.on-fill, .node-sub.on-fill { fill: #ffffff; }
.node-svc {
  font-size: 10px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase;
  fill: var(--green);
}
.system-label {
  font-size: 11px; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase;
  fill: var(--ink-3);
}
.link-label { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: var(--ink-3); }
.dimmed { opacity: .18; }
.node-g.pinned .node-box { stroke-dasharray: none; stroke: var(--accent); }
.node-g { cursor: grab; }
.node-g:active { cursor: grabbing; }
.node-g:focus-visible { outline: none; }
/* Selection wears the logo's pink, so it never collides with the violet and
   amber the data itself uses. */
.node-g:focus-visible .node-box,
.node-box.selected { stroke: var(--pink); stroke-width: 3px; }

/* ---------- Detail panel ---------- */

.detail {
  border-left: 1px solid var(--rule);
  background: var(--sunken);
  padding: 22px 24px;
  display: flex; flex-direction: column; gap: 16px;
  min-height: 0;
}
.detail .placeholder { color: var(--ink-3); font-size: 14px; }
.detail dl { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.detail dt {
  font-size: 10px; font-weight: 600;
  letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3);
}
.detail dd { margin: 3px 0 0; font-size: 14px; }
.detail dd.mono {
  font-family: "IBM Plex Mono", monospace;
  font-variant-numeric: tabular-nums;
  font-size: 15px; font-weight: 500;
}

/* ---------- Services ---------- */

.svc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 13px; }
.svc-list li { display: flex; flex-direction: column; gap: 2px; }
.svc-list .svc-name { font-weight: 600; font-size: 14px; }
.svc-list .svc-addr { font-family: "IBM Plex Mono", monospace; font-size: 12px; word-break: break-all; }
.svc-list .svc-desc { font-size: 13px; color: var(--ink-2); line-height: 1.5; }

a.ep-link {
  color: var(--accent-deep);
  text-decoration: none;
  border-bottom: 1px solid transparent;
}
a.ep-link:hover { color: var(--pink); border-bottom-color: currentColor; }
a.ep-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.ext { font-size: .85em; margin-left: 3px; opacity: .6; }

.filter-row { padding: 20px 24px 0; display: flex; flex-direction: column; gap: 7px; }
#svc-filter {
  font: inherit; font-size: 14px;
  width: 100%; max-width: 380px;
  padding: 10px 14px;
  color: var(--ink);
  background: var(--ground);
  border: 1px solid var(--rule);
  border-radius: var(--r-ctl);
  transition: border-color .13s;
}
#svc-filter::placeholder { color: var(--ink-3); }
#svc-filter:hover { border-color: var(--rule-strong); }
#svc-filter:focus { border-color: var(--accent); outline: none; }

tr.svc-row.hidden { display: none; }
.endpoint { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; white-space: nowrap; }
.endpoint.none { color: var(--ink-3); }
.on-host {
  display: block;
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px; font-weight: 400;
  color: var(--ink-3);
  margin-top: 2px;
}
.kind-tag, .cluster-tag {
  display: inline-block;
  font-size: 11px; font-weight: 600;
  letter-spacing: .06em;
  border-radius: var(--r-tag);
  padding: 2px 9px;
  white-space: nowrap;
}
.kind-tag {
  text-transform: uppercase;
  color: var(--orange);
  background: rgba(251, 146, 60, .13);
}
.cluster-tag {
  font-family: "IBM Plex Mono", monospace;
  font-weight: 500; letter-spacing: 0;
  color: var(--accent-deep);
  background: var(--accent-wash);
}
#svc-empty { padding: 0 24px 24px; color: var(--ink-3); font-size: 14px; }

/* ---------- Address matrix ---------- */

.matrix-wrap { padding: 24px; overflow-x: auto; }
.matrix { border-collapse: separate; border-spacing: 2px; font-variant-numeric: tabular-nums; }
.matrix th {
  font-family: "IBM Plex Mono", monospace;
  font-size: 10px; font-weight: 500;
  color: var(--ink-3);
  padding: 3px 5px; text-align: center;
}
.matrix th.row-head { text-align: right; padding-right: 9px; }
.matrix td { padding: 0; }
.cell {
  width: 34px; height: 27px;
  border: 1px solid transparent;
  border-radius: var(--r-tag);
  background: var(--free);
  font-family: "IBM Plex Mono", monospace;
  font-size: 10px; font-weight: 500;
  color: var(--ink-3);
  display: flex; align-items: center; justify-content: center;
  padding: 0; cursor: default;
  transition: transform .1s;
}
.cell.is-static {
  background: var(--static); border-color: var(--static);
  color: #ffffff; cursor: pointer;
}
.cell.is-static:hover { transform: scale(1.16); }
.cell.is-pool { background: var(--pool-soft); border-color: var(--pool); color: var(--ink-2); }
.cell.is-pool.is-static { background: var(--pool); border-color: var(--pool); color: #ffffff; }
.cell.is-reserved { background: transparent; border-color: var(--rule-strong); border-style: dashed; color: var(--ink-3); }
.cell.selected { outline: 2px solid var(--pink); outline-offset: 2px; }
.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.legend {
  display: flex; flex-wrap: wrap; gap: 10px 24px;
  padding: 0 24px 24px;
  font-size: 13px; color: var(--ink-2);
}
.legend span { display: inline-flex; align-items: center; gap: 9px; }
.swatch {
  width: 15px; height: 15px; border-radius: 5px;
  border: 1px solid var(--rule-strong); flex: none;
}
.swatch.static { background: var(--static); border-color: var(--static); }
.swatch.pool { background: var(--pool-soft); border-color: var(--pool); }
.swatch.free { background: var(--free); border-color: transparent; }
.swatch.reserved { background: transparent; border-style: dashed; }

/* ---------- Tables ---------- */

details.table-view > summary {
  padding: 16px 24px;
  cursor: pointer;
  font-size: 11px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--accent-deep);
  border-top: 1px solid var(--rule);
}
details.table-view > summary:hover { color: var(--pink); }
details.table-view > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.data-table-wrap { overflow-x: auto; padding: 16px 24px 24px; }
table.data { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.data th, table.data td {

table.data thead th { border-bottom-color: var(--rule-strong); }
table.data tbody tr { transition: background .1s; }
table.data tbody tr:hover { background: var(--sunken); }
table.data th {

table.data td.mono {

  white-space: nowrap;
}

th.sortable { padding: 0 16px 0 0; }
th.sortable button {
  font: inherit; color: inherit;
  letter-spacing: inherit; text-transform: inherit;
  background: none; border: 0;

  display: inline-flex; align-items: center; gap: 5px;

th.sortable button:hover { color: var(--ink); }
th.sortable button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sort-ind { font-size: 9px; line-height: 1; color: var(--ink-3); opacity: 0; }
th.sortable button:hover .sort-ind { opacity: .5; }
th[aria-sort="ascending"] button, th[aria-sort="descending"] button { color: var(--accent-deep); }
th[aria-sort="ascending"] .sort-ind,
th[aria-sort="descending"] .sort-ind { opacity: 1; color: var(--accent-deep); }

/* ---------- Tooltip ---------- */

#tip {
  position: fixed; z-index: 20;
  pointer-events: none; opacity: 0;
  transition: opacity .1s;
  background: #0a0f18;
  color: var(--ink);

  border-radius: var(--r-ctl);
  padding: 10px 13px;
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px; line-height: 1.5;

#tip b { font-weight: 600; color: var(--accent-deep); }

/* ---------- Colophon ---------- */

footer.colophon {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px 28px;

  padding-top: 18px;
  margin-top: 4px;
  font-size: 12px;

}
.build-meta { display: flex; flex-wrap: wrap; gap: 22px; }
.build-meta span {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.build-meta code {
  font-family: "IBM Plex Mono", monospace;

  letter-spacing: 0;
  text-transform: none;

}
.colophon .made-by { color: var(--ink-3); }
.colophon .made-by b { color: var(--accent-deep); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
  .cell.is-static:hover { transform: none; }
}
</style>

<script>
const DATA = /*__DATA__*/;

/* ----------------------------------------------------------------- Helpers */

const ipToInt = ip => ip.split(".").reduce((a, o) => (a << 8 >>> 0) + (+o), 0) >>> 0;
const intToIp = n => [n >>> 24, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join(".");

const net = DATA.networks[0] || null;
const hosts = DATA.hosts;
const byIp = new Map(hosts.map(h => [h.ip, h]));

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/** Free addresses in the first network - same arithmetic as the matrix note. */
function freeAddresses() {
  if (!net) return 0;
  const bits = +net.cidr.split("/")[1];
  const size = Math.min(2 ** (32 - bits), 256);
  const used = hosts.filter(h => net_contains(h.ip)).length;
  let pool = 0, staticInPool = 0;
  if (net.dhcp_pool) {
    const [a, b] = net.dhcp_pool.split("-").map(x => ipToInt(x.trim()));
    pool = b - a + 1;
    staticInPool = hosts.filter(h => {
      const n = ipToInt(h.ip);
      return n >= a && n <= b;
    }).length;
  }
  return size - 2 - used - (pool - staticInPool);
}

function net_contains(ip) {
  if (!net || !ip) return false;
  const base = ipToInt(net.cidr.split("/")[0]);
  const size = 2 ** (32 - +net.cidr.split("/")[1]);
  const n = ipToInt(ip);
  return n >= base && n < base + size;
}

/* ---------------------------------------------------------------- Masthead */

document.getElementById("site-name").textContent = DATA.site.name || "System overview";
document.getElementById("site-sub").textContent = DATA.site.subtitle || "";

const systems = [...new Set(hosts.map(h => h.system))].sort();
document.getElementById("stamp").innerHTML =
  [
    [hosts.length, "hosts", ""],
    [new Set(hosts.map(h => h.cluster).filter(Boolean)).size, "clusters", ""],
    [hosts.reduce((n, h) => n + (h.services || []).length, 0), "services", ""],
    [freeAddresses(), "free ips", " is-free"],
  ].map(([n, label, cls]) =>
    `<div class="stat${cls}"><b>${n}</b><span>${label}</span></div>`).join("");

/* ---------------------------------------------------------------- Tooltip  */

const tip = document.getElementById("tip");
function showTip(html, ev) {
  tip.innerHTML = html;
  tip.style.opacity = "1";
  const pad = 14;
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}
const hideTip = () => { tip.style.opacity = "0"; };

/* --------------------------------------------------------------- Selection */

let selected = null;

function select(hostname, { goToTopology = false } = {}) {
  selected = (selected === hostname) ? null : hostname;
  renderDetail();
  syncHighlight();
  // The detail panel lives in the topology tab, so a pick from the address
  // matrix would otherwise update something the reader cannot see.
  if (goToTopology && selected && activeTab !== "topology") showTab("topology");
}

function renderDetail() {
  const el = document.getElementById("detail");
  const h = hosts.find(x => x.hostname === selected);
  if (!h) {
    el.innerHTML = `<div class="eyebrow">Details</div>
      <p class="placeholder">Select a host in the diagram or the address matrix.</p>`;
    return;
  }
  el.innerHTML = `<div class="eyebrow">Details</div>
    <dl>
      <div><dt>Hostname</dt><dd class="mono">${h.hostname}</dd></div>
      <div><dt>IP</dt><dd class="mono">${h.ip}</dd></div>
      <div><dt>System</dt><dd>${h.system}</dd></div>
      <div><dt>Description</dt><dd>${h.description || "—"}</dd></div>
      ${h.kind || h.cluster ? `<div><dt>Kind</dt><dd>
        ${h.kind ? `<span class="kind-tag">${h.kind}</span>` : ""}
        ${h.cluster ? `<span class="cluster-tag">cluster ${h.cluster}</span>` : ""}
      </dd></div>` : ""}
      ${svcList(h)}
    </dl>`;
}

function endpoint(s) {
  if (s.fqdn) return s.fqdn;
  if (s.ip) return s.ip + (s.port ? ":" + s.port : "");
  if (s.port) return "port " + s.port;
  return "";
}

/** Where a service can actually be opened, or "" when it has no web endpoint. */
function endpointHref(s) {
  if (s.url) return s.url;                       // explicit override wins
  if (s.fqdn) return "https://" + s.fqdn;        // everything sits behind the gateway
  return "";
}

/** Endpoint as a link where one exists, plain text otherwise. */
function endpointHtml(s, cls) {
  const text = endpoint(s);
  if (!text) return `<span class="${cls} none">—</span>`;
  const href = endpointHref(s);
  if (!href) return `<span class="${cls}">${text}</span>`;
  return `<a class="${cls} ep-link" href="${href}" target="_blank" rel="noopener noreferrer"
    >${text}<span class="ext" aria-hidden="true">↗</span></a>`;
}

function svcList(h) {
  const svcs = h.services || [];
  if (!svcs.length) return "";
  const items = svcs.map(s => `<li>
      <span class="svc-name">${s.name}</span>
      ${endpoint(s) ? endpointHtml(s, "svc-addr") : ""}
      <span class="svc-desc">${s.description || ""}</span>
    </li>`).join("");
  return `<div><dt>Services (${svcs.length})</dt>
    <dd><ul class="svc-list">${items}</ul></dd></div>`;
}

function syncHighlight() {
  d3.selectAll(".node-box").classed("selected", d => d.kind === "host" && d.host.hostname === selected);
  d3.select("#graph").selectAll(".node-g, .link, .link-label")
    .classed("dimmed", d => {
      if (!selected) return false;
      if (d.kind === "host") return d.host.hostname !== selected;
      if (d.kind === "system") return d.id !== "sys:" + hosts.find(h => h.hostname === selected).system;
      if (d.kind === "net") return false;
      if (d.source) {
        const keep = ["host:" + selected, "sys:" + hosts.find(h => h.hostname === selected).system];
        return !(keep.includes(d.source.id) || keep.includes(d.target.id));
      }
      return false;
    });
  document.querySelectorAll(".cell").forEach(c => {
    c.classList.toggle("selected", c.dataset.hostname === selected && selected !== null);
  });
}

/* ------------------------------------------------------------------- Graph */

const nodes = [], links = [];
if (net) nodes.push({ id: "net", kind: "net", label: net.name || net.cidr, sub: net.cidr, fx: null });
systems.forEach(s => {
  const members = hosts.filter(h => h.system === s);
  nodes.push({ id: "sys:" + s, kind: "system", label: s, count: members.length });
  if (net) links.push({ source: "sys:" + s, target: "net", label: members.length + (members.length === 1 ? " host" : " hosts") });
  members.forEach(h => {
    nodes.push({
      id: "host:" + h.hostname, kind: "host", host: h,
      label: h.hostname, sub: h.ip,
      svcCount: (h.services || []).length,
    });
    links.push({ source: "host:" + h.hostname, target: "sys:" + s });
  });
});

const svg = d3.select("#graph");
let W = 0, H = 600;

const gLinks = svg.append("g");
const gLinkLabels = svg.append("g");
const gNodes = svg.append("g");

const link = gLinks.selectAll("path").data(links).join("path")
  .attr("class", "link")
  .attr("stroke-width", d => d.label ? 2 : 1.25);

const linkLabel = gLinkLabels.selectAll("text").data(links.filter(d => d.label)).join("text")
  .attr("class", "link-label")
  .attr("text-anchor", "middle")
  .text(d => d.label);

const node = gNodes.selectAll("g").data(nodes).join("g").attr("class", "node-g");

node.each(function (d) {
  const g = d3.select(this);
  if (d.kind === "net") {
    g.append("circle").attr("class", "node-box is-net").attr("r", 58);
    g.append("text").attr("class", "node-label on-fill").attr("text-anchor", "middle").attr("dy", "-.15em").text(d.label);
    g.append("text").attr("class", "node-sub on-fill").attr("text-anchor", "middle").attr("dy", "1.2em").text(d.sub);
  } else if (d.kind === "system") {
    g.append("rect").attr("class", "node-box is-system")
      .attr("x", -62).attr("y", -15).attr("width", 124).attr("height", 30).attr("rx", 3);
    g.append("text").attr("class", "system-label").attr("text-anchor", "middle").attr("dy", ".36em").text(d.label);
  } else {
    // Third line only when there are services - same rule as the D2 diagram:
    // the count, never the services themselves.
    const h = d.svcCount;
    const box = h ? 52 : 38;
    g.append("rect").attr("class", "node-box")
      .attr("x", -56).attr("y", -box / 2).attr("width", 112).attr("height", box).attr("rx", 2);
    g.append("text").attr("class", "node-label").attr("text-anchor", "middle")
      .attr("dy", h ? "-.75em" : "-.15em").text(d.label);
    g.append("text").attr("class", "node-sub").attr("text-anchor", "middle")
      .attr("dy", h ? ".5em" : "1.15em").text(d.sub);
    if (h) {
      g.append("text").attr("class", "node-svc").attr("text-anchor", "middle")
        .attr("dy", "1.75em").text(h === 1 ? "1 service" : h + " services");
    }
    g.attr("tabindex", 0).attr("role", "button")
      .attr("aria-label", `${d.host.hostname}, ${d.host.ip}, system ${d.host.system}`)
      .style("cursor", "pointer")
      .on("click", () => select(d.host.hostname))
      .on("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(d.host.hostname); } })
      .on("mousemove", ev => showTip(`<b>${d.host.hostname}</b> ${d.host.ip}<br>${d.host.description || ""}`, ev))
      .on("mouseleave", hideTip);
  }
});

const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(d => d.label ? 190 : 108).strength(.7))
  .force("charge", d3.forceManyBody().strength(-600))
  .force("collide", d3.forceCollide(d => d.kind === "net" ? 74 : 31).strength(1))
  .force("y", d3.forceY(H / 2).strength(.03))
  .on("tick", ticked);

node.filter(d => d.kind !== "net")
  .on("dblclick", (ev, d) => { ev.stopPropagation(); if (d.pinned) unpin(d); })
  .call(
  d3.drag()
    .on("start", (ev, d) => { if (!ev.active) sim.alphaTarget(.2).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
    // Released nodes stay put - otherwise every rearrangement springs straight
    // back into the original column. Double-click releases them again.
    .on("end", (ev, d) => {
      if (!ev.active) sim.alphaTarget(0);
      d.pinned = true;
      markPinned();
    })
);

const columnX = d => (d.kind === "system" ? W * 0.46 : W * 0.14);

function markPinned() {
  node.classed("pinned", d => !!d.pinned);
  document.getElementById("reset-layout").hidden = !nodes.some(d => d.pinned);
}

function unpin(d) {
  d.pinned = false;
  d.fx = null;
  d.fy = null;
  markPinned();
  sim.alpha(.5).restart();
}

function ticked() {
  nodes.forEach(d => {
    // Hold the columns. A circular collider cannot express "112 wide, 52 tall",
    // so it resolves an overlap sideways - cheaper for a circle - and hosts
    // drift out of their column. Fixing x leaves the simulation only y to
    // solve. Dragged nodes keep whatever position the reader gave them.
    if (!d.pinned && d.kind !== "net") d.x = columnX(d);
    // Keep nodes inside the visible frame - otherwise hosts run off the bottom.
    const padY = d.kind === "net" ? 62 : 32;
    d.x = Math.max(60, Math.min(W - 60, d.x));
    d.y = Math.max(padY, Math.min(H - padY, d.y));
  });
  link.attr("d", d => {
    const mx = (d.source.x + d.target.x) / 2;
    return `M${d.source.x},${d.source.y}C${mx},${d.source.y} ${mx},${d.target.y} ${d.target.x},${d.target.y}`;
  });
  linkLabel
    .attr("x", d => (d.source.x + d.target.x) / 2)
    .attr("y", d => (d.source.y + d.target.y) / 2 - 6);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
}

function layout() {
  const w = document.getElementById("graph").clientWidth;
  if (!w) return;   // panel hidden - showTab() calls this again when it opens
  W = w;
  svg.attr("viewBox", `0 0 ${W} ${H}`);
  const netNode = nodes.find(n => n.kind === "net");
  if (netNode) { netNode.fx = W * 0.76; netNode.fy = H / 2; }
  // Force hosts and systems into fixed columns - otherwise the rectangles
  // collide sideways, which a circular collider cannot prevent.
  sim.force("x", d3.forceX(columnX).strength(d => d.kind === "net" ? 0 : 0.9));
  sim.alpha(.9).restart();
  if (reduceMotion) { sim.stop(); for (let i = 0; i < 260; i++) sim.tick(); ticked(); }
}
document.getElementById("reset-layout").addEventListener("click", () => {
  nodes.forEach(d => { if (d.kind !== "net") { d.pinned = false; d.fx = null; d.fy = null; } });
  markPinned();
  sim.alpha(.9).restart();
});

layout();
markPinned();
addEventListener("resize", layout);

/* ---------------------------------------------------------- Address matrix */

if (net) {
  const base = ipToInt(net.cidr.split("/")[0]);
  const bits = +net.cidr.split("/")[1];
  const size = Math.min(2 ** (32 - bits), 256);
  const cols = 16;

  let poolFrom = null, poolTo = null;
  if (net.dhcp_pool) {
    const [a, b] = net.dhcp_pool.split("-").map(s => ipToInt(s.trim()));
    poolFrom = a; poolTo = b;
  }

  document.getElementById("matrix-title").textContent = `Address allocation ${net.cidr}`;
  const inNet = hosts.filter(h => ipToInt(h.ip) >= base && ipToInt(h.ip) < base + size);
  const usedCount = inNet.length;
  const poolCount = (poolFrom !== null) ? (poolTo - poolFrom + 1) : 0;
  // .110 and .139 sit inside the pool - without this they would be counted twice.
  const staticInPool = poolFrom === null ? 0
    : inNet.filter(h => ipToInt(h.ip) >= poolFrom && ipToInt(h.ip) <= poolTo).length;
  const freeCount = size - 2 - usedCount - (poolCount - staticInPool);
  document.getElementById("matrix-note").textContent =
    `${usedCount} statically assigned · ${poolCount} in DHCP pool · ${freeCount} free`;

  const tbl = document.createElement("table");
  tbl.className = "matrix";
  tbl.setAttribute("aria-label", `Address allocation ${net.cidr}`);

  const thead = tbl.createTHead().insertRow();
  thead.appendChild(document.createElement("th"));
  for (let c = 0; c < cols; c++) {
    const th = document.createElement("th");
    th.textContent = "+" + c;
    thead.appendChild(th);
  }

  const tbody = tbl.createTBody();
  for (let r = 0; r < size / cols; r++) {
    const tr = tbody.insertRow();
    const th = document.createElement("th");
    th.className = "row-head";
    th.scope = "row";
    th.textContent = "." + (r * cols);
    tr.appendChild(th);

    for (let c = 0; c < cols; c++) {
      const off = r * cols + c;
      const n = base + off;
      const ip = intToIp(n);
      const host = byIp.get(ip);
      const inPool = poolFrom !== null && n >= poolFrom && n <= poolTo;
      const reserved = off === 0 || off === size - 1;

      const td = tr.insertCell();
      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = "cell";
      cell.textContent = off;
      cell.dataset.ip = ip;

      let state;
      if (reserved) { cell.classList.add("is-reserved"); state = off === 0 ? "network address" : "broadcast address"; }
      else if (host) {
        cell.classList.add("is-static");
        if (inPool) cell.classList.add("is-pool");
        cell.dataset.hostname = host.hostname;
        state = `${host.hostname} · ${host.system}`;
        cell.addEventListener("click", () => select(host.hostname, { goToTopology: true }));
      } else if (inPool) { cell.classList.add("is-pool"); state = "DHCP pool, free"; }
      else { state = "free"; }

      cell.setAttribute("aria-label", `${ip} — ${state}`);
      cell.addEventListener("mousemove", ev => showTip(
        `<b>${ip}</b><br>${state}` + (host && host.description ? `<br>${host.description}` : ""), ev));
      cell.addEventListener("mouseleave", hideTip);
      td.appendChild(cell);
    }
  }
  document.getElementById("matrix-wrap").appendChild(tbl);

  document.getElementById("legend").innerHTML = `
    <span><i class="swatch static"></i>statically assigned</span>
    <span><i class="swatch pool"></i>DHCP pool ${net.dhcp_pool || ""}</span>
    <span><i class="swatch free"></i>free</span>
    <span><i class="swatch reserved"></i>network / broadcast address</span>`;
}

/* ------------------------------------------------------------------- Table */

const HOST_COLS = [
  { key: "ip", label: "IP" },
  { key: "hostname", label: "Hostname" },
  { key: "cluster", label: "Cluster" },
  { key: "system", label: "System" },
  { key: "description", label: "Description" },
];

const rows = [...hosts].sort((a, b) => ipToInt(a.ip) - ipToInt(b.ip));
document.getElementById("table-wrap").innerHTML =
  `<table class="data" id="host-table"><thead><tr>` +
  HOST_COLS.map(c => `<th>${c.label}</th>`).join("") +
  `</tr></thead><tbody>` +
  rows.map(h => `<tr
     data-ip="${String(ipToInt(h.ip)).padStart(10, "0")}"
     data-hostname="${h.hostname}"
     data-cluster="${h.cluster || "\uffff"}"
     data-system="${h.system}"
     data-description="${(h.description || "").slice(0, 80)}"
     data-tiebreak="${String(ipToInt(h.ip)).padStart(10, "0")}">
     <td class="mono">${h.ip}</td>
     <td class="mono">${h.hostname}</td>
     <td>${h.cluster
       ? `<span class="cluster-tag">${h.cluster}</span>`
       : `<span class="endpoint none">—</span>`}</td>
     <td>${h.system}</td>
     <td>${h.description || ""}</td>
   </tr>`).join("") +
  `</tbody></table>`;

// Same helper as the service index - the IP column sorts on a zero-padded
// integer so .9 lands before .110.
makeSortable(document.getElementById("host-table"), HOST_COLS, "ip");

/* ------------------------------------------------------------- Sortable ---- */

/**
 * Turn a rendered table into a sortable one. Rows carry their sort values in
 * data-<key> attributes, so sorting reorders existing <tr> nodes instead of
 * re-rendering - that keeps the filter's .hidden classes intact.
 */
function makeSortable(table, cols, initialKey) {
  const tbody = table.tBodies[0];
  const heads = [...table.tHead.rows[0].cells];
  let key = initialKey, dir = 1;

  cols.forEach((col, i) => {
    const th = heads[i];
    th.classList.add("sortable");
    th.setAttribute("aria-sort", "none");
    th.innerHTML = `<button type="button"><span>${col.label}</span><span class="sort-ind">\u25b2</span></button>`;
    th.querySelector("button").addEventListener("click", () => {
      dir = key === col.key ? -dir : 1;
      key = col.key;
      apply();
    });
  });

  function apply() {
    const i = cols.findIndex(c => c.key === key);
    heads.forEach((th, j) => {
      th.setAttribute("aria-sort", j === i ? (dir === 1 ? "ascending" : "descending") : "none");
      const ind = th.querySelector(".sort-ind");
      if (ind) ind.textContent = j === i && dir === -1 ? "\u25bc" : "\u25b2";
    });
    const rows = [...tbody.rows].sort((a, b) => {
      const av = a.dataset[key] || "", bv = b.dataset[key] || "";
      // numeric:true so artifacts < artifacts-console and .9 < .110 sort naturally
      const cmp = av.localeCompare(bv, undefined, { numeric: true, sensitivity: "base" });
      // Stable tie-break, otherwise equal cells shuffle between clicks.
      return (cmp || (a.dataset.tiebreak || "").localeCompare(b.dataset.tiebreak || "")) * dir;
    });
    rows.forEach(r => tbody.appendChild(r));
  }

  apply();
}

/* ----------------------------------------------------------- Service index */

const allServices = hosts.flatMap(h =>
  (h.services || []).map(s => ({
    ...s, host: h.hostname, system: h.system, cluster: h.cluster || "",
  }))
);

if (allServices.length) {
  const withEndpoint = allServices.filter(s => endpoint(s)).length;
  const clusters = new Set(allServices.map(s => s.cluster).filter(Boolean));
  const offCluster = allServices.filter(s => !s.cluster).length;
  document.getElementById("svc-note").textContent =
    `${allServices.length} across ${clusters.size} clusters · ` +
    `${offCluster} outside any cluster · ` +
    `${allServices.length - withEndpoint} without an endpoint`;

  // Services outside a cluster sort last rather than first under "".
  const clusterKey = s => s.cluster || "\uffff";
  const rows = [...allServices].sort(
    (a, b) => clusterKey(a).localeCompare(clusterKey(b)) || a.name.localeCompare(b.name)
  );

  const SVC_COLS = [
    { key: "cluster", label: "Cluster" },
    { key: "name", label: "Service" },
    { key: "endpoint", label: "Endpoint" },
    { key: "description", label: "Description" },
  ];

  // The host only earns a mention where it is not simply a restatement of the
  // cluster: when a cluster is served by more than one host, or when there is
  // no cluster at all. For the 1:1 clusters it would be pure duplication.
  const hostsPerCluster = {};
  allServices.forEach(s => {
    (hostsPerCluster[s.cluster] ||= new Set()).add(s.host);
  });
  const showHost = s => !s.cluster || hostsPerCluster[s.cluster].size > 1;

  document.getElementById("svc-wrap").innerHTML =
    `<table class="data" id="svc-table"><thead><tr>` +
    SVC_COLS.map(c => `<th>${c.label}</th>`).join("") +
    `</tr></thead><tbody>` +
    rows.map(s => {
      const ep = endpoint(s);
      return `<tr class="svc-row"
        data-host="${s.host}"
        data-name="${s.name}"
        data-endpoint="${ep}"
        data-cluster="${s.cluster || "\uffff"}"
        data-description="${(s.description || "").slice(0, 80)}"
        data-tiebreak="${s.cluster} ${s.name}"
        data-search="${[s.name, ep, s.host, s.cluster, s.system, s.description].join(" ").toLowerCase()}">
        <td>${s.cluster
          ? `<span class="cluster-tag">${s.cluster}</span>`
          : `<span class="endpoint none">—</span>`}</td>
        <td><b>${s.name}</b>${
          showHost(s) ? `<span class="on-host">on ${s.host}</span>` : ""}</td>
        <td>${endpointHtml(s, "endpoint")}</td>
        <td>${s.description || ""}</td>
      </tr>`;
    }).join("") +
    `</tbody></table>`;

  makeSortable(document.getElementById("svc-table"), SVC_COLS, "cluster");

  const filter = document.getElementById("svc-filter");
  const empty = document.getElementById("svc-empty");
  filter.addEventListener("input", () => {
    const q = filter.value.trim().toLowerCase();
    let shown = 0;
    document.querySelectorAll("tr.svc-row").forEach(tr => {
      const hit = !q || tr.dataset.search.includes(q);
      tr.classList.toggle("hidden", !hit);
      if (hit) shown++;
    });
    empty.hidden = shown > 0;
  });
} else {
  document.getElementById("svc-wrap").closest(".card").hidden = true;
}

/* ---------------------------------------------------------------- Tabs ---- */

const TABS = ["topology", "addresses", "services"];
let activeTab = null;

function showTab(name, { focus = false } = {}) {
  if (!TABS.includes(name)) name = TABS[0];
  activeTab = name;

  TABS.forEach(t => {
    const tab = document.getElementById("tab-" + t);
    const panel = document.getElementById("panel-" + t);
    const on = t === name;
    tab.setAttribute("aria-selected", String(on));
    tab.tabIndex = on ? 0 : -1;
    panel.hidden = !on;
  });

  if (focus) document.getElementById("tab-" + name).focus();

  // The graph reads clientWidth, which is 0 while its panel is hidden - so the
  // layout has to run again every time this tab becomes visible.
  if (name === "topology") layout();

  try { localStorage.setItem("tab", name); } catch (e) { /* private mode */ }
  if (location.hash.slice(1) !== name) history.replaceState(null, "", "#" + name);
}

document.querySelectorAll('[role="tab"]').forEach((tab, i, all) => {
  tab.addEventListener("click", () => showTab(tab.id.replace("tab-", "")));
  tab.addEventListener("keydown", ev => {
    const d = ev.key === "ArrowRight" ? 1 : ev.key === "ArrowLeft" ? -1 : 0;
    if (!d) return;
    ev.preventDefault();
    const next = all[(i + d + all.length) % all.length];
    showTab(next.id.replace("tab-", ""), { focus: true });
  });
});
