---
extends: default

ignore:
  - claims/cli/hacky.yaml
  - claims/infra/*/harvestervm-*.yaml
  # SOPS owns the formatting of these: it emits mac/lastmodified lines well
  # past any line-length limit and re-writes comments without a leading space.
  # Linting them would block every credential rotation for nothing.
  # .pre-commit-config.yaml excludes them for the same reason.
  - "**/*.enc.yaml"

rules:
  indentation: disable
  line-length:
    max: 200
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  document-start: disable
