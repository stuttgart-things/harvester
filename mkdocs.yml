---
site_name: Harvester
site_description: GitOps repository for Crossplane claims and infrastructure resources
repo_url: https://github.com/stuttgart-things/harvester
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/overview.md
      - Claim Lifecycle: architecture/claim-lifecycle.md
      - Claim Registry: architecture/claim-registry.md
      - Dev Image Chain: architecture/dev-image-chain.md
  - Services:
      - Claims CLI: services/claims-cli.md
      - Claim Registry API: services/claim-registry-api.md
      - Claim Status Collector: services/claim-status-collector.md
  - Edge cluster:
      - Overview: edge/index.md
      - Architecture: edge/architecture.md
      - Step by step: edge/step-by-step.md
      - Runbook (all in one): edge/runbook.md
      - k3s + Cilium: edge/k3s.md
      - From scratch: edge/from-scratch.md
      - Lab testing: edge/lab-testing.md
      - Notes: edge/notes.md
  - Guides:
      - Workstation setup: workstation.md
      - SOPS + age: sops.md
  - Runbooks:
      - Harvester Reinstall: install.md
  - Demo:
      - Self-Service auf Bare Metal: demo/bare-metal-self-service.md
  - Roadmap: roadmap.md

plugins:
  - techdocs-core

# Mermaid diagrams (docs/edge): rendered in the browser by mkdocs-material on
# GitHub Pages (system-inventory workflow builds this site into /docs/);
# Backstage TechDocs renders the same <pre class="mermaid"> blocks.
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
