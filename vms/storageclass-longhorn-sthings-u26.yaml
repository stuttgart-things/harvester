---
# Alias for the per-image StorageClass Harvester generated for the
# "sthings-u26" VM image (lh-68e4c918-0059-48bf-acaf-0de0ebe1eb65).
#
# Why it exists: harvester-vm 0.2.0 composes a PVC's storage class as
# "<storageClass>-<imageId>" (main.k:110) and offers no override, so
# bootstrap-xplane asks for "longhorn-sthings-u26". This Harvester names
# per-image classes lh-<uuid>, so that name resolves to nothing and the PVC
# would sit Pending -- the VM applies, KubeVirt never instantiates it, and
# bake-harvester trips --vmi-appear-timeout.
#
# The parameters below are copied verbatim from the generated class; the
# backingImage is what binds a volume to the image's contents. Keep them in
# sync if the image is ever re-imported under a new UUID.
#
# Delete this once the module can take a storage class verbatim.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-sthings-u26
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  backingImage: vmi-68e4c918-0059-48bf-acaf-0de0ebe1eb65
  migratable: "true"
  numberOfReplicas: "3"
  staleReplicaTimeout: "30"
