---
# Extra vars for the RKE2 cluster run on homerun2-dev, for the
# `execute-ansible` entrypoint. The README passes the same values to
# `bake-harvester` as a space-separated --ansible-parameters string; CI checks
# that the two agree (vms-lint.yml).
#
# Same set as bootstrap-xplane.rke2.ansible-vars.yaml apart from cluster_name.
# That file's values came from the singlenode RKE2 clusters in the ansible repo
# (exec/labul/philly-rke2) and ran green end to end on 2026-09-02.

# This VM has one 50Gi root disk and no data disk, so the role's LVM path has
# nothing to manage. Without it sthings.baseos.setup fails with
# "Error while resolving value for 'lvm_device_auto': 'lvm_disk' is undefined".
manage_filesystem: false

rke_state: present
rke2_k8s_version: 1.35.3
rke2_release_kind: rke2r1

cluster_setup: singlenode
cluster_name: homerun2-dev

# Cilium is NOT an RKE2 built-in CNI. The sthings.rke role installs it via Helm,
# gated on install_cilium=true AND rke2_cni=none -- setting only one of the two
# gives you either no CNI or RKE2's own Canal, quietly.
#
# The cluster needs Cilium specifically: the infra bundle's cilium-lb and
# cilium-gateway components apply CiliumLoadBalancerIPPool and a Gateway, which
# Canal cannot serve.
rke2_cni: none
install_cilium: true
disableKubeProxy: true

# The role has a working default source for the image archive; no mirror URL is
# set here. Pulling it takes several minutes on first run.
rke2_airgapped_installation: true
prepare_rancher_ha_nodes: true

install_helm_diff: false
registry_mirror_url: https://registry-1.docker.io
fetched_kubeconfig_path: /tmp/kubeconfig
