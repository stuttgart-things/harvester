---
# KCL parameters for the harvester-vm module, rendered and applied by
# blueprints' bake-harvester. See vms/README.md for the call.
#
# Mounted into the render container as a file rather than passed as
# --kcl-parameters, because inline parameter values become operation
# arguments and are echoed verbatim by `dagger --progress plain`.
#
# Values match vms/xplane.yaml, the VM this replaces the hand-rolled
# render for, except for imageId: xplane.yaml names "upstream", which does
# not exist on the cluster (nor does its storage class). See the note on the
# root disk below.

vmName: bootstrap-xplane
namespace: default

# Root disk.
#
# imageId picks a golden sthings-* image on purpose: those carry the password
# auth ANSIBLE_USER/ANSIBLE_PASSWORD expect. The *-dev images trust only the
# cloud-init key, and Ansible gets "Permission denied (publickey)".
#
# storageClassName is taken verbatim by harvester-vm 0.3.0 (blueprints/vm
# v3.2.1). It is the class Harvester generated for this image -- look it up
# rather than guessing, the UUID is per-image and per-cluster:
#
#   kubectl get virtualmachineimages -n default \
#     -o custom-columns='NAME:.metadata.name,SC:.status.storageClassName'
#
# The predecessor composed the class as "<storageClass>-<imageId>" with no
# override, which no current Harvester can satisfy -- see blueprints#197. Do
# not reintroduce a bare `storageClass:` here: on 0.3.0 an unset
# storageClassName falls back to that composition, which resolves to a class
# that does not exist, and the PVC then sits Pending while the VirtualMachine
# looks applied. It fails as a timeout, not as an error.
imageId: sthings-u26
imageNamespace: default
storage: 50Gi
storageClassName: lh-68e4c918-0059-48bf-acaf-0de0ebe1eb65

# Machine
cpuCores: 12
memory: 12Gi
description: crossplane management cluster bootstrap vm

# Network. networkName is joined with networkNamespace by the module,
# giving the multus network default/vms.
networkName: vms
networkNamespace: default

# NOTE ON CREDENTIALS -- read before the first run.
#
# cloudInitUsername, cloudInitPassword and cloudInitSshKey are deliberately
# absent here. The KCL module falls back to a hardcoded password and a
# placeholder SSH key ("ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC..."), so
# leaving them unset does NOT leave the VM without a login -- it gives every
# VM the same well-known one, and a key nobody holds.
#
# Supply them from the SOPS-encrypted variant instead:
#
#   --encrypted-file ./vms/bootstrap-xplane.params.enc.yaml \
#   --sops-key env:SOPS_AGE_KEY
#
# which carries these same keys plus cloudInitPassword and cloudInitSshKey.
# Pass either that or this file, never both -- the module rejects it.
