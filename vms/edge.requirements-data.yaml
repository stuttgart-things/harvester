---
# Requirements data for `bake-harvester` / `execute-ansible`
# (--requirements-data), rendered by blueprints' configuration module into the
# requirements.yaml the Ansible container installs.
#
# WHY THIS FILE EXISTS. Without --requirements-data, blueprints/vm loads
# stuttgart-things/ansible templates/requirements-data.yaml from main. As of
# 2026-10-03 that still pins sthings-rke 26.730.1176, which bundles a
# deploy-configure-rke without cilium_chart_version and k3s_cluster_init.
# Those two vars would be silently ignored: the edge would get the cli-default
# Cilium and embedded etcd. harvester's own requirements.yaml is NOT read by
# bake-harvester.
#
# Same structure as the upstream file, with the sthings collections pinned to
# the 2026-10-03 releases (rke 26.1003.1399 = deploy-configure-rke 2026.10.03-1).
# Keep in step with ../requirements.yaml.
gitCollections:
  ansible.netcommon: 8.7.1
  ansible.posix: 2.2.2
  awx.awx: 24.6.1
  community.crypto: 3.4.0
  community.docker: 5.3.0
  community.general: 13.4.0
  community.hashi_vault: 7.1.0
  community.vmware: 7.0.0
  kubernetes.core: 6.6.0

artifactCollections:
  - https://github.com/stuttgart-things/ansible/releases/download/sthings-container-26.1002.1398/sthings-container-26.1002.1398.tar.gz
  - https://github.com/stuttgart-things/ansible/releases/download/sthings-baseos-26.1003.1399/sthings-baseos-26.1003.1399.tar.gz
  - https://github.com/stuttgart-things/ansible/releases/download/sthings-rke-26.1003.1399/sthings-rke-26.1003.1399.tar.gz
