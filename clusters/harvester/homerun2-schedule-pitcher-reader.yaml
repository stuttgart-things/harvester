---
# Read access for the homerun2-schedule-pitcher agent on homerun2-dev
# (clusters/homerun2-dev/homerun2-schedule-pitcher-agent.yaml), which checks
# from there that every Longhorn volume is healthy (#573,
# stuttgart-things/homerun2-schedule-pitcher#64).
#
# Applied BY HAND on the Harvester cluster -- no Flux syncs this directory:
#   kubectl --kubeconfig ~/.kube/harvester apply -f clusters/harvester/homerun2-schedule-pitcher-reader.yaml
#
# get/list on Longhorn volumes, nothing else: no Secrets, no write. The token
# Secret below is the long-lived ServiceAccount token Kubernetes fills in; it
# goes, as a kubeconfig, into
# clusters/homerun2-dev/homerun2-schedule-pitcher-agent-harvester.enc.yaml.
# Deleting the Secret revokes it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homerun2-schedule-pitcher-reader
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homerun2-schedule-pitcher-reader
rules:
  - apiGroups: [longhorn.io]
    resources: [volumes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homerun2-schedule-pitcher-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homerun2-schedule-pitcher-reader
subjects:
  - kind: ServiceAccount
    name: homerun2-schedule-pitcher-reader
    namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: homerun2-schedule-pitcher-reader-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: homerun2-schedule-pitcher-reader
type: kubernetes.io/service-account-token
