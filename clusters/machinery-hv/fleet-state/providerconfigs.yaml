---
# provider-kubernetes configs for the two OTHER clusters this one drives. The
# `in-cluster` one comes from the flux machinery profile.
#
# Same names and Secret shapes as on crossplane-mgmt, so an order written for
# either cluster names the same configs. Both Secrets are SOPS-encrypted in
# ./secrets/ and decrypted by Flux; until they exist these configs are inert,
# and the first XR that uses one fails with the Secret named in the error.
---
# The Harvester cluster: HarvesterVM composes KubeVirt VirtualMachines, PVCs and
# cloud-init Secrets through this. Named by providerConfigRef in the
# harvestervm-sthings-lab EnvironmentConfig.
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: ClusterProviderConfig
metadata:
  name: harvester
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: harvester-kubeconfig
      key: kubeconfig
---
# The Rancher management cluster (`platform`): the rancher-cluster child
# creates the provisioning.cattle.io Cluster and its HarvesterConfig there, and
# registers the cluster with Argo CD and clusterbook (argocdProviderConfigRef).
#
# The credential is the SCOPED ServiceAccount crossplane-machinery on platform
# (clusters/platform/crossplane-machinery-access.yaml), not platform's admin
# kubeconfig (until 2026-09-28). A new order therefore sets
# `spec.rancher.clusterAnnotations: {field.cattle.io/no-creator-rbac: "true"}`
# -- see xrs/README.md rule 5.
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: ClusterProviderConfig
metadata:
  name: rancher-mgmt
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: rancher-mgmt-kubeconfig
      key: kubeconfig
---
# provider-minio against platform's MinIO (artifacts.platform.sthings.lab):
# what crossplane-configurations storage/minio's MinioBucket XRs compose
# buckets, policies and users with -- first use, the per-cluster CloudNativePG
# backup buckets of schmetterpause (../xrs/).
#
# The credential is the dedicated MinIO user `crossplane` (policy
# crossplane-admin: user/policy admin + s3:* on buckets), NOT the root account.
# render-fleet-secrets.sh step M creates it inside the MinIO pod and encrypts
# its keys; the same step rotates them.
#
# TLS: the ProviderConfig has no CA field. The provider trusts the lab root
# through its DeploymentRuntimeConfig `provider-minio` (SSL_CERT_FILE from
# crossplane-system/vault-pki-ca, CN=sthings.lab), which already verifies this
# endpoint (checked 2026-09-28).
apiVersion: minio.crossplane.io/v1
kind: ProviderConfig
metadata:
  name: minio
spec:
  minioURL: https://artifacts.platform.sthings.lab
  credentials:
    apiSecretRef:
      name: minio-crossplane
      namespace: crossplane-system
