# What the chart's templates/deploymentruntimeconfig.yaml renders, verbatim
# (chart 0.2.0): the CA for the Vault client -- api.DefaultConfig() reads
# VAULT_CACERT -- and a STABLE ServiceAccount name, because the chart's RBAC
# binds `provider-kubeconfig` and Crossplane would otherwise name the SA after
# the package revision hash.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-kubeconfig
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-kubeconfig
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              env:
                - name: VAULT_CACERT
                  value: /etc/vault-ca/ca.crt
              volumeMounts:
                - name: vault-ca
                  mountPath: /etc/vault-ca
                  readOnly: true
          volumes:
            - name: vault-ca
              secret:
                secretName: vault-pki-ca # pragma: allowlist secret
---
# provider-minio, as LabDA's provider-minio-runtime.yaml: its ProviderConfig has
# no CA field, so the trust comes from SSL_CERT_FILE in the pod. There is no
# MinIO ProviderConfig on this cluster yet -- this only lets the provider start
# (the profile references the config, so without it the package is unhealthy).
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-minio
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              env:
                - name: SSL_CERT_FILE
                  value: /etc/ssl/lab/ca.crt
              volumeMounts:
                - name: lab-ca
                  mountPath: /etc/ssl/lab
                  readOnly: true
          volumes:
            - name: lab-ca
              secret:
                secretName: vault-pki-ca # pragma: allowlist secret
