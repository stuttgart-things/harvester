---
# The two DeploymentRuntimeConfigs the flux machinery profile points providers
# at and does not ship, and the CA both of them mount.
#
# PLAIN MANIFESTS, NOT THE CHART'S. provider-kubeconfig-vault renders its own
# `provider-kubeconfig` config -- but in the SAME Helm release as a
# ClusterProviderConfig of kind kubeconfig.stuttgart-things.com, whose CRD only
# exists once the provider runs, which needs this config first. Helm refuses the
# whole release on the unknown kind:
#
#   unable to build kubernetes objects from release manifest: resource mapping
#   not found for name: "vault-kubeconfigs" ... no matches for kind
#   "ClusterProviderConfig" -- ensure CRDs are installed first
#
# so on a fresh cluster the config never came and the provider never started
# (machinery-hv, 2026-09-24). Split: this file brings the config and the CA
# unconditionally; provider-kubeconfig.yaml keeps the chart for the
# ClusterProviderConfig and the RBAC, drops the chart's copy of this config with
# a post-renderer, and retries until the CRD is there.
#
# Neither Provider CR is patched here -- the profile already names both configs
# (catalog 0.9.0 / 0.10.0).
apiVersion: v1
kind: Secret
metadata:
  # The name the chart gives it and both configs below mount.
  name: vault-pki-ca
  namespace: crossplane-system
type: Opaque
stringData:
  # The OpenBao root, byte-identical to openbao-pki-source-ca.yaml and to
  #   curl -sk https://openbao.platform.sthings.lab/v1/pki/ca/pem
  # (checked 2026-09-24). Public. The only CA this lab's Vault and -- once one
  # exists -- its MinIO are signed by.
