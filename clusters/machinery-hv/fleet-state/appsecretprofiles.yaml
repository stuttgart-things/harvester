---
# The AppSecretProfiles a rancher-mode ClusterStack's app profiles fetch. Copied
# from stuttgart-things clusters/labda/vsphere/machinery-fleet-state/
# appsecretprofiles.yaml (itself from crossplane-configurations
# bootstrap/cluster/examples/app-secret-profiles.yaml) -- refresh from there,
# do not edit the shape here.
#
# Cluster-scoped XRs: a profile decides which secrets every order of an app
# receives, so only an admin changes one. Removing one breaks every order of
# that app.
#
# The `backup` entry of schmetterpause reads the shared `object-store-backup`,
# which cluster-vault-sthings-lab.yaml does not define yet: this lab has no S3
# target for CloudNativePG backups. Add it there before an order uses
# schmetterpause.
apiVersion: secrets.stuttgart-things.com/v1alpha1
kind: AppSecretProfile
metadata:
  name: homerun2
spec:
  mount: homerun2
  entries:
    - suffix: ""
      keys:
        redisPassword:
          generate: {length: 32}
          overridable: true
        authToken:
          generate: {length: 32}
          overridable: true
        githubToken:
          shared: git-pat
---
apiVersion: secrets.stuttgart-things.com/v1alpha1
kind: AppSecretProfile
metadata:
  name: schmetterpause
spec:
  mount: schmetterpause
  entries:
    - suffix: ""
      keys:
        username:
          literal: schmetterpause
        password:
          generate: {length: 32}
          overridable: true
        session-key:
          generate: {length: 64}
          overridable: true
    - suffix: "-scoreboard"
      keys:
        token:
          generate: {length: 32}
          overridable: true
    - suffix: "-backup"
      keys:
        access_key:
          shared: object-store-backup
        secret_key:
          shared: object-store-backup
---
apiVersion: secrets.stuttgart-things.com/v1alpha1
kind: AppSecretProfile
metadata:
  name: zaehlwerk
spec:
  reads:
    omni-pitcher-token:
      from: {app: homerun2, key: authToken}
    redis-password:
      from: {app: homerun2, key: redisPassword}
    schmetterpause-token:
      from: {app: schmetterpause, suffix: "-scoreboard", key: token}
---
apiVersion: secrets.stuttgart-things.com/v1alpha1
kind: AppSecretProfile
metadata:
  name: tabletennis
spec:
  reads:
    redisPassword:
      from: {app: homerun2, key: redisPassword}
