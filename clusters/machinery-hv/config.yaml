apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: '1h'
    fluxcd.controlplane.io/reconcileTimeout: '5m'
spec:
  distribution:
    version: '2.8.5'
    registry: ghcr.io/fluxcd
    artifact: oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests
  components:
  - source-controller
  - kustomize-controller
  - helm-controller
  - notification-controller
  - image-reflector-controller
  - image-automation-controller
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
    domain: cluster.local
  kustomize:
    patches:
    - patch: |- # pragma: allowlist secret
        - op: add
          path: /spec/decryption
          value:
            provider: sops
            secretRef:
              name: sops-age
      target:
        group: kustomize.toolkit.fluxcd.io
        version: v1
        kind: Kustomization
    - target:
        kind: Deployment
        name: (kustomize-controller|helm-controller)
      patch: |-
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --concurrent=10
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --requeue-dependency=5s
  sync:
    kind: GitRepository
    url: https://github.com/stuttgart-things/harvester
    # Back on main since #249 merged (f219d7a). It synced
    # feat/machinery-hv-scaffold while clusters/machinery-hv existed only there.
    #
    # If this ever has to point at a branch again: the value lives here AND in
    # the live FluxInstance, and they move together -- this file is inside the
    # synced path, so patching only the cluster is undone by the next reconcile.
    # Order on the way back: merge, then patch the live instance, then delete
    # the branch (clusters/homerun2-dev/README.md, step 4).
    ref: refs/heads/main
    path: clusters/machinery-hv
    pullSecret: git-token-auth # pragma: allowlist secret
