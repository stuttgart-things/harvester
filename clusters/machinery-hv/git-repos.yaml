---
# The Git sources every Kustomization on this cluster pulls from.
#
# PINNED TO A TAG, unlike homerun2-dev's `branch: main`. This cluster exists to
# run the flux `machinery` Crossplane profile, and that profile only becomes the
# one this cluster needs at v1.80.0 (catalog 0.10.0: provider-vault/-minio
# pinned, the runtime configs, provider-kubeconfig's runtimeConfigRef --
# stuttgart-things/flux#506). On `main` a package bump would reach the
# management cluster the moment it merges; a tag makes it a reviewed change
# here. Same reason clusters/labda/vsphere/machinery in stuttgart-things pins
# one tag for all three bundles.
#
# v1.80.1 (2026-09-24) differs from v1.80.0 only in the coredns-lab-zone
# component (serve_stale, flux#515) -- the Crossplane profile is unchanged.
#
# v1.80.3 (2026-09-25) changes nothing this cluster renders: the
# crossplane-capabilities passthrough (flux#514, not selected here), the
# schmetterpause alerts, and bumps to external-secrets / velero (not selected)
# and to the cicd-platform profile's function-go-templating (the machinery
# profile pins its own).
#
# v1.94.3 (2026-09-28) changes one object this cluster renders: the
# `cluster` Configuration in the machinery profile, v0.11.10 -> v0.12.3
# (flux#562-#564). That is the ClusterStack machine-pool path (xplane-cluster
# 0.22.0, harvester#265) plus two additive changes: extraPlaybooks and the kargo
# profile (xplane-cluster 0.23.x). Checked by rendering every path and bundle
# this cluster pulls at both tags: everything else is byte-identical. The
# bundle's CROSSPLANE_VERSION default moves to 2.4.2, but the machinery profile
# pins the chart to 2.3.3 over it (install/catalog-patch.yaml), so nothing
# changes there. Taken through the tag, not the in-place patch harvester#265
# step 4 planned: crossplane-configs owns that Configuration and would revert
# a patch on its next reconcile.
#
# Both objects point at the same tag. They are two because the bundles name
# their source separately (FLUX_SOURCE / APPS_SOURCE); keep them in step.
#
# flux-bootstrap does NOT create these -- see clusters/homerun2-dev/README.md,
# step 5.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-infra
  namespace: flux-system
spec:
  interval: 10m0s
  ref:
    tag: v1.94.3
  url: https://github.com/stuttgart-things/flux.git
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-apps
  namespace: flux-system
spec:
  interval: 10m0s
  ref:
    tag: v1.94.3
  url: https://github.com/stuttgart-things/flux.git
