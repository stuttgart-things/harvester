---
# kube-prometheus-stack for this cluster (harvester#753, from #490). Same as
# ../homerun2-dev/kube-prometheus-stack.yaml, which explains why it is a local
# stack per cluster and not remote-write to platform. What differs:
#
# ALERTS go to homerun2-dev's omni-pitcher through its Gateway, HTTPS
# (this cluster runs no homerun2), on /pitch/alertmanager like platform's.
# The certificate there is issued by the lab's OpenBao PKI: the
# alertmanager-webhook-ca component mounts the ConfigMap cluster-trust-bundle
# from ./observability-trust-bundle.yaml (no trust-manager here).
#
# TOKEN: HOMERUN2_OMNI_PITCHER_AUTH_TOKEN, the variable the flux release reads,
# from its own SOPS Secret ./kube-prometheus-stack-secrets.enc.yaml -- a copy of
# that key in ../homerun2-dev/homerun2-secrets-subst.enc.yaml, NOT tied to
# platform's k8s-pitcher pilot Secret (#753). Rotating the pitcher token means
# updating both files. Not optional: without the Secret this stops instead of
# rolling out the release's `changeme` token.
#
# GRAFANA: https://grafana.machinery-hv.sthings.lab, login with ZITADEL as on
# platform (../platform/infra.yaml): client `grafana-machinery-hv` in
# ../platform/zitadel-config/apps.auto.tfvars, id and secret in the SOPS Secret
# ./grafana-oidc-zitadel.enc.yaml. grafana-admin => Admin, grafana-readonly =>
# Viewer, nobody else (role_attribute_strict). The local `admin` with its
# generated password stays as fallback (see homerun2-dev's file for how to read
# it). ZITADEL's certificate verifies against cluster-trust-bundle
# (./observability-trust-bundle.yaml).
#
# RESOURCES (checked 2026-11-19): 1 node, 8 CPU / 16 GiB, requests 35% CPU /
# 28% memory, ~10.8 GiB in use; the stack requests ~200m / ~800Mi. ~46 GiB
# free on the root disk that openebs-hostpath writes to.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: infrastructure
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  dependsOn:
    - name: cilium-gateway
    - name: openebs
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/kube-prometheus-stack
  components:
    - components/alertmanager-webhook-ca
  prune: true
  wait: true
  patches:
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: kube-prometheus-stack
      patch: |
        - op: remove
          path: /spec/values/grafana/adminPassword
        - op: add
          path: /spec/values/prometheus/prometheusSpec/externalLabels
          value:
            cluster: machinery-hv
        # Dashboard folders, as on platform (../platform/infra.yaml): the
        # sidecar files a ConfigMap into the folder named by its annotation
        # grafana_folder -- "Crossplane" for ./crossplane-observability.yaml's.
        # Without an annotation (the stack's own dashboards): General.
        - op: add
          path: /spec/values/grafana/sidecar
          value:
            dashboards:
              folderAnnotation: grafana_folder
              provider:
                foldersFromFilesStructure: true
        # ZITADEL login, same block as platform's (../platform/infra.yaml).
        - op: add
          path: /spec/values/grafana/envFromSecret
          value: grafana-oidc-zitadel
        - op: add
          path: /spec/values/grafana/extraConfigmapMounts
          value:
            - name: trust-bundle
              mountPath: /etc/grafana/ca
              configMap: cluster-trust-bundle
              readOnly: true
        - op: add
          path: /spec/values/grafana/grafana.ini/auth.generic_oauth
          value:
            enabled: true
            name: ZITADEL
            allow_sign_up: true
            auto_login: false
            scopes: openid profile email
            auth_url: https://zitadel.platform.sthings.lab/oauth/v2/authorize
            token_url: https://zitadel.platform.sthings.lab/oauth/v2/token
            api_url: https://zitadel.platform.sthings.lab/oidc/v1/userinfo
            auth_style: InHeader
            use_pkce: true
            login_attribute_path: preferred_username
            name_attribute_path: name
            email_attribute_path: email
            role_attribute_path: >-
              contains(keys("urn:zitadel:iam:org:project:roles" || `{}`), 'grafana-admin') && 'Admin' || contains(keys("urn:zitadel:iam:org:project:roles" || `{}`), 'grafana-readonly') && 'Viewer'
            role_attribute_strict: true
            tls_client_ca: /etc/grafana/ca/trust-bundle.pem
  postBuild:
    substitute:
      KPS_NAMESPACE: monitoring
      KPS_VERSION: "93.6.1" # datasource=helm depName=kube-prometheus-stack registryUrl=https://prometheus-community.github.io/helm-charts
      KPS_PROMETHEUS_STORAGE_CLASS: openebs-hostpath
      KPS_PROMETHEUS_STORAGE_SIZE: 10Gi
      KPS_PROMETHEUS_RETENTION: 15d
      KPS_SCRAPE_INTERVAL: 60s
      KPS_ALERTMANAGER_WEBHOOK_URL: https://omni-pitcher.homerun2-dev.sthings.lab/pitch/alertmanager
      KPS_ALERTMANAGER_CA_CONFIGMAP: cluster-trust-bundle
      KPS_ALERTMANAGER_CA_KEY: trust-bundle.pem
      # Keep identical to infra-platform.yaml's INFRA_*.
      GATEWAY_NAME: machinery-hv-sthings-gateway
      GATEWAY_NAMESPACE: default
      HOSTNAME: grafana
      DOMAIN: machinery-hv.sthings.lab
    substituteFrom:
      - kind: Secret
        name: kube-prometheus-stack-secrets
        optional: false
