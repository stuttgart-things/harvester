# openbao-pki-ca: the sthings.lab root CA of the OpenBao that runs on the
# platform cluster. cert-manager needs it to VERIFY that OpenBao's TLS when the
# ClusterIssuer talks to it over HTTPS -- see infra-platform.yaml,
# VAULT_ISSUER_CA_SECRET.
#
# NOT the same job as on platform. There the identical Secret feeds
# trust-manager (TRUST_BUNDLE_VAULT_CA_SECRET); here it is the issuer's own
# caBundleSecretRef, because this cluster reaches OpenBao across the network
# rather than in-cluster over plain HTTP.
#
# Byte-identical to clusters/platform/openbao-pki-ca.yaml -- same OpenBao, same
# root. Verified rather than assumed: sha256 f829dcf7835e47da53c8c2eb both in
# that file and from https://openbao.platform.sthings.lab/v1/pki/ca/pem.
#
# A CA certificate is public by definition; intentionally not encrypted, same
# as its counterpart on platform.
apiVersion: v1
data:
  ca.crt:  # pragma: allowlist secret
kind: Secret
metadata:
  name: openbao-pki-ca
  namespace: cert-manager
  labels:
    app.kubernetes.io/managed-by: flux
