---
# The infra BUNDLE for this cluster -- stuttgart-things/flux → ./infra/platform.
#
# The same selection and the same OpenBao issuer as ../homerun2-dev/
# infra-platform.yaml, which documents every value below at length. What differs
# is the name, the address, and what is NOT selected:
#
#   no cnpg-operator  -- no database runs here
#   no external-secrets / sops-git / sops-secrets-operator -- the LabDA
#     machinery cluster selects all three, because its capability charts read
#     credentials through sops-git and sops-git reads its age key through an ESO
#     Vault store. This cluster does not use the capability charts (see
#     ./fleet-state/README.md), and its fleet-state Secrets are
#     SOPS-encrypted in git and decrypted by Flux itself, like every other
#     Secret in this repo.
#
# `components:` must never be empty -- see the note in homerun2-dev's file.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-platform
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: infrastructure
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: false
  prune: true
  suspend: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/platform/root
  components:
    # networking -- cilium-gateway is also what tekton (cicd-platform.yaml)
    # waits on, across bundles
    - ../components/cilium-lb
    - ../components/cilium-gateway
    # pki
    - ../components/cert-manager-install
    - ../components/cert-manager-vault-issuer
    - ../components/cert-manager-selfsigned
    # storage -- openebs-hostpath is the class the ansible-run PipelineRuns
    # claim their workspace from (fleet-state ansible-run-defaults)
    - ../components/openebs
    # dashboards
    - ../components/headlamp
    - ../components/flux-web
    # dns -- the lab zone to the router, everything else as before, and BOTH
    # served stale while the uplink is down (harvester#252, flux#515). Selected
    # on a cluster nobody depends on yet: adding it rolls CoreDNS, about a
    # minute without cluster DNS on a single node.
    - ../components/coredns-lab-zone
    # logs -- every container log to the lab's Loki on platform, HTTPS through
    # its Gateway, as on homerun2-dev (harvester#490, #753). Needs flux#822,
    # in the pinned tag since v1.233.0. CA: observability-trust-bundle.yaml.
    - ../components/fluent-bit-remote
  # FLUX WEB UI BEHIND ZITADEL (harvester#719). Without a web config the UI at
  # flux.machinery-hv.sthings.lab was open, read-only, to the lab network. Now
  # it needs a ZITADEL login (client `flux-web-machinery-hv`,
  # ../platform/zitadel-config/apps.auto.tfvars) and impersonates the user:
  # `zitadel:<email>` plus a group `zitadel:<role key>` per role of ZITADEL's
  # role map. The prefix is added here, so a token cannot name a group such as
  # system:masters. No role -> no login. What each group may do:
  # ./flux-web-rbac.yaml (flux-admin: actions, flux-readonly: read, no Secrets).
  # Id/secret: ./flux-web-oidc-zitadel.enc.yaml (SOPS). ZITADEL's CA:
  # cluster-trust-bundle in flux-system (./observability-trust-bundle.yaml).
  # Scopes without the defaults offline_access/groups: the client has no
  # refresh-token grant and ZITADEL has no groups scope.
  #
  # Fallback (#574): flux-web has no local login -- the admin kubeconfig and
  # the flux CLI. To get the anonymous UI back, revert this patch.
  #
  # The HelmRelease belongs to the CHILD Kustomization `flux-web` that
  # ../components/flux-web creates, so this patches that child to patch the
  # HelmRelease in turn (as cicd-platform.yaml does for tekton). No dollar
  # sign in the CEL below: both Kustomizations run postBuild substitution.
  patches:
    - target:
        kind: Kustomization
        name: flux-web
      patch: |
        - op: add
          path: /spec/patches
          value:
            - target:
                kind: HelmRelease
                name: flux-web
              patch: |
                - op: add
                  path: /spec/values/web/config
                  value:
                    baseURL: https://flux.machinery-hv.sthings.lab
                    authentication:
                      type: OAuth2
                      sessionDuration: 12h
                      oauth2:
                        provider: OIDC
                        issuerURL: https://zitadel.platform.sthings.lab
                        scopes: [openid, profile, email]
                        variables:
                          - name: roles
                            expression: "'urn:zitadel:iam:org:project:roles' in claims ? claims['urn:zitadel:iam:org:project:roles'] : {}"
                          - name: groups
                            expression: "variables.roles.map(r, 'zitadel:' + r)"
                        validations:
                          - expression: "size(variables.groups) > 0"
                            message: "no Flux web role in ZITADEL (flux-admin or flux-readonly)"
                          - expression: "has(claims.email) && claims.email != ''"
                            message: "ZITADEL sent no email claim"
                        impersonation:
                          username: "'zitadel:' + claims.email"
                          groups: "variables.groups"
                    userActions:
                      audit: ["*"]
                # A values file merged at the root, NOT targetPath: ZITADEL's
                # client ID is all digits, and targetPath's --set parsing made
                # it a number -- helm-controller v1.5.3 then never matched the
                # release to the object and upgraded in a loop (v3..v12 within
                # minutes, 2026-11-26). `literal: true` would fix that, but
                # needs a newer helm-controller than this cluster runs. The
                # Secret's values.yaml quotes the ID, so it stays a string.
                - op: add
                  path: /spec/valuesFrom
                  value:
                    - kind: Secret
                      name: flux-web-oidc-zitadel
                      valuesKey: values.yaml
                - op: add
                  path: /spec/values/extraVolumes
                  value:
                    - name: trust-bundle
                      configMap:
                        name: cluster-trust-bundle
                - op: add
                  path: /spec/values/extraVolumeMounts
                  value:
                    - name: trust-bundle
                      mountPath: /etc/ssl/lab
                      readOnly: true
                - op: add
                  path: /spec/values/extraEnvs
                  value:
                    - name: SSL_CERT_FILE
                      value: /etc/ssl/lab/trust-bundle.pem
  postBuild:
    substitute:
      FLUX_SOURCE: flux-infra

      # Keep identical to cicd-platform.yaml.
      INFRA_DOMAIN: machinery-hv.sthings.lab
      INFRA_GATEWAY_NAME: machinery-hv-sthings-gateway
      INFRA_GATEWAY_NAMESPACE: default
      INFRA_TLS_SECRET: wildcard-tls # pragma: allowlist secret

      # ---- fluent-bit-remote ----------------------------------------------
      FLUENT_BIT_CLUSTER_NAME: machinery-hv
      FLUENT_BIT_LOKI_HOST: loki.platform.sthings.lab
      # The kubernetes filter's API buffer. The cilium agent pod here is
      # ~35 kB, above fluent-bit's 32k default: its logs would reach Loki
      # without namespace/pod labels and fluent-bit warns "[http_client]
      # cannot increase buffer" (#753). Read only from the flux tag that
      # contains stuttgart-things/flux#1045; ignored before that.
      FLUENT_BIT_K8S_BUFFER_SIZE: 128k

      # ---- cilium-lb ------------------------------------------------------
      # Reserved in Clusterbook on 2026-09-24 by auto-assignment (README step
      # 1), which also wrote *.machinery-hv.sthings.lab. Written out here by
      # hand because nothing reads the reservation back for a Flux-built
      # cluster -- see homerun2-dev's file. Quoted: substitute is
      # map[string]string.
      CILIUM_LB_IP_START: "192.168.10.178"
      CILIUM_LB_IP_STOP: "192.168.10.178"

      # ---- coredns-lab-zone -----------------------------------------------
      # sthings.lab is answered by the DD-WRT router's dnsmasq -- the only
      # resolver that knows the lab and Clusterbook's wildcards. No trailing
      # dot; the base adds it. COREDNS_SERVE_STALE stays at the component
      # default (24h).
      COREDNS_ZONE: sthings.lab
      COREDNS_ZONE_SERVER: "192.168.10.1"
      # The router answers AAAA with NXDOMAIN for its *.platform.sthings.lab
      # wildcard (A resolves). musl reads that as "no such name": the Ansible
      # pod of a ClusterStack's kubeconfig stage failed to resolve
      # openbao.platform.sthings.lab (harvester#265). CoreDNS answers AAAA in
      # this zone itself, empty; the lab has no IPv6 (flux#567, v1.95.0).
      COREDNS_ZONE_NODATA_TYPE: AAAA

      # ---- cert-manager / the OpenBao PKI issuer --------------------------
      CERT_MANAGER_SELFSIGNED_ISSUER: openbao-pki
      VAULT_ISSUER_NAME: openbao-pki
      VAULT_ISSUER_SERVER: https://openbao.platform.sthings.lab
      VAULT_ISSUER_PKI_PATH: pki/sign/sthings-lab
      # <cluster_name>-<k8s_auths[].name> from ./openbao/openbao.tf.
      VAULT_ISSUER_AUTH_MOUNT_PATH: /v1/auth/machinery-hv-certmanager
      VAULT_ISSUER_AUTH_ROLE: certmanager
      VAULT_ISSUER_SERVICE_ACCOUNT: cert-manager
      # From ./pki/openbao-pki-ca.yaml (applied by pki.yaml).
      VAULT_ISSUER_CA_SECRET: openbao-pki-ca # pragma: allowlist secret
      VAULT_ISSUER_CA_KEY: ca.crt
