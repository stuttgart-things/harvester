---
# The infra BUNDLE for this cluster -- stuttgart-things/flux → ./infra/platform.
#
# The same selection and the same OpenBao issuer as ../homerun2-dev/
# infra-platform.yaml, which documents every value below at length. What differs
# is the name, the address, and what is NOT selected:
#
#   no cnpg-operator  -- no database runs here
#   no external-secrets / sops-git / sops-secrets-operator -- the LabDA
#     machinery cluster selects all three, because its capability charts read
#     credentials through sops-git and sops-git reads its age key through an ESO
#     Vault store. This cluster does not use the capability charts (see
#     ../machinery-hv-fleet-state/README.md), and its fleet-state Secrets are
#     SOPS-encrypted in git and decrypted by Flux itself, like every other
#     Secret in this repo.
#
# `components:` must never be empty -- see the note in homerun2-dev's file.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-platform
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: infrastructure
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: false
  prune: true
  suspend: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/platform/root
  components:
    # networking -- cilium-gateway is also what tekton (cicd-platform.yaml)
    # waits on, across bundles
    - ../components/cilium-lb
    - ../components/cilium-gateway
    # pki
    - ../components/cert-manager-install
    - ../components/cert-manager-vault-issuer
    - ../components/cert-manager-selfsigned
    # storage -- openebs-hostpath is the class the ansible-run PipelineRuns
    # claim their workspace from (fleet-state ansible-run-defaults)
    - ../components/openebs
    # dashboards
    - ../components/headlamp
    - ../components/flux-web
  postBuild:
    substitute:
      FLUX_SOURCE: flux-infra

      # Keep identical to cicd-platform.yaml.
      INFRA_DOMAIN: machinery-hv.sthings.lab
      INFRA_GATEWAY_NAME: machinery-hv-sthings-gateway
      INFRA_GATEWAY_NAMESPACE: default
      INFRA_TLS_SECRET: wildcard-tls # pragma: allowlist secret

      # ---- cilium-lb ------------------------------------------------------
      # NOT RESERVED YET. Reserve in Clusterbook first (README step 1, with an
      # explicit `ip`), then write the address here. The placeholder is not a
      # valid address on purpose: the pool is rejected and cilium-lb fails
      # loudly, instead of announcing an address someone else holds.
      CILIUM_LB_IP_START: "set-after-clusterbook-reservation"
      CILIUM_LB_IP_STOP: "set-after-clusterbook-reservation"

      # ---- cert-manager / the OpenBao PKI issuer --------------------------
      CERT_MANAGER_SELFSIGNED_ISSUER: openbao-pki
      VAULT_ISSUER_NAME: openbao-pki
      VAULT_ISSUER_SERVER: https://openbao.platform.sthings.lab
      VAULT_ISSUER_PKI_PATH: pki/sign/sthings-lab
      # <cluster_name>-<k8s_auths[].name> from ./openbao/openbao.tf.
      VAULT_ISSUER_AUTH_MOUNT_PATH: /v1/auth/machinery-hv-certmanager
      VAULT_ISSUER_AUTH_ROLE: certmanager
      VAULT_ISSUER_SERVICE_ACCOUNT: cert-manager
      # From ./openbao-pki-ca.yaml.
      VAULT_ISSUER_CA_SECRET: openbao-pki-ca # pragma: allowlist secret
      VAULT_ISSUER_CA_KEY: ca.crt
