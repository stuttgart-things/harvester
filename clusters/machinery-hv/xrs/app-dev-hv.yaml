---
# The first order of machinery-hv (listed 2026-09-28). The Harvester counterpart of
# stuttgart-things clusters/labda/vsphere/machinery-xrs/app-dev.yaml; read that
# file's comments first, this one only records what differs.
#
# DIFFERS FROM LabDA:
#   provider: harvester      RANCHER builds the VM: the RancherCluster gets a
#                            Harvester machine pool, the way tabletennis was
#                            built on crossplane-mgmt (xplane-cluster 0.22.0,
#                            the default for provider: harvester). No
#                            HarvesterVM, no base-OS or join play
#   node address             static, reserved in clusterbook as
#                            `app-dev-hv-node` BEFORE the VM exists
#                            (machinePool in cluster-vault-sthings-lab). The
#                            kubeconfig stage logs in there with
#                            tekton-ci/ansible-credentials, which only images
#                            built after #274 accept (sthings-u26-26.928.0903+,
#                            rancher-cluster-join-sthings-lab.imageName), and
#                            retries until the node is up
#   environmentConfig        sthings-lab -- selects cluster-vault-sthings-lab
#   rancher.environmentConfig
#                            rancher-join-sthings-lab -- also carries the
#                            Harvester the machine pool is built on (cloud
#                            credential, image, network)
#   vaultAddr                the OpenBao on platform, not the LabUL infra Vault
#   reservation.networkKey   192.168.10, this lab's Clusterbook network
#   size: medium             `large` (8 CPU / 16 GiB) fits on Harvester but
#                            would be its biggest guest; start smaller.
#                            Becomes the pool's HarvesterConfig: 4 CPU / 8 GiB
#                            / 64 GiB
#   CNI                      none from k3s; cilium from the Platform, through
#                            node:6443 -- the same as every rancher order.
#                            Rancher's proxy cannot be that path (it needs
#                            cattle-cluster-agent on a pod network) and does
#                            not have to be
#   no NFS labels            the lab has had no NFS server since infra.sthings.lab
#                            was switched off (harvester#152)
#   no observability         platform's Argo CD has no observability-platform
#                            ApplicationSet; with the profile set, monitoring
#                            would never appear and nothing would say so
#   homerun2 + tabletennis   added 2026-09-28, once platform installed both
#                            ApplicationSets (stuttgart-things/flux#571,
#                            argocd#544). tabletennis reads homerun2's
#                            secrets (omni-pitcher token, redis password), so
#                            homerun2 is required in the same order.
#                            secretStores names both mounts: the profiles set
#                            the secrets-config gates, but the
#                            ClusterSecretStores vault-homerun2 /
#                            vault-schmetterpause only exist when the stores
#                            AppSet is told about them
#   backup                   schmetterpause's CNPG backups go to the bucket of
#                            THIS cluster (app-dev-hv-backup.yaml beside this
#                            file), not the shared _backup entry
#
# NOT BLOCKED BY crossplane-configurations#503 ANY MORE: that is the custom-node
# VM this stack used to build, which boots with no user the ansible stages can
# log in as. The machine pool boots the lab's Packer image, whose login the
# ansible credentials are.
#
# PROVEN BEFORE LISTING (harvester#265, #267): xplane-cluster 0.23.1 /
# cluster v0.12.3 / rancher-cluster v0.11.0 installed; one clusterbook
# reservation by hand; the throwaway hvpool-test1 Ready end to end (node-ip,
# machine pool, kubeconfig on attempt 1, access, cilium, Rancher Active); the
# Argo CD keys in rancher-cluster-join-sthings-lab (fleet-state).
#
# Teardown is two phases -- see kustomization.yaml beside this file.
apiVersion: config.stuttgart-things.com/v1alpha1
kind: ClusterStack
metadata:
  name: app-dev-hv
  namespace: default
  annotations:
    stuttgart-things.com/management-cluster: machinery-hv
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  provider: harvester
  distribution: rancher-k3s
  size: medium
  environmentConfig: sthings-lab
  kubeconfig:
    # vaultSecretName left at its default `vault`: tekton-ci/vault in the fleet
    # state carries the kubeconfig-writer AppRole the upload stage writes with,
    # and the read side is derived from that name (-> ClusterProviderConfig
    # `vault-kubeconfigs`).
    lifecycle:
      vaultAddr: https://openbao.platform.sthings.lab
  profiles:
    - network
    - security
    - storage-openebs
    - homerun2
    - tabletennis
  # The ClusterSecretStores the two profiles read through (external-secrets-
  # stores AppSet, kv-mounts derived from this list; ESO logs in via the
  # Platform's Vault issuer auth, policies read-<mount>-clusters).
  secretStores:
    - homerun2
    - schmetterpause
    # NOT tabletennis in the first order: it pulls schmetterpause, whose -backup
    # entry reads the shared object-store-backup -- not in
    # cluster-vault-sthings-lab and not seeded, and the render fails on it
    # (README "Log" step 10). Add it back with that entry.
  rancher:
    environmentConfig: rancher-join-sthings-lab
    argocd:
      register: true
      reservation:
        enabled: true
        networkKey: '192.168.10'
      labels:
        env: sthings-lab
      annotations:
        # CloudNativePG backups of schmetterpause-db into THIS cluster's bucket
        # (app-dev-hv-backup.yaml: MinioBucket + VaultSecretSet), not the
        # shared schmetterpause/_backup.
        tabletennis-platform.stuttgart-things.com/db-backup-enabled: 'true'
        tabletennis-platform.stuttgart-things.com/db-backup-endpoint-url: https://artifacts.platform.sthings.lab
        tabletennis-platform.stuttgart-things.com/db-backup-destination-path: s3://app-dev-hv-schmetterpause-cnpg/
        tabletennis-platform.stuttgart-things.com/db-backup-remote-key: app-dev-hv-backup
        tabletennis-platform.stuttgart-things.com/db-backup-secret-store: vault-schmetterpause
        # The database PVC's class; the AppSet default is "" (no class).
        tabletennis-platform.stuttgart-things.com/storage-class: openebs-hostpath
  platformEnabled: true
  platform:
    fluxInit:
      enabled: false
    clusterSecrets:
      enabled: true
    vaultIssuer:
      enabled: true
      authProvider: provider-vault
      vaultProviderConfigRef: vault
      vaultAddr: https://openbao.platform.sthings.lab
      pkiRole: sthings-lab
      caSourceSecret: openbao-pki-source-ca  # pragma: allowlist secret
