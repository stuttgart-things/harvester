---
# Demo order (2026-09-30, harvester#309 part 3): the same path as app-dev-hv,
# stripped to the base platform so it comes up fast and needs no secrets.
# Read app-dev-hv.yaml beside this file for why each field is what it is.
#
# DIFFERS FROM app-dev-hv:
#   profiles                 network, security, storage-openebs only -- no
#                            homerun2/tabletennis, so no secretStores, no
#                            db-backup annotations, no MinioBucket
#   clusterAnnotations       no-creator-rbac -- README rule 5: rancher-mgmt is
#                            the scoped ServiceAccount since 2026-09-28, and a
#                            new order must not make it the cluster's owner.
#                            Honoured at CREATE only
#
# Teardown is two phases, as for app-dev-hv (kustomization.yaml beside this
# file): `platformEnabled: false`, wait for the Platform to go, then delete.
apiVersion: config.stuttgart-things.com/v1alpha1
kind: ClusterStack
metadata:
  name: demo-hv
  namespace: default
  annotations:
    stuttgart-things.com/management-cluster: machinery-hv
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  provider: harvester
  distribution: rancher-k3s
  size: medium
  environmentConfig: sthings-lab
  kubeconfig:
    lifecycle:
      vaultAddr: https://openbao.platform.sthings.lab
  profiles:
    - network
    - security
    - storage-openebs
  rancher:
    environmentConfig: rancher-join-sthings-lab
    clusterAnnotations:
      field.cattle.io/no-creator-rbac: "true"
    argocd:
      register: true
      reservation:
        enabled: true
        networkKey: '192.168.10'
      labels:
        env: sthings-lab
  platformEnabled: true
  platform:
    fluxInit:
      enabled: false
    clusterSecrets:
      enabled: true
    vaultIssuer:
      enabled: true
      authProvider: provider-vault
      vaultProviderConfigRef: vault
      vaultAddr: https://openbao.platform.sthings.lab
      pkiRole: sthings-lab
      caSourceSecret: openbao-pki-source-ca  # pragma: allowlist secret
