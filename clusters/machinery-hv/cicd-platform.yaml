---
# The delivery layer of this cluster -- stuttgart-things/flux → ./cicd/platform.
# This file is why the cluster exists: `crossplane` with CROSSPLANE_PROFILE
# machinery installs the package set generated from the KCL catalog, the same
# one clusters/labda/vsphere/machinery in stuttgart-things runs.
#
# NEVER POINT THIS AT crossplane-mgmt. That cluster carries the older package
# family under short CR names (`namespace`, `volume-claim`, upbound-registry
# Functions); this profile applies the same sources under derived names, and a
# second CR for one source is a duplicate lock node -- every package on the
# cluster goes Healthy=False. The flux profile README says the same: fresh
# cluster, then the profile.
#
# WHAT IS NOT SELECTED, AND WHY:
#
#   crossplane-capabilities -- the component depends on the `sops-git`
#     Kustomization, which this cluster does not select (see
#     infra-platform.yaml): sops-git reads its age key through an ESO Vault
#     store, and it also owns the `stuttgart-things-charts` HelmRepository the
#     capability releases pull from, so no variable removes the dependency.
#     The `harvester-demo` set itself CAN be configured for this lab since
#     flux v1.80.3 (stuttgart-things/flux#514): all six
#     CROSSPLANE_CAPABILITY_HARVESTER_* values are passed through, and
#     CROSSPLANE_CAPABILITY_ANSIBLE_SSH_BACKEND=none drops the sops-git read of
#     the ansible SSH file. Until this cluster carries sops-git, the placement
#     and the ansible defaults stay written out in ../machinery-hv-fleet-state.
#
#   machinery / claim-machinery-api / komoplane -- the API and the dashboards
#     already run on platform; add komoplane here if a local view is wanted.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cicd-platform
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: cicd
spec:
  interval: 1h
  retryInterval: 1m
  # 20m: the Configurations are pulled and dependency-resolved after their CRs
  # exist, and ~20 packages on a cold cluster take minutes.
  timeout: 20m
  force: false
  prune: true
  suspend: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./cicd/platform/root
  components:
    - ../components/crossplane
    # The PipelineRuns every ClusterStack's ansible stages execute in, in
    # namespace tekton-ci.
    - ../components/tekton
  postBuild:
    substitute:
      APPS_SOURCE: flux-infra

      # Shared with infra-platform.yaml -- keep them identical.
      INFRA_DOMAIN: machinery-hv.sthings.lab
      INFRA_GATEWAY_NAME: machinery-hv-sthings-gateway
      INFRA_GATEWAY_NAMESPACE: default

      CROSSPLANE_PROFILE: machinery
