---
# The delivery layer of this cluster -- stuttgart-things/flux → ./cicd/platform.
# This file is why the cluster exists: `crossplane` with CROSSPLANE_PROFILE
# machinery installs the package set generated from the KCL catalog, the same
# one clusters/labda/vsphere/machinery in stuttgart-things runs.
#
# NEVER POINT THIS AT crossplane-mgmt. That cluster carries the older package
# family under short CR names (`namespace`, `volume-claim`, upbound-registry
# Functions); this profile applies the same sources under derived names, and a
# second CR for one source is a duplicate lock node -- every package on the
# cluster goes Healthy=False. The flux profile README says the same: fresh
# cluster, then the profile.
#
# WHAT IS NOT SELECTED, AND WHY:
#
#   crossplane-capabilities -- the component depends on the `sops-git`
#     Kustomization, which this cluster does not select (see
#     infra-platform.yaml): sops-git reads its age key through an ESO Vault
#     store, and it also owns the `stuttgart-things-charts` HelmRepository the
#     capability releases pull from, so no variable removes the dependency.
#     The `harvester-demo` set itself CAN be configured for this lab since
#     flux v1.80.3 (stuttgart-things/flux#514): all six
#     CROSSPLANE_CAPABILITY_HARVESTER_* values are passed through, and
#     CROSSPLANE_CAPABILITY_ANSIBLE_SSH_BACKEND=none drops the sops-git read of
#     the ansible SSH file. Until this cluster carries sops-git, the placement
#     and the ansible defaults stay written out in ./fleet-state.
#
#   claim-machinery-api -- runs here, but as a Kustomization of its own
#     (claim-machinery-api.yaml, harvester#676), not as a component of this
#     bundle.
#   komoplane -- add it here if a local view is wanted.
#
# machinery IS selected (harvester#490): it is a dashboard over the
# config./resources.stuttgart-things.com claims of the cluster it runs on, so
# platform cannot show the ClusterStacks and RancherClusters that live here.
# It waits on crossplane-configs, which the machinery profile creates.
# machinery.machinery-hv.sthings.lab, through the cluster Gateway.
#
# GRPC AUTH IS PREPARED, NOT YET SWITCHED ON (harvester#753). The target is
# `machinery-auth-sops` in place of `machinery`, plus `machinery-grpcroute`
# (machinery-grpc.machinery-hv.sthings.lab): machinery's gRPC API with a
# bearer token, reachable from other clusters. `machinery-auth` itself reads
# the token through an ExternalSecret, and this cluster runs no ESO (see
# infra-platform.yaml); the -sops variant substitutes it from the Secret
# machinery-auth-sops-secrets (./machinery-auth-sops-secrets.enc.yaml, key
# MACHINERY_AUTH_TOKEN). That variant comes with stuttgart-things/flux#1048,
# after v1.234.0, so the switch rides on the git-repos.yaml bump to the first
# tag that has cicd/platform/components/machinery-auth-sops. No gRPC client of
# this machinery exists today (no GRPCRoute, nothing in-cluster calls :50051;
# checked 2026-11-19), so nothing has to receive the token first. A client
# added later gets the same value:
#   sops -d --extract '["stringData"]["MACHINERY_AUTH_TOKEN"]' \
#     clusters/machinery-hv/machinery-auth-sops-secrets.enc.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cicd-platform
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: cicd
spec:
  interval: 1h
  retryInterval: 1m
  # 20m: the Configurations are pulled and dependency-resolved after their CRs
  # exist, and ~20 packages on a cold cluster take minutes.
  timeout: 20m
  force: false
  prune: true
  suspend: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./cicd/platform/root
  components:
    - ../components/crossplane
    # The PipelineRuns every ClusterStack's ansible stages execute in, in
    # namespace tekton-ci.
    - ../components/tekton
    # Claims dashboard, + HTTPRoute machinery.<INFRA_DOMAIN>.
    - ../components/machinery
  postBuild:
    substitute:
      APPS_SOURCE: flux-infra

      # Shared with infra-platform.yaml -- keep them identical.
      INFRA_DOMAIN: machinery-hv.sthings.lab
      INFRA_GATEWAY_NAME: machinery-hv-sthings-gateway
      INFRA_GATEWAY_NAMESPACE: default

      CROSSPLANE_PROFILE: machinery
