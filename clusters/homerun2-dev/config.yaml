apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: '1h'
    fluxcd.controlplane.io/reconcileTimeout: '5m'
spec:
  distribution:
    version: '2.8.5'
    registry: ghcr.io/fluxcd
    artifact: oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests
  components:
  - source-controller
  - kustomize-controller
  - helm-controller
  - notification-controller
  - image-reflector-controller
  - image-automation-controller
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
    domain: cluster.local
  kustomize:
    patches:
    - patch: |- # pragma: allowlist secret
        - op: add
          path: /spec/decryption
          value:
            provider: sops
            secretRef:
              name: sops-age
      target:
        group: kustomize.toolkit.fluxcd.io
        version: v1
        kind: Kustomization
    - target:
        kind: Deployment
        name: (kustomize-controller|helm-controller)
      patch: |-
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --concurrent=10
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --requeue-dependency=5s
  sync:
    kind: GitRepository
    url: https://github.com/stuttgart-things/harvester
    # TEMPORARY -- REVERT TO refs/heads/main WHEN #218 MERGES.
    #
    # flux-bootstrap rendered this as refs/heads/main, which is correct and is
    # what every other cluster here uses. It cannot work yet: clusters/homerun2-dev
    # exists only on this branch, so Flux fetched main, found no such path and
    # parked at `kustomization path not found` with the GitRepository itself
    # reporting Ready -- a failure that reads like a slow reconcile.
    #
    # Pointing at the branch is a bridge, not a design. A lab cluster syncing a
    # feature branch drifts the moment the branch does, and the branch will be
    # deleted on merge -- at which point this cluster's GitOps root stops
    # resolving entirely.
    #
    # This value is ALSO live on the cluster (the FluxInstance was patched to
    # match). Changing it here alone is not enough and changing it on the
    # cluster alone is worse: this file is inside the synced path, so Flux
    # reconciles the FluxInstance back to whatever is written here.
    ref: refs/heads/feat/homerun2-dev-cluster
    path: clusters/homerun2-dev
    pullSecret: git-token-auth # pragma: allowlist secret
