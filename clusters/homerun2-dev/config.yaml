apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: '1h'
    fluxcd.controlplane.io/reconcileTimeout: '5m'
spec:
  distribution:
    version: '2.8.5'
    registry: ghcr.io/fluxcd
    artifact: oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests
  components:
  - source-controller
  - kustomize-controller
  - helm-controller
  - notification-controller
  - image-reflector-controller
  - image-automation-controller
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
    domain: cluster.local
  kustomize:
    patches:
    - patch: |- # pragma: allowlist secret
        - op: add
          path: /spec/decryption
          value:
            provider: sops
            secretRef:
              name: sops-age
      target:
        group: kustomize.toolkit.fluxcd.io
        version: v1
        kind: Kustomization
    - target:
        kind: Deployment
        name: (kustomize-controller|helm-controller)
      patch: |-
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --concurrent=10
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --requeue-dependency=5s
  sync:
    kind: GitRepository
    url: https://github.com/stuttgart-things/harvester
    # Back on main, where flux-bootstrap rendered it and where every other
    # cluster here points.
    #
    # It was pinned to feat/homerun2-dev-cluster between #218 being opened and
    # merged, because clusters/homerun2-dev existed only on that branch: Flux
    # fetched main, found no such path, and parked at `kustomization path not
    # found` while the GitRepository itself reported Ready.
    #
    # If this ever has to point at a branch again, remember the value lives in
    # two places -- here and the live FluxInstance -- and they have to move
    # together. This file is inside the synced path, so patching only the
    # cluster is undone by the next reconcile, about a minute later.
    ref: refs/heads/main
    path: clusters/homerun2-dev
    pullSecret: git-token-auth # pragma: allowlist secret
