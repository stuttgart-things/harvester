---
# The light-catcher's profile -- caller-supplied, so the effects go to the
# real WLED instead of the wled-mock.
#
# homerun2.yaml sets HOMERUN2_LIGHT_CATCHER_PROFILE_CM to this ConfigMap's
# name (flux#570); unset, the component mounts the base's own profile, whose
# rules all point at http://homerun2-wled-mock. That ConfigMap still exists,
# it is just no longer mounted.
#
# The device: wled-matrix.sthings.lab (192.168.10.123, ESP32, WLED 16.0.1,
# 36 LEDs in one segment). Pods reach it by name -- CoreDNS forwards
# sthings.lab to the router (coredns-lab-zone).
#
# EFFECT NAMES ARE NOT LOOKED UP ON THE DEVICE. light-catcher v1.2.0 maps
# `fx` through a fixed table of 15 names (internal/profile/profile.go, FxMap),
# and only Solid, Blink, Breathe and Wipe carry the IDs WLED 16 uses: Twinkle
# sends 5 (Random Colors), Aurora 12 (Fade), and a name outside the table --
# Strobe -- logs `unknown effect` and lights nothing. Until upstream looks
# names up in /json/eff, use those four. `segments` is parsed but not sent.
#
# Colours: palettes sunset, beach, forest, ocean, or red, yellow, green, blue,
# white.
#
# duration 10: the matrix scrolls a title once in 8-12 s and ignores its own
# duration, so 10 s keeps the light on for about as long (hosts/matrix/
# profile.yaml). After it the catcher sends {"on": false}. A burst still drifts:
# the light restarts its timer per message, the matrix drops what arrives
# while it is busy.
#
# Rules are matched in document order, first match wins; severity is matched
# case-insensitively, system case-sensitively. There is no way to fan one
# message out to both the WLED and the mock: this profile has replaced the
# mock, whose dashboard stays up but no longer receives anything.
#
# Re-read on every message (the ConfigMap is mounted as a directory, so the
# kubelet's sync is all it takes) -- no restart needed after a change.
#
# No ${VAR} in here: the Kustomization that applies this file (the
# FluxInstance's own sync) has no postBuild, so none would be substituted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homerun2-light-catcher-profile-wled
  namespace: homerun2
data:
  profile.yaml: |
    effects:
      error:
        systems: ["*"]
        severity: [error, critical]
        fx: Blink
        duration: 10
        color: red
        segments: [0]
        endpoint: http://wled-matrix.sthings.lab
      warning:
        systems: ["*"]
        severity: [warning]
        fx: Breathe
        duration: 10
        color: yellow
        segments: [0]
        endpoint: http://wled-matrix.sthings.lab
      success:
        systems: ["*"]
        severity: [success]
        fx: Solid
        duration: 10
        color: green
        segments: [0]
        endpoint: http://wled-matrix.sthings.lab
      info:
        systems: ["*"]
        severity: [info]
        fx: Wipe
        duration: 10
        color: ocean
        segments: [0]
        endpoint: http://wled-matrix.sthings.lab
      debug:
        systems: ["*"]
        severity: [debug]
        fx: Solid
        duration: 10
        color: blue
        segments: [0]
        endpoint: http://wled-matrix.sthings.lab
