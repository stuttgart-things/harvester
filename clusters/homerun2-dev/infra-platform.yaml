---
# The infra BUNDLE for this cluster -- stuttgart-things/flux → ./infra/platform.
#
# One Kustomization stands up the whole infra layer. Each `components:` entry is
# a kustomize Component that renders a child Flux Kustomization pointing at a
# base in that repo; the substitutes below are read by all of them, which is why
# the domain and the gateway name are written once here rather than per app.
#
# This is the bundle form, not the one clusters/platform/infra.yaml
# uses. That predates the bundle and spells out one Kustomization per component
# with the bases' own variable names (CILIUM_GATEWAY_DOMAIN,
# CERT_MANAGER_SELFSIGNED_DOMAIN, ...). The bundle maps a single INFRA_DOMAIN
# onto all of them. Same upstream bases either way -- see
# clusters/platform/apps-platform.yaml for the same decision on the apps side.
#
# `components:` must never be empty. An empty list renders as YAML null, which
# the CRD rejects -- and it fails THIS Kustomization, so nothing in the bundle
# deploys while it reads like a slow reconcile. Delete the file rather than
# emptying the list.
#
# Ordering is handled upstream by dependsOn, not by the order of this list:
# cilium-gateway waits for cilium-lb, cert-manager-selfsigned for
# cert-manager-install, headlamp and flux-web for cilium-gateway. Every
# prerequisite has to be selected here too -- Flux has no optional dependency,
# so a missing one parks its dependent on "dependency not ready" forever.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-platform
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: infrastructure
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: false
  prune: true
  suspend: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/platform/root
  components:
    # networking
    - ../components/cilium-lb
    - ../components/cilium-gateway
    # dns -- CoreDNS rides out uplink outages (#252). Standalone, no dependency.
    - ../components/coredns-lab-zone
    # pki
    - ../components/cert-manager-install
    - ../components/cert-manager-vault-issuer
    - ../components/cert-manager-selfsigned
    # storage
    - ../components/openebs
    # databases -- the CRD schmetterpause's CloudNativePG Cluster needs;
    # tabletennis.yaml applies the Cluster itself.
    - ../components/cnpg-operator
    # Barman Cloud plugin (ObjectStore CRD, recovery and WAL archiving),
    # against the MinIO on platform (artifacts.platform.sthings.lab). First
    # use: restoring schmetterpause-db from the office's backups, then this
    # cluster's own. Waits on cnpg-operator and cert-manager-install.
    - ../components/cnpg-barman-cloud
    # dashboards
    - ../components/headlamp
    - ../components/flux-web
    # rollouts -- rolls Deployments annotated reloader.stakater.com/auto when a
    # ConfigMap/Secret they mount changes. sthings-portal reads its service
    # list (envFrom) only at start: without this a new card needed a manual
    # rollout restart. Standalone, no dependency.
    - ../components/reloader
    # logs -- every container log to the lab's Loki on platform, HTTPS through
    # its Gateway (harvester#490). CA: logging-trust-bundle.yaml.
    - ../components/fluent-bit-remote
  # FLUX WEB UI BEHIND ZITADEL (harvester#719), as on machinery-hv
  # (../machinery-hv/infra-platform.yaml). Without a web config the UI at
  # flux.homerun2-dev.sthings.lab was open, read-only, to the lab network. Now
  # it needs a ZITADEL login (client `flux-web-homerun2-dev`,
  # ../platform/zitadel-config/apps.auto.tfvars) and impersonates the user:
  # `zitadel:<email>` plus a group `zitadel:<role key>` per role of ZITADEL's
  # role map. The prefix is added here, so a token cannot name a group such as
  # system:masters. No role -> no login. What each group may do:
  # ./flux-web-rbac.yaml (flux-admin: actions, flux-readonly: read, no Secrets).
  # Id/secret: ./flux-web-oidc-zitadel.enc.yaml (SOPS). ZITADEL's CA:
  # cluster-trust-bundle in flux-system (./flux-web-trust-bundle.yaml).
  # Scopes without the defaults offline_access/groups: the client has no
  # refresh-token grant and ZITADEL has no groups scope.
  #
  # Fallback (#574): flux-web has no local login -- the admin kubeconfig and
  # the flux CLI. To get the anonymous UI back, revert this patch.
  #
  # The HelmRelease belongs to the CHILD Kustomization `flux-web` that
  # ../components/flux-web creates, so this patches that child to patch the
  # HelmRelease in turn (as ../machinery-hv/cicd-platform.yaml does for
  # tekton). No dollar sign in the CEL below: both Kustomizations run
  # postBuild substitution.
  patches:
    - target:
        kind: Kustomization
        name: flux-web
      patch: |
        - op: add
          path: /spec/patches
          value:
            - target:
                kind: HelmRelease
                name: flux-web
              patch: |
                - op: add
                  path: /spec/values/web/config
                  value:
                    baseURL: https://flux.homerun2-dev.sthings.lab
                    authentication:
                      type: OAuth2
                      sessionDuration: 12h
                      oauth2:
                        provider: OIDC
                        issuerURL: https://zitadel.platform.sthings.lab
                        scopes: [openid, profile, email]
                        variables:
                          - name: roles
                            expression: "'urn:zitadel:iam:org:project:roles' in claims ? claims['urn:zitadel:iam:org:project:roles'] : {}"
                          - name: groups
                            expression: "variables.roles.map(r, 'zitadel:' + r)"
                        validations:
                          - expression: "size(variables.groups) > 0"
                            message: "no Flux web role in ZITADEL (flux-admin or flux-readonly)"
                          - expression: "has(claims.email) && claims.email != ''"
                            message: "ZITADEL sent no email claim"
                        impersonation:
                          username: "'zitadel:' + claims.email"
                          groups: "variables.groups"
                    userActions:
                      audit: ["*"]
                # A values file merged at the root, NOT targetPath: ZITADEL's
                # client ID is all digits, and targetPath's --set parsing made
                # it a number -- helm-controller v1.5.3 then never matched the
                # release to the object and upgraded in a loop (v3..v12 within
                # minutes, 2026-11-26). `literal: true` would fix that, but
                # needs a newer helm-controller than this cluster runs. The
                # Secret's values.yaml quotes the ID, so it stays a string.
                - op: add
                  path: /spec/valuesFrom
                  value:
                    - kind: Secret
                      name: flux-web-oidc-zitadel
                      valuesKey: values.yaml
                - op: add
                  path: /spec/values/extraVolumes
                  value:
                    - name: trust-bundle
                      configMap:
                        name: cluster-trust-bundle
                - op: add
                  path: /spec/values/extraVolumeMounts
                  value:
                    - name: trust-bundle
                      mountPath: /etc/ssl/lab
                      readOnly: true
                - op: add
                  path: /spec/values/extraEnvs
                  value:
                    - name: SSL_CERT_FILE
                      value: /etc/ssl/lab/trust-bundle.pem
  postBuild:
    substitute:
      FLUX_SOURCE: flux-infra

      FLUENT_BIT_CLUSTER_NAME: homerun2-dev
      FLUENT_BIT_LOKI_HOST: loki.platform.sthings.lab
      # The kubernetes filter's API buffer. fluent-bit logged "[http_client]
      # cannot increase buffer: current=32000 requested=64768 max=32000" every
      # ~5 min (#605, still on 2026-11-19): the cilium agent pod's API object
      # is ~35 kB, so its logs reach Loki without namespace/pod labels. Read
      # only from the flux tag that contains stuttgart-things/flux#1045;
      # ignored before that.
      FLUENT_BIT_K8S_BUFFER_SIZE: 128k

      # Set once, read by the Gateway, the wildcard certificate and every
      # HTTPRoute behind it. Keep identical to any apps bundle added later --
      # apps/platform reads the same three INFRA_* names on purpose.
      INFRA_DOMAIN: homerun2-dev.sthings.lab
      INFRA_GATEWAY_NAME: homerun2-dev-sthings-gateway
      INFRA_GATEWAY_NAMESPACE: default
      # The NAME of the Secret cert-manager writes the wildcard into, not a
      # credential -- detect-secrets matches the key on "SECRET" alone.
      INFRA_TLS_SECRET: wildcard-tls # pragma: allowlist secret

      # ---- cilium-lb ------------------------------------------------------
      # Reserved in Clusterbook BEFORE this cluster was built, as a /32 -- see
      # the runbook in ./README.md, step 1. Written out by hand on purpose:
      # Clusterbook is IPAM here, nothing reads the reservation back. The
      # ArgoCD-registered clusters do read it (appset-cilium-lb takes it from
      # the `ip` annotation on the cluster Secret), which is exactly why those
      # do not set these two values and this one must.
      #
      # substitute is map[string]string -- quote it, or kustomize hands Flux an
      # int and the CR is rejected.
      CILIUM_LB_IP_START: "192.168.10.171"
      CILIUM_LB_IP_STOP: "192.168.10.171"

      # ---- coredns-lab-zone -----------------------------------------------
      # The point here is serve_stale, not the zone (#252). The uplink behind
      # the DD-WRT router drops out for up to ~20 min at a time and the router
      # sometimes reboots; stock CoreDNS then hands every pod an i/o timeout
      # for ghcr.io and github.com, and Flux sources fail on DNS. With the
      # component, CoreDNS answers from cache for COREDNS_SERVE_STALE (default
      # 24h, left as is) while the upstream is gone.
      #
      # sthings.lab gets its own server block, pointed at the router: it is the
      # only resolver that knows the lab and Clusterbook's wildcard records.
      # No trailing dot -- the bundle's base adds it. An ADDRESS, not a name:
      # resolving a name here would need the resolver this configures.
      COREDNS_ZONE: sthings.lab
      COREDNS_ZONE_SERVER: "192.168.10.1"
      # The router answers AAAA with NXDOMAIN for its *.platform.sthings.lab
      # wildcard (A resolves). musl (every Alpine image) reads that as "no such
      # name" -- on machinery-hv an Ansible pod could not resolve
      # openbao.platform.sthings.lab (harvester#265). CoreDNS answers AAAA in
      # this zone itself, empty; the lab has no IPv6 (flux#567). Same as
      # machinery-hv (#276).
      COREDNS_ZONE_NODATA_TYPE: AAAA

      # ---- cert-manager ---------------------------------------------------
      # Version left at the component default (v1.21.2). infra and xplane pin
      # v1.19.1 and platform v1.20.2, but those are older clusters carrying
      # older issuers; nothing here needs to match them.
      #
      # The wildcard for INFRA_DOMAIN is issued by the lab's OpenBao PKI, not by
      # a self-signed CA. cert-manager-selfsigned still applies the Certificate
      # -- only the issuer it names changes, which is how platform does it too.
      CERT_MANAGER_SELFSIGNED_ISSUER: openbao-pki

      # ---- the OpenBao PKI issuer -------------------------------------------
      # ca-bundle, NOT ca-none. platform selects ca-none because its OpenBao is
      # in the same cluster and it talks plain HTTP, where there is no
      # certificate to verify and going through the Gateway would be circular
      # -- that hostname's cert is issued by this very issuer. Neither applies
      # here: OpenBao lives on another cluster and is reached over HTTPS, so the
      # issuer must verify it, and there is no loop to avoid.
      VAULT_ISSUER_NAME: openbao-pki
      VAULT_ISSUER_SERVER: https://openbao.platform.sthings.lab
      VAULT_ISSUER_PKI_PATH: pki/sign/sthings-lab

      # <cluster_name>-<k8s_auths[].name> from ./openbao/openbao.tf. The mount
      # path, the role and the ServiceAccount move together or not at all.
      VAULT_ISSUER_AUTH_MOUNT_PATH: /v1/auth/homerun2-dev-certmanager
      VAULT_ISSUER_AUTH_ROLE: certmanager
      # cert-manager's own ServiceAccount, which the Terraform binds. Not the
      # -cainjector or -webhook one the same chart also creates.
      VAULT_ISSUER_SERVICE_ACCOUNT: cert-manager

      # The root CA to verify OpenBao's TLS with, from ./openbao-pki-ca.yaml.
      # The component defaults to `vault-pki-ca`, the retired infra Vault's --
      # unset, the issuer would try to verify against a Secret that does not
      # exist here. CA_KEY matches the default and is spelled out for the same
      # reason the rest of this block is.
      VAULT_ISSUER_CA_SECRET: openbao-pki-ca # pragma: allowlist secret
      VAULT_ISSUER_CA_KEY: ca.crt

      # ---- reloader --------------------------------------------------------
      # Chart version, pinned like the homerun2 components (renovate.json).
      RELOADER_VERSION: "2.2.21" # datasource=helm depName=reloader registryUrl=https://stakater.github.io/stakater-charts

      # Ready on this issuer proves the LOGIN worked and nothing more --
      # cert-manager never re-checks the ability to SIGN. A role bound to a
      # policy that grants nothing reports Ready and issues no certificate.
      # Only an issued Certificate is evidence; see ./README.md.

      # ---- dashboards -----------------------------------------------------
      # Reachable at https://headlamp.homerun2-dev.sthings.lab and
      # https://flux.homerun2-dev.sthings.lab once the Gateway has an address.
      # Both are here to prove the Gateway and the wildcard certificate work
      # end to end; neither is load-bearing.
