---
# homerun2-radio-pitcher (stuttgart-things/homerun2-radio-pitcher): the
# office LED matrix as a radio station. Between notifications the panel plays
# a programme -- time check, tech news, facts about the lab -- and every
# notification cuts in (homerun-library#146).
#
# The pitcher is the control room: it works through the schedule below and,
# when a slot comes due, pitches a card into its own stream `ambient`
# (system radio, severity INFO, tags segment=<name>). Priority is the
# catcher's job: the matrix Pi reads `ambient` next to `messages` and
# `tabletennis` (../../hosts/matrix/README.md), and the `radio` rule in its
# profile (../../hosts/matrix/profile.yaml, ./homerun2-led-catcher-profile.yaml)
# has `ambient: true` -- shown only on a free panel, dropped when busy,
# pre-empted by any notification (homerun2-led-catcher#161, v0.31.0+).
#
# One replica only: two directors would air every slot twice (the artifact
# uses Recreate).
#
# Infra facts: this cluster in-cluster (the artifact's read-only ClusterRole:
# list pods, nodes, namespaces, Flux objects), Harvester's VMs remotely with
# the list-only ServiceAccount of ../harvester/homerun2-radio-pitcher-reader.yaml,
# whose kubeconfig is ./homerun2-radio-pitcher-kubeconfigs.enc.yaml. Every
# number comes from a live query; the model only rewords.
#
# Moderation: the local Ollama on the GPU VM (hosts/ollama-gpu, as Backstage's
# RAG-AI), not OpenRouter -- the shared free key runs into
# 429 free-models-per-day. An answer with a number that is not in the input,
# or one too long for the card, is rejected and the fixed text airs. Ollama
# down = fixed texts, nothing else changes. Number words and a dropped
# cluster name are rejected too since v0.2.0 (radio-pitcher#11).
#
# The schedule is re-read when the ConfigMap changes, without a restart; a
# broken one is logged, /ready reports it and the last good one stays on air.
#
# Programme UI (v0.5.0+, radio-pitcher#23): read-only, at /radio/ behind the
# portal (key `radio` in ./sthings-portal.yaml, so behind its Zitadel login):
# the show on air, the clock, what airs next, the last aired cards, each
# source's last query, and a preview that builds a segment without airing it.
# Session controls (v0.6.0+, radio-pitcher#24): pause, skip the next slot,
# switch the clock, air a segment now -- short-lived overrides for the running
# pod, the schedule below stays the programme. Unlocked in the page with the
# token of ./homerun2-radio-pitcher-ui.enc.yaml:
#   sops -d --extract '["stringData"]["ui-token"]' clusters/homerun2-dev/homerun2-radio-pitcher-ui.enc.yaml
# Daily summary (v0.7.0+, radio-pitcher#7): at 17:30 the counts of the last
# 24 h from homerun2-scout's /analytics/digest -- messages, errors, critical,
# the day before, the busiest system. The artifact points RADIO_SCOUT_URL at
# the stack's homerun2-scout and RADIO_SCOUT_TOKEN at its Secret
# homerun2-scout-token (required). The radio's own cards are indexed too;
# scout leaves them out (HOMERUN2_SCOUT_DIGEST_EXCLUDE_SYSTEMS in
# ./homerun2.yaml).
# Table tennis (v0.8.0+, radio-pitcher#6): the demo's Pong league from
# schmetterpause-demo's GET /api/statistics -- matches, sets, points, the
# longest set, most wins, deuce sets. Read-only token in
# ./homerun2-radio-pitcher-schmetterpause.enc.yaml, the same value as
# SCHMETTERPAUSE_STATISTICS_TOKEN for ./tabletennis.yaml. Ambient cards, never
# a held score.
# Try a segment on the real panel:
#   kubectl -n homerun2 exec deploy/homerun2-radio-pitcher -- /ko-app/homerun2-radio-pitcher once news
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: homerun2-radio-pitcher-kustomize
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/stuttgart-things/homerun2-radio-pitcher-kustomize
  ref:
    tag: v0.18.0 # datasource=docker depName=ghcr.io/stuttgart-things/homerun2-radio-pitcher-kustomize
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-radio-pitcher
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  dependsOn:
    - name: homerun2 # redis-stack and its redis-stack-auth Secret
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  suspend: false
  wait: true
  sourceRef:
    kind: OCIRepository
    name: homerun2-radio-pitcher-kustomize
  path: ./
  targetNamespace: homerun2
  patches:
    # Roll the pod when the kubeconfig Secret changes. The schedule needs no
    # restart (the pitcher watches the file), but a roll does no harm.
    - target:
        kind: Deployment
        name: homerun2-radio-pitcher
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: homerun2-radio-pitcher
          annotations:
            reloader.stakater.com/auto: "true"
        spec:
          template:
            spec:
              containers:
                - name: homerun2-radio-pitcher
                  env:
                    # The stack's Secret has the key redis-password, not the
                    # artefact's default `password`; and not optional, so a
                    # missing key stops the pod instead of NOAUTH on every pitch.
                    - name: REDIS_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: redis-stack-auth
                          key: redis-password
                          optional: false
                    # The programme UI under the portal's prefix (the
                    # artifact's profile sets it too; explicit here because
                    # the portal key below depends on it).
                    - name: BASE_PATH
                      value: /radio
                    # Session controls of the UI; required, so a missing
                    # Secret stops the pod instead of a UI without controls.
                    - name: RADIO_UI_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: homerun2-radio-pitcher-ui
                          key: ui-token
                          optional: false
                    # tabletennis-stats: schmetterpause-demo over the Service,
                    # as zaehlwerk reports to it (./tabletennis.yaml).
                    - name: RADIO_SCHMETTERPAUSE_URL
                      value: http://schmetterpause.schmetterpause-demo.svc.cluster.local
                    - name: RADIO_SCHMETTERPAUSE_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: homerun2-radio-pitcher-schmetterpause
                          key: statistics-token
                          optional: false
                    # releases: the org's new GitHub releases (public events,
                    # one request per 10 min, no token needed)
                    - name: RADIO_RELEASES_ORG
                      value: stuttgart-things
                    # Order = turns of a mixed news show. heise airs in German
                    # (headlines are never translated).
                    - name: RADIO_NEWS_FEEDS
                      value: heise=https://www.heise.de/rss/heise-top-atom.xml,hn=https://hnrss.org/frontpage?points=300,cncf=https://www.cncf.io/feed/,kubernetes=https://kubernetes.io/feed.xml
                    # On since 2026-11-18. It was off while gemma3 could write
                    # "Six of the sixty-four VMs" for 6 VMs; v0.2.0 rejects
                    # number words, repeated numbers and a dropped cluster name
                    # (radio-pitcher#11). Dry run of v0.7.0 against this
                    # cluster and Harvester: every number and name kept.
                    - name: RADIO_LLM_ENABLED
                      value: "true"
                    - name: OLLAMA_URL
                      value: http://ollama-gpu.sthings.lab:11434
                    - name: OLLAMA_MODEL
                      value: gemma3:12b
                    - name: OLLAMA_API
                      value: openai
                    - name: OLLAMA_TIMEOUT
                      value: 60s
    - target:
        kind: ConfigMap
        name: homerun2-radio-pitcher-config
      patch: |
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: homerun2-radio-pitcher-config
        data:
          schedule.yaml: |
            # The format clock, every hour. Minute -> segment; a minute
            # without a slot leaves the panel to the idle clock (rotate /
            # daylight, ../../hosts/matrix/README.md). Each item is a 12 s
            # card; items of one slot come 15 s apart.
            clock:
              # News shows on the hour and the half hour (v0.17.0): one block
              # of the time, top headlines (feeds take turns), the org's new
              # releases, fresh rollouts and an infra fact. The show's cards
              # carry show=news, which the catcher's radio-show rule holds
              # 20 s (./homerun2-led-catcher-profile.yaml, the Pi's
              # ../../hosts/matrix/profile.yaml), so they come 23 s apart. A
              # segment with nothing new is left out.
              ":00":
                - { segment: time-check }
                - { segment: news, count: 3, mix: true, spacing: 23s, card-tags: [show=news] }
                - { segment: releases, count: 1, spacing: 23s, card-tags: [show=news] }
                - { segment: rollouts, count: 2, spacing: 23s, card-tags: [show=news] }
                - { segment: infra-facts, count: 1, spacing: 23s, card-tags: [show=news] }
              ":15": { segment: infra-facts, count: 2 }
              ":25": { segment: news, count: 1, feeds: [cncf, kubernetes] }
              ":30":
                - { segment: time-check }
                - { segment: news, count: 3, mix: true, spacing: 23s, card-tags: [show=news] }
                - { segment: releases, count: 1, spacing: 23s, card-tags: [show=news] }
                - { segment: rollouts, count: 2, spacing: 23s, card-tags: [show=news] }
                - { segment: infra-facts, count: 1, spacing: 23s, card-tags: [show=news] }
              ":45": { segment: infra-facts, count: 2, sources: [harvester] }
              ":55": { segment: news, count: 1, feeds: [hn] }
              default: { segment: idle-clock, style: rotate }
            # The night airs nothing (empty clock), like labul.
            clocks:
              night: {}
            # Day windows (shows). Aired since v0.4.0 (radio-pitcher#3):
            # a show may pick a named clock (`clock: <name>` from `clocks:`)
            # and air `extra:` segments once per window. Only the night has
            # a clock of its own (silent); the day shows air the clock above.
            # after-work adds the day's numbers at 17:30 (daily-summary).
            # Table tennis: the day after work. No weekly card at lunch:
            # schmetterpause counts at most 200 matches per query and the
            # Pong demo plays more than that a day, so the week and the day
            # were the same card ("at least 200 matches").
            programme:
              "07:00-10:00": { show: morning-show }
              "10:00-17:00": { show: daytime }
              "17:00-19:00":
                show: after-work
                extra:
                  - { segment: daily-summary, at: "17:30" }
                  - { segment: tabletennis-stats, at: "18:10", days: 1 }
              "19:00-07:00": { show: night, clock: night }
          sources.yaml: |
            sources:
              - name: homerun2-dev
                type: kubernetes
              - name: homerun2-dev
                type: flux
              - name: harvester
                type: harvester
                kubeconfig: /etc/homerun2-radio-pitcher/kubeconfigs/harvester
