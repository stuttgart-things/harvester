---
# The homerun2 application stack -- stuttgart-things/flux → ./apps/homerun2/root.
#
# TWO KUSTOMIZATIONS, NOT EIGHT. This file used to be one Flux Kustomization
# per upstream profile, because a Kustomization's `path` has to name a
# directory kustomize can build and every component set needed a profile
# directory of its own upstream. Three of those profiles existed only because
# this cluster asked for them (stuttgart-things/flux#479, #481, #482): it runs
# on SOPS-encrypted Secrets rather than external-secrets, and every profile
# that carried led-catcher, light-catcher or demo-pitcher selected the eso/
# variant.
#
# apps/homerun2/root is an empty selection target, so `components:` below is
# the whole composition and `/sops` on each line is the credential mode. There
# is nothing left to add upstream: another component is another line here.
#
# WHY NOT THE apps-platform BUNDLE. It would work now -- HOMERUN2_SECRETS: sops
# switches it -- but the bundle's homerun2 component is a fixed set
# (omni-pitcher, core-catcher, scout, led-catcher) and this cluster runs
# notification-catcher as well, with DRY_RUN off. DRY_RUN cannot be threaded
# through a bundle: postBuild.substitute is map[string]string and a reference
# defaulting to a bool arrives as one, which the API server rejects. Written
# out here, "false" is a literal and lands as a string.
#
# MIGRATING FROM THE EIGHT: the two lists render exactly what the eight
# profiles did, object for object, but the OWNER changes. Annotate the live
# objects with kustomize.toolkit.fluxcd.io/prune=disabled before applying so
# these two adopt them instead of pruning and recreating them -- ./README.md,
# section 7, "Migrating from the eight".
#
# Routes are deliberately NOT here -- see homerun2-routes below.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 1m
  # Generous: the redis-stack Helm install plus eight OCI-sourced child
  # Kustomizations. A fresh redis takes ~70s before it answers, and the
  # catchers restart against it until it does.
  timeout: 15m
  force: false
  prune: true
  suspend: false
  wait: true
  dependsOn:
    # For HOMERUN2_REDIS_STORAGE_CLASS below. Without openebs the PVC never
    # binds and the pod sits Pending while the HelmRelease reports installed.
    - name: openebs
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./apps/homerun2/root
  components:
    # Two lines per component that reads a credential: the workload, then the
    # credential mode. /sops renders plain Secrets filled by substituteFrom
    # below; /eso would read a ClusterSecretStore instead, which is what this
    # cluster deliberately does not have.
    - ../components/redis-stack
    - ../components/redis-stack/sops
    - ../components/omni-pitcher
    - ../components/omni-pitcher/sops
    - ../components/core-catcher
    - ../components/core-catcher/sops
    - ../components/notification-catcher
    - ../components/notification-catcher/sops
    - ../components/scout
    - ../components/scout/sops
    - ../components/led-catcher
    - ../components/led-catcher/sops
    - ../components/light-catcher
    - ../components/light-catcher/sops
    - ../components/demo-pitcher
    - ../components/demo-pitcher/sops
    # No credential of any kind: wled-mock is driven over HTTP and
    # config-viewer reads this namespace through the Kubernetes API. One line.
    - ../components/wled-mock
    - ../components/config-viewer
  postBuild:
    # homerun2-secrets-subst.enc.yaml, decrypted by Flux with the sops-age key
    # the FluxInstance mounts. optional:false on purpose -- left optional, Flux
    # substitutes empty strings and installs a Redis with no password, an
    # omni-pitcher whose bearer token is the empty string, and a
    # notification-catcher posting to nowhere, reporting success.
    substituteFrom:
      - kind: Secret
        name: homerun2-secrets-subst
        optional: false
    substitute:
      HOMERUN2_NAMESPACE: homerun2

      # The only StorageClass on this cluster, and the default. The component
      # default is `standard`, which does not exist here -- unset, the PVC
      # would never bind.
      HOMERUN2_REDIS_STORAGE_CLASS: openebs-hostpath
      HOMERUN2_REDIS_STORAGE_SIZE: 8Gi

      # notification-catcher posts for real from here on. It ships
      # DRY_RUN=true, which makes Dispatch log `would have sent` at INFO and
      # skip Notifier.Send entirely (internal/notify/dispatcher.go); the value
      # arrives as `${HOMERUN2_NOTIFICATION_CATCHER_DRYRUN:=true}` and
      # main.go reads it with boolEnv.
      #
      # Quoted because postBuild.substitute is map[string]string -- an unquoted
      # false renders as a YAML bool and the API server rejects the whole CR.
      #
      # Flipping it back is the way to debug routing: set "true", watch
      # `kubectl -n homerun2 logs -l app.kubernetes.io/name=homerun2-notification-catcher`,
      # confirm the right outputs match, flip again.
      HOMERUN2_NOTIFICATION_CATCHER_DRYRUN: "false"

      # NOT redundant with substituteFrom. Both carry a `:-changeme` default
      # upstream, so a missing value does not fail -- it installs the literal
      # string `changeme` as the bearer token and the scout token. They come
      # from the Secret above; this comment is here so nobody "tidies up" by
      # adding them as literals.
      #
      #   HOMERUN2_OMNI_PITCHER_AUTH_TOKEN  <- Secret
      #   HOMERUN2_SCOUT_AUTH_TOKEN         <- Secret
      #   HOMERUN2_REDIS_PASSWORD_B64       <- Secret (no default at all)
      #   TEAMS_WEBHOOK_URL                 <- Secret (no default at all)

  # UI_STREAM_PRESETS -- the two buttons in the led-catcher's web simulator.
  #
  # zaehlwerk CAN switch this catcher onto the `tabletennis` stream for a match
  # and back again, but only by calling the catcher directly, which needs
  # CATCHER_URL. That is deliberately not set here -- see the note in
  # ./tabletennis.yaml -- so on this cluster the switch is a human act instead.
  #
  # Unset, the control offers only the CONFIGURED stream as its single preset:
  # `messages`, and no way to reach `tabletennis`. The scorekeeper at the table
  # would have the button and nothing useful behind it. Two presets give
  # `messages` and `tabletennis`, and the header's `overridden` badge plus
  # `reset` are what keep a panel from sitting in scoreboard mode after an
  # abandoned match.
  #
  # WHY A PATCH ON A KUSTOMIZATION, not on the Deployment. The component above
  # renders an OCIRepository plus a child Kustomization; the Deployment itself
  # comes from the OCI artifact and is never an object in this path. So the
  # patch is appended to the CHILD's own patch list -- the same technique
  # upstream uses in apps/tabletennis/components/zaehlwerk-panel-homerun2.
  #
  # The container name is the merge key: `homerun2-led-catcher`, checked against
  # the running Deployment. A wrong one adds a SECOND container to the pod
  # rather than an env var, and reads like a broken image.
  patches:
    - target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: homerun2-led-catcher
      patch: |
        - op: add
          path: /spec/patches/-
          value:
            target:
              kind: Deployment
              name: homerun2-led-catcher
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: homerun2-led-catcher
              spec:
                template:
                  spec:
                    containers:
                      - name: homerun2-led-catcher
                        env:
                          - name: UI_STREAM_PRESETS
                            value: "messages,tabletennis"
---
# The HTTPRoutes for the stack above, applied only once it is Ready.
#
# Separate on purpose, and upstream keeps the `route` components separate for
# the same reason: Cilium resolves a route's backendRefs once. A route applied
# beside the Kustomization that later creates its Service serves HTTP 500 for
# good, while every Kustomization reports Ready.
#
# Eight routes, one per component that serves something:
#   omni-pitcher.homerun2-dev.sthings.lab
#   core-catcher.homerun2-dev.sthings.lab
#   scout.homerun2-dev.sthings.lab
#   led-catcher.homerun2-dev.sthings.lab
#   light-catcher.homerun2-dev.sthings.lab
#   wled-mock.homerun2-dev.sthings.lab
#   demo-pitcher.homerun2-dev.sthings.lab
#   config-viewer.homerun2-dev.sthings.lab
#
# notification-catcher has none: it is a consumer, not a server.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-routes
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  suspend: false
  wait: true
  dependsOn:
    - name: homerun2
    # The Gateway these routes attach to. An HTTPRoute whose parentRef does not
    # resolve sits at Accepted=False without explaining itself.
    - name: cilium-gateway
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./apps/homerun2/root
  components:
    - ../components/omni-pitcher/route
    - ../components/core-catcher/route
    - ../components/scout/route
    - ../components/led-catcher/route
    - ../components/light-catcher/route
    - ../components/wled-mock/route
    - ../components/demo-pitcher/route
    - ../components/config-viewer/route
  postBuild:
    substitute:
      HOMERUN2_NAMESPACE: homerun2

      # The `route` components read the ORIGINAL names, not the INFRA_* ones
      # the infra bundle uses. These three must match what infra-platform.yaml
      # sets as INFRA_DOMAIN / INFRA_GATEWAY_NAME / INFRA_GATEWAY_NAMESPACE, or
      # the routes attach to nothing.
      DOMAIN: homerun2-dev.sthings.lab
      GATEWAY_NAME: homerun2-dev-sthings-gateway
      GATEWAY_NAMESPACE: default
