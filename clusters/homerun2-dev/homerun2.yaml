---
# The homerun2 application stack -- stuttgart-things/flux → ./apps/homerun2.
#
# This uses profiles/base, NOT the apps-platform bundle component. The two
# differ in where credentials come from, and that is the whole reason for the
# choice: the bundle's profiles/platform selects each component's `eso/`
# variant, which needs external-secrets plus a ClusterSecretStore backed by
# OpenBao. profiles/base selects the `sops/` variants, which read their values
# from a substituteFrom Secret -- so the credentials live here, SOPS-encrypted,
# and this cluster needs no ESO at all.
#
# What that costs: profiles/base is a different component set. It has
# notification-catcher, which the platform profile does not, and it does NOT
# have led-catcher, which the platform profile does. Adding led-catcher means
# composing a profile of our own rather than using an upstream one.
#
# Routes are deliberately NOT here -- see homerun2-routes below.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 1m
  # Generous: the redis-stack Helm install plus four OCI-sourced child
  # Kustomizations. A fresh redis takes ~70s before it answers.
  timeout: 15m
  force: false
  prune: true
  suspend: false
  wait: true
  dependsOn:
    # For HOMERUN2_REDIS_STORAGE_CLASS below. Without openebs the PVC never
    # binds and the pod sits Pending while the HelmRelease reports installed.
    - name: openebs
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./apps/homerun2/profiles/base
  postBuild:
    # homerun2-secrets-subst.enc.yaml, decrypted by Flux with the sops-age key
    # the FluxInstance mounts. optional:false on purpose -- left optional, Flux
    # substitutes empty strings and installs a Redis with no password and an
    # omni-pitcher whose bearer token is the empty string, reporting success.
    substituteFrom:
      - kind: Secret
        name: homerun2-secrets-subst
        optional: false
    substitute:
      HOMERUN2_NAMESPACE: homerun2

      # The only StorageClass on this cluster, and the default. The component
      # default is `standard`, which does not exist here -- unset, the PVC
      # would never bind.
      HOMERUN2_REDIS_STORAGE_CLASS: openebs-hostpath
      HOMERUN2_REDIS_STORAGE_SIZE: 8Gi

      # notification-catcher posts for real from here on. It ships
      # DRY_RUN=true, which makes Dispatch log `would have sent` at INFO and
      # skip Notifier.Send entirely (internal/notify/dispatcher.go); the value
      # arrives as `${HOMERUN2_NOTIFICATION_CATCHER_DRYRUN:=true}` and
      # main.go reads it with boolEnv.
      #
      # Quoted because postBuild.substitute is map[string]string -- an unquoted
      # false renders as a YAML bool and the API server rejects the whole CR.
      #
      # Flipping it back is the way to debug routing: set "true", watch
      # `kubectl -n homerun2 logs -l app.kubernetes.io/name=homerun2-notification-catcher`,
      # confirm the right outputs match, flip again.
      HOMERUN2_NOTIFICATION_CATCHER_DRYRUN: "false"

      # NOT redundant with substituteFrom. Both carry a `:-changeme` default
      # upstream, so a missing value does not fail -- it installs the literal
      # string `changeme` as the bearer token and the scout token. They come
      # from the Secret above; this comment is here so nobody "tidies up" by
      # adding them as literals.
      #
      #   HOMERUN2_OMNI_PITCHER_AUTH_TOKEN  <- Secret
      #   HOMERUN2_SCOUT_AUTH_TOKEN         <- Secret
      #   HOMERUN2_REDIS_PASSWORD_B64       <- Secret (no default at all)
      #   TEAMS_WEBHOOK_URL                 <- Secret (no default at all)
---
# The HTTPRoutes for the stack above, applied only once it is Ready.
#
# Separate on purpose, and upstream ships them as their own profile for the
# same reason: Cilium resolves a route's backendRefs once. A route applied
# beside the Kustomization that later creates its Service serves HTTP 500 for
# good, while every Kustomization reports Ready.
#
# Three routes, not four: profiles/base has no led-catcher.
#   omni-pitcher.homerun2-dev.sthings.lab
#   core-catcher.homerun2-dev.sthings.lab
#   scout.homerun2-dev.sthings.lab
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-routes
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  suspend: false
  wait: true
  dependsOn:
    - name: homerun2
    # The Gateway these routes attach to. An HTTPRoute whose parentRef does not
    # resolve sits at Accepted=False without explaining itself.
    - name: cilium-gateway
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./apps/homerun2/profiles/base-routes
  postBuild:
    substitute:
      HOMERUN2_NAMESPACE: homerun2

      # profiles/base-routes predates the INFRA_* naming the infra bundle uses
      # and reads the ORIGINAL names. These three must match what
      # infra-platform.yaml sets as INFRA_DOMAIN / INFRA_GATEWAY_NAME /
      # INFRA_GATEWAY_NAMESPACE, or the routes attach to nothing.
      DOMAIN: homerun2-dev.sthings.lab
      GATEWAY_NAME: homerun2-dev-sthings-gateway
      GATEWAY_NAMESPACE: default
---
# led-catcher, which profiles/base does not carry.
#
# profiles/platform has it, but only in its eso/ form -- and components are not
# standalone-buildable, so there was no way to add it on the sops path at all.
# stuttgart-things/flux#479 adds the missing profile pair, mirroring
# platform-light-catcher: base-led-catcher takes led-catcher + led-catcher/sops,
# base-led-catcher-routes takes led-catcher/route.
#
# It needs no new credentials. The only bare variable is
# HOMERUN2_REDIS_PASSWORD_B64, which the Secret above already carries -- which
# is why substituteFrom is repeated here rather than the value being duplicated.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-led-catcher
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: false
  prune: true
  suspend: false
  wait: true
  dependsOn:
    # Redis and the namespace come from the base stack; led-catcher reads the
    # same stream and would restart against a Redis that is not up yet.
    - name: homerun2
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./apps/homerun2/profiles/base-led-catcher
  postBuild:
    substituteFrom:
      - kind: Secret
        name: homerun2-secrets-subst
        optional: false
    substitute:
      HOMERUN2_NAMESPACE: homerun2
---
# The HTTPRoute for led-catcher, applied only once it is Ready -- the same
# split, and the same reason, as homerun2-routes above: Cilium resolves a
# route's backendRefs once.
#
# Adds led-catcher.homerun2-dev.sthings.lab, the fourth route of the stack.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-led-catcher-routes
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  suspend: false
  wait: true
  dependsOn:
    - name: homerun2-led-catcher
    - name: cilium-gateway
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./apps/homerun2/profiles/base-led-catcher-routes
  postBuild:
    substitute:
      HOMERUN2_NAMESPACE: homerun2
      DOMAIN: homerun2-dev.sthings.lab
      GATEWAY_NAME: homerun2-dev-sthings-gateway
      GATEWAY_NAMESPACE: default
---
# light-catcher and the wled-mock it drives.
#
# Same story as led-catcher above: profiles/base carries neither, and the only
# profiles that did (platform-light-catcher and its tabletennis variant) select
# the eso/ variant. stuttgart-things/flux#481 adds base-light-catcher, mirroring
# platform-light-catcher with sops instead.
#
# wled-mock comes with it and takes no credentials at all -- it has neither an
# eso/ nor a sops/ directory. light-catcher drives it until
# HOMERUN2_LIGHT_CATCHER_WLED_ENDPOINT names a real strip.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-light-catcher
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: false
  prune: true
  suspend: false
  wait: true
  dependsOn:
    - name: homerun2
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./apps/homerun2/profiles/base-light-catcher
  postBuild:
    # For HOMERUN2_REDIS_PASSWORD_B64, the one bare variable the profile adds.
    substituteFrom:
      - kind: Secret
        name: homerun2-secrets-subst
        optional: false
    substitute:
      HOMERUN2_NAMESPACE: homerun2
---
# The HTTPRoutes for light-catcher and wled-mock, applied once they are Ready.
#
# Brings the stack to six routes: omni-pitcher, core-catcher, scout,
# led-catcher, light-catcher, wled-mock.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-light-catcher-routes
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  suspend: false
  wait: true
  dependsOn:
    - name: homerun2-light-catcher
    - name: cilium-gateway
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./apps/homerun2/profiles/base-light-catcher-routes
  postBuild:
    substitute:
      HOMERUN2_NAMESPACE: homerun2
      DOMAIN: homerun2-dev.sthings.lab
      GATEWAY_NAME: homerun2-dev-sthings-gateway
      GATEWAY_NAMESPACE: default
---
# demo-pitcher: a generator that pitches synthetic messages onto the stream, so
# the catchers have something to react to without a real system producing
# events. Useful precisely on a dev cluster.
#
# Third of the same shape as led-catcher and light-catcher above -- the profile
# pair comes from stuttgart-things/flux#482. With it, every homerun2 component
# that has a sops/ variant is reachable from profiles/base.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-demo-pitcher
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: false
  prune: true
  suspend: false
  wait: true
  dependsOn:
    - name: homerun2
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./apps/homerun2/profiles/base-demo-pitcher
  postBuild:
    substituteFrom:
      - kind: Secret
        name: homerun2-secrets-subst
        optional: false
    substitute:
      HOMERUN2_NAMESPACE: homerun2
---
# The HTTPRoute for demo-pitcher, applied once it is Ready.
#
# Brings the stack to seven routes: omni-pitcher, core-catcher, scout,
# led-catcher, light-catcher, wled-mock, demo-pitcher.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-demo-pitcher-routes
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  suspend: false
  wait: true
  dependsOn:
    - name: homerun2-demo-pitcher
    - name: cilium-gateway
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./apps/homerun2/profiles/base-demo-pitcher-routes
  postBuild:
    substitute:
      HOMERUN2_NAMESPACE: homerun2
      DOMAIN: homerun2-dev.sthings.lab
      GATEWAY_NAME: homerun2-dev-sthings-gateway
      GATEWAY_NAMESPACE: default
