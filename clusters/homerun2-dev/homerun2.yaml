---
# The homerun2 application stack -- stuttgart-things/flux →
# ./apps/homerun2/profiles/sops (flux#543).
#
# One profile for the whole sops stack: profiles/base (redis-stack,
# omni-pitcher, core-catcher, notification-catcher, scout) plus every add-on
# that has a sops/ variant -- led-catcher, light-catcher with wled-mock,
# demo-pitcher -- and config-viewer, which needs no credentials at all. Until
# 2026-09-28 this file pointed ten Kustomizations at five profiles and their
# five route profiles, each with the same source, namespace and substituteFrom
# (harvester#261). Rendered offline against flux#543 with this cluster's
# values: the same 39 objects, 38 field-for-field identical; the led-catcher
# Deployment differs only in the order of its env entries.
#
# Why sops and not the apps-platform bundle: the bundle's profiles/platform
# selects each component's `eso/` variant, which needs external-secrets plus a
# ClusterSecretStore backed by OpenBao. The sops/ variants read their values
# from a substituteFrom Secret -- the credentials live here, SOPS-encrypted,
# and this cluster needs no ESO at all.
#
# Routes are deliberately NOT here -- see homerun2-routes below.
#
# ROLLBACK IS TWO STEPS, not a plain revert (harvester#261): both Kustomizations
# are prune: true and own every add-on. Set prune: false on both, merge, wait
# for reconcile, THEN revert -- otherwise Flux deletes the add-ons before the
# old Kustomizations re-create them.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 1m
  # Generous: the redis-stack Helm install plus the OCI-sourced child
  # Kustomizations of nine components. A fresh redis takes ~70s before it
  # answers; led-catcher, light-catcher and demo-pitcher wait for it themselves.
  timeout: 15m
  force: false
  prune: true
  suspend: false
  wait: true
  dependsOn:
    # For HOMERUN2_REDIS_STORAGE_CLASS below. Without openebs the PVC never
    # binds and the pod sits Pending while the HelmRelease reports installed.
    - name: openebs
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./apps/homerun2/profiles/sops
  postBuild:
    # homerun2-secrets-subst.enc.yaml, decrypted by Flux with the sops-age key
    # the FluxInstance mounts. optional:false on purpose -- left optional, Flux
    # substitutes empty strings and installs a Redis with no password and an
    # omni-pitcher whose bearer token is the empty string, reporting success.
    substituteFrom:
      - kind: Secret
        name: homerun2-secrets-subst
        optional: false
    substitute:
      HOMERUN2_NAMESPACE: homerun2

      # Pinned, as on platform-sthings, rather than riding flux-apps main's
      # defaults: a component release then reaches this cluster as a Renovate
      # PR here (renovate.json, clusters/ manager), not as a silent change
      # whenever someone bumps the default upstream. Where a component has a
      # *_KUSTOMIZE_VERSION, image and kustomize artifact share the tag.
      HOMERUN2_OMNI_PITCHER_VERSION: v2.4.0 # datasource=docker depName=ghcr.io/stuttgart-things/homerun2-omni-pitcher
      HOMERUN2_CORE_CATCHER_VERSION: v1.3.0 # datasource=docker depName=ghcr.io/stuttgart-things/homerun2-core-catcher
      HOMERUN2_CORE_CATCHER_KUSTOMIZE_VERSION: v1.3.0 # datasource=docker depName=ghcr.io/stuttgart-things/homerun2-core-catcher-kustomize
      HOMERUN2_NOTIFICATION_CATCHER_VERSION: v3.15.0 # datasource=docker depName=ghcr.io/stuttgart-things/homerun2-notification-catcher
      HOMERUN2_NOTIFICATION_CATCHER_KUSTOMIZE_VERSION: v3.15.0 # datasource=docker depName=ghcr.io/stuttgart-things/homerun2-notification-catcher-kustomize
      HOMERUN2_SCOUT_VERSION: v0.12.0 # datasource=docker depName=ghcr.io/stuttgart-things/homerun2-scout
      HOMERUN2_SCOUT_KUSTOMIZE_VERSION: v0.12.0 # datasource=docker depName=ghcr.io/stuttgart-things/homerun2-scout-kustomize
      HOMERUN2_LED_CATCHER_VERSION: v0.24.0 # datasource=docker depName=ghcr.io/stuttgart-things/homerun2-led-catcher
      HOMERUN2_LIGHT_CATCHER_VERSION: v1.14.0 # datasource=docker depName=ghcr.io/stuttgart-things/homerun2-light-catcher
      HOMERUN2_LIGHT_CATCHER_KUSTOMIZE_VERSION: v1.14.0 # datasource=docker depName=ghcr.io/stuttgart-things/homerun2-light-catcher-kustomize
      HOMERUN2_WLED_MOCK_VERSION: v1.14.0 # datasource=docker depName=ghcr.io/stuttgart-things/homerun2-wled-mock
      HOMERUN2_DEMO_PITCHER_VERSION: v2.3.1 # datasource=docker depName=ghcr.io/stuttgart-things/homerun2-demo-pitcher
      HOMERUN2_CONFIG_VIEWER_VERSION: v0.7.0 # datasource=docker depName=ghcr.io/stuttgart-things/homerun2-config-viewer
      HOMERUN2_CONFIG_VIEWER_KUSTOMIZE_VERSION: v0.7.0 # datasource=docker depName=ghcr.io/stuttgart-things/homerun2-config-viewer-kustomize

      # The only StorageClass on this cluster, and the default. The component
      # default is `standard`, which does not exist here -- unset, the PVC
      # would never bind.
      HOMERUN2_REDIS_STORAGE_CLASS: openebs-hostpath
      HOMERUN2_REDIS_STORAGE_SIZE: 8Gi
      # Held at 7.2 on purpose: the library default moves to 7.4, which writes
      # RDB v12 that 7.2 cannot load -- one-way. This cluster moves when someone
      # decides to, after a backup (stuttgart-things#3923).
      HOMERUN2_REDIS_IMAGE_VERSION: 7.2.0-v18

      # notification-catcher posts for real from here on. It ships
      # DRY_RUN=true, which makes Dispatch log `would have sent` at INFO and
      # skip Notifier.Send entirely (internal/notify/dispatcher.go); the value
      # arrives as `${HOMERUN2_NOTIFICATION_CATCHER_DRYRUN:=true}` and
      # main.go reads it with boolEnv.
      #
      # Quoted because postBuild.substitute is map[string]string -- an unquoted
      # false renders as a YAML bool and the API server rejects the whole CR.
      #
      # Flipping it back is the way to debug routing: set "true", watch
      # `kubectl -n homerun2 logs -l app.kubernetes.io/name=homerun2-notification-catcher`,
      # confirm the right outputs match, flip again.
      HOMERUN2_NOTIFICATION_CATCHER_DRYRUN: "false"

      # The simulator reads both streams all the time, as the real matrix does
      # (../../hosts/matrix, led_streams): `messages` for the cluster and
      # `tabletennis` for the demo's score (./tabletennis.yaml), which its
      # tabletennis-score rule holds on the panel while cards for the cluster
      # pass over it. Nothing switches the panel -- zaehlwerk has no
      # CATCHER_URL -- because Pong plays almost without a pause, and a panel
      # switched to the score would never show a cluster message again.
      HOMERUN2_LED_CATCHER_STREAMS: messages,tabletennis
      # The web control's buttons, for looking at one stream alone.
      HOMERUN2_LED_CATCHER_UI_STREAM_PRESETS: messages,tabletennis

      # No HOMERUN2_LIGHT_CATCHER_PROFILE_CM: this light-catcher reads
      # `messages` and drives the wled-mock with the base's profile again, so
      # the cluster's alerts show on the TV (portal key `wled`). The real
      # strip belongs to the table now (./light-catcher-tabletennis.yaml): a
      # point every few seconds would bury every warning on it, and two
      # catchers on one strip cut each other's effects off.

      # The led-catcher simulator's profile, from
      # ./homerun2-led-catcher-profile.yaml: the real matrix's rules
      # (../../hosts/matrix/profile.yaml) instead of the base's, so the web
      # UI shows what the panel shows.
      HOMERUN2_LED_CATCHER_PROFILE_CM: homerun2-led-catcher-profile-matrix
      # The same display queue as the real matrix (../../hosts/matrix,
      # led_display_queue=3): up to 3 finite displays wait their turn instead
      # of the newest waiting one replacing the rest, so the simulator plays a
      # burst of Flux Ready flips the way the panel does. led-catcher v0.22.0
      # or later in web mode (homerun2-led-catcher#144); quoted, a substitute
      # value must be a string.
      HOMERUN2_LED_CATCHER_DISPLAY_QUEUE: "3"

      # Behind sthings-portal (./sthings-portal.yaml): each service answers
      # under the key the portal serves it at. The portal is the only way in:
      # the direct hostnames are gone (homerun2-routes below, #569).
      HOMERUN2_LED_CATCHER_BASE_PATH: /led
      HOMERUN2_CORE_CATCHER_BASE_PATH: /core
      HOMERUN2_LIGHT_CATCHER_BASE_PATH: /light
      HOMERUN2_WLED_MOCK_BASE_PATH: /wled
      HOMERUN2_DEMO_PITCHER_BASE_PATH: /pitch
      HOMERUN2_CONFIG_VIEWER_BASE_PATH: /config
      HOMERUN2_NOTIFICATION_CATCHER_BASE_PATH: /notify

      # NOT redundant with substituteFrom. Both carry a `:-changeme` default
      # upstream, so a missing value does not fail -- it installs the literal
      # string `changeme` as the bearer token and the scout token. They come
      # from the Secret above; this comment is here so nobody "tidies up" by
      # adding them as literals.
      #
      #   HOMERUN2_OMNI_PITCHER_AUTH_TOKEN  <- Secret
      #   HOMERUN2_SCOUT_AUTH_TOKEN         <- Secret
      #   HOMERUN2_REDIS_PASSWORD_B64       <- Secret (no default at all)
      #   TEAMS_WEBHOOK_URL                 <- Secret (no default at all)
---
# The HTTPRoutes for the stack above, applied only once it is Ready.
#
# Separate on purpose, and upstream ships them as their own profile for the
# same reason: Cilium resolves a route's backendRefs once. A route applied
# beside the Kustomization that later creates its Service serves HTTP 500 for
# good, while every Kustomization reports Ready.
#
# The profile renders nine routes under homerun2-dev.sthings.lab; only
# omni-pitcher's survives (#569). The UIs are served behind the sthings-portal
# login (./sthings-portal.yaml) and their direct hosts bypassed it, so the
# patches below delete those routes, and this Kustomization's prune takes them
# off the cluster. omni-pitcher keeps its host for the webhook callers
# (platform's HOMERUN2_CENTRAL_PITCHER_URL, .../pitch), narrowed to /pitch:
# no /metrics or / from outside. Mirrors platform-sthings
# (stuttgart-things#4149).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-routes
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  suspend: false
  wait: true
  dependsOn:
    - name: homerun2
    # The Gateway these routes attach to. An HTTPRoute whose parentRef does not
    # resolve sits at Accepted=False without explaining itself.
    - name: cilium-gateway
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./apps/homerun2/profiles/sops-routes
  # A plain `$patch: delete`: the flux-system Kustomization that applies this
  # file has no postBuild, so no `$$` escaping as in platform-sthings' bundle.
  patches:
    - target:
        kind: HTTPRoute
        name: homerun2-(core-catcher|scout|led-catcher|light-catcher|wled-mock|demo-pitcher|config-viewer|notification-catcher)
      patch: |
        $patch: delete
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: deleted
    - target:
        kind: HTTPRoute
        name: homerun2-omni-pitcher
      patch: |
        - op: replace
          path: /spec/rules/0/matches/0/path/value
          value: /pitch
  postBuild:
    substitute:
      HOMERUN2_NAMESPACE: homerun2

      # The route profiles predate the INFRA_* naming the infra bundle uses and
      # read the ORIGINAL names. These three must match what
      # infra-platform.yaml sets as INFRA_DOMAIN / INFRA_GATEWAY_NAME /
      # INFRA_GATEWAY_NAMESPACE, or the routes attach to nothing.
      DOMAIN: homerun2-dev.sthings.lab
      GATEWAY_NAME: homerun2-dev-sthings-gateway
      GATEWAY_NAMESPACE: default
