---
# Who may talk to homerun2-schedule-pitcher at all (#569, a copy of
# platform-sthings' policy from stuttgart-things#4145). Its UI trusts
# X-Forwarded-User / X-Forwarded-Groups from sthings-portal
# (AUTH_TRUST_FORWARDED_USER, #565). The Gateway paths are covered -- the
# portal strips client-sent values, the direct route removes them
# (./homerun2-schedule-pitcher.yaml) -- but any pod could send the headers
# straight to the Service. So the pod only takes traffic from the callers it
# has, as Hubble saw them here:
#  * ingress: the Cilium Gateway (Envoy) -- browsers and agents via the direct
#    route schedule-pitcher.homerun2-dev.sthings.lab;
#  * host: the kubelet's probes (and the kube-apiserver proxy);
#  * sthings-portal: the proxied UI under /schedule, /health, manifests;
#  * the Harvester agent (./homerun2-schedule-pitcher-agent.yaml): POST /findings.
# No Prometheus entry as on platform-sthings: this cluster has no monitoring
# namespace. Only this pod is selected: the rest of the namespace stays
# without policy (none of the other homerun2 services reads the headers).
# Egress is not touched -- the policy has no egress section.
#
# The two pod callers are matched by name label AND ServiceAccount (#753): a
# label alone is set by whoever writes a pod spec in that namespace, so any
# other workload there that copies `app.kubernetes.io/name` would get in too.
#
# Enforced, checked read-only on 2026-11-19 (#753): Cilium on this cluster
# runs without policy-audit-mode, `cilium-dbg endpoint list` shows ingress
# enforcement on the schedule-pitcher endpoint only, Hubble sees only host
# and sthings-portal flows to it. When Prometheus comes to this cluster
# (#753, kube-prometheus-stack), add its entry like on platform-sthings, or
# its scrapes are dropped.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homerun2-schedule-pitcher-ingress
  namespace: homerun2
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: homerun2-schedule-pitcher
  ingress:
    - fromEntities:
        - ingress
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: homerun2
            app.kubernetes.io/name: sthings-portal
            io.cilium.k8s.policy.serviceaccount: sthings-portal
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: homerun2-agent
            app.kubernetes.io/name: homerun2-schedule-pitcher-agent
            io.cilium.k8s.policy.serviceaccount: homerun2-schedule-pitcher-agent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
