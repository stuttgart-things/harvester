---
# schmetterpause and zaehlwerk -- stuttgart-things/flux →
# ./apps/tabletennis/profiles/sops.
#
# This file used to assemble both by hand: the upstream profile read every
# credential through ExternalSecrets, and this cluster runs no ESO. flux#483
# gave apps/tabletennis a sops path. profiles/sops is the same pair as
# profiles/base, with plain Secrets from substituteFrom in place of the
# ExternalSecrets, which it deletes. Upstream changes to the HTTPRoute,
# ConfigMap and Deployment patches reach this cluster again.
#
# Everything the profile brings is one Kustomization now: both namespaces, both
# OCIRepositories, the two app Kustomizations (in their own namespaces), the
# CloudNativePG Cluster and the three Secrets. The Cluster used to sit in
# ../homerun2-dev-seeds behind a Kustomization of its own. That was only because
# a CNPG object in THIS directory deadlocks flux-system on the CRD. Here it is
# inside a Kustomization that waits for infra-platform, which is the same
# guard.
#
# What stays local is below: the values, and two patches the profile does not
# carry.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tabletennis
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
  dependsOn:
    # cnpg-operator (the Cluster CRD, else the dry-run fails the whole apply)
    # and the Gateway the HTTPRoutes attach to.
    - name: infra-platform
    # zaehlwerk's panel pitches into omni-pitcher.
    - name: homerun2
    # The ObjectStore CRD schmetterpause-db-backup-sops needs (infra-platform
    # waits on it too; named here so the reason is visible).
    - name: cnpg-barman-cloud
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./apps/tabletennis/profiles/sops
  # schmetterpause-db archives WAL continuously and takes a base backup every
  # night into s3://schmetterpause-cnpg/schmetterpause-db-homerun2-dev/ on the
  # MinIO on platform (flux#573). Its data came from the office on 2026-09-28
  # as a pg_dump (README section 10), so there is no Barman archive to recover
  # from any more -- schmetterpause-db-recovery is gone again. NEVER archive
  # under `schmetterpause-db` in this bucket: that path is reserved for a copy
  # of the office's own archive.
  components:
    - ../../components/schmetterpause-db-backup-sops
    # The handover: a won match goes from zaehlwerk to schmetterpause's
    # POST /api/results, and the scoring page offers schmetterpause's players
    # and observers. Two ends of one feature -- both or neither (flux README).
    # One credential, SCHMETTERPAUSE_SCOREBOARD_TOKEN (substituteFrom), read by
    # both. zaehlwerk calls https://schmetterpause.homerun2-dev.sthings.lab
    # through the Gateway and trusts it via ./zaehlwerk-trust-bundle.yaml.
    - ../../components/schmetterpause-scoreboard-sops
    - ../../components/zaehlwerk-handover-sops
  postBuild:
    # SCHMETTERPAUSE_SESSION_KEY, SCHMETTERPAUSE_DB_PASSWORD,
    # ZAEHLWERK_OMNI_PITCHER_TOKEN and ZAEHLWERK_REDIS_PASSWORD -- the values
    # tabletennis-secrets.enc.yaml held, byte for byte, so nothing rotates.
    # The profile fixes the database username to `schmetterpause`, which is
    # what this cluster already uses; SCHMETTERPAUSE_DB_USERNAME is unread.
    substituteFrom:
      - kind: Secret
        name: homerun2-secrets-subst
        optional: false
    substitute:
      DOMAIN: homerun2-dev.sthings.lab
      GATEWAY_NAME: homerun2-dev-sthings-gateway
      GATEWAY_NAMESPACE: default
      # NOT the profile's 1Gi default. The Cluster was created at 2Gi, and a
      # smaller size is a shrink that CNPG refuses.
      SCHMETTERPAUSE_DB_STORAGE_SIZE: 2Gi
      # Backups (schmetterpause-db-backup-sops). Credentials and CA from the
      # Secret schmetterpause-db-backup (./schmetterpause-db-backup.enc.yaml).
      # 30d like the office; the database is a few MB, and the gzipped WAL of
      # an idle hour is small.
      SCHMETTERPAUSE_BACKUP_BUCKET: schmetterpause-cnpg
      SCHMETTERPAUSE_BACKUP_S3_ENDPOINT: https://artifacts.platform.sthings.lab
      SCHMETTERPAUSE_BACKUP_SERVER_NAME: schmetterpause-db-homerun2-dev
      SCHMETTERPAUSE_BACKUP_RETENTION: 30d
      # Where zaehlwerk hands a won match over (zaehlwerk-handover-sops). Set
      # rather than left to the component's nested default
      # (https://${SCHMETTERPAUSE_HOSTNAME}.${DOMAIN}) -- same value, nothing
      # to resolve. The token is SCHMETTERPAUSE_SCOREBOARD_TOKEN from the
      # Secret above.
      ZAEHLWERK_SCHMETTERPAUSE_URL: https://schmetterpause.homerun2-dev.sthings.lab
      # Pinned rather than left to the profile's defaults, so a flux-apps
      # change never upgrades this cluster by surprise. v0.14.0 since
      # 2026-09-28 (#305), before the restore: the office (homerun2-test1)
      # runs v0.14.0, and a recovered database must meet an app at least as
      # new as its schema. v0.11 -> v0.14 brought no schema migration (goose
      # stayed at 20260916170000). zaehlwerk v0.7.0 goes with it: from v0.6.0
      # it reads v0.14's GET /api/operators.
      SCHMETTERPAUSE_VERSION: v0.14.0
      ZAEHLWERK_VERSION: v0.7.0
  patches:
    # The base ships SP_PUBLIC_BASE_URL as https://schmetterpause.cluster.example.com,
    # a placeholder. schmetterpause builds absolute links from it (login
    # redirects, mail), so left alone it sends users to a host that does not
    # exist while the app itself is healthy. The profile does not set it, so
    # this reaches into the child Kustomization's own patches.
    - target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: schmetterpause
      patch: |
        - op: add
          path: /spec/patches/-
          value:
            target:
              kind: ConfigMap
              name: schmetterpause-config
            patch: |
              - op: replace
                path: /data/SP_PUBLIC_BASE_URL
                value: "https://schmetterpause.homerun2-dev.sthings.lab"
    # The panel, pointed at this cluster's omni-pitcher over the gateway. The
    # profile REMOVES OMNI_PITCHER_URL (no panel by default), and this runs
    # after that, so it is an add.
    #
    # Not upstream's zaehlwerk-panel-homerun2 component. That one also sets
    # CATCHER_URL, which makes zaehlwerk call the led-catcher's /streams API
    # directly to switch it onto `tabletennis` for a match. That is a second
    # outbound dependency across namespaces, from an app that should only ever
    # reach omni-pitcher. zaehlwerk logs "panel stream switching disabled, no
    # CATCHER_URL configured", and that line is the intended state here.
    # Switching the led-catcher is a deliberate act instead: its own web
    # control, or POST /streams.
    - target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: zaehlwerk
      patch: |
        - op: add
          path: /spec/patches/-
          value:
            target:
              kind: ConfigMap
              name: zaehlwerk-config
            patch: |
              - op: add
                path: /data/OMNI_PITCHER_URL
                value: "https://omni-pitcher.homerun2-dev.sthings.lab"
