---
# The table tennis DEMO -- stuttgart-things/flux →
# ./apps/tabletennis/profiles/sandbox, the Pong sandbox (zaehlwerk ADR-0015/16/17,
# schmetterpause ADR-0027/28) as the whole of this cluster's table tennis.
#
# homerun2-dev runs in the office next to a TV, the real LED matrix and the
# real WLED strip, as a demo nobody plays at: eight bot players seeded into a
# schmetterpause of its own, zaehlwerk-pong playing one real match after
# another between two of them -- the open places of a tournament first, a
# random pair when none is open -- every result reported and rated at once.
# The score goes onto the matrix, the moments onto the strip
# (./light-catcher-tabletennis.yaml), and the TV shows the game.
#
# Until 2026-10-25 this file ran profiles/sops: the office's pair, with a copy
# of the office's data restored into it (README, "History"). That copy and its
# backups are gone on purpose -- a demo that rates bots at once does not belong
# next to real people's ratings, and the seed refuses a database that already
# has players.
#
# What the profile selects is fixed: the handover and the scoreboard, the
# matches token (Pong's door into zaehlwerk), immediate settling, the pong
# seed and league mode with tournaments. Below: the cluster's values, the
# score straight into this cluster's Redis, and the court speed.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tabletennis
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
  dependsOn:
    # cnpg-operator (the Cluster CRD, else the dry-run fails the whole apply)
    # and the Gateway the HTTPRoutes attach to.
    - name: infra-platform
    # The score goes into homerun2's Redis.
    - name: homerun2
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./apps/tabletennis/profiles/sandbox
  components:
    # The score straight into redis-stack in `homerun2`, on the stream the
    # matrix and the led-catcher simulator read besides `messages`
    # (./homerun2.yaml, ../../hosts/matrix). No CATCHER_URL: nothing switches
    # the panel, it always shows both.
    - ../../components/zaehlwerk-panel-redis
    # The running match on schmetterpause's start page.
    - ../../components/schmetterpause-zaehlwerk-on
  postBuild:
    # SCHMETTERPAUSE_SESSION_KEY, SCHMETTERPAUSE_DB_PASSWORD,
    # SCHMETTERPAUSE_SCOREBOARD_TOKEN, ZAEHLWERK_MATCHES_TOKEN (all required)
    # and ZAEHLWERK_REDIS_PASSWORD (homerun2's) -- ./homerun2-secrets-subst.enc.yaml.
    substituteFrom:
      - kind: Secret
        name: homerun2-secrets-subst
        optional: false
    substitute:
      DOMAIN: homerun2-dev.sthings.lab
      GATEWAY_NAME: homerun2-dev-sthings-gateway
      GATEWAY_NAMESPACE: default
      # Namespaces of their own, not the old `schmetterpause` and `zaehlwerk`:
      # the old CloudNativePG Cluster carries prune: disabled and still holds
      # the office's copy until it is deleted by hand (README, "The demo"),
      # and a Cluster of the same name in the same namespace would be adopted
      # with its data. The hostnames are the short ones -- the old routes go
      # with the old Kustomization's objects.
      SCHMETTERPAUSE_NAMESPACE: schmetterpause-demo
      SCHMETTERPAUSE_HOSTNAME: schmetterpause
      ZAEHLWERK_NAMESPACE: zaehlwerk-demo
      ZAEHLWERK_HOSTNAME: zaehlwerk
      ZAEHLWERK_PONG_HOSTNAME: zaehlwerk-pong
      LINK_DOMAIN: homerun2-dev.sthings.lab
      ZAEHLWERK_ALLOWED_ORIGINS: https://schmetterpause.homerun2-dev.sthings.lab
      SCHMETTERPAUSE_ZAEHLWERK_URL: https://zaehlwerk.homerun2-dev.sthings.lab
      # zaehlwerk reports, and Pong reads its players and tournaments, over
      # the Service: no certificate, no trust bundle.
      ZAEHLWERK_SCHMETTERPAUSE_URL: http://schmetterpause.schmetterpause-demo.svc.cluster.local
      ZAEHLWERK_HOMERUN2_NAMESPACE: homerun2
      # The stream the score goes on, and the one the panel's
      # tabletennis-score rule draws (../../hosts/matrix/profile.yaml).
      ZAEHLWERK_PANEL_STREAM: tabletennis
      ZAEHLWERK_SET_OPENER: alternate
      ZAEHLWERK_PONG_BOT_SKILL: mittel
      ZAEHLWERK_PONG_OPERATOR: Pong
      # The bots, by the names they carry HERE: the seed's Ada .. Hanna,
      # renamed after the seed into table tennis legends (README, "The demo"),
      # strongest first. A name the database does not have plays at
      # ZAEHLWERK_PONG_BOT_SKILL, and the game logs it once.
      ZAEHLWERK_PONG_PLAYER_SKILL: Waldner=schwer,Ma Long=schwer,Boll=0.1,Ovtcharov=mittel,Zhang Jike=mittel,Persson=0.2,Samsonov=leicht,Saive=leicht
      # Longer than zaehlwerk's 15 s grace period, so a result is in -- and a
      # final decided -- before the next match starts.
      ZAEHLWERK_PONG_LEAGUE_PAUSE: 30s
      SCHMETTERPAUSE_DB_STORAGE_SIZE: 1Gi
      # Pinned, so a flux-apps change never moves the demo by surprise.
      # zaehlwerk v0.34.0: the panel's stake and tournament tags, which the
      # strip's match-point and final effects match on, and PONG_COURT_SPEED.
      # v0.35.0: Pong's /live, the one address the TV stays on; v0.36.0:
      # /ui/watch links it while Pong plays (v0.36.1: league matches too);
      # v0.37.0: the lobby's Liga card stops and plays the league.
      SCHMETTERPAUSE_VERSION: v0.20.0 # datasource=docker depName=ghcr.io/stuttgart-things/schmetterpause-kustomize
      ZAEHLWERK_VERSION: v0.39.0 # datasource=docker depName=ghcr.io/stuttgart-things/zaehlwerk-kustomize
  patches:
    # SP_PUBLIC_BASE_URL: the base ships a placeholder, and schmetterpause
    # builds its absolute links (login redirects) from it.
    - target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: schmetterpause
      patch: |
        - op: add
          path: /spec/patches/-
          value:
            target:
              kind: ConfigMap
              name: schmetterpause-config
            patch: |
              - op: replace
                path: /data/SP_PUBLIC_BASE_URL
                value: "https://schmetterpause.homerun2-dev.sthings.lab"
    # The court three times as fast as real time: a best-of-three in five
    # minutes rather than a quarter of an hour, which is what a screen in the
    # office can hold attention for. Quoted: an env value is a string, and
    # kustomize keeps the quotes of one that would parse as a number.
    # zaehlwerk-pong before v0.34.0 ignores the variable.
    - target:
        kind: Deployment
        name: zaehlwerk-pong
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: zaehlwerk-pong
        spec:
          template:
            spec:
              containers:
                - name: pong
                  env:
                    - name: PONG_COURT_SPEED
                      value: "3"
