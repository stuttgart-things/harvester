---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-lb
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cilium/components/lb
  prune: true
  wait: true
  postBuild:
    substitute:
      CILIUM_LB_IP_START: "192.168.10.160"
      CILIUM_LB_IP_STOP: "192.168.10.160"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cert-manager/components/install
  prune: true
  wait: true
  postBuild:
    substitute:
      CERT_MANAGER_NAMESPACE: cert-manager
      CERT_MANAGER_VERSION: v1.21.3
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-selfsigned
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cert-manager/components/selfsigned
  prune: true
  wait: true
  postBuild:
    substitute:
      CERT_MANAGER_NAMESPACE: cert-manager
      CERT_MANAGER_SELFSIGNED_DOMAIN: "platform.sthings.lab"
      CERT_MANAGER_SELFSIGNED_SECRET_NAME: wildcard-platform-sthings-tls # pragma: allowlist secret
      CERT_MANAGER_SELFSIGNED_CERT_NAME: wildcard-platform-sthings-tls
      CERT_MANAGER_SELFSIGNED_CERT_NAMESPACE: default
      # Moved off the retired infra Vault (vault-pki) onto the platform OpenBao
      # root now that openbao-pki is Ready. See stuttgart-things/harvester#152.
      CERT_MANAGER_SELFSIGNED_ISSUER: openbao-pki
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-gateway
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cilium-lb
    - name: cert-manager-selfsigned
    - name: cert-harbor-wildcard
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cilium/components/gateway
  prune: true
  wait: true
  postBuild:
    substitute:
      CILIUM_GATEWAY_NAME: platform-sthings-gateway
      CILIUM_GATEWAY_NAMESPACE: default
      CILIUM_GATEWAY_DOMAIN: "platform.sthings.lab"
      CILIUM_GATEWAY_TLS_SECRET: wildcard-platform-sthings-tls # pragma: allowlist secret
  # Extra listener for the harbor pull-through-cache wildcard subdomain
  # (*.harbor.<domain>) — the base *.<domain> cert/listener doesn't cover the
  # two-level subdomain used by harbor-project-proxy.
  patches:
    - target:
        group: gateway.networking.k8s.io
        version: v1
        kind: Gateway
      patch: |
        - op: add
          path: /spec/listeners/-
          value:
            name: https-harbor
            hostname: "*.harbor.platform.sthings.lab"
            port: 443
            protocol: HTTPS
            allowedRoutes:
              namespaces:
                from: All
            tls:
              mode: Terminate
              certificateRefs:
                - kind: Secret
                  group: ""
                  name: wildcard-harbor-platform-sthings-tls
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-harbor-wildcard
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cert-manager-selfsigned
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cert-manager/components/extra-certificate
  prune: true
  wait: true
  postBuild:
    substitute:
      EXTRA_CERT_NAME: wildcard-harbor-platform-sthings-tls
      EXTRA_CERT_NAMESPACE: default
      EXTRA_CERT_SECRET_NAME: wildcard-harbor-platform-sthings-tls # pragma: allowlist secret
      EXTRA_CERT_DOMAIN: harbor.platform.sthings.lab
      # Moved off the retired infra Vault (vault-pki) onto openbao-pki — #152.
      EXTRA_CERT_ISSUER: openbao-pki
      EXTRA_CERT_ISSUER_KIND: ClusterIssuer
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trust-manager
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cert-manager-selfsigned
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/trust-manager
  prune: true
  wait: true
  postBuild:
    substitute:
      TRUST_MANAGER_NAMESPACE: cert-manager
      TRUST_MANAGER_VERSION: "0.22.0"
      TRUST_BUNDLE_NAME: cluster-trust-bundle
      TRUST_BUNDLE_CA_SECRET: cluster-ca-secret # pragma: allowlist secret
      TRUST_BUNDLE_CA_KEY: ca.crt
      # openbao-pki-ca (clusters/platform/openbao-pki-ca.yaml) holds the OpenBao
      # root. It briefly also carried the legacy infra-Vault root during the
      # migration; that was trimmed once every platform cert moved to openbao-pki.
      # See #152.
      TRUST_BUNDLE_VAULT_CA_SECRET: openbao-pki-ca # pragma: allowlist secret
      TRUST_BUNDLE_VAULT_CA_KEY: ca.crt
      TRUST_BUNDLE_TARGET_KEY: trust-bundle.pem
      TRUST_BUNDLE_SECRET_NAME: tls-ca # pragma: allowlist secret
      TRUST_BUNDLE_SECRET_TARGET_KEY: cacerts.pem # pragma: allowlist secret
      TRUST_BUNDLE_SECRET_NAMESPACE: cattle-system # pragma: allowlist secret
      # Rancher's cacerts = the OpenBao root alone (it issues rancher's cert).
      # With cluster-ca-secret in it, every 60-day renewal of that self-signed
      # CA changed the checksum Rancher agents pin and locked Harvester's agent
      # out (#518). Needs stuttgart-things/flux#831; without it this is unused.
      TRUST_BUNDLE_SECRET_CA_SECRET: openbao-pki-ca # pragma: allowlist secret
      TRUST_BUNDLE_SECRET_CA_KEY: ca.crt # pragma: allowlist secret
---
# The ClusterIssuer for the OpenBao on this cluster — the tokenless half of the
# migration off the infra Vault.
#
# NOT a replacement for `vault-pki` beside it. The two are independent and
# coexist deliberately: every Certificate keeps its current issuer until it is
# moved by hand, so nothing reissues on a CA nothing trusts yet.
#
# IT WILL SIT NOT-READY UNTIL ./openbao/ HAS BEEN APPLIED. The auth mount, its
# role and the PKI come from Terraform (openbao/README.md step 3), and Flux has
# no OpenBao credentials to create them. A not-Ready issuer here means that step
# has not run — which is correct, and loud.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-openbao-issuer
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cert-manager/components/vault-issuer
  # No caBundleSecretRef: OpenBao is reached in-cluster over plain HTTP, so # pragma: allowlist secret
  # there is no certificate to verify. Going through the Gateway instead would
  # be circular — that hostname's cert is issued by this very issuer.
  components:
    - ./components/ca-none
  prune: true
  # wait on Ready, but do not mistake it for proof. cert-manager sets it on a
  # successful Vault LOGIN and never re-checks the ability to SIGN: pull the
  # cert-manager-tokenrequest RBAC and this stays green while no Certificate is
  # ever issued. Verified by doing exactly that on cicd-test3. Only an issued
  # Certificate is evidence.
  wait: true
  postBuild:
    substitute:
      CERT_MANAGER_NAMESPACE: cert-manager
      VAULT_ISSUER_NAME: openbao-pki
      VAULT_ISSUER_SERVER: http://openbao.openbao.svc.cluster.local:8200
      VAULT_ISSUER_PKI_PATH: pki/sign/sthings-lab
      # The mount is <cluster_name>-<k8s_auths[].name> from ./openbao/openbao.tf,
      # the role and the ServiceAccount are that same name. All three move
      # together or not at all.
      VAULT_ISSUER_AUTH_MOUNT_PATH: /v1/auth/platform-sthings-certmanager
      VAULT_ISSUER_AUTH_ROLE: certmanager
      VAULT_ISSUER_SERVICE_ACCOUNT: certmanager
---
# Stakater Reloader: rolls a workload when a ConfigMap/Secret it references
# changes, for workloads that opt in with reloader.stakater.com/auto: "true".
#
# Here for Backstage first (harvester#349): the chart mounts the catalog config
# with subPath, so Backstage reads it only at startup, and a catalog switch did
# nothing until someone restarted the pod by hand. The flux app's Deployment
# already carries the annotation; without the controller it was a no-op.
# Anything else on this cluster that carries the annotation is rolled on a
# config change from now on as well.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/reloader
  prune: true
  wait: true
  postBuild:
    substitute:
      RELOADER_NAMESPACE: reloader
---
# kube-prometheus-stack: Prometheus, Alertmanager, Grafana, node-exporter and
# kube-state-metrics for this cluster (harvester#490). The first monitoring in
# the Harvester lab; Grafana at grafana.platform.sthings.lab.
#
# CRDs: the prometheus-operator CRDs come with the chart (crds subchart,
# install/upgrade crds: CreateReplace in the flux release), so they exist before
# anything of this release uses ServiceMonitor/PrometheusRule.
#
# ALERTS (warning|critical) go to homerun2-dev's omni-pitcher (this cluster
# runs no homerun2), on its native Alertmanager endpoint /pitch/alertmanager
# (omni-pitcher >= v2.4.0: one message per alert, tags status=firing|resolved
# and fingerprint=...; routed to the `alerts` stream like /pitch/grafana).
# Through homerun2-dev's Gateway, so Alertmanager has to trust the OpenBao PKI
# that signed it: alertmanager-webhook-ca mounts the cluster-trust-bundle
# ConfigMap trust-manager writes into every namespace. From the pitcher the
# notification-catcher on homerun2-dev fans them out (Teams, severity >= warning).
#
# TOKEN: omni-pitcher has one bearer token (AUTH_TOKEN). It is already here as
# HOMERUN2_K8S_PITCHER_AUTH_TOKEN in the Secret homerun2-k8s-pitcher-remote-sops-secrets # pragma: allowlist secret
# (./apps/homerun2-k8s-pitcher-remote-sops-secrets.enc.yaml, the k8s-pitcher
# pilot), so this reads that Secret instead of keeping a second copy; the patch
# points the receiver at that variable instead of the flux release's
# HOMERUN2_OMNI_PITCHER_AUTH_TOKEN. Rotating the pitcher token = updating that
# one file. The patch runs before postBuild, so ${...} in it is substituted.
# Not optional: without the Secret this Kustomization stops instead of rolling
# out the release's `changeme` token.
#
# GRAFANA keeps its local admin (lab rule, #574): user `admin`, the password is
# the one the grafana chart generates into the Secret kube-prometheus-stack-grafana
# (key admin-password, kept across upgrades by the chart's lookup) -- the patch
# drops the flux release's adminPassword, whose fallback is the public
# `prom-operator`. Read it with
#   kubectl -n monitoring get secret kube-prometheus-stack-grafana \
#     -o jsonpath='{.data.admin-password}' | base64 -d
# SSO (ZITADEL) comes later as another patch on /spec/values/grafana/grafana.ini.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  dependsOn:
    - name: cilium-gateway
    - name: trust-manager
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/kube-prometheus-stack
  components:
    - components/alertmanager-webhook-ca
  prune: true
  wait: true
  # The `test` op pins receiver index 1 to `msteams`, like the flux components
  # do: a reordered release.yaml fails the build instead of patching the wrong
  # receiver.
  patches:
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: kube-prometheus-stack
      patch: |  # pragma: allowlist secret -- names a variable, holds no secret
        - op: test
          path: /spec/values/alertmanager/config/receivers/1/name
          value: msteams
        - op: replace
          path: /spec/values/alertmanager/config/receivers/1/webhook_configs/0/http_config/authorization/credentials
          value: ${HOMERUN2_K8S_PITCHER_AUTH_TOKEN}
        - op: remove
          path: /spec/values/grafana/adminPassword
  postBuild:
    substitute:
      KPS_NAMESPACE: monitoring
      KPS_VERSION: "92.11.0" # datasource=helm depName=kube-prometheus-stack registryUrl=https://prometheus-community.github.io/helm-charts
      KPS_PROMETHEUS_STORAGE_CLASS: local-path
      KPS_PROMETHEUS_STORAGE_SIZE: 20Gi
      KPS_PROMETHEUS_RETENTION: 15d
      KPS_SCRAPE_INTERVAL: 60s
      KPS_ALERTMANAGER_WEBHOOK_URL: https://omni-pitcher.homerun2-dev.sthings.lab/pitch/alertmanager
      KPS_ALERTMANAGER_CA_CONFIGMAP: cluster-trust-bundle
      KPS_ALERTMANAGER_CA_KEY: trust-bundle.pem
      GATEWAY_NAME: platform-sthings-gateway
      GATEWAY_NAMESPACE: default
      HOSTNAME: grafana
      DOMAIN: platform.sthings.lab
    substituteFrom:
      - kind: Secret
        name: homerun2-k8s-pitcher-remote-sops-secrets
        optional: false
