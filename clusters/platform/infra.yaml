---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-lb
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cilium/components/lb
  prune: true
  wait: true
  postBuild:
    substitute:
      CILIUM_LB_IP_START: "192.168.10.160"
      CILIUM_LB_IP_STOP: "192.168.10.160"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cert-manager/components/install
  prune: true
  wait: true
  postBuild:
    substitute:
      CERT_MANAGER_NAMESPACE: cert-manager
      CERT_MANAGER_VERSION: v1.21.3
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-selfsigned
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cert-manager/components/selfsigned
  prune: true
  wait: true
  postBuild:
    substitute:
      CERT_MANAGER_NAMESPACE: cert-manager
      CERT_MANAGER_SELFSIGNED_DOMAIN: "platform.sthings.lab"
      CERT_MANAGER_SELFSIGNED_SECRET_NAME: wildcard-platform-sthings-tls # pragma: allowlist secret
      CERT_MANAGER_SELFSIGNED_CERT_NAME: wildcard-platform-sthings-tls
      CERT_MANAGER_SELFSIGNED_CERT_NAMESPACE: default
      # Moved off the retired infra Vault (vault-pki) onto the platform OpenBao
      # root now that openbao-pki is Ready. See stuttgart-things/harvester#152.
      CERT_MANAGER_SELFSIGNED_ISSUER: openbao-pki
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-gateway
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cilium-lb
    - name: cert-manager-selfsigned
    - name: cert-harbor-wildcard
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cilium/components/gateway
  prune: true
  wait: true
  postBuild:
    substitute:
      CILIUM_GATEWAY_NAME: platform-sthings-gateway
      CILIUM_GATEWAY_NAMESPACE: default
      CILIUM_GATEWAY_DOMAIN: "platform.sthings.lab"
      CILIUM_GATEWAY_TLS_SECRET: wildcard-platform-sthings-tls # pragma: allowlist secret
  # Extra listener for the harbor pull-through-cache wildcard subdomain
  # (*.harbor.<domain>) — the base *.<domain> cert/listener doesn't cover the
  # two-level subdomain used by harbor-project-proxy.
  patches:
    - target:
        group: gateway.networking.k8s.io
        version: v1
        kind: Gateway
      patch: |
        - op: add
          path: /spec/listeners/-
          value:
            name: https-harbor
            hostname: "*.harbor.platform.sthings.lab"
            port: 443
            protocol: HTTPS
            allowedRoutes:
              namespaces:
                from: All
            tls:
              mode: Terminate
              certificateRefs:
                - kind: Secret
                  group: ""
                  name: wildcard-harbor-platform-sthings-tls
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-harbor-wildcard
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cert-manager-selfsigned
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cert-manager/components/extra-certificate
  prune: true
  wait: true
  postBuild:
    substitute:
      EXTRA_CERT_NAME: wildcard-harbor-platform-sthings-tls
      EXTRA_CERT_NAMESPACE: default
      EXTRA_CERT_SECRET_NAME: wildcard-harbor-platform-sthings-tls # pragma: allowlist secret
      EXTRA_CERT_DOMAIN: harbor.platform.sthings.lab
      # Moved off the retired infra Vault (vault-pki) onto openbao-pki — #152.
      EXTRA_CERT_ISSUER: openbao-pki
      EXTRA_CERT_ISSUER_KIND: ClusterIssuer
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trust-manager
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cert-manager-selfsigned
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/trust-manager
  prune: true
  wait: true
  postBuild:
    substitute:
      TRUST_MANAGER_NAMESPACE: cert-manager
      TRUST_MANAGER_VERSION: "0.22.0"
      TRUST_BUNDLE_NAME: cluster-trust-bundle
      TRUST_BUNDLE_CA_SECRET: cluster-ca-secret # pragma: allowlist secret
      TRUST_BUNDLE_CA_KEY: ca.crt
      # openbao-pki-ca (clusters/platform/openbao-pki-ca.yaml) holds the OpenBao
      # root. It briefly also carried the legacy infra-Vault root during the
      # migration; that was trimmed once every platform cert moved to openbao-pki.
      # See #152.
      TRUST_BUNDLE_VAULT_CA_SECRET: openbao-pki-ca # pragma: allowlist secret
      TRUST_BUNDLE_VAULT_CA_KEY: ca.crt
      TRUST_BUNDLE_TARGET_KEY: trust-bundle.pem
      TRUST_BUNDLE_SECRET_NAME: tls-ca # pragma: allowlist secret
      TRUST_BUNDLE_SECRET_TARGET_KEY: cacerts.pem # pragma: allowlist secret
      TRUST_BUNDLE_SECRET_NAMESPACE: cattle-system # pragma: allowlist secret
      # Rancher's cacerts = the OpenBao root alone (it issues rancher's cert).
      # With cluster-ca-secret in it, every 60-day renewal of that self-signed
      # CA changed the checksum Rancher agents pin and locked Harvester's agent
      # out (#518). Needs stuttgart-things/flux#831; without it this is unused.
      TRUST_BUNDLE_SECRET_CA_SECRET: openbao-pki-ca # pragma: allowlist secret
      TRUST_BUNDLE_SECRET_CA_KEY: ca.crt # pragma: allowlist secret
  # #600: trust-manager exits with "leader election lost" when lease renewals
  # stall. The chart default (15s lease / 10s renew deadline, 5s per request)
  # does not survive the first ~30 min after a platform boot, when lease PUTs
  # take 1-5s at p99. cert-manager runs with 60s/40s on the same API server and
  # never lost its lease. Same values here, plus requests so the pod is no
  # longer BestEffort while the node is busy starting everything else.
  patches:
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: trust-manager
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: trust-manager
        spec:
          values:
            app:
              leaderElection:
                leaseDuration: 60s
                renewDeadline: 40s
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
---
# The ClusterIssuer for the OpenBao on this cluster — the tokenless half of the
# migration off the infra Vault.
#
# NOT a replacement for `vault-pki` beside it. The two are independent and
# coexist deliberately: every Certificate keeps its current issuer until it is
# moved by hand, so nothing reissues on a CA nothing trusts yet.
#
# IT WILL SIT NOT-READY UNTIL ./openbao/ HAS BEEN APPLIED. The auth mount, its
# role and the PKI come from Terraform (openbao/README.md step 3), and Flux has
# no OpenBao credentials to create them. A not-Ready issuer here means that step
# has not run — which is correct, and loud.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-openbao-issuer
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cert-manager/components/vault-issuer
  # No caBundleSecretRef: OpenBao is reached in-cluster over plain HTTP, so # pragma: allowlist secret
  # there is no certificate to verify. Going through the Gateway instead would
  # be circular — that hostname's cert is issued by this very issuer.
  components:
    - ./components/ca-none
  prune: true
  # wait on Ready, but do not mistake it for proof. cert-manager sets it on a
  # successful Vault LOGIN and never re-checks the ability to SIGN: pull the
  # cert-manager-tokenrequest RBAC and this stays green while no Certificate is
  # ever issued. Verified by doing exactly that on cicd-test3. Only an issued
  # Certificate is evidence.
  wait: true
  postBuild:
    substitute:
      CERT_MANAGER_NAMESPACE: cert-manager
      VAULT_ISSUER_NAME: openbao-pki
      VAULT_ISSUER_SERVER: http://openbao.openbao.svc.cluster.local:8200
      VAULT_ISSUER_PKI_PATH: pki/sign/sthings-lab
      # The mount is <cluster_name>-<k8s_auths[].name> from ./openbao/openbao.tf,
      # the role and the ServiceAccount are that same name. All three move
      # together or not at all.
      VAULT_ISSUER_AUTH_MOUNT_PATH: /v1/auth/platform-sthings-certmanager
      VAULT_ISSUER_AUTH_ROLE: certmanager
      VAULT_ISSUER_SERVICE_ACCOUNT: certmanager
---
# Stakater Reloader: rolls a workload when a ConfigMap/Secret it references
# changes, for workloads that opt in with reloader.stakater.com/auto: "true".
#
# Here for Backstage first (harvester#349): the chart mounts the catalog config
# with subPath, so Backstage reads it only at startup, and a catalog switch did
# nothing until someone restarted the pod by hand. The flux app's Deployment
# already carries the annotation; without the controller it was a no-op.
# Anything else on this cluster that carries the annotation is rolled on a
# config change from now on as well.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/reloader
  prune: true
  wait: true
  postBuild:
    substitute:
      RELOADER_NAMESPACE: reloader
---
# kube-prometheus-stack: Prometheus, Alertmanager, Grafana, node-exporter and
# kube-state-metrics for this cluster (harvester#490). The first monitoring in
# the Harvester lab; Grafana at grafana.platform.sthings.lab.
#
# CRDs: the prometheus-operator CRDs come with the chart (crds subchart,
# install/upgrade crds: CreateReplace in the flux release), so they exist before
# anything of this release uses ServiceMonitor/PrometheusRule.
#
# ALERTS (warning|critical) go to homerun2-dev's omni-pitcher (this cluster
# runs no homerun2), on its native Alertmanager endpoint /pitch/alertmanager
# (omni-pitcher >= v2.4.0: one message per alert, tags status=firing|resolved
# and fingerprint=...; routed to the `alerts` stream like /pitch/grafana).
# Through homerun2-dev's Gateway, so Alertmanager has to trust the OpenBao PKI
# that signed it: alertmanager-webhook-ca mounts the cluster-trust-bundle
# ConfigMap trust-manager writes into every namespace. From the pitcher the
# notification-catcher on homerun2-dev fans them out (Teams, severity >= warning).
#
# TOKEN: omni-pitcher has one bearer token (AUTH_TOKEN, homerun2-dev's
# homerun2-secrets-subst). Alertmanager has its own copy of it, key `token` in
# the Secret monitoring/alertmanager-webhook-token # pragma: allowlist secret
# (./apps/alertmanager-webhook-token.enc.yaml), mounted through
# alertmanagerSpec.secrets and read by the receiver with credentials_file --
# the same shape as flux-infra's components/alertmanager-webhook-token, minus
# ESO (this cluster has none). Not in any Flux variable or HelmRelease value,
# and no longer tied to the k8s-pitcher pilot's Secret (#753, from #605).
# Rotating the omni-pitcher token = updating BOTH this file and
# ./apps/homerun2-k8s-pitcher-remote-sops-secrets.enc.yaml. Without the
# Secret the Alertmanager pod does not start (missing volume), instead of
# rolling out the release's `changeme` token.
#
# GRAFANA keeps its local admin (lab rule, #574): user `admin`, the password is
# the one the grafana chart generates into the Secret kube-prometheus-stack-grafana
# (key admin-password, kept across upgrades by the chart's lookup) -- the patch
# drops the flux release's adminPassword, whose fallback is the public
# `prom-operator`. Read it with
#   kubectl -n monitoring get secret kube-prometheus-stack-grafana \
#     -o jsonpath='{.data.admin-password}' | base64 -d
# SSO (ZITADEL) comes later as another patch on /spec/values/grafana/grafana.ini.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  dependsOn:
    - name: cilium-gateway
    - name: trust-manager
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/kube-prometheus-stack
  components:
    - components/alertmanager-webhook-ca
  prune: true
  wait: true
  # The `test` op pins receiver index 1 to `msteams`, like the flux components
  # do: a reordered release.yaml fails the build instead of patching the wrong
  # receiver.
  patches:
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: kube-prometheus-stack
      patch: |  # pragma: allowlist secret -- names a variable, holds no secret
        - op: test
          path: /spec/values/alertmanager/config/receivers/1/name
          value: msteams
        - op: replace
          path: /spec/values/alertmanager/config/receivers/1/webhook_configs/0/http_config/authorization
          value:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/alertmanager-webhook-token/token
        - op: add
          path: /spec/values/alertmanager/alertmanagerSpec/secrets
          value:
            - alertmanager-webhook-token
        - op: remove
          path: /spec/values/grafana/adminPassword
        # Lab dashboards (harvester#574 follow-up), folder "Lab": vendored
        # as ConfigMaps in ./apps/grafana-dashboards-lab/ (#753) -- no more
        # download at start, so they load without internet. The sidecar puts
        # a ConfigMap into the folder named by its annotation grafana_folder;
        # dashboards without it (kube-prometheus-stack's, Flux's, Cilium's)
        # stay in General. Loki logs is apps/grafana-dashboard-lab-logs.yaml.
        - op: add
          path: /spec/values/grafana/sidecar
          value:
            dashboards:
              folderAnnotation: grafana_folder
              provider:
                foldersFromFilesStructure: true
        # ZITADEL login (harvester#574) NEXT TO the local admin, which stays
        # (login form on, `admin` + generated password). Client ID/secret as
        # GF_AUTH_GENERIC_OAUTH_* env from the SOPS Secret
        # apps/grafana-oidc-zitadel.enc.yaml; the cluster trust bundle for
        # ZITADEL's OpenBao-PKI certificate. Roles from ZITADEL's own role
        # map in the ID token (urn:zitadel:iam:org:project:roles, only the
        # grafana project's roles; harvester#719 -- no more `groups` action):
        # grafana-admin => Admin, grafana-readonly => Viewer;
        # role_attribute_strict refuses anyone else (the expression yields
        # false). Callback /login/generic_oauth (zitadel-config/apps.auto.tfvars).
        - op: add
          path: /spec/values/grafana/envFromSecret
          value: grafana-oidc-zitadel
        - op: add
          path: /spec/values/grafana/extraConfigmapMounts
          value:
            - name: trust-bundle
              mountPath: /etc/grafana/ca
              configMap: cluster-trust-bundle
              readOnly: true
        - op: add
          path: /spec/values/grafana/grafana.ini/auth.generic_oauth
          value:
            enabled: true
            name: ZITADEL
            allow_sign_up: true
            auto_login: false
            scopes: openid profile email
            auth_url: https://zitadel.platform.sthings.lab/oauth/v2/authorize
            token_url: https://zitadel.platform.sthings.lab/oauth/v2/token
            api_url: https://zitadel.platform.sthings.lab/oidc/v1/userinfo
            auth_style: InHeader
            use_pkce: true
            login_attribute_path: preferred_username
            name_attribute_path: name
            email_attribute_path: email
            role_attribute_path: >-
              contains(keys("urn:zitadel:iam:org:project:roles" || `{}`), 'grafana-admin') && 'Admin' || contains(keys("urn:zitadel:iam:org:project:roles" || `{}`), 'grafana-readonly') && 'Viewer'
            role_attribute_strict: true
            tls_client_ca: /etc/grafana/ca/trust-bundle.pem
  postBuild:
    substitute:
      KPS_NAMESPACE: monitoring
      KPS_VERSION: "93.4.0" # datasource=helm depName=kube-prometheus-stack registryUrl=https://prometheus-community.github.io/helm-charts
      KPS_PROMETHEUS_STORAGE_CLASS: local-path
      KPS_PROMETHEUS_STORAGE_SIZE: 20Gi
      KPS_PROMETHEUS_RETENTION: 15d
      KPS_SCRAPE_INTERVAL: 60s
      KPS_ALERTMANAGER_WEBHOOK_URL: https://omni-pitcher.homerun2-dev.sthings.lab/pitch/alertmanager
      KPS_ALERTMANAGER_CA_CONFIGMAP: cluster-trust-bundle
      KPS_ALERTMANAGER_CA_KEY: trust-bundle.pem
      GATEWAY_NAME: platform-sthings-gateway
      GATEWAY_NAMESPACE: default
      HOSTNAME: grafana
      DOMAIN: platform.sthings.lab
---
# Loki: the lab's central log store (harvester#490). Monolithic on local-path,
# 7 days. In-cluster loki-gateway.loki.svc, for the other clusters
# loki.platform.sthings.lab through the Gateway; fluent-bit there runs the
# bundle's fluent-bit-remote. Also a datasource in the kube-prometheus-stack
# Grafana, which is why it waits on that (the ConfigMap goes into its
# namespace, monitoring).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  dependsOn:
    - name: cilium-gateway
    - name: kube-prometheus-stack
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/loki
  components:
    - components/httproute
    - components/grafana-datasource
  prune: true
  wait: true
  patches:
    - target:
        kind: HelmRelease
        name: loki
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: loki
        spec:
          values:
            # One node: the chart's required gateway anti-affinity lets no
            # surge pod schedule, so a RollingUpdate never finishes (first
            # seen on the 21.3.1 upgrade). Recreate: a few seconds without
            # the gateway on a rollout instead.
            gateway:
              deploymentStrategy:
                type: Recreate
  postBuild:
    substitute:
      LOKI_NAMESPACE: loki
      LOKI_VERSION: "21.4.3" # datasource=docker depName=ghcr.io/grafana-community/helm-charts/loki
      LOKI_STORAGE_CLASS: local-path
      LOKI_STORAGE_SIZE: 30Gi
      LOKI_RETENTION: 168h
      LOKI_HOSTNAME: loki
      LOKI_GRAFANA_NAMESPACE: monitoring
      GATEWAY_NAME: platform-sthings-gateway
      GATEWAY_NAMESPACE: default
      DOMAIN: platform.sthings.lab
---
# fluent-bit: platform's own container logs into the Loki above, plain HTTP to
# its gateway Service.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fluent-bit
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: loki
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/fluent-bit
  prune: true
  wait: true
  postBuild:
    substitute:
      FLUENT_BIT_NAMESPACE: logging
      FLUENT_BIT_VERSION: "0.58.3" # datasource=docker depName=ghcr.io/fluent/helm-charts/fluent-bit
      FLUENT_BIT_CLUSTER_NAME: platform
      FLUENT_BIT_LOKI_HOST: loki-gateway.loki.svc.cluster.local
---
# External Secrets Operator (harvester#753). The first ESO on this cluster, and
# for now it serves ONE store: `vault-clusterscope` below, which clusterscope's
# live mode reads the lab's other clusters through (./apps/clusterscope.yaml).
# Everything else here stays SOPS-in-git, as before.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/external-secrets/components/install
  prune: true
  wait: true
  postBuild:
    substitute:
      EXTERNAL_SECRETS_NAMESPACE: external-secrets # pragma: allowlist secret
      # The flux component's default; written out so Renovate and a reader see
      # the same version.
      EXTERNAL_SECRETS_VERSION: "2.15.0" # datasource=helm depName=external-secrets registryUrl=https://charts.external-secrets.io
---
# ClusterSecretStore `vault-clusterscope`: KV mount `clusterscope` on this
# cluster's OpenBao -- one READ-ONLY kubeconfig per lab cluster (ServiceAccount
# clusterscope-reader: get/list/watch, no Secrets), written by
# ./openbao/platform-eso/seed-clusterscope-kubeconfig.sh. Deliberately NOT the
# `kubeconfigs` mount: that one holds machinery-hv's ADMIN kubeconfigs, and any
# namespace on this cluster can reference a ClusterSecretStore.
#
# THE OPENBAO SIDE IS ./openbao/platform-eso (terraform, by hand, FIRST): the
# mount, the auth mount platform-sthings-eso, role `eso` bound to ESO's own
# ServiceAccount and the policy read-clusterscope-kubeconfigs. Before that has
# run this store reports InvalidProviderConfig -- loud, and correct.
#
# In-cluster over plain HTTP like cert-manager-openbao-issuer above, so it does
# not depend on the Gateway. The CA Secret is only there because the base
# always renders a caProvider; openbao-pki-ca is the OpenBao root
# (./openbao-pki-ca.yaml).
#
# Ready=True means the LOGIN worked, not that the policy reads anything --
# clusterscope's ExternalSecret clusterscope-kubeconfigs syncing is the proof.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-vault-clusterscope
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: external-secrets
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/external-secrets/components/cluster-store-vault
  prune: true
  wait: true
  postBuild:
    substitute:
      VAULT_CSS_NAME: vault-clusterscope
      VAULT_SERVER: http://openbao.openbao.svc.cluster.local:8200
      VAULT_KV_PATH: clusterscope
      VAULT_CA_SECRET_NAME: openbao-pki-ca # pragma: allowlist secret
      VAULT_CA_SECRET_NAMESPACE: cert-manager # pragma: allowlist secret
      VAULT_CA_SECRET_KEY: ca.crt # pragma: allowlist secret
      # <cluster_name>-<name> from ./openbao/platform-eso -- mount, role and
      # ServiceAccount move together or not at all.
      VAULT_K8S_AUTH_MOUNT_PATH: platform-sthings-eso
      VAULT_K8S_AUTH_ROLE: eso
      VAULT_K8S_AUTH_SA_NAME: external-secrets
      VAULT_K8S_AUTH_SA_NAMESPACE: external-secrets
