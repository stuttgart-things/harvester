---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-lb
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cilium/components/lb
  prune: true
  wait: true
  postBuild:
    substitute:
      CILIUM_LB_IP_START: "192.168.10.160"
      CILIUM_LB_IP_STOP: "192.168.10.160"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cert-manager/components/install
  prune: true
  wait: true
  postBuild:
    substitute:
      CERT_MANAGER_NAMESPACE: cert-manager
      CERT_MANAGER_VERSION: v1.20.2
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-selfsigned
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cert-manager/components/selfsigned
  prune: true
  wait: true
  postBuild:
    substitute:
      CERT_MANAGER_NAMESPACE: cert-manager
      CERT_MANAGER_SELFSIGNED_DOMAIN: "platform.sthings.lab"
      CERT_MANAGER_SELFSIGNED_SECRET_NAME: wildcard-platform-sthings-tls # pragma: allowlist secret
      CERT_MANAGER_SELFSIGNED_CERT_NAME: wildcard-platform-sthings-tls
      CERT_MANAGER_SELFSIGNED_CERT_NAMESPACE: default
      # Moved off the retired infra Vault (vault-pki) onto the platform OpenBao
      # root now that openbao-pki is Ready. See stuttgart-things/harvester#152.
      CERT_MANAGER_SELFSIGNED_ISSUER: openbao-pki
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-gateway
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cilium-lb
    - name: cert-manager-selfsigned
    - name: cert-harbor-wildcard
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cilium/components/gateway
  prune: true
  wait: true
  postBuild:
    substitute:
      CILIUM_GATEWAY_NAME: platform-sthings-gateway
      CILIUM_GATEWAY_NAMESPACE: default
      CILIUM_GATEWAY_DOMAIN: "platform.sthings.lab"
      CILIUM_GATEWAY_TLS_SECRET: wildcard-platform-sthings-tls # pragma: allowlist secret
  # Extra listener for the harbor pull-through-cache wildcard subdomain
  # (*.harbor.<domain>) — the base *.<domain> cert/listener doesn't cover the
  # two-level subdomain used by harbor-project-proxy.
  patches:
    - target:
        group: gateway.networking.k8s.io
        version: v1
        kind: Gateway
      patch: |
        - op: add
          path: /spec/listeners/-
          value:
            name: https-harbor
            hostname: "*.harbor.platform.sthings.lab"
            port: 443
            protocol: HTTPS
            allowedRoutes:
              namespaces:
                from: All
            tls:
              mode: Terminate
              certificateRefs:
                - kind: Secret
                  group: ""
                  name: wildcard-harbor-platform-sthings-tls
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-harbor-wildcard
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cert-manager-selfsigned
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cert-manager/components/extra-certificate
  prune: true
  wait: true
  postBuild:
    substitute:
      EXTRA_CERT_NAME: wildcard-harbor-platform-sthings-tls
      EXTRA_CERT_NAMESPACE: default
      EXTRA_CERT_SECRET_NAME: wildcard-harbor-platform-sthings-tls # pragma: allowlist secret
      EXTRA_CERT_DOMAIN: harbor.platform.sthings.lab
      # Moved off the retired infra Vault (vault-pki) onto openbao-pki — #152.
      EXTRA_CERT_ISSUER: openbao-pki
      EXTRA_CERT_ISSUER_KIND: ClusterIssuer
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nfs-csi
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/nfs-csi
  prune: true
  wait: true
  postBuild:
    substitute:
      NFS_SERVER_FQDN: "infra.sthings.lab"
      NFS_SHARE_PATH: /data/nfs/sthings
      CLUSTER_NAME: platform
      NFS_CSI_NAMESPACE: kube-system
      NFS_CSI_VERSION: v4.13.1
      NFS_CSI_ENABLE_CRDS: "true"
      NFS_CSI_ENABLE_SNAPSHOTTER: "true"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trust-manager
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cert-manager-selfsigned
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/trust-manager
  prune: true
  wait: true
  postBuild:
    substitute:
      TRUST_MANAGER_NAMESPACE: cert-manager
      TRUST_MANAGER_VERSION: "0.22.0"
      TRUST_BUNDLE_NAME: cluster-trust-bundle
      TRUST_BUNDLE_CA_SECRET: cluster-ca-secret # pragma: allowlist secret
      TRUST_BUNDLE_CA_KEY: ca.crt
      # openbao-pki-ca (clusters/platform/openbao-pki-ca.yaml) is a bundle of the
      # new OpenBao root AND the legacy infra-Vault root, so in-cluster trust
      # covers both during the migration off vault-pki. See #152.
      TRUST_BUNDLE_VAULT_CA_SECRET: openbao-pki-ca # pragma: allowlist secret
      TRUST_BUNDLE_VAULT_CA_KEY: ca.crt
      TRUST_BUNDLE_TARGET_KEY: trust-bundle.pem
      TRUST_BUNDLE_SECRET_NAME: tls-ca # pragma: allowlist secret
      TRUST_BUNDLE_SECRET_TARGET_KEY: cacerts.pem # pragma: allowlist secret
      TRUST_BUNDLE_SECRET_NAMESPACE: cattle-system # pragma: allowlist secret
---
# The ClusterIssuer for the OpenBao on this cluster — the tokenless half of the
# migration off the infra Vault.
#
# NOT a replacement for `vault-pki` beside it. The two are independent and
# coexist deliberately: every Certificate keeps its current issuer until it is
# moved by hand, so nothing reissues on a CA nothing trusts yet.
#
# IT WILL SIT NOT-READY UNTIL ./openbao/ HAS BEEN APPLIED. The auth mount, its
# role and the PKI come from Terraform (openbao/README.md step 3), and Flux has
# no OpenBao credentials to create them. A not-Ready issuer here means that step
# has not run — which is correct, and loud.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-openbao-issuer
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cert-manager/components/vault-issuer
  # No caBundleSecretRef: OpenBao is reached in-cluster over plain HTTP, so # pragma: allowlist secret
  # there is no certificate to verify. Going through the Gateway instead would
  # be circular — that hostname's cert is issued by this very issuer.
  components:
    - ./components/ca-none
  prune: true
  # wait on Ready, but do not mistake it for proof. cert-manager sets it on a
  # successful Vault LOGIN and never re-checks the ability to SIGN: pull the
  # cert-manager-tokenrequest RBAC and this stays green while no Certificate is
  # ever issued. Verified by doing exactly that on cicd-test3. Only an issued
  # Certificate is evidence.
  wait: true
  postBuild:
    substitute:
      CERT_MANAGER_NAMESPACE: cert-manager
      VAULT_ISSUER_NAME: openbao-pki
      VAULT_ISSUER_SERVER: http://openbao.openbao.svc.cluster.local:8200
      VAULT_ISSUER_PKI_PATH: pki/sign/sthings-lab
      # The mount is <cluster_name>-<k8s_auths[].name> from ./openbao/openbao.tf,
      # the role and the ServiceAccount are that same name. All three move
      # together or not at all.
      VAULT_ISSUER_AUTH_MOUNT_PATH: /v1/auth/platform-sthings-certmanager
      VAULT_ISSUER_AUTH_ROLE: certmanager
      VAULT_ISSUER_SERVICE_ACCOUNT: certmanager
