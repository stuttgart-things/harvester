---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: app
  name: harbor-project-proxy
  namespace: flux-system
spec:
  force: false
  interval: '1h'
  path: './apps/harbor/components/project-proxy'
  postBuild:
    substitute:
      # goharbor since #693: the HelmRelease "harbor" it depends on and the
      # harbor-core it forwards to are the goharbor chart's (./goharbor.yaml).
      HARBOR_NAMESPACE: goharbor
      HARBOR_HOSTNAME: harbor
      HARBOR_DOMAIN: platform.sthings.lab
      # Exposure is via the Gateway API HTTPRoute harbor-project-proxy in
      # ./goharbor.yaml (*.harbor.<domain>), so the chart's own nginx
      # ingress is disabled.
      INGRESS_ENABLED: 'false'
      INGRESS_CLASS_NAME: nginx
      HARBOR_PROJECT_PROXY_VERSION: '0.0.1' # datasource=docker depName=ghcr.io/hiddenmarten/harbor-project-proxy
  prune: true
  retryInterval: '1m'
  sourceRef:
    kind: GitRepository
    name: flux-apps
  suspend: false
  timeout: '5m'
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: harbor-project-proxy
      namespace: harbor
