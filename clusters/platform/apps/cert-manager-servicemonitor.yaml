---
# cert-manager's controller metrics (certificate expiry, readiness, ACME/issuer
# requests) for the "Cert-manager-Kubernetes" dashboard (grafana.com 20842,
# ../infra.yaml). Every gateway certificate here comes from the OpenBao PKI
# issuer. A ServiceMonitor of its own instead of the chart's: cert-manager is
# the flux-infra release, and this needs no patch on it.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: metrics
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/component: controller
  endpoints:
    # The Service port's name: http-metrics since cert-manager v1.21 (it was
    # tcp-prometheus-servicemonitor up to v1.20).
    - port: http-metrics
      path: /metrics
      interval: 60s
