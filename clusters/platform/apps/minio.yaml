---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: app
  name: minio
  namespace: flux-system
spec:
  force: false
  interval: '1h'
  path: './apps/minio'
  postBuild:
    substitute:
      MINIO_NAMESPACE: minio
      MINIO_VERSION: '16.0.10'
      MINIO_INGRESS_ENABLED: 'false'
      CLUSTER_ISSUER: openbao-pki
      INGRESS_HOSTNAME_CONSOLE: artifacts-console
      INGRESS_HOSTNAME_API: artifacts
      INGRESS_DOMAIN: platform.sthings.lab
      STORAGE_CLASS: local-path
      MINIO_STORAGE_SIZE: '10Gi'
    substituteFrom:
    - kind: Secret
      name: minio-secrets
      optional: false
  # ZITADEL login for the console (harvester#574) NEXT TO the root user, which
  # stays (auth.rootUser/rootPassword from minio-secrets). The claim `groups`
  # (clusters/platform/zitadel-config/groups-claim.tf) names MinIO policies:
  # minio-admin / minio-readonly from
  # clusters/machinery-hv/xrs/platform-minio-oidc-policies.yaml; other values
  # in it have no policy and are skipped.
  #
  # Client ID and secret: SOPS Secret minio-oidc-zitadel
  # (./minio-oidc-zitadel.enc.yaml) as env. MINIO_BROWSER_REDIRECT_URL makes
  # the console call back on <url>/oauth_callback, as registered in
  # zitadel-config/apps.auto.tfvars. The cluster trust bundle goes into
  # /certs/CAs (the server runs with --certs-dir /certs), so MinIO trusts
  # ZITADEL's OpenBao-PKI certificate.
  patches:
    - target:
        kind: HelmRelease
        name: minio-deployment
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: minio-deployment
        spec:
          values:
            extraEnvVarsSecret: minio-oidc-zitadel
            extraEnvVars:
              - name: MINIO_IDENTITY_OPENID_CONFIG_URL
                value: https://zitadel.platform.sthings.lab/.well-known/openid-configuration
              - name: MINIO_IDENTITY_OPENID_CLAIM_NAME
                value: groups
              - name: MINIO_IDENTITY_OPENID_SCOPES
                value: openid,profile,email
              - name: MINIO_IDENTITY_OPENID_DISPLAY_NAME
                value: ZITADEL
              - name: MINIO_BROWSER_REDIRECT_URL
                value: https://artifacts-console.platform.sthings.lab
            extraVolumes:
              - name: trust-bundle
                configMap:
                  name: cluster-trust-bundle
                  items:
                    - key: trust-bundle.pem
                      path: trust-bundle.pem
            extraVolumeMounts:
              - name: trust-bundle
                mountPath: /certs/CAs
                readOnly: true
  prune: true
  retryInterval: '1m'
  sourceRef:
    kind: GitRepository
    name: flux-apps
  suspend: false
  timeout: '5m'
  wait: true
