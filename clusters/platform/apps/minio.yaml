---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: app
  name: minio
  namespace: flux-system
spec:
  force: false
  interval: '1h'
  path: './apps/minio'
  postBuild:
    substitute:
      MINIO_NAMESPACE: minio
      MINIO_VERSION: '16.0.10'
      MINIO_INGRESS_ENABLED: 'false'
      CLUSTER_ISSUER: openbao-pki
      INGRESS_HOSTNAME_CONSOLE: artifacts-console
      INGRESS_HOSTNAME_API: artifacts
      INGRESS_DOMAIN: platform.sthings.lab
      STORAGE_CLASS: local-path
      MINIO_STORAGE_SIZE: '10Gi'
    substituteFrom:
    - kind: Secret
      name: minio-secrets
      optional: false
  prune: true
  retryInterval: '1m'
  sourceRef:
    kind: GitRepository
    name: flux-apps
  suspend: false
  timeout: '5m'
  wait: true
