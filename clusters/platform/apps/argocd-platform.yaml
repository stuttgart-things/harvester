---
# argocd-platform bundle (sthings-lab overlay): stands up Argo CD (same
# cicd/argo-cd install as before) + clusterbook-operator + argocd-config
# (AppProjects + cluster-generator ApplicationSet), all dependsOn-ordered.
# Replaces the standalone clusters/platform/apps/argo-cd.yaml Kustomization.
#
# Platforms are opt-in: this points at the sthings-lab overlay, which enables
# the network, cicd, security, storage and kind catalog platforms. The
# overlay's component list is the on/off switch (in the flux repo). Requires
# the argocd-catalog GitRepository source (see ../git-repos.yaml) plus
# flux-apps + argocd-secrets.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: cicd
  name: argocd-platform
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./cicd/argocd-platform/overlays/sthings-lab
  prune: true
  wait: true
  postBuild:
    substitute:
      BUNDLE_NAME: argocd-platform
      FLUX_SOURCE: flux-apps
      ARGOCD_CATALOG_SOURCE: argocd-catalog
      ARGO_CD_VERSION: "9.4.15"
      ARGO_CD_NAMESPACE: argocd
      ARGO_CD_INGRESS_ENABLED: "false"
      INGRESS_HOSTNAME: argocd
      INGRESS_DOMAIN: platform.sthings.lab
      # The bundle derives the Argo CD Gateway HTTPRoute host from INFRA_DOMAIN
      # (ARGO_CD_DOMAIN: ${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid} in ks-argo-cd).
      # Without it the HTTPRoute renders argocd.set-INFRA_DOMAIN.invalid and is
      # rejected by the Gateway API validation, failing the whole Kustomization.
      INFRA_DOMAIN: platform.sthings.lab
      INGRESS_SECRET_NAME: argocd-server-tls # pragma: allowlist secret
      ISSUER_NAME: vault-pki
      ISSUER_KIND: ClusterIssuer
      ARGO_CD_PASSWORD_MTIME: "2026-03-23T02:00:00UTC" # pragma: allowlist secret
      AVP_TRUST_BUNDLE_CONFIGMAP: cluster-trust-bundle
      AVP_TRUST_BUNDLE_KEY: trust-bundle.pem
      AVP_SSL_CERT_DIR: /etc/ssl/custom
      CLUSTERBOOK_OPERATOR_NAMESPACE: clusterbook-system
      CLUSTERBOOK_OPERATOR_VERSION: v0.19.0
      # clusterbook backend for the bundled ClusterbookProviderConfig/default
      CLUSTERBOOK_API_URL: https://clusterbook.infra.sthings.lab
      CLUSTERBOOK_INSECURE_SKIP_VERIFY: "false"
    substituteFrom:
      - kind: Secret
        name: argocd-secrets
