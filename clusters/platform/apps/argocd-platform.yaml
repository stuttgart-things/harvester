---
# argocd-platform bundle (sthings-lab overlay): stands up Argo CD (same
# cicd/argo-cd install as before) + clusterbook-operator + argocd-config
# (AppProjects + cluster-generator ApplicationSet), all dependsOn-ordered.
# Replaces the standalone clusters/platform/apps/argo-cd.yaml Kustomization.
#
# Platforms are opt-in: this points at the sthings-lab overlay, which enables
# the network, cicd, security, storage and kind catalog platforms. The
# overlay's component list is the on/off switch (in the flux repo). Requires
# the argocd-catalog GitRepository source (see ../git-repos.yaml) plus
# flux-apps + argocd-secrets.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: cicd
  name: argocd-platform
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./cicd/argocd-platform/overlays/sthings-lab
  prune: true
  wait: true
  # ZITADEL login (harvester#574) NEXT TO the local admin, which stays
  # (admin.enabled is the chart default, ARGO_CD_SERVER_ADMIN_PASSWORD as
  # before). Nested, as openbao's in ../apps-platform.yaml: the HelmRelease
  # argocd-deployment comes from the child Kustomization argocd-platform-argo-cd,
  # so this adds a patch to the child's own patch list.
  #
  # The whole oidc.config comes from the SOPS Secret argocd-oidc-zitadel
  # (./argocd-oidc-zitadel.enc.yaml) via valuesFrom: it carries the client
  # secret literally, no `$secret:key` reference -- a `$` would be eaten by the
  # two postBuild substitutions on the way (this one and the child's).
  #
  # url: ArgoCD builds the redirect URI from it (<url>/auth/callback, as
  # registered in ../zitadel-config/apps.auto.tfvars); it said
  # https://argocd.example.com. RBAC: the flat `groups` claim
  # (../zitadel-config/groups-claim.tf), argocd-admin => role:admin,
  # argocd-readonly => role:readonly; no default role -- ZITADEL's role check
  # refuses users without either anyway.
  patches:
    - target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: argocd-platform-argo-cd
      patch: |
        - op: add
          path: /spec/patches
          value:
            - target:
                kind: HelmRelease
                name: argocd-deployment
              patch: |
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: argocd-deployment
                spec:
                  valuesFrom:
                    - kind: Secret
                      name: argocd-oidc-zitadel
                      valuesKey: oidc.config
                      targetPath: configs.cm.oidc\.config
                  values:
                    configs:
                      cm:
                        url: https://argocd.platform.sthings.lab
                      rbac:
                        policy.default: ""
                        scopes: "[groups]"
                        policy.csv: |
                          g, argocd-admin, role:admin
                          g, argocd-readonly, role:readonly
  postBuild:
    substitute:
      BUNDLE_NAME: argocd-platform
      FLUX_SOURCE: flux-apps
      ARGOCD_CATALOG_SOURCE: argocd-catalog
      ARGO_CD_VERSION: "9.4.15"
      ARGO_CD_NAMESPACE: argocd
      ARGO_CD_INGRESS_ENABLED: "false"
      INGRESS_HOSTNAME: argocd
      INGRESS_DOMAIN: platform.sthings.lab
      # The bundle derives the Argo CD Gateway HTTPRoute host from INFRA_DOMAIN
      # (ARGO_CD_DOMAIN: ${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid} in ks-argo-cd).
      # Without it the HTTPRoute renders argocd.set-INFRA_DOMAIN.invalid and is
      # rejected by the Gateway API validation, failing the whole Kustomization.
      INFRA_DOMAIN: platform.sthings.lab
      # Same for the HTTPRoute parentRef: ks-argo-cd defaults GATEWAY_NAME to
      # cilium-gateway, which does not exist here; left unset, the UI 404s at
      # the gateway. The bundle is the only owner of argocd/argocd-server.
      INFRA_GATEWAY_NAME: platform-sthings-gateway
      INFRA_GATEWAY_NAMESPACE: default
      INGRESS_SECRET_NAME: argocd-server-tls # pragma: allowlist secret
      ISSUER_NAME: openbao-pki
      ISSUER_KIND: ClusterIssuer
      ARGO_CD_PASSWORD_MTIME: "2026-03-23T02:00:00UTC" # pragma: allowlist secret
      AVP_TRUST_BUNDLE_CONFIGMAP: cluster-trust-bundle
      AVP_TRUST_BUNDLE_KEY: trust-bundle.pem
      AVP_SSL_CERT_DIR: /etc/ssl/custom
      # Teams channel for Argo CD notifications. Must match a key under
      # recipientUrls, which the flux repo renders from this same variable, and
      # the URL behind it comes from argocd-notifications-secret.enc.yaml next
      # to this file. Unset would mean channel `none` and no delivery.
      ARGO_CD_TEAMS_CHANNEL: "platform"
      CLUSTERBOOK_OPERATOR_NAMESPACE: clusterbook-system
      # v0.21.0: stamps clusterbook.stuttgart-things.com/cluster-ready, which the
      # network AppSets gate on since stuttgart-things/argocd#566 (2026-09-30).
      # On v0.20.0 no cluster had it, so every network AppSet matched nothing
      # (demo-hv never got cert-manager; app-dev-hv's cert-manager app vanished).
      CLUSTERBOOK_OPERATOR_VERSION: v0.21.0
      # clusterbook backend for the bundled ClusterbookProviderConfig/default.
      # apps/clusterbook-operator-config.yaml applies the same object from the
      # flux-system Kustomization, so both must name the same URL -- otherwise
      # whichever reconciles last wins. This one still said clusterbook.infra
      # (dead since infra went, and its wildcard cert expired 2026-09-01).
      CLUSTERBOOK_API_URL: https://clusterbook.platform.sthings.lab
      CLUSTERBOOK_INSECURE_SKIP_VERIFY: "false"
    substituteFrom:
      - kind: Secret
        name: argocd-secrets
