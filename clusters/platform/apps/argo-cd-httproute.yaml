---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argo-cd-httproute
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./cicd/argo-cd/components/httproute
  prune: true
  wait: true
  dependsOn:
    - name: argocd-platform-argo-cd
  postBuild:
    substitute:
      ARGO_CD_NAMESPACE: argocd
      ARGO_CD_HOSTNAME: argocd
      ARGO_CD_DOMAIN: platform.sthings.lab
      GATEWAY_NAME: platform-sthings-gateway
      GATEWAY_NAMESPACE: default
