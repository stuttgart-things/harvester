---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: app
  name: harbor
  namespace: flux-system
spec:
  force: false
  interval: '1h'
  path: './apps/harbor'
  postBuild:
    substitute:
      HARBOR_NAMESPACE: harbor
      HARBOR_VERSION: '27.0.3'
      HARBOR_HOSTNAME: harbor
      HARBOR_DOMAIN: platform.sthings.lab
      EXPOSURE_TYPE: none
      INGRESS_CLASS_NAME: nginx
      ISSUER_NAME: openbao-pki
      ISSUER_KIND: ClusterIssuer
      STORAGE_CLASS: local-path
      HARBOR_PV_SIZE_REGISTRY: 12Gi
      HARBOR_PV_SIZE_TRIVY: 5Gi
      HARBOR_PV_SIZE_JOBSERVICE: 1Gi
    substituteFrom:
    - kind: Secret
      name: harbor-secrets
      optional: false
  # Single-node platform cluster: keep harbor lean (registry / pull-through
  # cache only). Disable trivy (vuln scanner) and exporter (metrics), and drop
  # resource requests to "none" — the node's CPU requests are already ~96%
  # allocated (yet only ~15% used), so the default presets prevent the
  # rolling-update surge pods from scheduling.
  patches:
    - target:
        kind: HelmRelease
        name: harbor
      patch: |
        - op: add
          path: /spec/values/trivy/enabled
          value: false
        - op: add
          path: /spec/values/exporter/enabled
          value: false
        - op: add
          path: /spec/values/core/resourcesPreset
          value: none
        - op: add
          path: /spec/values/jobservice/resourcesPreset
          value: none
        - op: add
          path: /spec/values/portal/resourcesPreset
          value: none
        - op: add
          path: /spec/values/registry/server/resourcesPreset
          value: none
        - op: add
          path: /spec/values/registry/controller/resourcesPreset
          value: none
  prune: true
  retryInterval: '1m'
  sourceRef:
    kind: GitRepository
    name: flux-apps
  suspend: false
  timeout: '10m'
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: harbor
      namespace: harbor
