---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: app
  name: backstage
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./apps/backstage
  prune: true
  wait: true
  postBuild:
    substitute:
      BACKSTAGE_NAMESPACE: backstage
      BACKSTAGE_VERSION: "2.6.3"
      BACKSTAGE_IMAGE_REGISTRY: ghcr.io
      BACKSTAGE_IMAGE_REPOSITORY: stuttgart-things/sthings-backstage
      BACKSTAGE_STORAGE_CLASS: local-path
      BACKSTAGE_REPLICAS: "1"
      BACKSTAGE_APP_TITLE: Stuttgart Things Backstage
      BACKSTAGE_ORGANIZATION_NAME: stuttgart-things
      # Org + catalog index of the app's own catalog-config.yaml. The patch
      # below replaces that ConfigMap's content anyway; this keeps the app's
      # default (sthings-dev) out even if the patch is ever dropped.
      BACKSTAGE_CATALOG_ORG: sthings-harvester
      DOMAIN: platform.sthings.lab
      GATEWAY_NAME: platform-sthings-gateway
      GATEWAY_NAMESPACE: default
    substituteFrom:
      - kind: Secret
        name: backstage-secrets-subst
  patches:
    # Catalog locations (sthings-harvester instance), replacing the content of
    # the app's own backstage-catalog-config. ONE owner for that object: it used
    # to be a second copy in backstage-prereqs.yaml as well (harvester#349).
    # Must contain the User entities GitHub sign-in
    # (usernameMatchingUserEntityName) resolves against.
    #
    # Backstage reads this file only at startup (the chart mounts it with
    # subPath). The Deployment carries reloader.stakater.com/auto, and Reloader
    # (infra.yaml) rolls it when this ConfigMap changes.
    - target:
        kind: ConfigMap
        name: backstage-catalog-config
      patch: |
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: backstage-catalog-config
        data:
          app-config.catalog.yaml: |
            catalog:
              locations:
                - type: url
                  target: https://github.com/stuttgart-things/backstage-resources/blob/main/org/sthings-harvester/org.yaml
                  rules:
                    - allow: [User, Group]
                - type: url
                  target: https://github.com/stuttgart-things/backstage-resources/blob/main/services/sthings-harvester/catalog-index.yaml
                  rules:
                    - allow: [Component, Location, System, API, Resource, Template]
                # Self-maintaining index for THIS repo, regenerated by
                # .backstage/catalog-index.sh — brings in the claims/** and packer/**
                # Components/Resources (the external index above only ingests the root
                # harvester System). The root System entity is also listed in the
                # external `stuttgart-things-services` Location; drop the
                # harvester/.../catalog-info.yaml line there to avoid double-registering it.
                - type: url
                  target: https://github.com/stuttgart-things/harvester/blob/main/.backstage/catalog-locations.yaml
                  rules:
                    - allow: [Component, Location, System, API, Resource, Template]
    # Point the claim-machinery-api proxy/plugin at this cluster's actual
    # HTTPRoute host (claims.${DOMAIN}); the upstream app defaults to the
    # non-routable claim-api.${DOMAIN} placeholder.
    - target:
        kind: HelmRelease
        name: backstage-configuration
      patch: | # pragma: allowlist secret
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: backstage-configuration
        spec:
          values:
            secrets:
              backstage-secrets:
                secretKVs:
                  CLAIM_MACHINERY_API_URL: https://claims.${DOMAIN}
    - target:
        kind: HelmRelease
        name: backstage-deployment
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: backstage-deployment
        spec:
          # First pull of the ~248MB image from ghcr.io can take ~9m on a cold
          # node, exceeding the default 5m Helm wait and wedging the release in
          # a failed-upgrade retry loop. Give the pull/rollout room.
          timeout: 15m
          values:
            backstage:
              extraVolumes:
                - name: trust-bundle
                  configMap:
                    name: cluster-trust-bundle
                    optional: true
              extraVolumeMounts:
                - name: trust-bundle
                  mountPath: /etc/ssl/custom/trust-bundle.pem
                  subPath: trust-bundle.pem
                  readOnly: true
              extraEnvVarsCM:
                - backstage-ca-env
