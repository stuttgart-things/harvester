---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: app
  name: backstage
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./apps/backstage
  prune: true
  wait: true
  postBuild:
    substitute:
      BACKSTAGE_NAMESPACE: backstage
      # Chart 2.10.2, the app's own default and what sthings-platform (LabDA)
      # runs with the same patches as below.
      BACKSTAGE_VERSION: "2.10.2"
      BACKSTAGE_IMAGE_REGISTRY: ghcr.io
      BACKSTAGE_IMAGE_REPOSITORY: stuttgart-things/sthings-backstage
      BACKSTAGE_STORAGE_CLASS: local-path
      BACKSTAGE_REPLICAS: "1"
      BACKSTAGE_APP_TITLE: Stuttgart Things Backstage
      BACKSTAGE_ORGANIZATION_NAME: stuttgart-things
      # Org + catalog index of the app's own catalog-config.yaml. The patch
      # below replaces that ConfigMap's content anyway; this keeps the app's
      # default (sthings-dev) out even if the patch is ever dropped.
      BACKSTAGE_CATALOG_ORG: sthings-harvester
      DOMAIN: platform.sthings.lab
      GATEWAY_NAME: platform-sthings-gateway
      GATEWAY_NAMESPACE: default
      # RAG-AI ("Ask AI") with its own pgvector Postgres (backstage-rag-postgres.yaml).
      # LLM: the local Ollama on the GPU VM (harvester#526, hosts/ollama-gpu),
      # not the app's OpenRouter default. BACKSTAGE_LLM_API_KEY in
      # backstage-secrets-subst stays: Ollama ignores it, the plugin wants one.
      # Changing the embeddings model changes the vector size: truncate the
      # embeddings table and re-index (hosts/ollama-gpu/README.md, step 6). FIRST ROLLOUT:
      # Backstage starts before rag-postgres-creds exists and skips RAG-AI
      # quietly -- restart it once the CNPG Cluster is Ready:
      #   kubectl -n backstage wait cluster.postgresql.cnpg.io/rag-postgres --for=condition=Ready --timeout=15m
      #   kubectl -n backstage rollout restart deploy/backstage-deployment
      BACKSTAGE_RAG_AI_ENABLED: "true"
      BACKSTAGE_LLM_BASE_URL: http://ollama-gpu.sthings.lab:11434/v1
      BACKSTAGE_LLM_MODEL: gemma3:12b
      BACKSTAGE_LLM_EMBEDDINGS_MODEL: bge-m3
      # Chunks per question (default 6, flux#890). 6 hid one of six VMs on
      # "how many Harvester VMs"; 20 x 1000 chars fits Ollama's 16k context.
      BACKSTAGE_RAG_AI_AMOUNT: "20"
    substituteFrom:
      - kind: Secret
        name: backstage-secrets-subst
  patches:
    # Catalog locations (sthings-harvester instance), replacing the content of
    # the app's own backstage-catalog-config. ONE owner for that object: it used
    # to be a second copy in backstage-prereqs.yaml as well (harvester#349).
    # Must contain the User entities GitHub sign-in
    # (usernameMatchingUserEntityName) resolves against.
    #
    # Backstage reads this file only at startup (the chart mounts it with
    # subPath). The Deployment carries reloader.stakater.com/auto, and Reloader
    # (infra.yaml) rolls it when this ConfigMap changes.
    - target:
        kind: ConfigMap
        name: backstage-catalog-config
      patch: |
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: backstage-catalog-config
        data:
          app-config.catalog.yaml: |
            catalog:
              locations:
                - type: url
                  target: https://github.com/stuttgart-things/backstage-resources/blob/main/org/sthings-harvester/org.yaml
                  rules:
                    - allow: [User, Group]
                - type: url
                  target: https://github.com/stuttgart-things/backstage-resources/blob/main/services/sthings-harvester/catalog-index.yaml
                  rules:
                    - allow: [Component, Location, System, API, Resource, Template]
                # Self-maintaining index for THIS repo, regenerated by
                # .backstage/catalog-index.sh — brings in the claims/** and packer/**
                # Components/Resources (the external index above only ingests the root
                # harvester System). The root System entity is also listed in the
                # external `stuttgart-things-services` Location; drop the
                # harvester/.../catalog-info.yaml line there to avoid double-registering it.
                - type: url
                  target: https://github.com/stuttgart-things/harvester/blob/main/.backstage/catalog-locations.yaml
                  rules:
                    - allow: [Component, Location, System, API, Resource, Template]
    # Point the claim-machinery-api proxy/plugin at this cluster's actual
    # HTTPRoute host (claims.${DOMAIN}); the upstream app defaults to the
    # non-routable claim-api.${DOMAIN} placeholder.
    - target:
        kind: HelmRelease
        name: backstage-configuration
      patch: | # pragma: allowlist secret
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: backstage-configuration
        spec:
          values:
            secrets:
              backstage-secrets:
                secretKVs:
                  CLAIM_MACHINERY_API_URL: https://claims.${DOMAIN}
                  # ServiceAccount token on the Harvester cluster for the VM
                  # entity provider (backstage-vms-config in
                  # backstage-prereqs.yaml), from backstage-secrets-subst.
                  HARVESTER_TOKEN: ${BACKSTAGE_HARVESTER_TOKEN:-}
    - target:
        kind: HelmRelease
        name: backstage-deployment
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: backstage-deployment
        spec:
          # First pull of the ~248MB image from ghcr.io can take ~9m on a cold
          # node, exceeding the default 5m Helm wait and wedging the release in
          # a failed-upgrade retry loop. Give the pull/rollout room.
          timeout: 15m
          values:
            backstage:
              extraVolumes:
                - name: trust-bundle
                  configMap:
                    name: cluster-trust-bundle
                    optional: true
              extraVolumeMounts:
                - name: trust-bundle
                  mountPath: /etc/ssl/custom/trust-bundle.pem
                  subPath: trust-bundle.pem
                  readOnly: true
              extraEnvVarsCM:
                - backstage-ca-env
              # The whole Secret, for HARVESTER_TOKEN: the app lists its env
              # vars one by one in extraEnvVars, which a patch could only
              # replace. The keys already mapped get the same value twice.
              extraEnvVarsSecrets:
                - backstage-secrets
              # Restates the app's two entries (flux apps/backstage/release.yaml
              # on main): the list is replaced, not merged. Update this when
              # the app's list changes.
              extraAppConfig:
                - filename: app-config.extra.yaml
                  configMapRef: backstage-app-config
                - filename: app-config.catalog.yaml
                  configMapRef: backstage-catalog-config
                - filename: app-config.vms.yaml
                  configMapRef: backstage-vms-config
