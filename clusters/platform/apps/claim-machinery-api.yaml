---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: app
  name: claim-machinery-api
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./apps/claim-machinery-api
  prune: true
  wait: true
  postBuild:
    substitute:
      CLAIM_MACHINERY_API_VERSION: "v0.21.1" # datasource=docker depName=ghcr.io/stuttgart-things/claim-machinery-api
      CLAIM_MACHINERY_API_NAMESPACE: claim-machinery
      # Pinned profile (claim-machinery-api#153) instead of harvester main; same
      # 12 templates. The image stays v0.21.1 on purpose: this old instance is
      # removed once its clients are switched to machinery-hv (#681). v0.21.1
      # reads the profile `name:` field, so the v0.33.0 profile loads as is.
      CLAIM_MACHINERY_PROFILE_PATH: "https://raw.githubusercontent.com/stuttgart-things/claim-machinery-api/v0.33.0/profiles/harvester.yaml"
      CLAIM_MACHINERY_ENABLE_HOMERUN: "false"
      FLUX_SOURCE_API_VERSION: v1
      GATEWAY_NAME: platform-sthings-gateway
      GATEWAY_NAMESPACE: default
      HOSTNAME: claims
      DOMAIN: platform.sthings.lab
      CLAIM_MACHINERY_TRUST_BUNDLE_CONFIGMAP: cluster-trust-bundle
      CLAIM_MACHINERY_TRUST_BUNDLE_KEY: trust-bundle.pem
      CLAIM_MACHINERY_SSL_CERT_DIR: /etc/ssl/custom
