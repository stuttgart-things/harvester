---
# Prerequisites the backstage app itself doesn't create — applied by the
# flux-system sync before the backstage Kustomization reconciles.
apiVersion: v1
kind: Namespace
metadata:
  name: backstage
  labels:
    toolkit.fluxcd.io/tenant: sthings-team
---
# imageTag is passed via ConfigMap (not Flux substitution) so Helm keeps it a
# string; consumed by release.yaml valuesFrom -> backstage.image.tag.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-helm-overrides
  namespace: backstage
data:
  # v1.6.0 replaces allow-all with the template audience policy
  # (stuttgart-things/sthings-backstage#119): templates are platform-team only
  # unless annotated backstage.stuttgart-things.com/audience: developers.
  # v1.7.2 the VM entity provider, v1.9.0 RAG-AI with LLM_* names, v1.13.0
  # per-entity embedding hashes, v1.17.0 its Harvester source -- used by
  # backstage-vms-config below -- v1.18.0 VM details (OS, network, disks,
  # image) and a VM entity page. v1.19.0-v1.20.1 MachineryClaimPicker on
  # machinery's live inventory (/machinery proxy, MACHINERY_URL), v1.21.0
  # worker-step templates grouped last, v1.22.0 platform-team separated from
  # developers in the permission policy and guest switchable
  # (BACKSTAGE_AUTH_GUEST_ENABLED in backstage.yaml, sthings-backstage#202).
  # v1.23.0 ZITADEL sign-in with the zitadelProjectRoles resolver
  # (AUTH_OIDC_ENABLED, #203) and a platform-only /devtools (#204), v1.24.x
  # Pull Requests tab and /devtools fix, v1.25.x beta tracks/team roles and
  # machinery orders (private to their owner), v1.26.0 MachineryClaimPicker
  # proxyPaths, v1.27.0-v1.28.0 live facts + Flux/Argo CD on
  # kubernetes-cluster entities (opt-in, no entry here), v1.29.0 template
  # groups and the Backstage monorepo update (#185), v1.30.0 HTTPRoutes as
  # links on cluster entities (#222). harvester#675. v1.31.0-v1.39.1:
  # announcements, home page, offerings, Backstage 1.57.1 (v1.35.1), live VM
  # card and list-live-vms (v1.36/v1.39), and an MCP server for AI clients
  # (v1.38.0) -- read-only only through backstage-actions-config below.
  #
  # This ConfigMap WINS over BACKSTAGE_IMAGE_TAG in backstage.yaml: bump both.
  imageTag: "v1.39.1"
---
# Actions and MCP server (image >= v1.38.0, sthings-backstage#277, its
# docs/mcp.md). Mounted as app-config.actions.yaml through extraAppConfig in
# backstage.yaml.
#
# WHY HERE: the pod starts with explicit --config files, so the image's own
# app-config.yaml -- where sthings-backstage keeps this filter -- is NOT
# loaded. Without this file the MCP server at /api/mcp-actions/v1 would offer
# every registered action, also writing ones, to any holder of a static token
# (backend.auth.externalAccess has one). Same content as the image's
# app-config.yaml at v1.39.1: only read-only actions of catalog, search,
# techdocs and vm-info; no kubernetes (its proxy writes to clusters), no
# scaffolder, no announcements. Keep it in step with the image on a bump.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-actions-config
  namespace: backstage
data:
  app-config.actions.yaml: |
    backend:
      actions:
        pluginSources:
          - catalog
          - search
          - techdocs
          - vm-info
        filter:
          include:
            - attributes:
                readOnly: true
    mcpActions:
      name: sthings-portal
      description: stuttgart-things developer portal (Backstage), read-only
      instructions: >-
        The stuttgart-things developer portal. Use it to find who owns a
        service, API, VM or cluster, where it runs and what its docs say.
        Catalog entities are identified by refs like
        component:default/homerun2-core-catcher or
        resource:default/<vm>-<cloud>-vm. Query the catalog first, then use
        TechDocs, search or live VM info for details. VM status in the
        catalog is the last inventory run; vm-info gives the current state.
        Everything here is read-only.
---
# Sets NODE_EXTRA_CA_CERTS to the trust bundle mounted by backstage.yaml's
# extraVolumeMounts, so Node trusts the cluster CA (e.g. for https calls to
# claims.${DOMAIN} / claim-machinery-api). Referenced via extraEnvVarsCM.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-ca-env
  namespace: backstage
data:
  NODE_EXTRA_CA_CERTS: /etc/ssl/custom/trust-bundle.pem
---
# VM entity provider (sthings-backstage plugins/catalog-backend-module-
# sthings-vms, Harvester source since v1.17.0): mirrors the KubeVirt VMs of the
# Harvester cluster into the catalog as Resource entities <vm>-harvester-vm.
# Mounted as app-config.vms.yaml through extraAppConfig in backstage.yaml.
#
# The ${...} below are resolved by Backstage at startup, not by Flux: the root
# sync that applies this file does no postBuild substitution. HARVESTER_TOKEN
# must exist in the pod (backstage-secrets, from BACKSTAGE_HARVESTER_TOKEN in
# backstage-secrets-subst) -- an unset ${...} stops the whole backend.
#
# The token is the ServiceAccount backstage-vm-reader on the Harvester cluster
# (clusters/harvester/backstage-vm-reader.yaml, applied by hand there).
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-vms-config
  namespace: backstage
data:
  app-config.vms.yaml: |
    catalog:
      providers:
        sthingsVms:
          harvester-sthings:
            type: harvester
            # The Kubernetes API of Harvester (RKE2), not the Rancher proxy.
            endpoint: https://192.168.10.110:6443
            token: ${HARVESTER_TOKEN}
            uiUrl: https://harvester.sthings.lab
            system: harvester
            # The RKE2 cluster CA that signs the API certificate (the
            # certificate-authority-data of a Harvester kubeconfig).
            caCert: |
              -----BEGIN CERTIFICATE-----
              MIIBejCCAR+gAwIBAgIBADAKBggqhkjOPQQDAjAkMSIwIAYDVQQDDBlya2UyLXNl
              cnZlci1jYUAxNzgwNjQ3MTQ5MB4XDTI2MDYwNTA4MTIyOVoXDTM2MDYwMjA4MTIy
              OVowJDEiMCAGA1UEAwwZcmtlMi1zZXJ2ZXItY2FAMTc4MDY0NzE0OTBZMBMGByqG
              SM49AgEGCCqGSM49AwEHA0IABEW2CsDXmKmjN8yM7SpcJJ0NkMr5JN8b+Z/Yv4M3
              ANJ2KjOv3QGXk7Wza8EKlX9rm08HBWDuJ75h264H52Hwr7ijQjBAMA4GA1UdDwEB
              /wQEAwICpDAPBgNVHRMBAf8EBTADAQH/MB0GA1UdDgQWBBQ2hjDdOFgBLn9HfQcb
              oXO5qMoe8jAKBggqhkjOPQQDAgNJADBGAiEA1R8+JSKHq/9zSLwP9QxEBpe34Jib
              jU/4BJ1U4wResusCIQDTFtJArOXToYtgQ1yYbzCs44gOcUpLoj1xFNIwJ7lLGw==
              -----END CERTIFICATE-----
---
# The catalog ConfigMap `backstage-catalog-config` is NOT here any more. The
# flux app (stuttgart-things/flux apps/backstage/catalog-config.yaml) ships it
# itself since 2026-09-03, so a copy here gave the SAME object two owners: this
# root sync and the `backstage` Kustomization, each applying its own content
# (sthings-harvester here, sthings-dev there) on its own interval. Whichever ran
# last when the pod started decided the catalog (harvester#349). The harvester
# locations are now a patch on that one object, in backstage.yaml.
