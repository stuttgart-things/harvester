---
# clusterscope: the lab's clusters as a map, read from this repo's clusters/
# (git-sync, the repo is public) plus live status of this cluster
# (harvester#490). clusterscope.platform.sthings.lab.
#
# Live mode reads `platform` itself in-cluster and every other cluster whose
# kubeconfig is in OpenBao (KV mount `kubeconfigs`, entry = cluster name,
# property `kubeconfig`), through the ClusterSecretStore vault-kubeconfigs
# (../infra.yaml, OpenBao side ../openbao/platform-eso; harvester#753).
#
# CLUSTERSCOPE_KUBECONFIG_CLUSTERS lists exactly the clusters that HAVE an
# entry -- only what machinery-hv's ClusterStacks wrote, i.e. app-dev-hv
# (checked 2026-11-19). homerun2-dev, machinery-hv, crossplane-mgmt,
# tabletennis, harvester, edge and sthings-edge have none and stay
# "no kubeconfig" until one is written there; add each name to the regexp then.
# (tabletennis and the edges sit in another network and are unreachable from
# here anyway.)
#
# PROBE checks every HTTPRoute URL it finds; the cluster-trust-bundle (OpenBao
# root) is mounted so *.sthings.lab endpoints verify.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: app
  name: clusterscope
  namespace: flux-system
spec:
  force: false
  interval: '1h'
  # The store and its CRDs come from the infra Kustomizations; without them
  # the ExternalSecret below fails the apply.
  dependsOn:
    - name: external-secrets-vault-kubeconfigs
  path: './apps/clusterscope'
  components:
    - components/vault-kubeconfigs
  postBuild:
    substitute:
      CLUSTERSCOPE_NAMESPACE: clusterscope
      CLUSTERSCOPE_VERSION: v0.28.0
      CLUSTERSCOPE_TECH: flux
      CLUSTERSCOPE_LAB: sthings-lab
      CLUSTERSCOPE_LIVE: 'true'
      CLUSTERSCOPE_SELF_CLUSTER: platform
      CLUSTERSCOPE_KUBECONFIG_DIR: /kubeconfigs
      CLUSTERSCOPE_KUBECONFIG_STORE: vault-kubeconfigs
      CLUSTERSCOPE_KUBECONFIG_CLUSTERS: ^(app-dev-hv)$
      CLUSTERSCOPE_PROBE: 'true'
      CLUSTERSCOPE_TRUST_BUNDLE_CONFIGMAP: cluster-trust-bundle
      CLUSTERSCOPE_TRUST_BUNDLE_KEY: trust-bundle.pem
      GIT_SYNC_REPO: https://github.com/stuttgart-things/harvester
      GIT_SYNC_BRANCH: main
      GIT_SYNC_PERIOD: 60s
      GIT_SYNC_DIR: /data/harvester/clusters
      GATEWAY_NAME: platform-sthings-gateway
      GATEWAY_NAMESPACE: default
      HOSTNAME: clusterscope
      DOMAIN: platform.sthings.lab
  prune: true
  retryInterval: '1m'
  sourceRef:
    kind: GitRepository
    name: flux-apps
  suspend: false
  timeout: '5m'
  wait: true
