---
# clusterscope: the lab's clusters as a map, read from this repo's clusters/
# (git-sync, the repo is public) plus live status of this cluster
# (harvester#490). clusterscope.platform.sthings.lab.
#
# Live mode reads `platform` itself in-cluster and every other cluster that
# has an entry in OpenBao KV mount `clusterscope` (entry = cluster name as
# clusterscope knows it, property `kubeconfig`), through the ClusterSecretStore
# vault-clusterscope (../infra.yaml, OpenBao side ../openbao/platform-eso;
# harvester#753). Those are READ-ONLY ServiceAccount kubeconfigs
# (clusterscope-reader), seeded per cluster by
# ../openbao/platform-eso/seed-clusterscope-kubeconfig.sh -- never the admin
# kubeconfigs in the `kubeconfigs` mount.
#
# The regexp takes every entry of that mount, so a newly seeded cluster shows
# up live without a change here (ESO refreshes hourly). A cluster without an
# entry stays "no kubeconfig"; tabletennis and the edges sit in other networks
# and are unreachable from here anyway.
#
# WHICH DIRECTORIES ARE CLUSTERS (-config, components/config, harvester#753):
# clusters/ also holds directories that are not clusters -- shared (content
# used by several clusters), platform-seeds and homerun2-dev-light (Kustomize
# siblings). `include` lists the real ones; A NEW CLUSTER DIRECTORY MUST BE
# ADDED THERE or clusterscope does not show it. Clusters built by machinery-hv
# from a ClusterStack (app-dev-hv) have no directory here: `machineries` reads
# their orders from machinery-hv (its clusterscope entry; the reader's
# ClusterRole covers clusterstacks), so they show as "ordered on machinery-hv"
# instead of "kubeconfig only".
#
# PROBE checks every HTTPRoute URL it finds; the cluster-trust-bundle (OpenBao
# root) is mounted so *.sthings.lab endpoints verify.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: app
  name: clusterscope
  namespace: flux-system
spec:
  force: false
  interval: '1h'
  # The store and its CRDs come from the infra Kustomizations; without them
  # the ExternalSecret below fails the apply.
  dependsOn:
    - name: external-secrets-vault-clusterscope
  path: './apps/clusterscope'
  components:
    - components/vault-kubeconfigs
    - components/config
  postBuild:
    substitute:
      CLUSTERSCOPE_NAMESPACE: clusterscope
      CLUSTERSCOPE_VERSION: v0.28.0 # datasource=docker depName=ghcr.io/stuttgart-things/clusterscope-kustomize
      CLUSTERSCOPE_TECH: flux
      CLUSTERSCOPE_LAB: sthings-lab
      CLUSTERSCOPE_LIVE: 'true'
      CLUSTERSCOPE_SELF_CLUSTER: platform
      CLUSTERSCOPE_KUBECONFIG_DIR: /kubeconfigs
      CLUSTERSCOPE_KUBECONFIG_STORE: vault-clusterscope
      CLUSTERSCOPE_KUBECONFIG_CLUSTERS: ^[a-z0-9-]+$
      CLUSTERSCOPE_PROBE: 'true'
      CLUSTERSCOPE_CONFIG_FILE: /etc/clusterscope/config.yaml
      # ONE line of JSON (see the header): the real cluster directories + the
      # ClusterStack orders on machinery-hv.
      CLUSTERSCOPE_CONFIG: '{"roots":[{"path":"/data/harvester/clusters","lab":"sthings-lab","include":["platform","homerun2-dev","machinery-hv","crossplane-mgmt","harvester","tabletennis","edge","sthings-edge"]}],"machineries":[{"cluster":"machinery-hv","lab":"sthings-lab"}]}'
      CLUSTERSCOPE_TRUST_BUNDLE_CONFIGMAP: cluster-trust-bundle
      CLUSTERSCOPE_TRUST_BUNDLE_KEY: trust-bundle.pem
      GIT_SYNC_REPO: https://github.com/stuttgart-things/harvester
      GIT_SYNC_BRANCH: main
      GIT_SYNC_PERIOD: 60s
      GIT_SYNC_DIR: /data/harvester/clusters
      GATEWAY_NAME: platform-sthings-gateway
      GATEWAY_NAMESPACE: default
      HOSTNAME: clusterscope
      DOMAIN: platform.sthings.lab
  prune: true
  retryInterval: '1m'
  sourceRef:
    kind: GitRepository
    name: flux-apps
  suspend: false
  timeout: '5m'
  wait: true
