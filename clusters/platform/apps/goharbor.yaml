apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: goharbor
  namespace: goharbor
spec:
  interval: 12h
  url: https://helm.goharbor.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # Named "harbor" so the services are harbor-core/harbor-portal and the
  # harbor-project-proxy HelmRelease (dependsOn: harbor) finds it.
  name: harbor
  namespace: goharbor
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: harbor
      version: "1.19.4" # datasource=helm depName=harbor registryUrl=https://helm.goharbor.io
      sourceRef:
        kind: HelmRepository
        name: goharbor
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: goharbor-secrets
      valuesKey: DATABASE_PASSWORD
      targetPath: database.internal.password
  values:
    externalURL: https://harbor.platform.sthings.lab
    existingSecretAdminPassword: goharbor-secrets # pragma: allowlist secret
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD # pragma: allowlist secret
    existingSecretSecretKey: goharbor-secrets # pragma: allowlist secret
    caBundleSecretName: goharbor-lab-ca # pragma: allowlist secret
    expose:
      type: route
      tls:
        enabled: false
      route:
        parentRefs:
          - name: platform-sthings-gateway
            namespace: default
            group: gateway.networking.k8s.io
            kind: Gateway
        hosts:
          - harbor.platform.sthings.lab
    ipFamily:
      ipv6:
        enabled: false
    persistence:
      enabled: true
      resourcePolicy: keep
      persistentVolumeClaim:
        registry:
          storageClass: local-path
          size: 12Gi
        jobservice:
          jobLog:
            storageClass: local-path
            size: 1Gi
        database:
          storageClass: local-path
          size: 2Gi
        redis:
          storageClass: local-path
          size: 1Gi
    trivy:
      enabled: false
    metrics:
      enabled: false
    portal:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
    core:
      resources:
        requests: {cpu: 50m, memory: 128Mi}
    jobservice:
      resources:
        requests: {cpu: 20m, memory: 64Mi}
    registry:
      registry:
        resources:
          requests: {cpu: 20m, memory: 64Mi}
      controller:
        resources:
          requests: {cpu: 10m, memory: 32Mi}
    database:
      internal:
        resources:
          requests: {cpu: 50m, memory: 128Mi}
    redis:
      internal:
        resources:
          requests: {cpu: 20m, memory: 32Mi}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor-project-proxy
  namespace: goharbor
spec:
  parentRefs:
    - name: platform-sthings-gateway
      namespace: default
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "*.harbor.platform.sthings.lab"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: harbor-project-proxy
          port: 80
