# Harbor from the official goharbor/harbor chart (harvester#693), replacing
# the frozen Bitnami chart (27.0.3, Harbor 2.13, bitnamilegacy images) of
# ./harbor.yaml.
#
# Fresh install, no data taken over: the old Harbor held a 66 MB pull-through
# cache (one image) and only the local admin. The projects are in Terraform,
# ../harbor-config.
#
# Exposure on platform-sthings-gateway:
#   harbor.<domain>    the chart's own HTTPRoute (expose.type route: no nginx,
#                      no Ingress): /api,/service,/v2,/c -> core, / -> portal
#   *.harbor.<domain>  HTTPRoute harbor-project-proxy below -> nginx of
#                      ./harbor-project-proxy.yaml (docker.harbor.<domain>/x
#                      = harbor.<domain>/docker/x), listener https-harbor
#                      (../infra.yaml)
# Until #693 both came from the harbor-httproute Kustomization (flux-apps
# apps/harbor/httproute), which pointed at the Bitnami Harbor.
#
# Secrets: ./goharbor-secrets.enc.yaml (admin password = the old one, # pragma: allowlist secret
# secretKey, internal database password).
#
# goharbor-lab-ca: the lab root CA (CN=sthings.lab, same file as
# ../openbao/sthings-lab-root-ca.pem), so harbor-core trusts ZITADEL for the
# OIDC login (../harbor-config). Public certificate, no key.
#
# Single-node platform cluster: trivy and metrics off, small requests (the
# node's CPU requests are at ~78 %).
---
