apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-mgmt
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/stuttgart-things/harvester.git
    targetRevision: main
    path: clusters/crossplane-mgmt
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true