---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-resources
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/stuttgart-things/crossplane-configurations.git
    targetRevision: main
    path: tests/envs/harvester/crossplane-mgmt
    directory:
      recurse: true
  destination:
    name: crossplane-mgmt
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
