---
apiVersion: clusterbook.stuttgart-things.com/v1alpha1
kind: ClusterbookCluster
metadata:
  name: crossplane-mgmt
  namespace: clusterbook-system
spec:
  providerConfigRef:
    name: default            # the bundled ClusterbookProviderConfig
  networkKey: "192.168.10"    # network to reserve IP+FQDN from in the clusterbook backend
  clusterName: crossplane-mgmt
  createDNS: true            # reserves the FQDN → produces the clusterbook fqdn annotation
  useFQDNAsServer: false     # keep the ArgoCD server URL on the IP (reachable); flip later
  preserveKubeconfigServer: true   # <-- keep the kubeconfig's API server URL; don't rewrite to the reserved IP
  argocdNamespace: argocd
  kubeconfigSecretRef:       # register an existing kubeconfig as the ArgoCD cluster
    name: crossplane-mgmt
    namespace: argocd
    key: kubeconfig
  releaseOnDelete: true
  annotations:               # copied onto the ArgoCD cluster Secret; AppSets read config from these
    # cert-manager Vault-PKI ClusterIssuer (appset-cert-manager-vault-pki).
    #
    # OpenBao on `platform`, not the Vault on `infra`: that instance is being
    # switched off to free the hardware, and its certificate expired on
    # 2026-09-01 — which is why this issuer reported `certificate has expired`
    # rather than anything resembling a migration. See harvester#152 and
    # ../../OPENBAO-CLUSTERBOOK.md.
    clusterbook.stuttgart-things.com/vault-server: https://openbao.platform.sthings.lab
    clusterbook.stuttgart-things.com/vault-pki-path: pki/sign/sthings-lab
    # Tokenless. cert-manager mints a ServiceAccount token per signing request
    # through the TokenRequest API instead of holding a Vault token that nothing
    # renews — the 720h token on the old path was the actual defect, and it
    # failed silently because the issuer reports Ready on a successful LOGIN and
    # never checks that it can sign.
    clusterbook.stuttgart-things.com/vault-auth-method: kubernetes
    # Created by `terraform apply` in ../../crossplane-mgmt/openbao.
    # vault-base-setup derives the mount from <cluster_name>-<name>, so
    # cluster_name "crossplane-mgmt-sthings" plus the k8s_auth named
    # "certmanager" gives exactly this path. All three names move together.
    clusterbook.stuttgart-things.com/vault-k8s-auth-mount: /v1/auth/crossplane-mgmt-sthings-certmanager
    clusterbook.stuttgart-things.com/vault-k8s-auth-role: certmanager
    clusterbook.stuttgart-things.com/vault-k8s-auth-sa: certmanager
    # Inert under kubernetes auth — the chart renders only the block matching
    # `method`. Kept so the Secret name stays the one the rest of the fleet
    # uses; it goes when the token path is removed everywhere.
    clusterbook.stuttgart-things.com/vault-token-secret: cert-manager-vault-token # pragma: allowlist secret
    # Gateway TLS wildcard issuer (appset-cert-manager-cluster-ca): issue the
    # *.crossplane-mgmt.sthings.lab gateway cert from Vault PKI (trusted root)
    # instead of the default self-signed cluster-ca.
    clusterbook.stuttgart-things.com/wildcard-issuer-name: vault-pki
  labels:                    # stamped onto the resulting ArgoCD cluster secret
    auto-project: "true"     # → cluster-projects makes proj-net-test (required first)
    cicd-platform: 'true'                # umbrella: enable the CI/CD stack
    cicd-platform/crossplane: 'true'     # → appset-crossplane (+ configs/functions/provider-configs/providers)
    cicd-platform/tekton: 'true'         # → appset-tekton (+ config, dashboard-httproute)
    cicd-platform/machinery: 'true'      # → machinery-cicd (resource dashboard + gRPC ResourceService)
    cicd-platform/kro: 'false'           # → appset-kro
    cicd-platform/dapr: 'false'          # → appset-dapr
    cicd-platform/kargo: 'false'         # → appset-kargo (+ httproute)
    cicd-platform/argo-rollouts: 'false' # → appset-argo-rollouts
    cicd-platform/openebs: 'false'       # → appset-openebs (cicd); using storage-platform/openebs instead (mutually exclusive)
    network-platform: "true" # → master gate: enables all default-on network
    network-platform/cilium-lb: 'true'  # → appset-cilium-lb            [ann: ip]
    network-platform/cilium-gateway: 'true'           # → appset-cilium-gateway          [ann: fqdn]
    network-platform/cilium-gateway-secondary: 'false'# → appset-cilium-gateway-secondary [ann: fqdn-secondary]
    network-platform/cert-manager-install: 'true'     # → appset-cert-manager-install
    network-platform/cert-manager-selfsigned: 'true'  # → appset-cert-manager-selfsigned
    network-platform/cert-manager-cluster-ca: 'true'  # → appset-cert-manager-cluster-ca  [ann: fqdn, wildcard-issuer-name]
    network-platform/cert-manager-vault-pki: 'true'   # → appset-cert-manager-vault-pki   [ann: vault-server, vault-pki-path, vault-token-secret]
    network-platform/trust-manager-install: 'true'    # → appset-trust-manager-install
    network-platform/trust-manager-bundle: 'true'
    storage-platform: 'true'            # umbrella
    storage-platform/openebs: 'true'
    storage-platform/longhorn: 'false'  # → appset-longhorn
    storage-platform/nfs-csi-install: 'false'        # → appset-nfs-csi-install (driver + snapshot-controller)
    storage-platform/nfs-csi-storageclasses: 'false' # → appset-nfs-csi-storageclasses (the SC).
    storage-platform.stuttgart-things.com/nfs-config: 'false'
