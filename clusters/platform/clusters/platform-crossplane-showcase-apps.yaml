---
# Platform layer: Crossplane Configurations, EnvironmentConfigs and namespaces.
# prune is intentionally OFF — pruning a Configuration triggers foreground
# deletion that cascade-deletes every XR built from it (and risks the package
# lock freeze). Sync this app first; the xrs app below depends on the XRDs it
# installs (Argo retries the xrs app until they exist).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: showcase-crossplane-platform
  namespace: argocd
spec:
  project: default
  source:
    # Moved out of crossplane-configurations (it lived under
    # tests/envs/harvester/) on 2026-09-12: this is the target environment's own
    # state, so it belongs in the repo that already carries the rest of it. It
    # also gains a check it did not have: this half sat in that repo's
    # verify.yaml paths-ignore, so nothing validated it. Here clusters/** goes
    # through pr-lint (pre-commit). The xrs/ half below was Kyverno-gated there
    # and still is — the workflow moved with it.
    repoURL: https://github.com/stuttgart-things/harvester.git
    targetRevision: main
    path: clusters/crossplane-mgmt/platform
    directory:
      recurse: true
  destination:
    name: crossplane-mgmt
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# Resource claims (RancherCluster, XVirtualMachine, …). Safe to auto-prune.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: showcase-crossplane-xrs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/stuttgart-things/harvester.git
    targetRevision: main
    path: clusters/crossplane-mgmt/xrs
    directory:
      recurse: true
      # Skip non-cluster artifacts the scaffolder emits in flux mode:
      # catalog-info.yaml (Backstage Component) and kustomization.yaml
      # (kustomize config) are not CRDs — applying them fails the sync.
      exclude: '{**/catalog-info.yaml,**/kustomization.yaml}'
  destination:
    name: crossplane-mgmt
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# Crossplane monitoring (harvester#753): PodMonitors for core, providers and
# functions, crossplane-state-metrics (Ready/Synced of every XR and composed
# MR), the alert CrossplaneXRNotReady and the Grafana folder "Crossplane".
# Shared with machinery-hv: ../../shared/crossplane-observability/README.md.
#
# Its own Application, NOT part of showcase-crossplane-platform: it needs
# kube-prometheus-stack's CRDs (kube-prometheus-stack-observability on this
# cluster), and a missing CRD would fail -- and with it stall -- the sync of
# the Crossplane platform layer. Here it fails alone and Argo retries. Prune on:
# nothing here owns Crossplane objects.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-mgmt-crossplane-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/stuttgart-things/harvester.git
    targetRevision: main
    path: clusters/shared/crossplane-observability
    # Explicit source type: without it Argo's plugin discovery hands any path
    # with a kustomization.yaml to argocd-vault-plugin (CMP), which fails here
    # with "AVP_ROLE_ID and AVP_SECRET_ID ... cannot be empty". The
    # kustomization already sets this namespace -- a no-op besides the type.
    kustomize:
      namespace: monitoring
  destination:
    name: crossplane-mgmt
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
