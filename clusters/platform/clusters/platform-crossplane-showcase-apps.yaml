---
# Platform layer: Crossplane Configurations, EnvironmentConfigs and namespaces.
# prune is intentionally OFF — pruning a Configuration triggers foreground
# deletion that cascade-deletes every XR built from it (and risks the package
# lock freeze). Sync this app first; the xrs app below depends on the XRDs it
# installs (Argo retries the xrs app until they exist).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: showcase-crossplane-platform
  namespace: argocd
spec:
  project: default
  source:
    # Moved out of crossplane-configurations (it lived under
    # tests/envs/harvester/) on 2026-09-12: this is the target environment's own
    # state, so it belongs in the repo that already carries the rest of it. It
    # also gains a check it did not have: this half sat in that repo's
    # verify.yaml paths-ignore, so nothing validated it. Here clusters/** goes
    # through pr-lint (pre-commit). The xrs/ half below was Kyverno-gated there
    # and still is — the workflow moved with it.
    repoURL: https://github.com/stuttgart-things/harvester.git
    targetRevision: main
    path: clusters/crossplane-mgmt/platform
    directory:
      recurse: true
  destination:
    name: crossplane-mgmt
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# Resource claims (RancherCluster, XVirtualMachine, …). Safe to auto-prune.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: showcase-crossplane-xrs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/stuttgart-things/harvester.git
    targetRevision: main
    path: clusters/crossplane-mgmt/xrs
    directory:
      recurse: true
      # Skip non-cluster artifacts the scaffolder emits in flux mode:
      # catalog-info.yaml (Backstage Component) and kustomization.yaml
      # (kustomize config) are not CRDs — applying them fails the sync.
      exclude: '{**/catalog-info.yaml,**/kustomization.yaml}'
  destination:
    name: crossplane-mgmt
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
