---
# Cluster-specific single-host certificate for the Harvester UI/API endpoint.
# Lives here (not in the generic stuttgart-things/flux cert-manager definition)
# because the hostname is specific to this cluster.
#
# Migrated from clusters/infra (vault-pki) to the platform cluster's openbao-pki
# ClusterIssuer as part of the sthings.lab PKI move off the decommissioned infra
# Vault (issue #152). Flux adopts the pre-existing harvester-tls secret via
# server-side-apply as long as only this manifest manages it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harvester-tls
  namespace: default
spec:
  commonName: harvester.sthings.lab
  dnsNames:
    - harvester.sthings.lab
  secretName: harvester-tls # pragma: allowlist secret
  issuerRef:
    name: openbao-pki
    kind: ClusterIssuer
  duration: 2160h # 90 days
  renewBefore: 360h # renew 15 days before expiry
  privateKey:
    rotationPolicy: Always
