# openbao-pki-ca: the sthings.lab root CA for the platform cluster, fed into the
# cluster-trust-bundle via trust-manager (TRUST_BUNDLE_VAULT_CA_SECRET, infra.yaml).
# Every platform Certificate now issues from openbao-pki, so this holds ONLY the
# new OpenBao root; the legacy infra-Vault root was trimmed here -- the in-cluster
# half of Part B "drop the old CA". CA is public; intentionally not encrypted.
# See stuttgart-things/harvester#152.
apiVersion: v1
data:
  ca.crt: 
kind: Secret
metadata:
  name: openbao-pki-ca
  namespace: cert-manager
  labels:
    app.kubernetes.io/managed-by: flux
