# Trust anchors fed into the platform cluster-trust-bundle via trust-manager's
# TRUST_BUNDLE_VAULT_CA_SECRET (infra.yaml). ca.crt is a PEM bundle of TWO roots,
# both CN=sthings.lab but different keys:
#   1. the new OpenBao root (clusters/platform/openbao) — what everything is
#      migrating onto;
#   2. the legacy infra-Vault root, kept so the still-valid old-root ingress
#      certs (argocd/rancher/harbor/minio) stay trusted in-cluster until they are
#      re-issued from openbao-pki.
# Drop root #2 once those Certificates are moved — the in-cluster half of Part B's
# "drop the old CA". CAs are public; this is intentionally not encrypted.
# See stuttgart-things/harvester#152.
apiVersion: v1
data:
  ca.crt: 
kind: Secret
metadata:
  name: openbao-pki-ca
  namespace: cert-manager
  labels:
    app.kubernetes.io/managed-by: flux
