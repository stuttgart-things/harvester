---
- name: Install sthings.lab CA certificate from Vault
  hosts: all
  become: true
  vars:
    vault_url: https://vault.infra.sthings.lab
    vault_pki_path: pki/ca/pem
    ca_cert_name: sthings-lab-ca.crt
    ca_cert_dest: /usr/local/share/ca-certificates/{{ ca_cert_name }}

  tasks:
    - name: Fetch CA certificate from Vault PKI
      ansible.builtin.get_url:
        url: "{{ vault_url }}/v1/{{ vault_pki_path }}"
        dest: /tmp/{{ ca_cert_name }}
        validate_certs: false
        mode: "0644"

    - name: Copy CA certificate to system trust store
      ansible.builtin.copy:
        src: /tmp/{{ ca_cert_name }}
        dest: "{{ ca_cert_dest }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      notify: Update CA certificates

    - name: Clean up temp cert file
      ansible.builtin.file:
        path: /tmp/{{ ca_cert_name }}
        state: absent

    - name: Verify CA cert is trusted (curl Vault endpoint)
      ansible.builtin.command:
        cmd: curl -sv https://vault.infra.sthings.lab/v1/sys/health
      register: vault_curl
      changed_when: false
      failed_when: vault_curl.rc != 0

    - name: Show curl verification result
      ansible.builtin.debug:
        msg: "{{ vault_curl.stderr_lines | select('match', '.*SSL.*|.*certificate.*|.*issuer.*|.*subject.*|.*expire.*') | list }}"

  handlers:
    - name: Update CA certificates
      ansible.builtin.command: update-ca-certificates
      changed_when: true