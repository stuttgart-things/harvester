---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-lb
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cilium/components/lb
  prune: true
  wait: true
  postBuild:
    substitute:
      CILIUM_LB_IP_START: "192.168.10.150"
      CILIUM_LB_IP_STOP: "192.168.10.150"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cert-manager/components/install
  prune: true
  wait: true
  postBuild:
    substitute:
      CERT_MANAGER_NAMESPACE: cert-manager
      CERT_MANAGER_VERSION: v1.19.1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-selfsigned
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cert-manager/components/selfsigned
  prune: true
  wait: true
  postBuild:
    substitute:
      CERT_MANAGER_NAMESPACE: cert-manager
      CERT_MANAGER_SELFSIGNED_DOMAIN: "infra.sthings.lab"
      CERT_MANAGER_SELFSIGNED_SECRET_NAME: wildcard-infra-sthings-tls # pragma: allowlist secret
      CERT_MANAGER_SELFSIGNED_CERT_NAME: wildcard-infra-sthings-tls
      CERT_MANAGER_SELFSIGNED_CERT_NAMESPACE: default
      CERT_MANAGER_SELFSIGNED_ISSUER: vault-pki
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-gateway
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cilium-lb
    - name: cert-manager-selfsigned
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/cilium/components/gateway
  prune: true
  wait: true
  postBuild:
    substitute:
      CILIUM_GATEWAY_NAME: infra-sthings-gateway
      CILIUM_GATEWAY_NAMESPACE: default
      CILIUM_GATEWAY_DOMAIN: "infra.sthings.lab"
      CILIUM_GATEWAY_TLS_SECRET: wildcard-infra-sthings-tls # pragma: allowlist secret
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nfs-csi
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/nfs-csi
  prune: true
  wait: true
  postBuild:
    substitute:
      NFS_SERVER_FQDN: "infra.sthings.lab"
      NFS_SHARE_PATH: /data/nfs/sthings
      CLUSTER_NAME: infra
      NFS_CSI_NAMESPACE: kube-system
      NFS_CSI_VERSION: v4.13.1
      NFS_CSI_ENABLE_CRDS: "true"
      NFS_CSI_ENABLE_SNAPSHOTTER: "true"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./infra/prometheus
  prune: true
  wait: true
  postBuild:
    substitute:
      PROMETHEUS_NAMESPACE: monitoring
      PROMETHEUS_VERSION: "28.13.0"
      PROMETHEUS_STORAGE_CLASS: nfs4-csi
      PROMETHEUS_STORAGE_SIZE: 10Gi
      PROMETHEUS_RETENTION: 15d
      GATEWAY_NAME: infra-sthings-gateway
      GATEWAY_NAMESPACE: default
      HOSTNAME: prometheus
      DOMAIN: infra.sthings.lab
