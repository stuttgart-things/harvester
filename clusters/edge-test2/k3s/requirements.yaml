---
# Collections for the k3s install on the edge node -- used by both runs in
# ./README.md (ansible-galaxy for the CLI run, --requirements for Dagger).
#
# sthings.rke must be >= 26.1003.1399 (deploy-configure-rke 2026.10.03-1):
# older collections silently ignore cilium_chart_version and k3s_cluster_init
# from ./k3s-vars.yaml. Install with --upgrade, or an older sthings.rke already
# in ~/.ansible/collections wins.
#
# Same versions as ../../../requirements.yaml on 2026-10-03; pinned here on
# purpose so the edge run does not move when the repo-wide file does.
collections:
  - name: community.crypto
    version: 3.4.0
  - name: community.general
    version: 13.4.0
  - name: ansible.posix
    version: 2.2.2
  - name: kubernetes.core
    version: 6.6.0
  - name: community.docker
    version: 5.3.0
  - name: community.vmware
    version: 7.0.0
  - name: awx.awx
    version: 24.6.1
  - name: community.hashi_vault
    version: 7.1.0
  - name: ansible.netcommon
    version: 8.7.1
  - name: https://github.com/stuttgart-things/ansible/releases/download/sthings-baseos-26.1003.1399/sthings-baseos-26.1003.1399.tar.gz
  - name: https://github.com/stuttgart-things/ansible/releases/download/sthings-rke-26.1003.1401/sthings-rke-26.1003.1401.tar.gz
  - name: https://github.com/stuttgart-things/ansible/releases/download/sthings-container-26.1002.1398/sthings-container-26.1002.1398.tar.gz
