---
# Extra vars for sthings.rke.k3s_cluster on the edge node -- the lab test VM
# now, the LattePanda later. Used as-is by both runs in ./README.md:
#   ansible-playbook ... -e @k3s-vars.yaml
#   dagger ... execute-ansible --parameters-file k3s-vars.yaml
#
# Needs sthings.rke >= 26.1003.1399 (deploy-configure-rke 2026.10.03-1):
# cilium_chart_version and k3s_cluster_init do not exist in older collections,
# and an older collection would silently ignore them. ./requirements.yaml
# pins it -- for both runs.
#
# What the role does on k3s WITHOUT being told (k3s_config defaults): flannel
# none, kube-proxy and network policy disabled, servicelb and traefik disabled.
# local-path stays, and it is the default StorageClass this cluster uses.
# Cilium is installed with kubeProxyReplacement, Gateway API, L2 announcements,
# and k8sServiceHost = the node's default IPv4.

# The role's LVM handling is baseos' job, and baseos already ran (the VM
# request does it). Keep it off here so a k3s run never touches the disks.
manage_filesystem: false

# k3s 1.35.9 (latest 1.35 patch, 2026-09-30).
install_k3s: true
k3s_state: present
k3s_k8s_version: 1.35.9
k3s_release_kind: k3s1
# sqlite/kine instead of embedded etcd: one node that never grows, less RAM
# and fewer writes on the 64GB eMMC. Decided before the first install --
# switching an existing cluster's datastore is not an in-place change.
k3s_cluster_init: false

cluster_setup: singlenode
cluster_name: edge-test2

# Cilium 1.20.2: the first Cilium line whose tested matrix includes k8s 1.35
# (1.19.x stops at 1.34). cilium-cli 0.20.1 installs it via --version, and
# Cilium 1.20 needs Gateway API v1.6.1, which the role applies server-side.
# Moving CRDs to v1.6.x is one-way (the v1.6 admission policy blocks
# downgrades below v1.5).
install_cilium: true
cilium_version: 0.20.1
cilium_chart_version: "1.20.2"
cilium_gateway_api_crds_version: v1.6.1

prepare_rancher_ha_nodes: true
install_helm_diff: false
fetched_kubeconfig_path: /tmp/kubeconfig-edge-test2.yaml
