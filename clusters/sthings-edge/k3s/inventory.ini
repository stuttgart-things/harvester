# sthings-edge (LattePanda Mu) in the table tennis network, role `tt`.
# Cluster layout, not [all]: sthings.rke's role branches on these two groups,
# and a plain [all] inventory dies on an undefined group before doing anything.
[initial_master_node]
sthings-edge ansible_host=192.168.8.10

[additional_master_nodes]

[all:vars]
ansible_user=sthings
