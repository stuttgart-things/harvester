# homerun2 on edge-play-gateway: the same Services as the internal routes
# (homerun2-sops, homerun2-light-catcher-tabletennis-sops, homerun2-portal),
# one rule at "/" like theirs, under the *.<EDGE_PLAY_DOMAIN> wildcard
# certificate that already covers schmetterpause and zaehlwerk. Same set as
# clusters/edge (#460, #473). The services behind homerun2-portal answer under
# their BASE_PATH (/led, /core, ...) on their own hostname too; "/" redirects
# there.
#
# The route is the access control, as for ../play-routes/zaehlwerk.yaml.
# omni-pitcher and scout ask for their token; demo-pitcher, the led-catcher's
# stream switch, the light-catcher test page and the wled-mock do not --
# anyone in the table Wi-Fi who reaches the name can send messages to the
# LED matrix and switch its stream.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: config-viewer-play
  namespace: homerun2
spec:
  parentRefs:
    - name: edge-play-gateway
      namespace: default
      sectionName: https
  hostnames:
    - config-viewer.${EDGE_PLAY_DOMAIN}
  rules:
    - backendRefs:
        - name: homerun2-config-viewer
          port: 80
---
