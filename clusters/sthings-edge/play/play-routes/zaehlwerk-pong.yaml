---
# zaehlwerk-pong for players' phones: https://zaehlwerk-pong.<EDGE_PLAY_DOMAIN>,
# the same Service as the internal route (apps/tabletennis, zaehlwerk-pong-on),
# through edge-play-gateway and its *.<EDGE_PLAY_DOMAIN> wildcard certificate,
# like schmetterpause.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zaehlwerk-pong-play
  namespace: zaehlwerk
spec:
  parentRefs:
    - name: edge-play-gateway
      namespace: default
      sectionName: https
  hostnames:
    - zaehlwerk-pong.${EDGE_PLAY_DOMAIN}
  rules:
    - backendRefs:
        - name: zaehlwerk-pong
          port: 80
