---
# The table mock on a phone: https://buttons.<EDGE_PLAY_DOMAIN>, the same
# Service as the internal route (apps/tabletennis, zaehlwerk-buttons-sim-on),
# through edge-play-gateway and its *.<EDGE_PLAY_DOMAIN> wildcard certificate,
# like zaehlwerk.yaml. The page scores into the running match without a login:
# the table Wi-Fi is the boundary, and the route goes with the mock once real
# buttons count.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zaehlwerk-buttons-sim-play
  namespace: zaehlwerk
spec:
  parentRefs:
    - name: edge-play-gateway
      namespace: default
      sectionName: https
  hostnames:
    - buttons.${EDGE_PLAY_DOMAIN}
  rules:
    - backendRefs:
        - name: zaehlwerk-buttons-sim
          port: 80
