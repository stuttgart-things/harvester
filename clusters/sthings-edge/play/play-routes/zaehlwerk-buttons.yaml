---
# The table mock on a phone: https://buttons.<EDGE_PLAY_DOMAIN>, the same
# Service as the internal route (apps/tabletennis, zaehlwerk-buttons-sim-on),
# through edge-play-gateway. Covered by its *.<EDGE_PLAY_DOMAIN> wildcard
# and the Opal's dnsmasq entry for sthings-edge.com, like schmetterpause.yaml.
# UNTIL THE REAL BOARD SCORES (../../cluster-apps.yaml): the page scores into
# the running match without a login -- drop this file together with
# TABLETENNIS_ZAEHLWERK_BUTTONS_SIM once real matches are played at the table.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zaehlwerk-buttons-sim-play
  namespace: zaehlwerk
spec:
  parentRefs:
    - name: edge-play-gateway
      namespace: default
      sectionName: https
  hostnames:
    - buttons.${EDGE_PLAY_DOMAIN}
  rules:
    - backendRefs:
        - name: zaehlwerk-buttons-sim
          port: 80
