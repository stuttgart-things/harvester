---
# zaehlwerk's dev portal: https://zaehlwerk-portal.<EDGE_PLAY_DOMAIN>, the same
# Service as the internal route (apps/tabletennis, zaehlwerk-portal-on),
# through edge-play-gateway and its *.<EDGE_PLAY_DOMAIN> wildcard certificate,
# like zaehlwerk.yaml. The frames it shows are the play names too
# (TABLETENNIS_LINK_DOMAIN). No login: it ends matches -- the table Wi-Fi is
# the boundary, as for zaehlwerk's own route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zaehlwerk-portal-play
  namespace: zaehlwerk
spec:
  parentRefs:
    - name: edge-play-gateway
      namespace: default
      sectionName: https
  hostnames:
    - zaehlwerk-portal.${EDGE_PLAY_DOMAIN}
  rules:
    - backendRefs:
        - name: zaehlwerk-portal
          port: 80
