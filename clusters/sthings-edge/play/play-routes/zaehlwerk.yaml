---
# zaehlwerk on a phone: https://zaehlwerk.<EDGE_PLAY_DOMAIN>, the same Service
# as the internal route (apps/tabletennis, zaehlwerk), through
# edge-play-gateway and its *.<EDGE_PLAY_DOMAIN> wildcard certificate, like
# schmetterpause.yaml. One rule at "/", as zaehlwerk's own route: the scoring
# page, the watch and live screens, the API and ingest. Check-in by phone
# claims the table over it (TABLETENNIS_SCHMETTERPAUSE_ZAEHLWERK_URL).
# zaehlwerk has no authentication, its route is the access control: anyone in
# the table Wi-Fi who reaches this name can start, score and end a match.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zaehlwerk-play
  namespace: zaehlwerk
spec:
  parentRefs:
    - name: edge-play-gateway
      namespace: default
      sectionName: https
  hostnames:
    - zaehlwerk.${EDGE_PLAY_DOMAIN}
  rules:
    - backendRefs:
        - name: zaehlwerk
          port: 80
