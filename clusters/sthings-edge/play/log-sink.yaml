---
# The firmware's log sink on the box: ../log-sink/log-sink.yaml (UDP on
# 192.168.8.23 for the board, the viewer at https://log-sink.<EDGE_DOMAIN>).
# A Kustomization of its own like redis-lb.yaml, so it shows its own Ready
# state; it brings its namespace, so it waits for nothing.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: log-sink
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 30s
  timeout: 2m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/sthings-edge/log-sink
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
        optional: false
