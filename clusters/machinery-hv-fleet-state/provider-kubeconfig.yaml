---
# provider-kubeconfig: the read side of the kubeconfigs every ClusterStack
# uploads, as the `provider-kubeconfig-vault` chart renders it -- the same chart
# the LabDA machinery cluster runs (stuttgart-things
# clusters/labda/vsphere/machinery-fleet-state/provider-kubeconfig.yaml), pointed
# at ONE Vault: the OpenBao on platform.
#
# WHY IT UNBLOCKS THE PROVIDER. The flux machinery profile gives
# stuttgart-things-provider-kubeconfig-xpkg `runtimeConfigRef: provider-kubeconfig`
# and does not ship that DeploymentRuntimeConfig; this chart does. Until it
# exists the provider sits at `DeploymentRuntimeConfig "provider-kubeconfig" not
# found` and no RemoteCluster -- so no ClusterStack -- can finish (seen on this
# cluster, 2026-09-24).
#
# WHAT DIFFERS FROM LabDA, all in `values` below:
#   additionalVaults: []   the chart's defaults are the LabUL infra Vault and
#                          the LabDA one. Neither is reachable from this lab,
#                          and a list default is only dropped by setting it.
#   vaultCA                the OpenBao root ONLY. It is the one file
#                          VAULT_CACERT points at; the chart's default bundle
#                          holds the three LabUL/LabDA roots and not this one,
#                          which fails at RUNTIME in the RemoteCluster
#                          (`tls: failed to verify certificate`), not on install.
#   roleIds                from a Secret (valuesFrom), as on LabDA -- the
#                          machinery-hv-kubeconfig-reader AppRole (read-kubeconfigs).
#
# Name `vault-kubeconfigs`, the chart default, on purpose: a ClusterStack derives
# its read ProviderConfig from kubeconfig.vaultSecretName, and its default
# `vault` maps to exactly this name. The upload side is tekton-ci/vault.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  # The name LabDA's sops-git component gives it. Nothing else creates it here --
  # sops-git is not selected on this cluster.
  name: stuttgart-things-charts
  namespace: crossplane-system
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/stuttgart-things/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: provider-kubeconfig-vault
  namespace: crossplane-system
spec:
  interval: 30m
  chart:
    spec:
      chart: provider-kubeconfig-vault
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/charts/provider-kubeconfig-vault
      version: 0.2.0
      sourceRef:
        kind: HelmRepository
        name: stuttgart-things-charts
        namespace: crossplane-system
      interval: 12h
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  # roleIds.vault-kubeconfigs -- secrets/provider-kubeconfig-roleids.enc.yaml
  valuesFrom:
    - kind: Secret
      name: provider-kubeconfig-roleids
      valuesKey: values.yaml
  values:
    providerConfigName: vault-kubeconfigs
    namespace: crossplane-system
    vault:
      address: https://openbao.platform.sthings.lab
      mountPath: kubeconfigs
      appRole:
        mountPath: approle
        # key `secret-id` -- secrets/vault-approle-reader.enc.yaml
        secretRef:
          name: vault-approle
          namespace: crossplane-system
    additionalVaults: []
    # The sthings.lab root, byte-identical to openbao-pki-source-ca.yaml and to
    #   curl -sk https://openbao.platform.sthings.lab/v1/pki/ca/pem
    # (checked 2026-09-24). Public; a CA is not a secret.
