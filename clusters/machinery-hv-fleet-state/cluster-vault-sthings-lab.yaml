---
# The OpenBao policy mapping for ClusterStacks with
# `spec.environmentConfig: sthings-lab`. Shape copied from cluster-vault-labul
# (stuttgart-things clusters/labda/vsphere/machinery-fleet-state/
# environmentconfigs.yaml, itself a copy of crossplane-configurations
# bootstrap/cluster/examples/environment-config-vault-labul.yaml).
#
# EVERY NAME HERE MUST EXIST ON THE OPENBAO. A role referencing a missing
# policy is accepted and its token silently has no permissions -- the order
# builds, and the cluster's ExternalSecrets never sync. The mounts and the
# read-/write-*-clusters policies are created by
# ../platform/openbao/machinery-fleet (same names as LabUL, on purpose).
#
# ONE GAP: the shared entry homerun2/_git-pat below is NOT seeded -- it needs a
# real GitHub token, and choosing whose is not a Terraform decision. Until it
# exists, an order with the homerun2 profile gets every homerun2 key except
# githubToken.
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: cluster-vault-sthings-lab
  labels:
    cluster.stuttgart-things.com/environment: sthings-lab
data:
  vault:
    certManagerPolicies:
      - pki-issue
    # KV mount -> the policies that let a cluster's ESO read it. The keys are
    # also an allow-list: a store not listed here fails the order.
    secretStores:
      homerun2:
        - read-homerun2-clusters
      schmetterpause:
        - read-schmetterpause-clusters
      observability:
        - read-observability-clusters
    # Logical mount of an AppSecretProfile -> the real KV mount on this OpenBao.
    mounts:
      homerun2: homerun2
      schmetterpause: schmetterpause
    # Shared, externally seeded `_` entries.
    shared:
      git-pat:
        mount: homerun2
        entry: _git-pat
    # Entries hand-seeded clusters still read. homerun2-dev runs from SOPS in
    # this repo, not from OpenBao, so nothing is reserved yet -- add the name of
    # any cluster that gets a hand-written entry before a ClusterStack could
    # derive the same path.
    reservedEntries: {}
    writer:
      providerConfigName: vault-cluster-secrets
