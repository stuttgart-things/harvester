---
# The clusterbook IPAM state, migrated verbatim from the infra cluster on
# 2026-09-07 (`clusterbook/networks-labul`). This CR *is* the data — clusterbook
# runs with LOAD_CONFIG_FROM=cr and holds nothing else: no PVC, no database.
#
# COPIED UNCHANGED, INCLUDING THE ENTRIES THAT ARE NO LONGER TRUE. A migration
# that also edits allocation state is two changes wearing one hat, and the
# entries below may still have matching DNS records on the router (192.168.10.1)
# that only clusterbook knows how to withdraw:
#
#   178:ASSIGNED:DNS:martinwolf   the cluster was deleted 2026-09-07
#   173:ASSIGNED:DNS:ferdinand    the cluster was deleted 2026-09-07,
#                                 replaced by apps1 (which holds 172)
#
# Both are still ASSIGNED below as of 2026-09-08. That is not an oversight in
# this file -- it is the withdrawal above that has not been done.
#
# Release them through clusterbook once it runs here — not by editing this file.
#
# 2026-09-08: releasing both freed the addresses and left the DNS records in
# place. Verified against the router, not the pod resolver:
#
#   nslookup ferdinand.sthings.lab    192.168.10.1  -> 192.168.10.173
#   nslookup x.martinwolf.sthings.lab 192.168.10.1  -> 192.168.10.178
#
# NOT because clusterbook cannot remove records. It calls DeleteRecord on
# release, for DD-WRT exactly as for PowerDNS. The call FAILED and the API said
# `{"status":"ok"}` anyway, because web.go discarded the returned error:
#
#   DDWRT DELETE DNS RECORD FAILED
#     err: ddwrt write dnsmasq_options: Process exited with status 127
#
# Creation was equally broken -- reserving with create_dns:true returned 200 and
# wrote no record -- so this was never a delete-only gap, and reading the source
# rather than the UI is what showed it.
#
# Both are fixed in clusterbook v1.26.0 (stuttgart-things/clusterbook#187): the
# NVRAM write and the dnsmasq reload run as separate commands so the error names
# the failing step, three reload variants are tried because restart_dnsmasq is a
# shell function a non-interactive SSH session may not resolve, and the DNS
# outcome is reported in the API response instead of being dropped.
#
# So the two records above should be withdrawn through clusterbook on that
# version. If any record still survives a release, check the response and the
# log first — on v1.26.0 both now say what happened.
#
# Harmless until an address is reused: a later cluster taking 173 would make
# both ferdinand.sthings.lab and its own name resolve to the same host.
#
# ---------------------------------------------------------------------------
# THE ANNOTATION BELOW IS LOAD-BEARING. Without it Flux re-applies this list
# every hour and DELETES every reservation clusterbook has made since.
#
# Measured on 2026-09-08:
#
#   POST /api/v1/networks/192.168.10/reserve  -> 192.168.10.172 assigned
#   flux reconcile kustomization clusterbook-seed
#   -> 172 free again, resourceVersion 4236946 -> 4236956
#
# That is not a theoretical race. It is why apps1 runs on 192.168.10.172 while
# this file lists 172 as free: the reservation was made when the cluster was
# built and erased within the hour. It is also why 173 and 178 above cannot be
# released -- clusterbook removes them, the next reconcile puts them back.
#
# The consequence is an IP handed out twice. Reserving from the pool in that
# state returned 172 -- the address apps1 is already using.
#
# `ssa: Ignore` makes Flux CREATE this resource when it is missing and never
# touch it again, which is what a seed means. The live CR is the database
# (clusterbook runs LOAD_CONFIG_FROM=cr, no PVC), so git can define its initial
# contents and must not define its ongoing contents.
#
# ORDERING — THIS IS WHY THE FILE LIVES OUTSIDE clusters/platform.
#
# flux-system applies clusters/platform RECURSIVELY, and a Kustomization fails
# as a whole: one object that does not dry-run takes every other object with it.
# Put this CR in there and the result is a deadlock, not a race — the CRD is
# installed by the clusterbook Kustomization, which flux-system itself has to
# create, and it never gets that far:
#
#   Ready=False ReconciliationFailed
#   NetworkConfig/clusterbook/networks-labul dry-run failed: no matches for kind
#   "NetworkConfig" in version "github.stuttgart-things.com/v1"
#
# Observed on platform 2026-09-07, blocking all of clusters/platform. It never
# surfaced on infra because the CRD has existed there for 173 days; the ordering
# only bites on a fresh install.
#
# So this directory is a SIBLING of clusters/platform, not a child, and it is
# applied by its own Kustomization (apps/clusterbook-seed.yaml) that dependsOn
# clusterbook.
apiVersion: github.stuttgart-things.com/v1
kind: NetworkConfig
metadata:
  name: networks-labul
  annotations:
    # Create once, never update. See the block above.
    kustomize.toolkit.fluxcd.io/ssa: Ignore
  namespace: clusterbook
spec:
  networks:
    "192.168.10":
      - "171"
      - "177:ASSIGNED:DNS:crossplane-mgmt"
      - "176"
      - "178:ASSIGNED:DNS:martinwolf"
      - "180:ASSIGNED:DNS:k3s-xp"
      - "173:ASSIGNED:DNS:ferdinand"
      - "172"
      - "179"
