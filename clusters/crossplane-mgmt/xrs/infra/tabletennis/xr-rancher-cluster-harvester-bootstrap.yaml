---
# tabletennis -- a Harvester k3s cluster for the homerun2 + tabletennis stack:
# homerun2 (redis-stack, omni-pitcher, core-catcher, scout, led-catcher and the
# light-catcher at the table), schmetterpause (league, with a CloudNativePG
# database) and zaehlwerk (live scorekeeping).
#
# THE CLUSTER NAME IS LOAD-BEARING IN THREE PLACES, so renaming it is not a
# one-line change: it becomes the DNS name the reservation creates (and with it
# every application hostname, `<app>.tabletennis.sthings.lab`), the OpenBao
# mount path in the annotations below, and the directory
# clusters/tabletennis/openbao that terraform runs from.
#
# Modelled on ../apps1, which is the same shape of cluster. The differences are
# sizing and one extra label -- see below.
apiVersion: resources.stuttgart-things.com/v1alpha1
kind: RancherCluster
metadata:
  name: tabletennis
  namespace: default
spec:
  name: tabletennis
  environmentConfig: default
  infrastructure: harvester
  # Bigger than apps1's 6/6/40. This cluster carries two stateful workloads on
  # top of the platform -- a CloudNativePG instance for schmetterpause and
  # redis-stack with persistence for homerun2 -- plus roughly ten small Go
  # services. The disk is the reason for 60: the two PVCs default to 8Gi each
  # on openebs-hostpath, which is local storage on this root disk.
  harvester:
    cpuCount: 8
    memorySize: 12
    diskSize: 60
    quantity: 1
  argocd:
    register: true
    # Produces the clusterbook allocation-ip label and the ip/fqdn annotations.
    # NOT optional here: every network-platform ApplicationSet gates on that
    # anchor, so without a reservation the cluster joins Argo CD and none of
    # cilium-lb, the Gateway or the wildcard certificate is installed -- and
    # then nothing this cluster exists for is reachable.
    reservation:
      enabled: true
      createDNS: true
    labels:
      storage-platform: 'true'
      # The default StorageClass. Both PVCs above land on it.
      storage-platform/openebs: 'true'
      storage-platform/longhorn: 'false'
      # REQUIRED BY tabletennis-platform: schmetterpause's database is a
      # CloudNativePG `Cluster`, and without the CRD that Application's dry-run
      # rejects the whole apply. Opt-in and a singleton per cluster, which is why
      # it sits in the storage bundle rather than in platforms/tabletennis.
      storage-platform/cloudnative-pg: 'true'
      storage-platform/nfs-csi-install: 'false'
      storage-platform/nfs-csi-storageclasses: 'false'
      security-platform: 'true'
      # REQUIRED by all three applications: homerun2's component Secrets,
      # schmetterpause's app + database credentials and zaehlwerk's panel token
      # all come from a ClusterSecretStore. They fail closed, so a missing store
      # shows up as a Secret that never appears rather than as an error anyone
      # reads.
      security-platform/external-secrets: 'true'  # pragma: allowlist secret
      security-platform/kyverno: 'true'
      network-platform: 'true'
      network-platform/cilium-lb: 'true'
      # The Gateway all six public hostnames attach to. zaehlwerk has NO
      # authentication of its own -- its route is the access control -- so this
      # Gateway must stay on the internal network.
      network-platform/cilium-gateway: 'true'
      network-platform/cilium-gateway-secondary: 'false'
      network-platform/cert-manager-install: 'true'
      network-platform/cert-manager-selfsigned: 'true'
      network-platform/cert-manager-cluster-ca: 'true'
      network-platform/cert-manager-vault-pki: 'true'
      network-platform/trust-manager-install: 'true'
      network-platform/trust-manager-bundle: 'true'
      cicd-platform: 'false'
      # The schmetterpause PodMonitors and alert rules need the Prometheus
      # Operator CRDs from this bundle. Off for now -- turn it on together with
      # the monitoring variant on the flux side.
      observability-platform: 'false'

      # ---- the two app platforms this cluster exists for ----
      #
      # homerun2: redis-stack + omni-pitcher + core-catcher + scout +
      # led-catcher, with the `tabletennis` stream in omni-pitcher's routing
      # file. The component set is fixed by the bundle.
      homerun2-platform: 'true'
      homerun2-platform/stack: 'true'
      # tabletennis: schmetterpause + its database, zaehlwerk, and the LED strip
      # at the table. A platform of its own, beside homerun2.
      tabletennis-platform: 'true'
      tabletennis-platform/tabletennis: 'true'
      # The strip is physical hardware. Flip this to 'true' and set the
      # wled-endpoint annotation below once one is wired up at the table;
      # without it the catcher would drive homerun2's wled-mock.
      tabletennis-platform/light-catcher: 'false'

      # THE TWO GATES, AND THEY STAY 'false' UNTIL THE STORE EXISTS.
      #
      # Both bundles read every credential they have from a ClusterSecretStore,
      # and ExternalSecrets fail closed: labelled early, the Pods sit in
      # CreateContainerConfigError waiting for Secrets that never appear, and
      # schmetterpause's database never bootstraps at all, because it initialises
      # from the Secret its own ExternalSecret produces.
      #
      # The gates are matched on the VALUE, so 'false' here really is off.
      #
      # Flip BOTH to 'true' after:
      #   1. terraform in clusters/tabletennis/openbao   (the mount)
      #   2. the ClusterSecretStore `vault-tabletennis` on the cluster
      #   3. three entries under it:
      #        homerun2:       authToken, redisPassword
      #        schmetterpause: session-key, username, password
      #        zaehlwerk:      omni-pitcher-token, redis-password
      #      where omni-pitcher-token holds the SAME value as homerun2's
      #      authToken -- otherwise /pitch answers 401 and the only symptom is a
      #      `panel pitch failed, point not shown` line in zaehlwerk's log.
      homerun2-platform.stuttgart-things.com/secrets-config: 'false'
      tabletennis-platform.stuttgart-things.com/secrets-config: 'false'
    # PKI against the OpenBao on `platform` -- this cluster never touches the
    # Vault on `infra` that is being switched off (stuttgart-things/harvester#152).
    annotations:
      clusterbook.stuttgart-things.com/vault-server: https://openbao.platform.sthings.lab
      clusterbook.stuttgart-things.com/vault-pki-path: pki/sign/sthings-lab
      # Tokenless: cert-manager mints a ServiceAccount token per signing request
      # through the TokenRequest API rather than holding a Vault token that
      # nothing renews.
      clusterbook.stuttgart-things.com/vault-auth-method: kubernetes
      # THE MOUNT DOES NOT EXIST UNTIL A HUMAN RUNS TERRAFORM, from
      # clusters/tabletennis/openbao in this repo -- which needs this cluster's
      # own API address, CA and reviewer JWT and therefore cannot run until the
      # cluster is up. The vault-pki ClusterIssuer sits not-Ready between
      # provisioning and that apply. That is the intended signal, not a fault;
      # see clusters/OPENBAO-CLUSTERBOOK.md.
      #
      # vault-base-setup derives the mount from <cluster_name>-<name> and binds
      # a role of that same <name> to a ServiceAccount of that <name>. All three
      # move together, and the cluster_name here is `tabletennis-sthings`.
      clusterbook.stuttgart-things.com/vault-k8s-auth-mount: /v1/auth/tabletennis-sthings-certmanager
      clusterbook.stuttgart-things.com/vault-k8s-auth-role: certmanager
      clusterbook.stuttgart-things.com/vault-k8s-auth-sa: certmanager
      # Inert under kubernetes auth -- the chart renders only the block matching
      # the method. Kept so the Composition writes the Secret name every other
      # cluster uses rather than a second, differently-named unused one.
      clusterbook.stuttgart-things.com/vault-token-secret: cert-manager-vault-token  # pragma: allowlist secret
      # The issuer keeps the name every Certificate in the fleet references. The
      # name says Vault; the endpoint above is OpenBao.
      clusterbook.stuttgart-things.com/wildcard-issuer-name: vault-pki

      # ---- the two app platforms ----
      #
      # One store for both bundles, named per cluster the way every other
      # ClusterSecretStore in the fleet is. Required by both -- the gate labels
      # above are what keeps them from firing before it exists.
      homerun2-platform.stuttgart-things.com/secret-store: vault-tabletennis
      tabletennis-platform.stuttgart-things.com/secret-store: vault-tabletennis
      # Everything else is left at its bundle default on purpose:
      #   homerun2 secret-key      -> the cluster name, `tabletennis`
      #   homerun2 storage-class   -> openebs-hostpath, which this cluster has
      #   homerun2 redis-storage   -> 8Gi
      #   tabletennis storage-class-> empty, i.e. the cluster's default SC
      #   tabletennis db-storage   -> 8Gi
      #   tabletennis homerun2-ns  -> homerun2
      # Add tabletennis-platform.stuttgart-things.com/wled-endpoint together with
      # the light-catcher label when a real strip is wired up.
