---
# crossplane-state-metrics: a second kube-state-metrics, custom-resource-state
# ONLY, exporting the conditions of every XR and composed managed resource as
# crossplane_xr_* / crossplane_mr_* (config: crossplane-state-metrics-config.yaml).
#
# Why not kube-prometheus-stack's own kube-state-metrics with
# `kube-state-metrics.customResourceState`: crossplane-mgmt's stack comes from
# the argocd catalog chart (platforms/observability), machinery-hv's from flux
# infra/kube-prometheus-stack -- two values paths, one of them behind an argocd
# release tag. A separate instance is the same object on both clusters, rolls
# out with this directory, and a broken CRS config cannot take the stack's
# standard kube_* metrics down with it. Same image as the stack's (v2.20.0).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crossplane-state-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-state-metrics
rules:
  # wildcard kinds/versions are resolved from the CRDs
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # Keep in step with the groups in crossplane-state-metrics-config.yaml.
  - apiGroups:
      # XRs
      - resources.stuttgart-things.com
      - config.stuttgart-things.com
      - secrets.stuttgart-things.com
      - storage.stuttgart-things.com
      - vault.stuttgart-things.com
      # MRs
      - kubernetes.m.crossplane.io
      - helm.m.crossplane.io
      - opentofu.m.upbound.io
      - auth.vault.m.upbound.io
      - kubernetes.vault.m.upbound.io
      - kv.vault.m.upbound.io
      - kubeconfig.stuttgart-things.com
      - ipreservation.clusterbook.stuttgart-things.com
      - virtualmachine.vspherevm.m.stuttgart-things.com
    resources: ["*"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-state-metrics
subjects:
  - kind: ServiceAccount
    name: crossplane-state-metrics
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crossplane-state-metrics
  labels:
    app.kubernetes.io/name: crossplane-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crossplane-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crossplane-state-metrics
    spec:
      serviceAccountName: crossplane-state-metrics
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          args:
            - --port=8080
            - --telemetry-port=8081
            - --custom-resource-state-only
            - --custom-resource-state-config-file=/etc/crossplane-state-metrics/config.yaml
          ports:
            - name: http
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/crossplane-state-metrics
              readOnly: true
      volumes:
        - name: config
          configMap:
            # name gets kustomize's content hash: a config change rolls the pod
            name: crossplane-state-metrics-config
---
apiVersion: v1
kind: Service
metadata:
  name: crossplane-state-metrics
  labels:
    app.kubernetes.io/name: crossplane-state-metrics
spec:
  selector:
    app.kubernetes.io/name: crossplane-state-metrics
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: crossplane-state-metrics
  labels:
    app.kubernetes.io/name: crossplane-state-metrics
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: crossplane-state-metrics
  endpoints:
    - port: http
      # keep the objects' own `namespace` label instead of the scrape target's
      honorLabels: true
