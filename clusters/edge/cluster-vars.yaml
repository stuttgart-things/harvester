---
# Everything that differs between the lab test node and the LattePanda, in ONE
# place. edge-infra and edge-apps substitute these into the Kustomizations
# they apply (postBuild.substituteFrom), so infra/ and apps/ carry
# ${EDGE_*} placeholders instead of values.
#
# THIS FILE: the lab -- edge-tt-test1 in LabDA vSphere. Address and DNS
# wildcard reserved in the LabDA Clusterbook (README, step 1). On the
# LattePanda: EDGE_DOMAIN edge.sthings.lab, the VIP from the OpenWrt LAN
# (harvester#364, "Design decided").
#
# Only plain strings here, no secrets (those are SOPS, in secrets/edge/ at the repo root).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
data:
  EDGE_CLUSTER_NAME: edge-tt-test1
  EDGE_DOMAIN: edge-tt-test1.4sthings.tiab.ssc.sva.de
  EDGE_LB_IP: 10.100.136.223
  EDGE_GATEWAY_NAME: edge-gateway
  # The "public" side for players (./lab/, lab only): its own Gateway on its
  # own VIP. On the edge this becomes the deSEC name with Let's Encrypt; in
  # the lab a Clusterbook name with a certificate from the LabDA Vault.
  # Reserved 2026-10-04 as edge-tt-test1-play (ASSIGNED:DNS).
  EDGE_PLAY_DOMAIN: edge-tt-test1-play.4sthings.tiab.ssc.sva.de
  EDGE_PLAY_LB_IP: 10.100.136.226
