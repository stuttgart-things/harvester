---
# Everything that differs between the lab test node and the LattePanda, in ONE
# place. edge-infra and edge-apps substitute these into the Kustomizations
# they apply (postBuild.substituteFrom), so infra/ and apps/ carry
# ${EDGE_*} placeholders instead of values.
#
# THIS FILE: the lab -- edge-tt-test1 in LabDA vSphere. Address and DNS
# wildcard reserved in the LabDA Clusterbook (README, step 1). On the
# LattePanda: EDGE_DOMAIN edge.sthings.lab, the VIP from the OpenWrt LAN
# (harvester#364, "Design decided").
#
# Only plain strings here, no secrets (those are SOPS, in secrets/edge/ at the repo root).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
data:
  EDGE_CLUSTER_NAME: edge-tt-test1
  EDGE_DOMAIN: edge-tt-test1.4sthings.tiab.ssc.sva.de
  EDGE_LB_IP: 10.100.136.223
  EDGE_GATEWAY_NAME: edge-gateway
  # The public side for players (./lab/ on the lab VM): its own Gateway on its
  # own VIP, a public name with a Let's Encrypt wildcard (DNS-01 at Hetzner
  # DNS, zone sthings-edge.com, ClusterIssuer letsencrypt-hetzner).
  # *.sthings-edge.com -> EDGE_PLAY_LB_IP is a record in that zone (Hetzner
  # Console / API), the private lab VIP. Until 2026-10-05: the Clusterbook name
  # edge-tt-test1-play.4sthings.tiab.ssc.sva.de with the LabDA Vault issuer.
  EDGE_PLAY_DOMAIN: sthings-edge.com
  EDGE_PLAY_LB_IP: 10.100.136.226
  # LAB ONLY: the emulated ESP (lab/esp-mock, deployment piezo-a). "1" = on,
  # "0" = off. TURN IT OFF WHILE REAL BOARDS ARE AT THE TABLE: zaehlwerk has
  # one running match and every board in join mode scores into it, so mock
  # and real board together count each rally twice.
  EDGE_ESP_MOCK_REPLICAS: "1"
