---
# What flux-system applies from this directory: the FluxInstance, its secrets,
# the content source and the two layers -- nothing below them. Each layer
# directory is applied only by its own Kustomization:
#
#   infra.yaml -> ./infra   (edge-infra)
#   apps.yaml  -> ./apps    (edge-apps, dependsOn edge-infra)
#   ./k3s is Ansible, never Flux (.sourceignore)
#
# A NEW FLUX OBJECT IN THIS DIRECTORY MUST BE LISTED HERE, or it is never
# applied. Dropping an entry is worse: flux-system prunes, and a layer
# Kustomization that goes takes everything it applied with it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # the FluxInstance and its sops key (committed by the Flux bootstrap)
  - config.yaml
  - secrets.yaml
  # the environment's values (lab vs. LattePanda), read by both layers
  - cluster-vars.yaml
  # OCIRepository flux-repo: what every layer's content comes from
  - sources.yaml
  - infra.yaml
  - apps.yaml
