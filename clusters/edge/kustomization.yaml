---
# What flux-system applies from this directory. Same rule as
# ../machinery-hv/kustomization.yaml: a new Flux object here must be listed, or
# it is never applied.
#
# config.yaml and secrets.yaml do not exist until the Flux bootstrap commits
# them (README, step 5). Until then this kustomization does not build, and
# nothing applies it either.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # the FluxInstance and its sops key (committed by the Flux bootstrap)
  - config.yaml
  - secrets.yaml
  # SOPS: the substitutions homerun2 and tabletennis read
  - edge-secrets-subst.enc.yaml
  - flux-sources.yaml
  - infra-platform.yaml
  - homerun2.yaml
  - tabletennis.yaml
