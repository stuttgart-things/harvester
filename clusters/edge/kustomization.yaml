---
# What flux-system applies from this directory. Each layer directory is
# applied only by its own Kustomization (all three in apps.yaml):
#
#   edge-infra -> ./infra   (wait: true)
#   edge-apps  -> ./apps    (dependsOn edge-infra)
#   edge-lab   -> ./lab     (LAB ONLY, dependsOn edge-infra)
#   ./k3s, ./terraform, cluster-apps.yaml are never Flux (.sourceignore)
#
# GENERATED (blueprints render-cluster-apps from ./cluster-apps.yaml, see
# there): apps.yaml, infra/infra-platform.yaml, apps/apps-platform.yaml,
# ./cluster-secrets. Change cluster-apps.yaml and re-render; do not edit them.
#
# A NEW FLUX OBJECT IN THIS DIRECTORY MUST BE LISTED HERE, or it is never
# applied. Dropping an entry is worse: flux-system prunes, and a layer
# Kustomization that goes takes everything it applied with it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # the FluxInstance and its sops key (committed by the Flux bootstrap)
  - config.yaml
  - secrets.yaml
  # the environment's values (lab vs. LattePanda), read by every layer
  - cluster-vars.yaml
  # GENERATED: OCIRepository flux-repo + the layers edge-infra, edge-apps,
  # edge-lab (edge-lab is LAB ONLY: drop it in cluster-apps.yaml for the
  # LattePanda)
  - apps.yaml
  # GENERATED: the bundle apps' secrets (SOPS, flux-system)
  - cluster-secrets/secrets
