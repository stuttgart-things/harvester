---
# edge-ca: cert-manager's CA issuer backed by the PERSISTENT edge intermediate
# (./edge-ca.enc.yaml, SOPS). Chain: stuttgart-things edge root CA (P-384,
# 20y; offline -- key only in ../../../../secrets/edge-root-ca.enc.yaml) ->
# intermediate "(cert-manager)" (P-256, 5y, pathlen 0) -> leaf.
#
# The gateway wildcard (cert-manager-selfsigned's Certificate) is issued by
# this issuer, not by the self-signed cluster-ca: infra-platform.yaml sets
# CERT_MANAGER_SELFSIGNED_ISSUER: edge-ca. Clients and devices trust ONE
# public root, ../../edge-root-ca.crt, and it survives a reinstall.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: edge-ca
spec:
  ca:
    secretName: edge-ca # pragma: allowlist secret
