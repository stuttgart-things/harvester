---
# LAB ONLY, for now: Let's Encrypt with DNS-01 at Hetzner DNS -- the public
# players' side of the edge (harvester#364). DNS-01 needs no inbound access:
# cert-manager writes the _acme-challenge TXT record through the Hetzner Cloud
# API, Let's Encrypt checks it publicly. Works the same behind the edge's
# visitor Wi-Fi/LTE uplink. Once proven here it moves into the flux catalog.
#
# cert-manager-webhook-hetzner: the DNS-01 solver (hetzner's official webhook)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-webhook-hetzner
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: infrastructure
spec:
  dependsOn:
    - name: cert-manager-install
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/edge/lab/letsencrypt/webhook
---
# letsencrypt-issuers: ClusterIssuers letsencrypt-staging-hetzner and
# letsencrypt-hetzner. They read the Hetzner token from Secret
# cert-manager/hetzner-dns (SOPS, added together with the domain).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: letsencrypt-issuers
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: infrastructure
spec:
  dependsOn:
    - name: cert-manager-webhook-hetzner
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/edge/lab/letsencrypt/issuers
  decryption:
    provider: sops
    secretRef:
      name: sops-age # pragma: allowlist secret
