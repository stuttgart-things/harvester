---
# The Pong sandbox's schmetterpause on a phone: https://schmetterpause-sandbox.${EDGE_PLAY_DOMAIN},
# the same Service as its internal route (flux tabletennis-sandbox), through
# edge-play-gateway and its *.<EDGE_PLAY_DOMAIN> wildcard, like schmetterpause.yaml
# for the office's. LAB ONLY, as that one.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: schmetterpause-play
  namespace: schmetterpause-sandbox
spec:
  parentRefs:
    - name: edge-play-gateway
      namespace: default
      sectionName: https
  hostnames:
    - schmetterpause-sandbox.${EDGE_PLAY_DOMAIN}
  rules:
    - backendRefs:
        - name: schmetterpause
          port: 80
