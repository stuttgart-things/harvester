---
# zaehlwerk's dev portal: https://zaehlwerk-portal.<EDGE_PLAY_DOMAIN>, the same
# Service as the internal route (apps/tabletennis, zaehlwerk-portal-on),
# through edge-play-gateway. Covered by its *.<EDGE_PLAY_DOMAIN> wildcard
# (certificate and Hetzner record), like schmetterpause.yaml. No login: this
# route is the access control, as for zaehlwerk.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zaehlwerk-portal-play
  namespace: zaehlwerk
spec:
  parentRefs:
    - name: edge-play-gateway
      namespace: default
      sectionName: https
  hostnames:
    - zaehlwerk-portal.${EDGE_PLAY_DOMAIN}
  rules:
    - backendRefs:
        - name: zaehlwerk-portal
          port: 80
