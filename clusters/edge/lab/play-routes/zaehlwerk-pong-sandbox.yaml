---
# The Pong sandbox's zaehlwerk-pong on a phone: https://zaehlwerk-pong-sandbox.${EDGE_PLAY_DOMAIN},
# the same Service as its internal route (flux tabletennis-sandbox), through
# edge-play-gateway and its *.<EDGE_PLAY_DOMAIN> wildcard, like zaehlwerk-pong.yaml
# for the office's. LAB ONLY, as that one.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zaehlwerk-pong-play
  namespace: zaehlwerk-sandbox
spec:
  parentRefs:
    - name: edge-play-gateway
      namespace: default
      sectionName: https
  hostnames:
    - zaehlwerk-pong-sandbox.${EDGE_PLAY_DOMAIN}
  rules:
    - backendRefs:
        - name: zaehlwerk-pong
          port: 80
