---
# The buttons sim on a phone: https://buttons.<EDGE_PLAY_DOMAIN>, the same
# Service as the internal route (apps/tabletennis, zaehlwerk-buttons-sim-on),
# through edge-play-gateway. Covered by its *.<EDGE_PLAY_DOMAIN> wildcard
# (certificate and Hetzner record), like schmetterpause.yaml. LAB ONLY: the
# page scores into the running match without a login, so a phone that opens
# this name can press points in a real match -- drop the route (or the sim)
# while one is played at the table.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zaehlwerk-buttons-sim-play
  namespace: zaehlwerk
spec:
  parentRefs:
    - name: edge-play-gateway
      namespace: default
      sectionName: https
  hostnames:
    - buttons.${EDGE_PLAY_DOMAIN}
  rules:
    - backendRefs:
        - name: zaehlwerk-buttons-sim
          port: 80
