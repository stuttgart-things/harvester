---
# The "public" Gateway for players, lab version -- flux
# infra/cilium/components/gateway-extra (flux #630) instead of the hand-written
# pool + Certificate + Gateway: its own VIP (EDGE_PLAY_LB_IP, Clusterbook
# edge-tt-test1-play with DNS), its own wildcard from the LabDA Vault issuer.
# Same names as before (edge-play-gateway, edge-play-pool, play-wildcard-tls),
# so the objects carry over.
#
# NOT the bundle component (cilium-gateway-extra in infra-platform): its
# issuer vault-pki-4sthings comes from this lab layer, which depends on
# edge-infra -- inside infra-platform the Certificate would wait for an issuer
# that only exists after it: deadlock (flux #630 README).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: play-gateway
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: infrastructure
spec:
  dependsOn:
    - name: cilium-lb
    - name: cert-manager-vault-issuer
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  # HANDOVER (harvester#364): the infra-platform bundle took this over
  # (cert-manager-letsencrypt-hetzner / cilium-gateway-extra); this file goes
  # in the next commit and must not take the objects with it.
  prune: false
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-repo
  path: ./infra/cilium/components/gateway-extra
  postBuild:
    substitute:
      CILIUM_GATEWAY_EXTRA_NAME: edge-play-gateway
      CILIUM_GATEWAY_EXTRA_NAMESPACE: default
      CILIUM_GATEWAY_EXTRA_POOL_NAME: edge-play-pool
      CILIUM_GATEWAY_EXTRA_IP: "${EDGE_PLAY_LB_IP}"
      CILIUM_GATEWAY_EXTRA_DOMAIN: ${EDGE_PLAY_DOMAIN}
      # Let's Encrypt (production) via DNS-01 at Hetzner DNS (./letsencrypt).
      # Staging (letsencrypt-staging-hetzner) for experiments: rate limits.
      CILIUM_GATEWAY_EXTRA_ISSUER: letsencrypt-hetzner
      CILIUM_GATEWAY_EXTRA_ISSUER_KIND: ClusterIssuer
      CILIUM_GATEWAY_EXTRA_TLS_SECRET: play-wildcard-tls # pragma: allowlist secret
