---
# LAB ONLY: the firmware's log sink (zaehlwerk-firmware tools/log-sink,
# docs/log-sink.md) with a sender in front of it, to test the sink as it runs
# on the box (../../../sthings-edge/log-sink) before a real board talks to it.
#
# There is no board in the lab, and piezo-a (../esp-mock) is zaehlwerk's piezo
# mock: it scores over HTTP and sends no diagnostic log. So the data comes
# from the sink's own generator, `log-sink mock` in the same image, run by a
# CronJob every 15 minutes: a made-up session with curves, rallies, wrong
# sides and tagged corrections, over UDP to the sink's Service -- the path a
# board's datagrams take, minus the LoadBalancer (the box has one on
# 192.168.8.23; the lab would need a LabDA address for it, and no device here
# needs one).
#
# The viewer (no login, writes labels) at https://log-sink.<EDGE_DOMAIN> on
# edge-gateway. Files on a local-path volume, deleted with the claim.
apiVersion: v1
kind: Namespace
metadata:
  name: log-sink
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: log-sink-data
  namespace: log-sink
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-sink
  namespace: log-sink
  labels:
    app.kubernetes.io/name: log-sink
spec:
  replicas: 1
  # One writer per volume: a second pod during a rollout would split a
  # session over two files.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: log-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-sink
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: log-sink
          image: ghcr.io/stuttgart-things/zaehlwerk-log-sink:sha-4c4f846e8e039f0c2bb12e6e048753ce2f267589
          args: ["-listen", ":9000", "-viewer", ":9001", "-dir", "/data"]
          ports:
            - name: diag
              containerPort: 9000
              protocol: UDP
            - name: viewer
              containerPort: 9001
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: viewer
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: viewer
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: log-sink-data
---
apiVersion: v1
kind: Service
metadata:
  name: log-sink
  namespace: log-sink
spec:
  selector:
    app.kubernetes.io/name: log-sink
  ports:
    - name: viewer
      port: 80
      targetPort: viewer
    - name: diag
      port: 9000
      targetPort: diag
      protocol: UDP
---
# The stand-in for a board: one made-up session every 15 minutes. -seed 0
# makes each run a fresh session (the default seed would write every run into
# the first run's file).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: log-sink-mock
  namespace: log-sink
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mock
              image: ghcr.io/stuttgart-things/zaehlwerk-log-sink:sha-4c4f846e8e039f0c2bb12e6e048753ce2f267589
              args: ["mock", "-to", "log-sink.log-sink.svc.cluster.local:9000",
                     "-rallies", "30", "-seed", "0", "-loss", "0.01"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: log-sink
  namespace: log-sink
spec:
  parentRefs:
    - name: ${EDGE_GATEWAY_NAME}
      namespace: default
      sectionName: https
  hostnames:
    - log-sink.${EDGE_DOMAIN}
  rules:
    - backendRefs:
        - name: log-sink
          port: 80
