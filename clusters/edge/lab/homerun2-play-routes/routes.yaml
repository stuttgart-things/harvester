# homerun2 on edge-play-gateway: the same Services as the internal routes
# (homerun2-sops, homerun2-light-catcher-tabletennis-sops), one rule at "/"
# like theirs, under the *.<EDGE_PLAY_DOMAIN> wildcard (certificate and Hetzner
# record) that already covers schmetterpause and zaehlwerk.
#
# LAB ONLY, and the same caveat as ../play-routes/zaehlwerk.yaml: the route is
# the access control. omni-pitcher and scout ask for their token; demo-pitcher,
# the led-catcher's stream switch, the light-catcher test page and the
# wled-mock do not -- anyone who reaches the name can send messages and drive
# the panel. The name is public, the VIP behind it (EDGE_PLAY_LB_IP) is not.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: config-viewer-play
  namespace: homerun2
spec:
  parentRefs:
    - name: edge-play-gateway
      namespace: default
      sectionName: https
  hostnames:
    - config-viewer.${EDGE_PLAY_DOMAIN}
  rules:
    - backendRefs:
        - name: homerun2-config-viewer
          port: 80
---
