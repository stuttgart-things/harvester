---
# What edge-lab (../apps.yaml) applies. ./play-routes is applied by
# play-routes.yaml (the routes live in the apps' namespaces).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # the LabDA zone to the resolver that knows it (k3s coredns-custom)
  - coredns-lab-zone.yaml
  - vault-issuer.yaml
  - play-routes.yaml
  # an emulated ESP32 (piezo mock + ACME device certificate from OpenBao),
  # and the table's buttons with a page to press them on
  - esp-mock.yaml
