---
# The emulated board "piezo-a":
#   1. init container lego: ACME HTTP-01 against OpenBao (role devices) for
#      piezo-a.<EDGE_DOMAIN>, EC P-256 -- what the ESP firmware does at boot.
#      Certificate + key land in /certs (emptyDir): the device identity, kept
#      for mutual TLS later. lego trusts only the edge root (the OpenBao
#      Gateway's certificate chains to it).
#   2. the piezo board mock (zaehlwerk-piezo): JOINS the match started on the
#      zaehlwerk page (players picked there from schmetterpause) and scores it
#      to the end, a rally every PIEZO_PACE, then waits for the next one --
#      what a real board does after power-up. zaehlwerk reports the result to
#      schmetterpause. Over HTTPS through the Gateway, trusting only the edge
#      root (SSL_CERT_FILE) -- like a device that knows nothing but that root.
#      PIEZO_JOIN=false would make it start its own matches without players
#      and replace any match started on the page (zaehlwerk has ONE running
#      match).
#
# A new certificate per pod start (90 days). A real device renews before
# expiry; the mock simply gets a fresh one when it restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: piezo-a
  namespace: esp-mock
  labels:
    app.kubernetes.io/name: piezo-a
spec:
  # cluster-vars EDGE_ESP_MOCK_REPLICAS: "0" while real boards play (README,
  # "Mock or real boards"). Default 1 if the key is missing.
  replicas: ${EDGE_ESP_MOCK_REPLICAS:=1}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: piezo-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: piezo-a
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: enrol
          image: goacme/lego:v4.35.2
          env:
            - name: LEGO_CA_CERTIFICATES
              value: /ca/root.crt
          args:
            - --server=https://openbao.${EDGE_DOMAIN}/v1/pki/acme/directory
            - --email=piezo-a@esp-mock.invalid
            - --accept-tos
            - --domains=piezo-a.${EDGE_DOMAIN}
            - --key-type=ec256
            - --path=/certs
            - --http
            - --http.port=:8080
            - run
          volumeMounts:
            - {name: certs, mountPath: /certs}
            - {name: ca, mountPath: /ca, readOnly: true}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
      containers:
        - name: piezo
          image: ghcr.io/stuttgart-things/zaehlwerk-piezo:v0.11.0
          env:
            - name: ZAEHLWERK_URL
              value: https://zaehlwerk.${EDGE_DOMAIN}
            - name: SSL_CERT_FILE
              value: /ca/root.crt
            - name: PIEZO_SOURCE
              value: piezo-a
            - name: PIEZO_JOIN
              value: "true"
            - name: PIEZO_MATCHES
              value: "0"
            - name: PIEZO_BEST_OF
              value: "3"
            - name: PIEZO_PACE
              value: 3s
            # The control endpoint the table mock (tabletennis
            # TABLETENNIS_ZAEHLWERK_BUTTONS_SIM) pauses and tunes this board
            # through, behind piezo-a-control below.
            - name: PIEZO_CONTROL_ADDR
              value: ":8081"
          ports:
            - name: control
              containerPort: 8081
          volumeMounts:
            - {name: certs, mountPath: /certs, readOnly: true}
            - {name: ca, mountPath: /ca, readOnly: true}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
      volumes:
        - name: certs
          emptyDir: {}
        - name: ca
          configMap:
            name: edge-root-ca
---
# For the table mock's page in the zaehlwerk namespace
# (TABLETENNIS_ZAEHLWERK_BUTTONS_PIEZO_URL in ../../cluster-apps.yaml).
# ClusterIP, no route: pausing the board is not something to publish.
apiVersion: v1
kind: Service
metadata:
  name: piezo-a-control
  namespace: esp-mock
spec:
  selector:
    app.kubernetes.io/name: piezo-a
  ports:
    - name: control
      port: 8081
      targetPort: control
