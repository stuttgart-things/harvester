---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - clusterissuers.yaml
  # SOPS: Secret cert-manager/hetzner-dns (key: token) -- the Hetzner Cloud API
  # token (Read & Write) of the project `edge-dns`, which holds ONLY the zone
  # sthings-edge.com (a Hetzner token is project-wide; checked: it lists just
  # that zone). Decrypted by this Kustomization (letsencrypt-issuers).
  - hetzner-dns.enc.yaml
