---
# hetzner/cert-manager-webhook-hetzner (README maturity: "experiment"), chart
# from charts.hetzner.cloud. Defaults fit: cert-manager in namespace
# cert-manager, service account cert-manager, groupName acme.hetzner.com.
# Uses the Hetzner Cloud API (api.hetzner.cloud), not the old DNS console API.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: hcloud
  namespace: cert-manager
spec:
  interval: 24h
  url: https://charts.hetzner.cloud
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-hetzner
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager-webhook-hetzner
      version: 0.9.0
      sourceRef:
        kind: HelmRepository
        name: hcloud
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
