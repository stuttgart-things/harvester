---
# Layer 1: the infrastructure -- ./infra (the flux infra bundle: Cilium LB and
# Gateway, cert-manager + self-signed CA, cnpg-operator, reloader).
#
# wait: true, so edge-infra is Ready only once infra-platform is, and that one
# (wait: true itself) only once every bundle child is. edge-apps depends on
# exactly that.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge-infra
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: infrastructure
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/edge/infra
  # ${EDGE_*} in the files of this layer: the environment's values
  # (../cluster-vars.yaml). Nothing in this layer's objects may carry any other
  # ${...} -- this substitution would empty it (README, Layout).
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
        optional: false
