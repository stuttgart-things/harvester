---
# AppProfile for the flux catalog's infra-platform component cert-manager-ca-from-secret.
# Derived from its ks-*.yaml (flux hack/check-app-profiles.py contract); kept
# here until it moves into the catalog (<bundle>/components/<app>/profile.yaml).
kind: AppProfile
metadata:
  name: cert-manager-ca-from-secret
spec:
  bundle: infra-platform
  component: ../components/cert-manager-ca-from-secret
  vars:
    CERT_MANAGER_CA_FROM_SECRET_ISSUER: {}
    CERT_MANAGER_CA_FROM_SECRET_NAME: {}
    CERT_MANAGER_CA_FROM_SECRET_SUSPEND: {}
