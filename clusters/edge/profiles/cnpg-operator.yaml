---
# AppProfile for the flux catalog's infra-platform component cnpg-operator.
# Derived from its ks-*.yaml (flux hack/check-app-profiles.py contract); kept
# here until it moves into the catalog (<bundle>/components/<app>/profile.yaml).
kind: AppProfile
metadata:
  name: cnpg-operator
spec:
  bundle: infra-platform
  component: ../components/cnpg-operator
  vars:
    CNPG_NAMESPACE: {}
    CNPG_OPERATOR_SUSPEND: {}
    CNPG_VERSION: {}
