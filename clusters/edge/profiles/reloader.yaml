---
# AppProfile for the flux catalog's infra-platform component reloader.
# Derived from its ks-*.yaml (flux hack/check-app-profiles.py contract); kept
# here until it moves into the catalog (<bundle>/components/<app>/profile.yaml).
kind: AppProfile
metadata:
  name: reloader
spec:
  bundle: infra-platform
  component: ../components/reloader
  vars:
    RELOADER_NAMESPACE: {}
    RELOADER_RELOAD_STRATEGY: {}
    RELOADER_SUSPEND: {}
    RELOADER_VERSION: {}
