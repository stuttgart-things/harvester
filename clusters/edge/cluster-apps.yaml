---
# ClusterApps for clusters/edge (harvester#364, phase 4b): the input from which
# blueprints `render-cluster-apps` generates this folder's source, layers and
# bundle Kustomizations. NOT a Kubernetes object -- Flux never reads it
# (.sourceignore). LIVE since harvester#364 phase 4b step 2: the files listed
# under Output are generated -- change this file and re-render, never edit them.
#
# Re-render (from the repo root) with blueprints/flux v3.10.0 or newer
# (blueprints#212-#216; bundle module claim-flux-kustomizations 0.5.0, kcl#338).
# Every AppProfile comes from the flux catalog in flux-repo (flux#634, #635):
#
#   dagger call -m github.com/stuttgart-things/blueprints/flux@v3.10.0 \
#     render-cluster-apps \
#     --cluster-apps clusters/edge/cluster-apps.yaml \
#     --master-age-key env:SOPS_AGE_KEY \
#     --escrow-recipients "$(age-keygen -y <<<"$SOPS_AGE_KEY")" \
#     --sops-ref-dir . \
#     --existing-secrets clusters/edge/cluster-secrets \
#     export --path /tmp/edge-gen
#   cp -r /tmp/edge-gen/flux/. clusters/edge/
#
# Output (relative to clusters/edge): kustomization.yaml, infra/ and
# apps/kustomization.yaml (the wiring), apps.yaml (OCIRepository flux-repo + the
# layers edge-infra, edge-apps, edge-lab), infra/infra-platform.yaml,
# apps/apps-platform.yaml (homerun2-sops, minio, openbao-sops,
# tabletennis-sops-backup), cluster-secrets/ (their secrets; sops-age.enc.yaml
# there is the escrowed cluster key, never applied: .sourceignore).
#
# --existing-secrets keeps what is already encrypted there. Every secret value
# below is a ref+sops into a hand-kept SOPS file in secrets/edge/ (repo root,
# never read by Flux), so nothing rotates --
# above all the OpenBao seal key, which must never change.
#
# --escrow-recipients: the edge decrypts with the repo's age key (sops-age =
# the master key), not with a cluster key of its own, so the generated secrets
# must be encrypted for it too. Drop it once the edge gets its own key.
#
# LAB vs LATTEPANDA. The values that differ stay in cluster-vars.yaml: every
# value below that is ${EDGE_*} is substituted by the layer that applies the
# generated file, exactly as with the hand-written ones. The only structural
# difference is the layer edge-lab (lab only): remove it for the LattePanda.
kind: ClusterApps
metadata:
  name: edge
spec:
  # The whole stuttgart-things/flux repo as one OCI artifact (sources.yaml).
  # Generated as the OCIRepository flux-repo; the bundles read it with
  # sourceRef.kind OCIRepository plus a kind patch for their children.
  # v1.120.0: the infra AppProfiles (flux#634), the SOPS alternatives
  # homerun2-sops, tabletennis-sops-backup, openbao-sops (flux#635) and
  # homerun2-light-catcher-tabletennis-sops (flux#639); v1.121.0/v1.122.0:
  # the trust-manager AppProfile (flux#641) and the scoreboard + handover
  # switch of tabletennis-sops(-backup) (flux#642); v1.123.0: OpenBao
  # self-init with a terraform and a break-glass admin user (flux#640);
  # v1.124.0: the schmetterpause admin switch in tabletennis-sops* (flux#643);
  # v1.125.0: cert-manager-letsencrypt-hetzner + cilium-gateway-extra (flux#645);
  # v1.128.2: the table mock TABLETENNIS_ZAEHLWERK_BUTTONS_SIM and the
  # piezo-sim/buttons-sim switches on the sops bundles (flux#666), plus
  # OpenBao requests/limits (flux#657) and homerun2 catcher bumps.
  source:
    kind: OCIRepository
    name: flux-repo
    url: oci://ghcr.io/stuttgart-things/flux/repo
    tag: v1.128.2
    interval: 1h
  path: ./clusters/edge
  # The secrets the generator makes go to ./cluster-secrets and are applied
  # by flux-system (the generated kustomization.yaml lists cluster-secrets/secrets).
  secrets:
    mode: inline
  # The wiring is generated too (blueprints v3.10.0, #215): kustomization.yaml
  # (config.yaml + secrets.yaml from the bootstrap, the extras below, apps.yaml,
  # cluster-secrets/secrets) and one per layer dir with a bundle or extras.
  # lab/ keeps its hand-written kustomization.yaml (no bundle, no extras).
  wiring:
    generate: true
    # hand-written: the environment's values
    extraResources: [cluster-vars.yaml]
  layers:
    edge-infra:
      dir: infra
      # hand-written: Kustomization edge-ca (the SOPS intermediate, ./ca)
      extraResources: [ca.yaml]
      labels:
        app.kubernetes.io/managed-by: flux
        kustomization.stuttgart-things.com/type: infrastructure
      timeout: 15m
      substituteFrom:
        - kind: ConfigMap
          name: cluster-vars
          optional: false
    edge-apps:
      dir: apps
      labels:
        app.kubernetes.io/managed-by: flux
        kustomization.stuttgart-things.com/type: apps
      dependsOn: [edge-infra]
      wait: false
      # ./apps holds no SOPS file (the values are in secrets/edge/ and reach
      # the cluster via cluster-secrets); kept so a hand-added *.enc.yaml works.
      decryptionSecret: sops-age # pragma: allowlist secret
      substituteFrom:
        - kind: ConfigMap
          name: cluster-vars
          optional: false
    # LAB ONLY: Vault issuer + the players' Gateway (hand-written, ./lab)
    edge-lab:
      dir: lab
      labels:
        app.kubernetes.io/managed-by: flux
        kustomization.stuttgart-things.com/type: infrastructure
      dependsOn: [edge-infra]
      timeout: 10m
      substituteFrom:
        - kind: ConfigMap
          name: cluster-vars
          optional: false
  bundles:
    infra-platform:
      layer: edge-infra
      # as infra/infra-platform.yaml (blueprints v3.8.0; default 15m)
      timeout: 10m
    apps-platform:
      layer: edge-apps
  # Every bundle gets these.
  vars:
    INFRA_DOMAIN: ${EDGE_DOMAIN}
    INFRA_GATEWAY_NAME: ${EDGE_GATEWAY_NAME}
    INFRA_GATEWAY_NAMESPACE: default
    INFRA_TLS_SECRET: wildcard-tls # pragma: allowlist secret
  apps:
    # ---- infra-platform ---------------------------------------------------
    # Cilium itself is the CNI from k3s/ (Ansible); these are its LB pool and
    # the Gateway. ONE address, the Gateway's VIP.
    cilium-lb:
      vars:
        CILIUM_LB_IP_START: ${EDGE_LB_IP}
        CILIUM_LB_IP_STOP: ${EDGE_LB_IP}
    cilium-gateway: {}
    cert-manager-install: {}
    # The wildcard comes from the persistent edge CA (ClusterIssuer edge-ca),
    # not from the self-signed cluster-ca, which is new on every install.
    cert-manager-selfsigned:
      vars:
        CERT_MANAGER_SELFSIGNED_ISSUER: edge-ca
    # ClusterIssuer edge-ca from the SOPS Secret in infra/ca (hand-written: the
    # intermediate is a manual offline artifact).
    cert-manager-ca-from-secret:
      vars:
        CERT_MANAGER_CA_FROM_SECRET_ISSUER: edge-ca # pragma: allowlist secret
        CERT_MANAGER_CA_FROM_SECRET_NAME: edge-ca # pragma: allowlist secret
    # One CA distribution for the cluster: trust-manager's Bundle
    # cluster-trust-bundle (ConfigMap in every namespace, key trust-bundle.pem)
    # = the default public CAs + the self-signed cluster CA + the persistent
    # edge root. Its Vault source slot points at edge-ca (ca.crt = the edge
    # root) -- there is no Vault on the edge. zaehlwerk reads exactly this
    # ConfigMap, so it can call schmetterpause over the Gateway (HTTPS).
    trust-manager:
      vars:
        TRUST_BUNDLE_VAULT_CA_SECRET: edge-ca # pragma: allowlist secret
    # The public players' side (since 2026-10-05, before: hand-written in
    # ./lab): Let's Encrypt via DNS-01 at Hetzner DNS -- webhook, ClusterIssuers
    # letsencrypt-staging-hetzner / letsencrypt-hetzner, the token Secret
    # cert-manager/hetzner-dns. Token of the Hetzner project edge-dns (only the
    # zone sthings-edge.com).
    cert-manager-letsencrypt-hetzner:
      secrets:
        cert-manager-letsencrypt-hetzner-secrets:
          HETZNER_DNS_TOKEN: ref+sops://secrets/edge/app-values.enc.yaml#/stringData/HETZNER_DNS_TOKEN # pragma: allowlist secret
    # ... and its own Gateway on its own VIP: *.EDGE_PLAY_DOMAIN with the Let's
    # Encrypt wildcard. Waits for the issuer (ISSUER_KUSTOMIZATION).
    cilium-gateway-extra:
      vars:
        CILIUM_GATEWAY_EXTRA_NAME: edge-play-gateway
        CILIUM_GATEWAY_EXTRA_NAMESPACE: default
        CILIUM_GATEWAY_EXTRA_POOL_NAME: edge-play-pool
        CILIUM_GATEWAY_EXTRA_IP: ${EDGE_PLAY_LB_IP}
        CILIUM_GATEWAY_EXTRA_DOMAIN: ${EDGE_PLAY_DOMAIN}
        CILIUM_GATEWAY_EXTRA_ISSUER: letsencrypt-hetzner
        CILIUM_GATEWAY_EXTRA_ISSUER_KIND: ClusterIssuer
        CILIUM_GATEWAY_EXTRA_TLS_SECRET: play-wildcard-tls # pragma: allowlist secret
        CILIUM_GATEWAY_EXTRA_ISSUER_KUSTOMIZATION: cert-manager-letsencrypt-hetzner
    cnpg-operator: {}
    cnpg-barman-cloud: {}
    reloader: {}
    # ---- apps-platform (profile: flux catalog) ---------------------------
    # The S3 target for schmetterpause's backups. Chart 16.0.10 (17 needs an
    # image that cannot be pulled).
    minio:
      vars:
        MINIO_STORAGE_CLASS: local-path
        MINIO_STORAGE_SIZE: 5Gi
        MINIO_VERSION: 16.0.10
      # The admin credentials Terraform (../terraform/minio) already uses:
      # taken from secrets/edge/app-values, not generated, so nothing rotates.
      secrets:
        minio-secrets:
          MINIO_ADMIN_USER: ref+sops://secrets/edge/app-values.enc.yaml#/stringData/MINIO_ADMIN_USER
          MINIO_ADMIN_PASSWORD: ref+sops://secrets/edge/app-values.enc.yaml#/stringData/MINIO_ADMIN_PASSWORD # pragma: allowlist secret
    # homerun2 without ESO: secrets from SOPS, no notification catcher
    # (homerun2-sops). Its values are the ones secrets/edge/app-values has always
    # had, so nothing rotates.
    homerun2-sops:
      vars:
        HOMERUN2_NAMESPACE: homerun2
        HOMERUN2_REDIS_STORAGE_CLASS: local-path
        HOMERUN2_REDIS_STORAGE_SIZE: 1Gi
        HOMERUN2_LED_CATCHER_UI_STREAM_PRESETS: messages,tabletennis
      secrets:
        homerun2-sops-secrets:
          HOMERUN2_REDIS_PASSWORD_B64: ref+sops://secrets/edge/app-values.enc.yaml#/stringData/HOMERUN2_REDIS_PASSWORD_B64 # pragma: allowlist secret
          TEAMS_WEBHOOK_URL: ref+sops://secrets/edge/app-values.enc.yaml#/stringData/TEAMS_WEBHOOK_URL
          HOMERUN2_OMNI_PITCHER_AUTH_TOKEN: ref+sops://secrets/edge/app-values.enc.yaml#/stringData/HOMERUN2_OMNI_PITCHER_AUTH_TOKEN # pragma: allowlist secret
          HOMERUN2_SCOUT_AUTH_TOKEN: ref+sops://secrets/edge/app-values.enc.yaml#/stringData/HOMERUN2_SCOUT_AUTH_TOKEN # pragma: allowlist secret
    # schmetterpause + zaehlwerk (panel: homerun2), CNPG backups into MinIO
    # with the schmetterpause-cnpg user (../terraform/minio).
    tabletennis-sops-backup:
      vars:
        TABLETENNIS_ZAEHLWERK_PANEL: homerun2
        TABLETENNIS_SCHMETTERPAUSE_DB_STORAGE_SIZE: 1Gi
        TABLETENNIS_SCHMETTERPAUSE_BACKUP_BUCKET: schmetterpause-cnpg
        TABLETENNIS_SCHMETTERPAUSE_BACKUP_S3_ENDPOINT: http://minio-deployment.minio.svc.cluster.local:9000
        TABLETENNIS_SCHMETTERPAUSE_BACKUP_SERVER_NAME: schmetterpause-db-edge
        TABLETENNIS_SCHMETTERPAUSE_BACKUP_RETENTION: 7d
        # scoreboard + handover (flux#642): players and scorers from
        # schmetterpause on the zaehlwerk page, won matches reported back.
        # zaehlwerk calls https://schmetterpause.<EDGE_DOMAIN> (the default),
        # trusting the edge root through trust-manager's bundle.
        TABLETENNIS_SCOREBOARD_HANDOVER: sops
        # The office's admin who never plays (schmetterpause
        # docs/admin-and-observers.md): `timoboll` joins on the page with its
        # own PIN, gets the admin flag here at every start, then marks itself
        # as observer under /admin -- counts at zaehlwerk, never in the ranking.
        # 'on' QUOTED: a bare on is YAML 1.1 true.
        TABLETENNIS_SCHMETTERPAUSE_ADMIN: 'on'
        TABLETENNIS_SCHMETTERPAUSE_BOOTSTRAP_ADMIN: timoboll
        # LAB: zaehlwerk's table mock (flux#666) at https://buttons.<EDGE_DOMAIN>
        # -- emulated buttons, and a page that pauses and tunes the emulated
        # board. The board is piezo-a in ./lab/esp-mock (it enrols through
        # ACME, which the flux piezo-sim does not), so the page points at its
        # control Service and the piezo-sim stays off. REMOVE ON THE
        # LATTEPANDA with the edge-lab layer: the page takes points back.
        TABLETENNIS_ZAEHLWERK_BUTTONS_SIM: 'on'
        TABLETENNIS_ZAEHLWERK_BUTTONS_HOSTNAME: buttons
        TABLETENNIS_ZAEHLWERK_BUTTONS_PIEZO_URL: http://piezo-a-control.esp-mock.svc.cluster.local:8081
      secrets:
        tabletennis-sops-secrets:
          SCHMETTERPAUSE_DB_PASSWORD: ref+sops://secrets/edge/app-values.enc.yaml#/stringData/SCHMETTERPAUSE_DB_PASSWORD # pragma: allowlist secret
          SCHMETTERPAUSE_SESSION_KEY: ref+sops://secrets/edge/app-values.enc.yaml#/stringData/SCHMETTERPAUSE_SESSION_KEY # pragma: allowlist secret
          ZAEHLWERK_OMNI_PITCHER_TOKEN: ref+sops://secrets/edge/app-values.enc.yaml#/stringData/ZAEHLWERK_OMNI_PITCHER_TOKEN # pragma: allowlist secret
          ZAEHLWERK_REDIS_PASSWORD: ref+sops://secrets/edge/app-values.enc.yaml#/stringData/ZAEHLWERK_REDIS_PASSWORD # pragma: allowlist secret
          SCHMETTERPAUSE_BACKUP_ACCESS_KEY_ID: ref+sops://secrets/edge/app-values.enc.yaml#/stringData/SCHMETTERPAUSE_BACKUP_ACCESS_KEY_ID # pragma: allowlist secret
          SCHMETTERPAUSE_BACKUP_SECRET_ACCESS_KEY: ref+sops://secrets/edge/app-values.enc.yaml#/stringData/SCHMETTERPAUSE_BACKUP_SECRET_ACCESS_KEY # pragma: allowlist secret
          # one token, read by both sides (schmetterpause /api, zaehlwerk)
          SCHMETTERPAUSE_SCOREBOARD_TOKEN: ref+sops://secrets/edge/app-values.enc.yaml#/stringData/SCHMETTERPAUSE_SCOREBOARD_TOKEN # pragma: allowlist secret
    # The light at the table: a second light-catcher on zaehlwerk's
    # tabletennis stream, in its own namespace (homerun2-tabletennis). Point
    # for side a: blue, side b: red (1 s); set won: rainbow; match won:
    # fireworks. Sends to the wled-mock that homerun2-sops brings; on the box
    # set HOMERUN2_LIGHT_CATCHER_TABLETENNIS_WLED_ENDPOINT to the real strip.
    # Same redis password as homerun2-sops (same ref).
    homerun2-light-catcher-tabletennis-sops:
      secrets:
        homerun2-light-catcher-tabletennis-sops-secrets:
          HOMERUN2_REDIS_PASSWORD_B64: ref+sops://secrets/edge/app-values.enc.yaml#/stringData/HOMERUN2_REDIS_PASSWORD_B64 # pragma: allowlist secret
    # OpenBao for the devices' PKI/ACME: static seal, one node. THE SEAL KEY
    # MUST NEVER CHANGE (the raft data is sealed with it): taken from the
    # SOPS file, never generated.
    openbao-sops:
      vars:
        OPENBAO_TOPOLOGY: single-node
        OPENBAO_STORAGE_CLASS: local-path
        OPENBAO_STORAGE_SIZE: 2Gi
        OPENBAO_SEAL_KEY_ID: edge-20261004
        # Self-init (flux#640): on EMPTY storage OpenBao initialises itself --
        # userpass with `terraform` (PKI only, used by terraform/openbao and
        # sign-intermediate.sh) and `admin` (break-glass, by hand only). No
        # root token, no recovery keys. On an already initialised instance
        # (edge-tt-test1, initialised by hand 2026-10-04) this does nothing; the
        # same users were created there once by hand.
        OPENBAO_INIT: self-init-userpass
      secrets:
        openbao-sops-secrets:
          OPENBAO_SEAL_STATIC_KEY: ref+sops://secrets/edge/openbao-seal.enc.yaml#/stringData/key # pragma: allowlist secret
          OPENBAO_TERRAFORM_PASSWORD: ref+sops://secrets/edge/app-values.enc.yaml#/stringData/OPENBAO_TERRAFORM_PASSWORD # pragma: allowlist secret
          OPENBAO_ADMIN_PASSWORD: ref+sops://secrets/edge/app-values.enc.yaml#/stringData/OPENBAO_ADMIN_PASSWORD # pragma: allowlist secret
