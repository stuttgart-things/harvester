---
# ClusterApps for clusters/edge (harvester#364, phase 4b): the input from which
# blueprints `render-cluster-apps` generates this folder's source, layers and
# bundle Kustomizations. NOT a Kubernetes object -- Flux never reads it
# (.sourceignore). LIVE since harvester#364 phase 4b step 2: the files listed
# under Output are generated -- change this file and re-render, never edit them.
#
# Re-render (from the repo root) with blueprints/flux v3.8.0 or newer
# (blueprints#212, #213; bundle module claim-flux-kustomizations 0.5.0, kcl#338).
# Every AppProfile comes from the flux catalog in flux-repo (flux#634, #635):
#
#   dagger call -m github.com/stuttgart-things/blueprints/flux@v3.8.0 \
#     render-cluster-apps \
#     --cluster-apps clusters/edge/cluster-apps.yaml \
#     --master-age-key env:SOPS_AGE_KEY \
#     --escrow-recipients "$(age-keygen -y <<<"$SOPS_AGE_KEY")" \
#     --sops-ref-dir . \
#     --existing-secrets clusters/edge/cluster-secrets \
#     export --path /tmp/edge-gen
#   cp -r /tmp/edge-gen/flux/. clusters/edge/
#
# Output (relative to clusters/edge): apps.yaml (OCIRepository flux-repo + the
# layers edge-infra, edge-apps, edge-lab), infra/infra-platform.yaml,
# apps/apps-platform.yaml (homerun2-sops, minio, openbao-sops,
# tabletennis-sops-backup), cluster-secrets/ (their secrets; sops-age.enc.yaml
# there is the escrowed cluster key, never applied: .sourceignore).
#
# --existing-secrets keeps what is already encrypted there. Every secret value
# below is a ref+sops into a hand-kept SOPS file anyway, so nothing rotates --
# above all the OpenBao seal key, which must never change.
#
# --escrow-recipients: the edge decrypts with the repo's age key (sops-age =
# the master key), not with a cluster key of its own, so the generated secrets
# must be encrypted for it too. Drop it once the edge gets its own key.
#
# LAB vs LATTEPANDA. The values that differ stay in cluster-vars.yaml: every
# value below that is ${EDGE_*} is substituted by the layer that applies the
# generated file, exactly as with the hand-written ones. The only structural
# difference is the layer edge-lab (lab only): remove it for the LattePanda.
kind: ClusterApps
metadata:
  name: edge
spec:
  # The whole stuttgart-things/flux repo as one OCI artifact (sources.yaml).
  # Generated as the OCIRepository flux-repo; the bundles read it with
  # sourceRef.kind OCIRepository plus a kind patch for their children.
  # v1.119.0: the infra AppProfiles (flux#634) and the SOPS alternatives
  # homerun2-sops, tabletennis-sops-backup, openbao-sops (flux#635).
  source:
    kind: OCIRepository
    name: flux-repo
    url: oci://ghcr.io/stuttgart-things/flux/repo
    tag: v1.119.0
    interval: 1h
  path: ./clusters/edge
  # The secrets the generator makes go to ./cluster-secrets and are applied
  # by flux-system (kustomization.yaml would list cluster-secrets/secrets).
  secrets:
    mode: inline
  layers:
    edge-infra:
      dir: infra
      labels:
        app.kubernetes.io/managed-by: flux
        kustomization.stuttgart-things.com/type: infrastructure
      timeout: 15m
      substituteFrom:
        - kind: ConfigMap
          name: cluster-vars
          optional: false
    edge-apps:
      dir: apps
      labels:
        app.kubernetes.io/managed-by: flux
        kustomization.stuttgart-things.com/type: apps
      dependsOn: [edge-infra]
      wait: false
      # ./apps carries edge-secrets-subst.enc.yaml (README, Layout)
      decryptionSecret: sops-age # pragma: allowlist secret
      substituteFrom:
        - kind: ConfigMap
          name: cluster-vars
          optional: false
    # LAB ONLY: Vault issuer + the players' Gateway (hand-written, ./lab)
    edge-lab:
      dir: lab
      labels:
        app.kubernetes.io/managed-by: flux
        kustomization.stuttgart-things.com/type: infrastructure
      dependsOn: [edge-infra]
      timeout: 10m
      substituteFrom:
        - kind: ConfigMap
          name: cluster-vars
          optional: false
  bundles:
    infra-platform:
      layer: edge-infra
      # as infra/infra-platform.yaml (blueprints v3.8.0; default 15m)
      timeout: 10m
    apps-platform:
      layer: edge-apps
  # Every bundle gets these.
  vars:
    INFRA_DOMAIN: ${EDGE_DOMAIN}
    INFRA_GATEWAY_NAME: ${EDGE_GATEWAY_NAME}
    INFRA_GATEWAY_NAMESPACE: default
    INFRA_TLS_SECRET: wildcard-tls # pragma: allowlist secret
  apps:
    # ---- infra-platform ---------------------------------------------------
    # Cilium itself is the CNI from k3s/ (Ansible); these are its LB pool and
    # the Gateway. ONE address, the Gateway's VIP.
    cilium-lb:
      vars:
        CILIUM_LB_IP_START: ${EDGE_LB_IP}
        CILIUM_LB_IP_STOP: ${EDGE_LB_IP}
    cilium-gateway: {}
    cert-manager-install: {}
    # The wildcard comes from the persistent edge CA (ClusterIssuer edge-ca),
    # not from the self-signed cluster-ca, which is new on every install.
    cert-manager-selfsigned:
      vars:
        CERT_MANAGER_SELFSIGNED_ISSUER: edge-ca
    # ClusterIssuer edge-ca from the SOPS Secret in infra/ca (hand-written: the
    # intermediate is a manual offline artifact).
    cert-manager-ca-from-secret:
      vars:
        CERT_MANAGER_CA_FROM_SECRET_ISSUER: edge-ca # pragma: allowlist secret
        CERT_MANAGER_CA_FROM_SECRET_NAME: edge-ca # pragma: allowlist secret
    cnpg-operator: {}
    cnpg-barman-cloud: {}
    reloader: {}
    # ---- apps-platform (profile: flux catalog) ---------------------------
    # The S3 target for schmetterpause's backups. Chart 16.0.10 (17 needs an
    # image that cannot be pulled).
    minio:
      vars:
        MINIO_STORAGE_CLASS: local-path
        MINIO_STORAGE_SIZE: 5Gi
        MINIO_VERSION: 16.0.10
      # The admin credentials Terraform (../terraform/minio) already uses:
      # taken from edge-secrets-subst, not generated, so nothing rotates.
      secrets:
        minio-secrets:
          MINIO_ADMIN_USER: ref+sops://clusters/edge/apps/edge-secrets-subst.enc.yaml#/stringData/MINIO_ADMIN_USER
          MINIO_ADMIN_PASSWORD: ref+sops://clusters/edge/apps/edge-secrets-subst.enc.yaml#/stringData/MINIO_ADMIN_PASSWORD # pragma: allowlist secret
    # homerun2 without ESO: secrets from SOPS, no notification catcher
    # (homerun2-sops). Its values are the ones edge-secrets-subst has always
    # had, so nothing rotates.
    homerun2-sops:
      vars:
        HOMERUN2_NAMESPACE: homerun2
        HOMERUN2_REDIS_STORAGE_CLASS: local-path
        HOMERUN2_REDIS_STORAGE_SIZE: 1Gi
        HOMERUN2_LED_CATCHER_UI_STREAM_PRESETS: messages,tabletennis
      secrets:
        homerun2-sops-secrets:
          HOMERUN2_REDIS_PASSWORD_B64: ref+sops://clusters/edge/apps/edge-secrets-subst.enc.yaml#/stringData/HOMERUN2_REDIS_PASSWORD_B64 # pragma: allowlist secret
          TEAMS_WEBHOOK_URL: ref+sops://clusters/edge/apps/edge-secrets-subst.enc.yaml#/stringData/TEAMS_WEBHOOK_URL
          HOMERUN2_OMNI_PITCHER_AUTH_TOKEN: ref+sops://clusters/edge/apps/edge-secrets-subst.enc.yaml#/stringData/HOMERUN2_OMNI_PITCHER_AUTH_TOKEN # pragma: allowlist secret
          HOMERUN2_SCOUT_AUTH_TOKEN: ref+sops://clusters/edge/apps/edge-secrets-subst.enc.yaml#/stringData/HOMERUN2_SCOUT_AUTH_TOKEN # pragma: allowlist secret
    # schmetterpause + zaehlwerk (panel: homerun2), CNPG backups into MinIO
    # with the schmetterpause-cnpg user (../terraform/minio).
    tabletennis-sops-backup:
      vars:
        TABLETENNIS_ZAEHLWERK_PANEL: homerun2
        TABLETENNIS_SCHMETTERPAUSE_DB_STORAGE_SIZE: 1Gi
        TABLETENNIS_SCHMETTERPAUSE_BACKUP_BUCKET: schmetterpause-cnpg
        TABLETENNIS_SCHMETTERPAUSE_BACKUP_S3_ENDPOINT: http://minio-deployment.minio.svc.cluster.local:9000
        TABLETENNIS_SCHMETTERPAUSE_BACKUP_SERVER_NAME: schmetterpause-db-edge
        TABLETENNIS_SCHMETTERPAUSE_BACKUP_RETENTION: 7d
      secrets:
        tabletennis-sops-secrets:
          SCHMETTERPAUSE_DB_PASSWORD: ref+sops://clusters/edge/apps/edge-secrets-subst.enc.yaml#/stringData/SCHMETTERPAUSE_DB_PASSWORD # pragma: allowlist secret
          SCHMETTERPAUSE_SESSION_KEY: ref+sops://clusters/edge/apps/edge-secrets-subst.enc.yaml#/stringData/SCHMETTERPAUSE_SESSION_KEY # pragma: allowlist secret
          ZAEHLWERK_OMNI_PITCHER_TOKEN: ref+sops://clusters/edge/apps/edge-secrets-subst.enc.yaml#/stringData/ZAEHLWERK_OMNI_PITCHER_TOKEN # pragma: allowlist secret
          ZAEHLWERK_REDIS_PASSWORD: ref+sops://clusters/edge/apps/edge-secrets-subst.enc.yaml#/stringData/ZAEHLWERK_REDIS_PASSWORD # pragma: allowlist secret
          SCHMETTERPAUSE_BACKUP_ACCESS_KEY_ID: ref+sops://clusters/edge/apps/edge-secrets-subst.enc.yaml#/stringData/SCHMETTERPAUSE_BACKUP_ACCESS_KEY_ID # pragma: allowlist secret
          SCHMETTERPAUSE_BACKUP_SECRET_ACCESS_KEY: ref+sops://clusters/edge/apps/edge-secrets-subst.enc.yaml#/stringData/SCHMETTERPAUSE_BACKUP_SECRET_ACCESS_KEY # pragma: allowlist secret
    # OpenBao for the devices' PKI/ACME: static seal, one node. THE SEAL KEY
    # MUST NEVER CHANGE (the raft data is sealed with it): taken from the
    # SOPS file, never generated.
    openbao-sops:
      vars:
        OPENBAO_TOPOLOGY: single-node
        OPENBAO_STORAGE_CLASS: local-path
        OPENBAO_STORAGE_SIZE: 2Gi
        OPENBAO_SEAL_KEY_ID: edge-20261004
      secrets:
        openbao-sops-secrets:
          OPENBAO_SEAL_STATIC_KEY: ref+sops://clusters/edge/apps/openbao-prereqs/openbao-static-seal.enc.yaml#/stringData/key # pragma: allowlist secret
