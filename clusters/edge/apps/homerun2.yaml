---
# homerun2 on the edge box -- the same `sops` profiles as
# ../../homerun2-dev/homerun2.yaml, read from the flux-repo OCI artifact.
#
# These are the full profiles, deliberately. They are the combination that
# already runs on homerun2-dev. Trimming (no scout / config-viewer /
# demo-pitcher, redis without replica + sentinel) is a follow-up, once the lab
# VM shows what 8Gi actually leaves (README, "Footprint").
#
# Differences from homerun2-dev:
#   - storage is k3s local-path, at 1Gi rather than 8Gi. There are two PVCs
#     (master + replica), and the target has a 64GB eMMC.
#   - the notification-catcher stays in dry run (its default). There is no
#     Teams webhook on the edge.
#   - no redis-lb.yaml. Nothing outside the node reads this Redis.
#
# tabletennis needs homerun2: zaehlwerk publishes to omni-pitcher and reads its
# Redis (tabletennis.yaml).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  force: false
  prune: true
  suspend: false
  wait: true
  # No dependsOn on infra: edge-apps (../apps.yaml) only runs once edge-infra
  # is Ready, i.e. the whole infra bundle is.
  sourceRef:
    kind: OCIRepository
    name: flux-repo
  path: ./apps/homerun2/profiles/sops
  postBuild:
    substituteFrom:
      - kind: Secret
        name: edge-secrets-subst
        optional: false
    substitute:
      HOMERUN2_NAMESPACE: homerun2
      HOMERUN2_REDIS_STORAGE_CLASS: local-path
      HOMERUN2_REDIS_STORAGE_SIZE: 1Gi
      HOMERUN2_LED_CATCHER_UI_STREAM_PRESETS: messages,tabletennis
---
# Routes only after the Services exist. A route applied first leaves Cilium
# answering 500 for good (flux apps/homerun2/README).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-routes
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  suspend: false
  wait: true
  dependsOn:
    - name: homerun2
    - name: cilium-gateway
  sourceRef:
    kind: OCIRepository
    name: flux-repo
  path: ./apps/homerun2/profiles/sops-routes
  postBuild:
    substitute:
      HOMERUN2_NAMESPACE: homerun2
      DOMAIN: edge-tt-test1.4sthings.tiab.ssc.sva.de
      GATEWAY_NAME: edge-gateway
      GATEWAY_NAMESPACE: default
