---
# What edge-apps (../apps.yaml) applies. ./openbao-prereqs is NOT listed: it
# is applied by its own Kustomization (openbao.yaml), see there.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # SOPS: the substitutions homerun2 and tabletennis read
  - edge-secrets-subst.enc.yaml
  - homerun2.yaml
  - minio.yaml
  # OpenBao (PKI/ACME): openbao-prereqs, openbao, openbao-httproute
  - openbao.yaml
  - tabletennis.yaml
