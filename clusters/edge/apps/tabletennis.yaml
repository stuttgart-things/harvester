---
# tabletennis (schmetterpause + zaehlwerk) on the edge box -- flux
# apps/tabletennis/profiles/sops, read from the flux-repo OCI artifact.
#
# Differences from ../../homerun2-dev/tabletennis.yaml:
#   - no schmetterpause-db-backup-sops. There is no S3 on the edge, and a
#     same-node backup would not survive losing the node. The data is
#     disposable here.
#   - no scoreboard / handover. The handover reaches schmetterpause over the
#     HTTPRoute, so zaehlwerk would need the self-signed CA in a trust bundle.
#     Add both together later if wanted (flux apps/tabletennis/README).
#   - zaehlwerk-panel-homerun2 instead of a hand-patched OMNI_PITCHER_URL. It
#     talks to omni-pitcher and led-catcher over in-cluster http, with no CA
#     involved.
#
# zaehlwerk has no authentication of its own. The route is the only access
# control, so the Gateway must stay on the edge network.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tabletennis
  namespace: flux-system
  annotations:
    # HANDOVER to the generated apps-platform bundle (harvester#364 phase 4b):
    # edge-apps must not delete this object when it leaves this file -- the
    # bundle takes it over under the same name. Removed by that takeover.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
  # cnpg-operator is infra (edge-infra, Ready before edge-apps starts); kept
  # by name anyway because the Cluster CRD must exist at dry-run time.
  dependsOn:
    - name: cnpg-operator
    # the ObjectStore CRD (barmancloud.cnpg.io) must exist at dry-run time
    - name: cnpg-barman-cloud
    - name: minio
    - name: homerun2
  sourceRef:
    kind: OCIRepository
    name: flux-repo
  path: ./apps/tabletennis/profiles/sops
  components:
    - ../../components/zaehlwerk-panel-homerun2
    # WAL archiving + daily base backup into MinIO on the node (./minio.yaml).
    # -subst renders the credentials Secret in this build from
    # SCHMETTERPAUSE_BACKUP_ACCESS_KEY_ID / _SECRET_ACCESS_KEY (edge-secrets-subst,
    # the schmetterpause-cnpg user from ../terraform/minio) -- flux #628; the
    # separate schmetterpause-backup Kustomization is gone. The endpoint is
    # in-cluster HTTP, so the CA default (a placeholder) is never read.
    - ../../components/schmetterpause-db-backup-subst
  postBuild:
    substituteFrom:
      - kind: Secret
        name: edge-secrets-subst
        optional: false
    substitute:
      DOMAIN: ${EDGE_DOMAIN}
      GATEWAY_NAME: ${EDGE_GATEWAY_NAME}
      GATEWAY_NAMESPACE: default
      SCHMETTERPAUSE_DB_STORAGE_SIZE: 1Gi
      SCHMETTERPAUSE_BACKUP_BUCKET: schmetterpause-cnpg
      SCHMETTERPAUSE_BACKUP_S3_ENDPOINT: http://minio-deployment.minio.svc.cluster.local:9000
      SCHMETTERPAUSE_BACKUP_SERVER_NAME: schmetterpause-db-edge
      # same eMMC as the database -- keep the bucket small
      SCHMETTERPAUSE_BACKUP_RETENTION: 7d
