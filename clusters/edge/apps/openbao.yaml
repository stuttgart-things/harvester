---
# OpenBao on the node: the PKI for ACME device enrollment (ESP32) and other
# services that need certificates from the edge CA (harvester#364, phase 3).
# Configured by Terraform (../terraform/openbao), not by Flux.
#
# Three Kustomizations, in this order:
#   openbao-prereqs    namespace + static seal key (SOPS)
#   openbao            flux apps/openbao + components/seal-static (raft on
#                      local-path, static seal: unseals itself on every restart)
#                      + components/single-node
#   openbao-httproute  flux apps/openbao/components/httproute, only after
#                      openbao is Ready (a route before its Service = 500 for
#                      good under Cilium)
#
# THE FIRST ROLLOUT STOPS AT "openbao not Ready", by design: the pod is not
# ready until `bao operator init` has run once (README, OpenBao). The static
# seal unseals on restart; it does not initialise.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-prereqs
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 2m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/edge/apps/openbao-prereqs
  decryption:
    provider: sops
    secretRef:
      name: sops-age # pragma: allowlist secret
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  dependsOn:
    - name: openbao-prereqs
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-repo
  path: ./apps/openbao
  components:
    - ./components/seal-static
    # flux #631: install/upgrade disableWait (the pod is not ready before
    # `bao operator init`), injector off (nothing here uses sidecar injection;
    # its hard self anti-affinity blocks upgrades on one node), small server
    # resources -- what this file used to patch by hand.
    - ./components/single-node
  postBuild:
    substitute:
      OPENBAO_STORAGE_CLASS: local-path
      OPENBAO_STORAGE_SIZE: 2Gi
      # An OPAQUE LABEL for the seal key in ./openbao-prereqs. It MUST change
      # whenever the key does, or OpenBao cannot tell them apart.
      OPENBAO_SEAL_KEY_ID: edge-20261004
      OPENBAO_SEAL_SECRET: openbao-static-seal # pragma: allowlist secret
      OPENBAO_SEAL_SECRET_KEY: key # pragma: allowlist secret
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-httproute
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  dependsOn:
    - name: openbao
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-repo
  # flux #631: the route is its own component; as a path it renders just the
  # HTTPRoute (it used to be the base reduced by delete patches).
  path: ./apps/openbao/components/httproute
  postBuild:
    substitute:
      HOSTNAME: openbao
      DOMAIN: ${EDGE_DOMAIN}
      GATEWAY_NAME: ${EDGE_GATEWAY_NAME}
      GATEWAY_NAMESPACE: default
