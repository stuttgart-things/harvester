---
# OpenBao on the node: the PKI for ACME device enrollment (ESP32) and other
# services that need certificates from the edge CA (harvester#364, phase 3).
# Configured by Terraform (../terraform/openbao), not by Flux.
#
# Three Kustomizations, in this order:
#   openbao-prereqs    namespace + static seal key (SOPS)
#   openbao            flux apps/openbao + components/seal-static (raft on
#                      local-path, static seal: unseals itself on every restart)
#   openbao-httproute  the HTTPRoute, only after openbao is Ready
#
# THE FIRST ROLLOUT STOPS AT "openbao not Ready", by design: the pod is not
# ready until `bao operator init` has run once (README, OpenBao). The static
# seal unseals on restart; it does not initialise.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-prereqs
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 2m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/edge/apps/openbao-prereqs
  decryption:
    provider: sops
    secretRef:
      name: sops-age # pragma: allowlist secret
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  dependsOn:
    - name: openbao-prereqs
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-repo
  path: ./apps/openbao
  components:
    - ./components/seal-static
  # Patches run BEFORE postBuild substitution: the base's namespace is still the
  # literal ${OPENBAO_NAMESPACE:-openbao} then, so they select by kind + name
  # (target), never by namespace.
  patches:
    # The route goes to openbao-httproute below (after the Service exists:
    # a route first makes Cilium answer 500 for good).
    - target:
        kind: HTTPRoute
        name: openbao
      patch: |
        $patch: delete
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: openbao
    - target:
        kind: HelmRelease
        name: openbao
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: openbao
        spec:
          # Helm must not wait for the pod: it is not ready before
          # `bao operator init`, and an install that waits for it fails.
          install:
            disableWait: true
          upgrade:
            disableWait: true
          values:
            # No agent injector: nothing on this node uses sidecar injection,
            # and its hard self anti-affinity blocks upgrades on one node
            # (clusters/platform/apps-platform.yaml).
            injector:
              enabled: false
            server:
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
  postBuild:
    substitute:
      OPENBAO_STORAGE_CLASS: local-path
      OPENBAO_STORAGE_SIZE: 2Gi
      # An OPAQUE LABEL for the seal key in ./openbao-prereqs. It MUST change
      # whenever the key does, or OpenBao cannot tell them apart.
      OPENBAO_SEAL_KEY_ID: edge-20261004
      OPENBAO_SEAL_SECRET: openbao-static-seal # pragma: allowlist secret
      OPENBAO_SEAL_SECRET_KEY: key # pragma: allowlist secret
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-httproute
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  dependsOn:
    - name: openbao
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-repo
  # The same base, reduced to its HTTPRoute -- so the route stays the flux
  # repo's, only applied later.
  path: ./apps/openbao
  patches:
    # by kind only: its name is still the literal ${OPENBAO_NAMESPACE:-openbao}
    # at patch time
    - target:
        kind: Namespace
      patch: |
        $patch: delete
        apiVersion: v1
        kind: Namespace
        metadata:
          name: openbao
    - target:
        kind: HelmRepository
        name: openbao
      patch: |
        $patch: delete
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: HelmRepository
        metadata:
          name: openbao
    - target:
        kind: HelmRelease
        name: openbao
      patch: |
        $patch: delete
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: openbao
  postBuild:
    substitute:
      HOSTNAME: openbao
      DOMAIN: edge-tt-test1.4sthings.tiab.ssc.sva.de
      GATEWAY_NAME: edge-gateway
      GATEWAY_NAMESPACE: default
