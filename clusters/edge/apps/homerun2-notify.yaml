---
# Applies ./homerun2-notify (the notification-catcher's routing ConfigMap) in a
# Kustomization of its own, not as part of edge-apps.
#
# The ConfigMap lives in namespace homerun2, which only the homerun2
# Kustomization creates -- in the same edge-apps apply that would carry the
# ConfigMap. Listed directly, it fails that apply on a fresh cluster before
# homerun2 ever exists: deadlock. On its own, it fails and retries until
# homerun2 has created the namespace, then applies; the notification-catcher pod
# mounts it and homerun2 (wait: true) gets Ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-notify
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 30s
  timeout: 2m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/edge/apps/homerun2-notify
