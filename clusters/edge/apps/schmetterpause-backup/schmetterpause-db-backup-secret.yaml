---
# The credentials tabletennis' schmetterpause-db-backup-sops component reads
# (ObjectStore schmetterpause-db: s3Credentials + endpointCA). Caller-supplied
# by design (flux apps/tabletennis/components/schmetterpause-db-backup-sops).
#
# Not SOPS-encrypted itself: it holds only ${VAR} placeholders, filled by the
# schmetterpause-backup Kustomization from edge-secrets-subst -- the same values
# MinIO's root user is created with (../minio.yaml), so there is one source.
#
# trust-bundle.pem: the ObjectStore always references it, but the endpoint is
# in-cluster plain HTTP (http://minio-deployment.minio.svc:9000), so it is never
# used to verify anything. A throwaway self-signed certificate (no key exists)
# keeps the reference valid. Replace it with the real CA if the endpoint ever
# moves to HTTPS.
apiVersion: v1
kind: Secret
metadata:
  name: schmetterpause-db-backup
  namespace: schmetterpause
type: Opaque
stringData:
  ACCESS_KEY_ID: "${MINIO_ADMIN_USER}"
  ACCESS_SECRET_KEY: "${MINIO_ADMIN_PASSWORD}"
  trust-bundle.pem: |
    -----BEGIN CERTIFICATE-----
    MIIBozCCAUmgAwIBAgIUY+7jd2fLzshF86U47WbTxaWcDl8wCgYIKoZIzj0EAwIw
