---
# MinIO on the node: the S3 target for schmetterpause's CNPG backups
# (./schmetterpause-backup.yaml, tabletennis.yaml). flux apps/minio from the
# flux-repo OCI artifact. Its HTTPRoutes are a separate Kustomization
# (minio-httproute below), applied only after this one is Ready -- the same
# split as clusters/platform/apps/minio(-httproute).yaml.
#
# SAME-NODE BACKUP. The bucket sits on the same eMMC as the database. It
# protects against a bad migration or a deleted table (WAL archive + daily base
# backup, point-in-time recovery), NOT against losing the box. An off-box copy
# (mc mirror to the lab when online, or USB) is a later step (harvester#364).
#
# Chart 16.0.10, not the base default 17.x: 17 adds a console image
# (ghcr.io/bitnami/minio-object-browser) that cannot be pulled
# (flux apps/platform/components/minio/ks-minio.yaml).
#
# Buckets, users and policies are Terraform's (../terraform/minio): the bucket
# schmetterpause-cnpg, the user schmetterpause-cnpg and its bucket-only policy.
# The chart's provisioning Job is NOT used: its client image
# (bitnami/minio-client) is gone from Docker Hub. The bucket was first created
# via `defaultBuckets` (#365) and adopted by Terraform with an import block;
# defaultBuckets is gone so that Terraform is the only owner.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minio
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-repo
  path: ./apps/minio
  postBuild:
    substituteFrom:
      # MINIO_ADMIN_USER / MINIO_ADMIN_PASSWORD
      - kind: Secret
        name: edge-secrets-subst
        optional: false
    substitute:
      MINIO_VERSION: 16.0.10
      STORAGE_CLASS: local-path
      MINIO_STORAGE_SIZE: 5Gi
      MINIO_INGRESS_ENABLED: "false"
      # pre-release.yaml renders two Certificates from it (unused with the
      # Gateway, but they must resolve): cert-manager-selfsigned's CA issuer
      CLUSTER_ISSUER: cluster-ca
      INGRESS_HOSTNAME_API: minio
      INGRESS_HOSTNAME_CONSOLE: minio-console
      INGRESS_DOMAIN: ${EDGE_DOMAIN}
---
# The routes, only after the Service exists. A route applied before its
# backend Service makes Cilium answer 500 for good (flux apps/homerun2/README;
# the reason homerun2-routes is split too). In one Kustomization with the
# HelmRelease, the route is applied at once and the Service only when
# helm-controller installs the chart.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minio-httproute
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
spec:
  dependsOn:
    - name: minio
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-repo
  path: ./apps/minio/components/httproute
  postBuild:
    substitute:
      MINIO_NAMESPACE: minio
      INGRESS_HOSTNAME_API: minio
      INGRESS_HOSTNAME_CONSOLE: minio-console
      INGRESS_DOMAIN: ${EDGE_DOMAIN}
      GATEWAY_NAME: ${EDGE_GATEWAY_NAME}
      GATEWAY_NAMESPACE: default
