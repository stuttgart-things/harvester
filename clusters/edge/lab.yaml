---
# LAB ONLY: what the lab test node has instead of the edge's public side
# (deSEC name + Let's Encrypt, harvester#364). Not part of the LattePanda.
#
# ./lab: the LabDA Vault as ClusterIssuer vault-pki-4sthings, and a second
# Gateway edge-play-gateway on its own VIP (EDGE_PLAY_LB_IP) with a wildcard
# for EDGE_PLAY_DOMAIN from that Vault. The internal Gateway keeps edge-ca.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge-lab
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: infrastructure
spec:
  dependsOn:
    - name: edge-infra
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/edge/lab
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
        optional: false
