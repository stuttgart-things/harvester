---
# DRAFT -- NOT LISTED in kustomization.yaml. The Harvester counterpart of
# stuttgart-things clusters/labda/vsphere/machinery-xrs/app-dev.yaml; read that
# file's comments first, this one only records what differs.
#
# DIFFERS FROM LabDA:
#   provider: harvester      RANCHER builds the VM: the RancherCluster gets a
#                            Harvester machine pool, the way tabletennis was
#                            built on crossplane-mgmt (xplane-cluster 0.22.0,
#                            the default for provider: harvester). No
#                            HarvesterVM, no base-OS or join play
#   node address             static, reserved in clusterbook as
#                            `app-dev-hv-node` BEFORE the VM exists
#                            (machinePool in cluster-vault-sthings-lab). The
#                            kubeconfig stage logs in there with the Packer
#                            image's credentials (tekton-ci/ansible-credentials)
#                            and retries until the node is up
#   environmentConfig        sthings-lab -- selects cluster-vault-sthings-lab
#   rancher.environmentConfig
#                            rancher-join-sthings-lab -- also carries the
#                            Harvester the machine pool is built on (cloud
#                            credential, image, network)
#   vaultAddr                the OpenBao on platform, not the LabUL infra Vault
#   reservation.networkKey   192.168.10, this lab's Clusterbook network
#   size: medium             `large` (8 CPU / 16 GiB) fits on Harvester but
#                            would be its biggest guest; start smaller.
#                            Becomes the pool's HarvesterConfig: 4 CPU / 8 GiB
#                            / 64 GiB
#   CNI                      none from k3s; cilium from the Platform, through
#                            node:6443 -- the same as every rancher order.
#                            Rancher's proxy cannot be that path (it needs
#                            cattle-cluster-agent on a pod network) and is not
#   no NFS labels            the lab has had no NFS server since infra.sthings.lab
#                            was switched off (harvester#152)
#   no observability         platform's Argo CD has no observability-platform
#                            ApplicationSet; with the profile set, monitoring
#                            would never appear and nothing would say so
#
# NOT BLOCKED BY crossplane-configurations#503 ANY MORE: that is the custom-node
# VM this stack used to build, which boots with no user the ansible stages can
# log in as. The machine pool boots the lab's Packer image, whose login the
# ansible credentials are.
#
# BEFORE LISTING THIS:
#   1. published and installed: xplane-cluster 0.22.0 (stuttgart-things/kcl)
#      and rancher-cluster v0.10.0 (crossplane-configurations, the
#      `harvester.networkData` field), plus the `cluster` Configuration pinned
#      to that module -- until then the installed Composition still builds a
#      HarvesterVM. All three are on branches named
#      claude/harvester-cluster-stack-status-yrmcuv.
#   2. ../machinery-hv-fleet-state/clusterbook.yaml applied, and one
#      reservation proven by hand through it -- the TLS trust of
#      clusterbook.platform.sthings.lab is the open question there.
#   3. `crossplane render` of this file against the live Compositions, as in
#      ../machinery-hv/README.md Log step 10: an IPReservation
#      app-dev-hv-node-ip, then a RancherCluster with infrastructure: harvester
#      and networkData, no HarvesterVM, no join.
#   4. every step in ../machinery-hv-fleet-state/README.md, plus the Argo CD
#      registration preconditions in ../machinery-hv/README.md.
apiVersion: config.stuttgart-things.com/v1alpha1
kind: ClusterStack
metadata:
  name: app-dev-hv
  namespace: default
  annotations:
    stuttgart-things.com/management-cluster: machinery-hv
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  provider: harvester
  distribution: rancher-k3s
  size: medium
  environmentConfig: sthings-lab
  kubeconfig:
    # vaultSecretName left at its default `vault`: tekton-ci/vault in the fleet
    # state carries the kubeconfig-writer AppRole the upload stage writes with,
    # and the read side is derived from that name (-> ClusterProviderConfig
    # `vault-kubeconfigs`).
    lifecycle:
      vaultAddr: https://openbao.platform.sthings.lab
  profiles:
    - network
    - security
    - storage-openebs
    - homerun2
    # NOT tabletennis in the first order: it pulls schmetterpause, whose -backup
    # entry reads the shared object-store-backup -- not in
    # cluster-vault-sthings-lab and not seeded, and the render fails on it
    # (README "Log" step 10). Add it back with that entry.
  rancher:
    environmentConfig: rancher-join-sthings-lab
    argocd:
      register: true
      reservation:
        enabled: true
        networkKey: '192.168.10'
      labels:
        env: sthings-lab
  platformEnabled: true
  platform:
    fluxInit:
      enabled: false
    clusterSecrets:
      enabled: true
    vaultIssuer:
      enabled: true
      authProvider: provider-vault
      vaultProviderConfigRef: vault
      vaultAddr: https://openbao.platform.sthings.lab
      pkiRole: sthings-lab
      caSourceSecret: openbao-pki-source-ca  # pragma: allowlist secret
