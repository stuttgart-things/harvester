# Skip SOPS-encrypted files: hooks must never rewrite them (whitespace/EOF
# edits invalidate the SOPS MAC), and detect-secrets only sees ciphertext —
# the encrypted values and age recipients are false positives.
#
# TWO naming conventions are in use and both have to be here. `*.enc.yaml` is the
# older one; `*.sops.json` is what the openbao roots document for their
# terraform variables (see clusters/platform/openbao/app-secrets/README.md).
# The second was written down long before a file of that shape existed, so this
# pattern never caught up — the first one landed in #211 and detect-secrets
# flagged its ciphertext as a "Base64 High Entropy String", correctly and
# uselessly. JSON has no comments, so `pragma: allowlist secret` is not an
# option there; the exclude is.
exclude: '(^\.task/|^secrets/|\.enc\.ya?ml$|\.sops\.(ya?ml|json)$|secrets?\.ya?ml$)'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      # Without this the hook only runs while git is mid-merge, so a
      # conflict resolved badly and pushed from the web UI -- which is how
      # secrets/README.md kept its markers -- never gets looked at.
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-symlinks
      - id: check-yaml
        args: ['--allow-multiple-documents']
        # mkdocs-Configs nutzen !!python/name:-Tags (pymdownx superfences),
        # die check-yaml (yaml.safe_load) nicht kennt.
        exclude: '^system-inventory/mkdocs\.yml$'
      - id: detect-private-key
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0  # or specific git tag
    hooks:
      - id: shellcheck
        args:
          - "-e"
          - "SC1090"
          - "-e"
          - "SC1091"
  - repo: https://github.com/hadolint/hadolint
    rev: "v2.12.0"
    hooks:
      - id: hadolint-docker
        args:
          - --ignore
          - DL4006
          - --ignore
          - DL3015
  - repo: https://github.com/sirosen/check-jsonschema
    rev: 0.30.0
    hooks:
      - id: check-github-workflows

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        description: Detects high entropy strings that are likely to be passwords.
        entry: detect-secrets-hook
        language: python
        # for backward compatibility
        files: .*  # all files
        exclude: ^secrets/
