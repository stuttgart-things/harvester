---
# The CLIs for the machine you work from -- docs/workstation.md.
# sthings.container.tools with THIS selection (-e @workstation/tools.yaml):
# the `bin` dict replaces the collection's full tool list. Version check
# first, download only on a mismatch -- a rerun changes nothing.
# Docker itself: sthings.container.docker (docs/workstation.md).
dagger_version: 0.21.10    # datasource=github-tags depName=dagger/dagger
kubectl_version: v1.35.9   # datasource=github-tags depName=kubernetes/kubectl
helm_version: 4.3.0        # datasource=github-tags depName=helm/helm
k9s_version: 0.51.0        # datasource=github-tags depName=derailed/k9s
flux_version: 2.9.6        # datasource=github-tags depName=fluxcd/flux2
sops_version: 3.12.1       # datasource=github-tags depName=getsops/sops
age_version: 1.2.1         # datasource=github-tags depName=FiloSottile/age

bin:
  dagger:
    bin_name: dagger
    bin_version: "{{ dagger_version }}"
    check_bin_version_before_installing: true
    source_url: "https://github.com/dagger/dagger/releases/download/v{{ dagger_version }}/dagger_v{{ dagger_version }}_linux_amd64.tar.gz"
    bin_to_copy: dagger
    to_remove: ""
    bin_dir: /usr/local/bin
    version_cmd: " version"
    target_version: "{{ dagger_version }}"
  kubectl:
    bin_name: kubectl
    bin_version: "{{ kubectl_version }}"
    check_bin_version_before_installing: true
    source_url: "https://dl.k8s.io/{{ kubectl_version }}/bin/linux/amd64/kubectl"
    bin_to_copy: kubectl
    to_remove: kubectl
    bin_dir: /usr/local/bin
    version_cmd: " version --client"
    target_version: "{{ kubectl_version }}"
  helm:
    bin_name: helm
    bin_version: "{{ helm_version }}"
    check_bin_version_before_installing: true
    source_url: "https://get.helm.sh/helm-v{{ helm_version }}-linux-amd64.tar.gz"
    bin_to_copy: linux-amd64/helm
    to_remove: linux-amd64
    bin_dir: /usr/local/bin
    version_cmd: " version"
    target_version: "{{ helm_version }}"
  k9s:
    bin_name: k9s
    bin_version: "{{ k9s_version }}"
    check_bin_version_before_installing: true
    source_url: "https://github.com/derailed/k9s/releases/download/v{{ k9s_version }}/k9s_Linux_amd64.tar.gz"
    bin_to_copy: k9s
    to_remove: ""
    bin_dir: /usr/local/bin
    version_cmd: " version --short"
    target_version: "{{ k9s_version }}"
  flux:
    bin_name: flux
    bin_version: "{{ flux_version }}"
    check_bin_version_before_installing: true
    source_url: "https://github.com/fluxcd/flux2/releases/download/v{{ flux_version }}/flux_{{ flux_version }}_linux_amd64.tar.gz"
    bin_to_copy: flux
    to_remove: ""
    bin_dir: /usr/local/bin
    version_cmd: " version --client"
    target_version: "{{ flux_version }}"
  sops:
    bin_name: sops
    bin_version: "{{ sops_version }}"
    check_bin_version_before_installing: true
    source_url: "https://github.com/getsops/sops/releases/download/v{{ sops_version }}/sops-v{{ sops_version }}.linux.amd64"
    bin_to_copy: "sops-v{{ sops_version }}.linux.amd64"
    to_remove: ""
    bin_dir: /usr/local/bin/sops         # a file path: renames the download to sops
    version_cmd: " --version --disable-version-check"
    target_version: "{{ sops_version }}"
  age:
    bin_name: age
    bin_version: "{{ age_version }}"
    check_bin_version_before_installing: true
    source_url: "https://github.com/FiloSottile/age/releases/download/v{{ age_version }}/age-v{{ age_version }}-linux-amd64.tar.gz"
    bin_to_copy: age/age
    to_remove: age
    bin_dir: /usr/local/bin
    version_cmd: " --version"
    target_version: "{{ age_version }}"
  age-keygen:
    bin_name: age-keygen
    bin_version: "{{ age_version }}"
    check_bin_version_before_installing: true
    source_url: "https://github.com/FiloSottile/age/releases/download/v{{ age_version }}/age-v{{ age_version }}-linux-amd64.tar.gz"
    bin_to_copy: age/age-keygen
    to_remove: age
    bin_dir: /usr/local/bin
    version_cmd: " --version"
    target_version: "{{ age_version }}"
