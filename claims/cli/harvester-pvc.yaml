---
apiVersion: resources.stuttgart-things.com/v1alpha1
kind: VolumeClaim
metadata:
  name: test-pvc-harvester
  namespace: default
spec:
  accessModes:
  - ReadWriteMany
  annotations:
    description: A simple persistent volume claim for test data on harvester cluster
  namespace: default
  providerConfigRef: harvester
  pvcName: test-pvc-harvester
  storage: '10Gi'
  storageClassName: harvester-longhorn
  volumeMode: Filesystem
