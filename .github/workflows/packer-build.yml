---
name: Packer Build

# Two entry points:
#   * workflow_dispatch — manually build any golden/dev image (optionally upload).
#   * push to main (golden + dev) — every changed image is released: built from
#     main, registered as <name>-<version>, and its pin moved by a pin PR
#     (packer-release.yml). The PR build before it is a test: validation-only
#     for golden, a throwaway pr<N> image for dev.
# Build always runs from packer/_build/ selecting an image via its build.pkrvars.hcl.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to build (tier/name)"
        required: true
        default: "golden/sthings-u26"
        type: choice
        options:
          - golden/sthings-u26
          - dev/u26-dev
          - golden/sthings-rocky9
          - dev/rocky9-dev
          - golden/sthings-leap
          - dev/leap-dev
          - golden/sthings-u26-k3s

      upload_to_harvester:
        description: "Upload the built image to Harvester"
        required: false
        default: false
        type: boolean

      runner:
        description: "Runner label to execute the job on"
        required: true
        default: "kvm"
        type: string

      packer_log:
        description: "Enable Packer debug logging"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
    paths:
      # Only a changed image dir triggers a release. Shared _build changes do
      # NOT auto-rebuild every image (see detect-release); rebuild affected
      # images via workflow_dispatch or by touching their dir.
      - "packer/golden/**"
      - "packer/dev/**"

permissions:
  contents: read

jobs:
  # --- Manual build of a single image -------------------------------------
  dispatch:
    name: "Build ${{ inputs.image }}"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner }}
    # Every build now publishes to MinIO — golden as a base for dev images, dev
    # because that is where Harvester downloads it from — so the MINIO_* secrets
    # in the harvester environment are always needed.
    environment: harvester
    env:
      PACKER_LOG: ${{ inputs.packer_log && 1 || 0 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve image name, tier and version
        id: meta
        run: |
          # The Harvester VMI is versioned; the MinIO key is not. See
          # register-image.sh for why images are never replaced in place.
          {
            echo "name=$(basename '${{ inputs.image }}')"
            echo "tier=$(dirname '${{ inputs.image }}')"
            echo "version=$(date -u +%y.%-m%d.%H%M)"
          } >> "$GITHUB_OUTPUT"

      - name: Show build parameters
        run: |
          echo "Image      : ${{ inputs.image }}"
          echo "Var file   : ../${{ inputs.image }}/build.pkrvars.hcl"
          echo "Version    : ${{ steps.meta.outputs.version }}"
          echo "Register   : ${{ inputs.upload_to_harvester }}"
          echo "Runner     : ${{ inputs.runner }}"

      - name: Packer init
        working-directory: packer/_build
        run: packer init .

      - name: Compute sthings password hash
        # Hash the plaintext STHINGS_PASSWORD (harvester env secret) so only the
        # SHA-512 hash enters the image. Empty when the secret/env is absent.
        env:
          STHINGS_PASSWORD: ${{ secrets.STHINGS_PASSWORD }}
        run: |
          if [ -n "${STHINGS_PASSWORD}" ]; then
            HASH=$(openssl passwd -6 "${STHINGS_PASSWORD}")
            echo "::add-mask::${HASH}"
            echo "STHINGS_PASSWORD_HASH=${HASH}" >> "$GITHUB_ENV"
          fi

      - name: Packer build
        working-directory: packer/_build
        env:
          PKR_VAR_sthings_password: ${{ env.STHINGS_PASSWORD_HASH }}
        run: packer build -var-file="../${{ inputs.image }}/build.pkrvars.hcl" .

      # MinIO first, Harvester second: Harvester downloads the image from this
      # URL itself, so it has to resolve before the VMI is created (issue #215).
      - name: Publish image to MinIO
        id: publish
        working-directory: packer/_build
        env:
          IMAGE_FILE: output/${{ steps.meta.outputs.name }}-amd64.img
          IMAGE_NAME: ${{ steps.meta.outputs.name }}
          S3_PREFIX: ${{ steps.meta.outputs.tier }}
          S3_ENDPOINT: https://artifacts.platform.sthings.lab
          S3_BUCKET: packer
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: bash publish-base.sh

      - name: Register image with Harvester
        if: inputs.upload_to_harvester
        working-directory: packer/_build
        env:
          UPLOAD_TO_HARVESTER: "true"
          HARVESTER_VIP: ${{ secrets.HARVESTER_VIP }}
          HARVESTER_PASSWORD: ${{ secrets.HARVESTER_PASSWORD }}
          IMAGE_NAME: ${{ steps.meta.outputs.name }}
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
          IMAGE_URL: ${{ steps.publish.outputs.image_url }}
        run: bash register-image.sh

      - name: Prune superseded images
        # Cleans up images that nothing uses any more: older release builds
        # beyond KEEP, and per-PR images whose PR has closed. Never fails the
        # job — a cleanup problem is not a reason to fail a good image.
        if: inputs.upload_to_harvester && vars.PRUNE_IMAGES != 'false'
        continue-on-error: true
        working-directory: packer/_build
        env:
          PRUNE_DRY_RUN: "false"
          HARVESTER_VIP: ${{ secrets.HARVESTER_VIP }}
          HARVESTER_PASSWORD: ${{ secrets.HARVESTER_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: bash prune-images.sh

  # --- Detect images to release after a merge to main --------------------
  detect-release:
    name: Detect images to release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      golden: ${{ steps.detect.outputs.golden }}
      dev: ${{ steps.detect.outputs.dev }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect changed image dirs
        id: detect
        run: |
          # Release ONLY the image dirs that changed in this push. A shared
          # _build change does NOT blanket-rebuild every image (avoids wasteful
          # re-uploads when the change is a no-op for most images). If a _build
          # change must propagate to other images, touch their dir or rebuild
          # them manually via workflow_dispatch.
          #
          # catalog-info.yaml is Backstage metadata and *.md is documentation,
          # neither is a build input (same rule as packer-pr-build.yml). This
          # matters more here than on a PR: a release moves a pin, and for a dev
          # image that pin PR merges itself — a README edit to u26-dev would
          # otherwise move u26-dev AND the ubuntu24 alias on crossplane-mgmt.
          # A dir whose var-file is gone was deleted — there is nothing to build.
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
            | grep -vE '/catalog-info\.yaml$|\.md$' || true)

          for tier in golden dev; do
            DIRS=$(echo "$CHANGED" | grep -oP "^packer/${tier}/[^/]+" | sort -u || true)
            NAMES=$(for d in $DIRS; do
              if [ -f "$d/build.pkrvars.hcl" ]; then basename "$d"; fi
            done)
            JSON=$(echo "$NAMES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "${tier}=$JSON" >> "$GITHUB_OUTPUT"
            echo "${tier} images to release: $JSON"
          done

  # --- Release: build, register, open a pin PR ---------------------------
  # Golden before dev: a dev image layers on the golden artifact in MinIO, so
  # when one push changes both, dev must build on the new golden, not the old.
  release-golden:
    name: "Release golden/${{ matrix.name }}"
    needs: detect-release
    if: needs.detect-release.outputs.golden != '[]'
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJson(needs.detect-release.outputs.golden) }}
    permissions:
      contents: write        # the pin PR pushes its branch
      pull-requests: write   # ...and opens it
    uses: ./.github/workflows/packer-release.yml
    with:
      tier: golden
      name: ${{ matrix.name }}
    secrets: inherit # pragma: allowlist secret

  release-dev:
    name: "Release dev/${{ matrix.name }}"
    needs: [detect-release, release-golden]
    # Runs when no golden was released (skipped), not when one failed: a dev
    # build on a golden that failed to publish would layer on the stale base.
    if: >-
      always() &&
      needs.detect-release.result == 'success' &&
      needs.detect-release.outputs.dev != '[]' &&
      needs.release-golden.result != 'failure' &&
      needs.release-golden.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJson(needs.detect-release.outputs.dev) }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/packer-release.yml
    with:
      tier: dev
      name: ${{ matrix.name }}
    secrets: inherit # pragma: allowlist secret
