---
name: Packer Build

# Two entry points:
#   * workflow_dispatch — manually build any golden/dev image (optionally upload).
#   * push to main (golden) — review-gated golden images are uploaded AFTER merge
#     (their PR build is validation-only). Dev images upload during their PR build.
# Build always runs from packer/_build/ selecting an image via its build.pkrvars.hcl.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to build (tier/name)"
        required: true
        default: "golden/sthings-u26"
        type: choice
        options:
          - golden/sthings-u26
          - dev/u26-dev
          - golden/sthings-rocky9
          - dev/rocky9-dev
          - golden/sthings-leap
          - dev/leap-dev
          - golden/sthings-u26-k3s

      upload_to_harvester:
        description: "Upload the built image to Harvester"
        required: false
        default: false
        type: boolean

      runner:
        description: "Runner label to execute the job on"
        required: true
        default: "kvm"
        type: string

      packer_log:
        description: "Enable Packer debug logging"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
    paths:
      # Only a changed golden dir triggers a post-merge rebuild. Shared _build
      # changes do NOT auto-rebuild every golden (see detect-golden); rebuild
      # affected images via workflow_dispatch or by touching their dir.
      - "packer/golden/**"

permissions:
  contents: read

jobs:
  # --- Manual build of a single image -------------------------------------
  dispatch:
    name: "Build ${{ inputs.image }}"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner }}
    # Every build now publishes to MinIO — golden as a base for dev images, dev
    # because that is where Harvester downloads it from — so the MINIO_* secrets
    # in the harvester environment are always needed.
    environment: harvester
    env:
      PACKER_LOG: ${{ inputs.packer_log && 1 || 0 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve image name, tier and version
        id: meta
        run: |
          # The Harvester VMI is versioned; the MinIO key is not. See
          # register-image.sh for why images are never replaced in place.
          {
            echo "name=$(basename '${{ inputs.image }}')"
            echo "tier=$(dirname '${{ inputs.image }}')"
            echo "version=$(date -u +%y.%-m%d.%H%M)"
          } >> "$GITHUB_OUTPUT"

      - name: Show build parameters
        run: |
          echo "Image      : ${{ inputs.image }}"
          echo "Var file   : ../${{ inputs.image }}/build.pkrvars.hcl"
          echo "Version    : ${{ steps.meta.outputs.version }}"
          echo "Register   : ${{ inputs.upload_to_harvester }}"
          echo "Runner     : ${{ inputs.runner }}"

      - name: Packer init
        working-directory: packer/_build
        run: packer init .

      - name: Compute sthings password hash
        # Hash the plaintext STHINGS_PASSWORD (harvester env secret) so only the
        # SHA-512 hash enters the image. Empty when the secret/env is absent.
        env:
          STHINGS_PASSWORD: ${{ secrets.STHINGS_PASSWORD }}
        run: |
          if [ -n "${STHINGS_PASSWORD}" ]; then
            HASH=$(openssl passwd -6 "${STHINGS_PASSWORD}")
            echo "::add-mask::${HASH}"
            echo "STHINGS_PASSWORD_HASH=${HASH}" >> "$GITHUB_ENV"
          fi

      - name: Packer build
        working-directory: packer/_build
        env:
          PKR_VAR_sthings_password: ${{ env.STHINGS_PASSWORD_HASH }}
        run: packer build -var-file="../${{ inputs.image }}/build.pkrvars.hcl" .

      # MinIO first, Harvester second: Harvester downloads the image from this
      # URL itself, so it has to resolve before the VMI is created (issue #215).
      - name: Publish image to MinIO
        id: publish
        working-directory: packer/_build
        env:
          IMAGE_FILE: output/${{ steps.meta.outputs.name }}-amd64.img
          IMAGE_NAME: ${{ steps.meta.outputs.name }}
          S3_PREFIX: ${{ steps.meta.outputs.tier }}
          S3_ENDPOINT: https://artifacts.platform.sthings.lab
          S3_BUCKET: packer
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: bash publish-base.sh

      - name: Register image with Harvester
        if: inputs.upload_to_harvester
        working-directory: packer/_build
        env:
          UPLOAD_TO_HARVESTER: "true"
          HARVESTER_VIP: ${{ secrets.HARVESTER_VIP }}
          HARVESTER_PASSWORD: ${{ secrets.HARVESTER_PASSWORD }}
          IMAGE_NAME: ${{ steps.meta.outputs.name }}
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
          IMAGE_URL: ${{ steps.publish.outputs.image_url }}
        run: bash register-image.sh

  # --- Detect golden images to (re)build after a merge to main ------------
  detect-golden:
    name: Detect golden images to upload
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.detect.outputs.targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect changed golden images
        id: detect
        run: |
          # Rebuild ONLY the golden dirs that changed in this push. A shared
          # _build change does NOT blanket-rebuild every golden (avoids wasteful
          # re-uploads when the change is a no-op for most images). If a _build
          # change must propagate to other images, touch their dir or rebuild
          # them manually via workflow_dispatch.
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)
          DIRS=$(echo "$CHANGED" | grep -oP '^packer/golden/[^/]+' | sort -u || true)

          if [ -z "$DIRS" ]; then
            echo "targets=[]" >> "$GITHUB_OUTPUT"
            echo "No golden images to rebuild."
            exit 0
          fi

          JSON=$(echo "$DIRS" | jq -R -s -c '
            split("\n") | map(select(length > 0)) | map(
              (split("/")) as $p | {
                name:     $p[2],
                var_file: ("../golden/" + $p[2] + "/build.pkrvars.hcl")
              })')
          echo "targets=$JSON" >> "$GITHUB_OUTPUT"
          echo "Golden images to upload: $JSON"

  # --- Post-merge build + upload of golden images -------------------------
  upload-golden:
    name: "Upload golden ${{ matrix.name }}"
    needs: detect-golden
    if: github.event_name == 'push' && needs.detect-golden.outputs.targets != '[]'
    runs-on: kvm
    environment: harvester
    env:
      PACKER_LOG: 0
      UPLOAD_TO_HARVESTER: ${{ vars.UPLOAD_TO_HARVESTER != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-golden.outputs.targets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve image version
        id: meta
        run: echo "version=$(date -u +%y.%-m%d.%H%M)" >> "$GITHUB_OUTPUT"

      - name: Show build parameters
        run: |
          echo "Golden image : ${{ matrix.name }}"
          echo "Var file     : ${{ matrix.var_file }}"
          echo "Version      : ${{ steps.meta.outputs.version }}"
          echo "Register     : ${{ env.UPLOAD_TO_HARVESTER }}"

      - name: Packer init
        working-directory: packer/_build
        run: packer init .

      - name: Compute sthings password hash
        env:
          STHINGS_PASSWORD: ${{ secrets.STHINGS_PASSWORD }}
        run: |
          if [ -n "${STHINGS_PASSWORD}" ]; then
            HASH=$(openssl passwd -6 "${STHINGS_PASSWORD}")
            echo "::add-mask::${HASH}"
            echo "STHINGS_PASSWORD_HASH=${HASH}" >> "$GITHUB_ENV"
          fi

      - name: Packer build
        working-directory: packer/_build
        env:
          PKR_VAR_sthings_password: ${{ env.STHINGS_PASSWORD_HASH }}
        run: packer build -var-file="${{ matrix.var_file }}" .

      # MinIO first, Harvester second — Harvester pulls from this URL itself.
      - name: Publish golden base to MinIO
        id: publish
        working-directory: packer/_build
        env:
          IMAGE_FILE: output/${{ matrix.name }}-amd64.img
          IMAGE_NAME: ${{ matrix.name }}
          S3_PREFIX: golden
          S3_ENDPOINT: https://artifacts.platform.sthings.lab
          S3_BUCKET: packer
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: bash publish-base.sh

      - name: Register image with Harvester
        id: register
        if: env.UPLOAD_TO_HARVESTER == 'true'
        working-directory: packer/_build
        env:
          UPLOAD_TO_HARVESTER: "true"
          HARVESTER_VIP: ${{ secrets.HARVESTER_VIP }}
          HARVESTER_PASSWORD: ${{ secrets.HARVESTER_PASSWORD }}
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
          IMAGE_URL: ${{ steps.publish.outputs.image_url }}
        run: bash register-image.sh

      - name: Summarise the new image pin
        # The new image carries a fresh lh-<uuid>. Nothing consumes it until the
        # pin in env-config-virtualmachine.yaml is moved, so say so out loud
        # rather than leaving a green build that changed nothing.
        if: steps.register.outcome == 'success'
        run: |
          {
            echo "### Registered \`${{ steps.register.outputs.vmi_name }}\`"
            echo
            echo "Update the pin in \`clusters/crossplane-mgmt/platform/virtual-machine/env-config-virtualmachine.yaml\`:"
            echo
            echo '```yaml'
            echo "      ${{ matrix.name }}:"
            echo "        imageId: default/${{ steps.register.outputs.vmi_name }}"
            echo "        storageClassName: ${{ steps.register.outputs.storage_class }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
