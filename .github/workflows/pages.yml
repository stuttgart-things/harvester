---
name: Build & Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'system-inventory/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'system-inventory/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: system-inventory

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: system-inventory/requirements.txt

      - run: pip install -r requirements.txt

      - name: Install d2
        env:
          D2_VERSION: 0.7.1
        run: |
          curl -fsSL -o /tmp/d2.tgz \
            "https://github.com/d2lang/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/d2.tgz -C /tmp
          sudo install -m755 "/tmp/d2-v${D2_VERSION}/bin/d2" /usr/local/bin/d2
          d2 --version

      # Generiert docs/index.md + docs/topology.d2 aus inventory.yaml.
      # --strict laesst den Build bei IP-Kollisionen o.ae. fehlschlagen.
      - name: Generate docs from inventory.yaml
        run: python tools/gen.py --strict

      - name: Render diagram
        run: d2 --pad 24 --theme 0 docs/topology.d2 docs/topology.svg

      # Fallstrick: |md|-Labels wuerden als <foreignObject> gerendert - die
      # Shape faellt weg und der PDF-Druck bleibt leer.
      - name: Assert diagram has no foreignObject
        run: |
          count=$(grep -c foreignObject docs/topology.svg || true)
          echo "foreignObject: ${count}"
          test "${count}" -eq 0

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: system-inventory/site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
