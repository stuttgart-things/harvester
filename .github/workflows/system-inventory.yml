---
name: System Inventory

on:
  push:
    branches: [main]
    paths:
      - 'system-inventory/**'
      - '.github/workflows/system-inventory.yml'
  pull_request:
    paths:
      - 'system-inventory/**'
      - '.github/workflows/system-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Scoped by ref, so a pull request run and a main run never share a slot.
# The bare `pages` group used before was a single slot for the whole workflow:
# any new run cancelled whatever was in it, which meant an unrelated PR could
# cancel a main deploy and leave the published page silently stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: system-inventory

jobs:
  diagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Install d2
        env:
          D2_VERSION: 0.7.1
        run: |
          curl -fsSL -o /tmp/d2.tgz \
            "https://github.com/d2lang/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/d2.tgz -C /tmp
          sudo install -m755 "/tmp/d2-v${D2_VERSION}/bin/d2" /usr/local/bin/d2
          d2 --version

      # gen.py --strict aborts on duplicate IPs/hostnames, invalid IPs, IPs
      # outside every defined network, and missing descriptions.
      # `make check` then renders and diffs against the committed artifacts, so
      # topology.svg cannot silently fall behind inventory.yaml.
      - name: Validate inventory and assert diagram is current
        run: make check

      - name: Build interactive D3 page
        run: |
          make d3-install
          make html

      # Headless Chrome, not the browser print dialog: no page chrome, fixed
      # margins, deterministic output. The PDF lands inside site/, so Pages
      # serves it next to the page and the colophon can link to it.
      # ubuntu-latest ships Google Chrome preinstalled.
      - name: Render PDF
        run: make pdf

      - name: Upload PDF as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: system-inventory-pdf
          path: system-inventory/site/inventory.pdf
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-pages-artifact@v5
        with:
          path: system-inventory/site

  # The interactive page runs entirely in the browser - Pages only has to serve
  # it. Deploy from main only.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: diagram
    runs-on: ubuntu-latest
    # GitHub Pages allows one deployment at a time. Queue them rather than
    # cancel: a cancelled deploy leaves the previous page published, so the
    # last commit to main would not be the one being served.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
