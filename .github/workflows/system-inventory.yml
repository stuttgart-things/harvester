---
name: System Inventory

on:
  push:
    branches: [main]
    paths:
      - 'system-inventory/**'
      - '.github/workflows/system-inventory.yml'
  pull_request:
    paths:
      - 'system-inventory/**'
      - '.github/workflows/system-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: system-inventory

jobs:
  diagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Install d2
        env:
          D2_VERSION: 0.7.1
        run: |
          curl -fsSL -o /tmp/d2.tgz \
            "https://github.com/d2lang/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/d2.tgz -C /tmp
          sudo install -m755 "/tmp/d2-v${D2_VERSION}/bin/d2" /usr/local/bin/d2
          d2 --version

      # gen.py --strict bricht bei doppelten IPs/Hostnames, ungueltigen IPs,
      # IPs ausserhalb aller Netze und fehlenden Beschreibungen ab.
      # `make check` rendert danach und vergleicht mit den eingecheckten
      # Artefakten - so kann topology.svg nicht hinter inventory.yaml zurueckfallen.
      - name: Validate inventory and assert diagram is current
        run: make check

      - name: Build interactive D3 page
        run: |
          make d3-install
          make html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: system-inventory/site

  # Die interaktive Seite laeuft komplett im Browser - Pages muss sie nur
  # ausliefern. Deploy nur von main.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: diagram
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
