---
name: Packer PR Build

# Folder-driven build for the golden / dev image tiers.
#   packer/golden/<name>/  -> curated base, REVIEW-GATED (build-only on PR, no upload, no auto-merge)
#   packer/dev/<name>/     -> self-service playground (build + upload + auto-merge on PR)
#   packer/_build/         -> shared packer logic (changes trigger a validate of every image)
# Build always runs from packer/_build/ selecting an image via its build.pkrvars.hcl.

on:
  pull_request:
    branches:
      - main
    paths:
      - "packer/golden/**"
      - "packer/dev/**"
      - "packer/_build/**"
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-targets:
    name: Detect changed image targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.detect.outputs.targets }}
      has_golden: ${{ steps.detect.outputs.has_golden }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed image directories
        id: detect
        run: |
          BASE="origin/${{ github.base_ref }}"
          # catalog-info.yaml is Backstage metadata, not a build input — a
          # provenance/catalog-only edit (e.g. the catalog-bot refresh) must not
          # trigger an image rebuild, so exclude it before matching image dirs.
          CHANGED=$(git diff --name-only "$BASE"...HEAD \
            | grep -vE '/catalog-info\.yaml$' \
            | grep -oP '^packer/(golden|dev)/[^/]+' | sort -u || true)

          if [ -z "$CHANGED" ]; then
            echo "targets=[]" >> "$GITHUB_OUTPUT"
            echo "has_golden=false" >> "$GITHUB_OUTPUT"
            echo "No golden/dev image directories changed (shared _build change only)."
            exit 0
          fi

          # Build a matrix entry per changed image dir.
          JSON=$(echo "$CHANGED" | jq -R -s -c '
            split("\n") | map(select(length > 0)) | map(
              (split("/")) as $p | {
                image_dir: .,
                tier:      $p[1],
                name:      $p[2],
                var_file:  ("../" + $p[1] + "/" + $p[2] + "/build.pkrvars.hcl")
              })')
          HAS_GOLDEN=$(echo "$JSON" | jq -r 'any(.[]; .tier == "golden")')

          echo "targets=$JSON" >> "$GITHUB_OUTPUT"
          echo "has_golden=$HAS_GOLDEN" >> "$GITHUB_OUTPUT"
          echo "Changed targets: $JSON"
          echo "PR touches a golden image: $HAS_GOLDEN"

  validate:
    name: Validate packer config (all images)
    needs: detect-targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Packer
        uses: hashicorp/setup-packer@main

      - name: Packer init
        working-directory: packer/_build
        run: packer init .

      - name: Validate every image var-file
        working-directory: packer/_build
        run: |
          rc=0
          for vf in ../golden/*/build.pkrvars.hcl ../dev/*/build.pkrvars.hcl; do
            [ -e "$vf" ] || continue
            echo "::group::packer validate $vf"
            if packer validate -var-file="$vf" .; then
              echo "OK: $vf"
            else
              echo "::error::packer validate failed for $vf"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

  build:
    name: "Build ${{ matrix.tier }}/${{ matrix.name }}"
    needs: [detect-targets, validate]
    if: needs.detect-targets.outputs.targets != '[]'
    runs-on: kvm
    # Only the upload-capable (dev) builds need the Harvester environment/secrets.
    environment: ${{ matrix.tier == 'dev' && 'harvester' || '' }}
    env:
      PACKER_LOG: 0
      # Set repo/env variable UPLOAD_TO_HARVESTER=false while Harvester is down.
      UPLOAD_TO_HARVESTER: ${{ vars.UPLOAD_TO_HARVESTER != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-targets.outputs.targets) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve build mode
        id: mode
        run: |
          # Golden = review-gated: build for validation only, never upload on a PR.
          # Dev    = self-service: upload (subject to UPLOAD_TO_HARVESTER) + auto-merge.
          if [ "${{ matrix.tier }}" = "dev" ]; then
            echo "upload=${{ env.UPLOAD_TO_HARVESTER }}" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show build parameters
        run: |
          echo "Image dir   : ${{ matrix.image_dir }}"
          echo "Tier        : ${{ matrix.tier }}"
          echo "Image name  : ${{ matrix.name }}"
          echo "Var file    : ${{ matrix.var_file }}"
          echo "Upload      : ${{ steps.mode.outputs.upload }}"
          echo "PR number   : ${{ github.event.pull_request.number }}"

      - name: Guard — dev image needs a golden source (issue #93)
        if: matrix.tier == 'dev'
        working-directory: packer/_build
        run: |
          SRC=$(grep -E '^[[:space:]]*source_url[[:space:]]*=' "${{ matrix.var_file }}" \
            | sed -E 's/.*=[[:space:]]*"?([^"]*)"?.*/\1/')
          if [ -z "$SRC" ]; then
            echo "::error::source_url is empty in ${{ matrix.var_file }} — set the published golden artifact URL (issue #93) before dev builds can run."
            exit 1
          fi

      - name: Packer init
        working-directory: packer/_build
        run: packer init .

      - name: Compute sthings password hash
        # dev builds run in the harvester environment, so the STHINGS_PASSWORD
        # secret resolves here; golden PR builds have no env (validation only).
        env:
          STHINGS_PASSWORD: ${{ secrets.STHINGS_PASSWORD }}
        run: |
          if [ -n "${STHINGS_PASSWORD}" ]; then
            HASH=$(openssl passwd -6 "${STHINGS_PASSWORD}")
            echo "::add-mask::${HASH}"
            echo "STHINGS_PASSWORD_HASH=${HASH}" >> "$GITHUB_ENV"
          fi

      - name: Packer build
        working-directory: packer/_build
        env:
          PKR_VAR_upload_to_harvester: ${{ steps.mode.outputs.upload }}
          PKR_VAR_harvester_vip: ${{ secrets.HARVESTER_VIP }}
          PKR_VAR_harvester_password: ${{ secrets.HARVESTER_PASSWORD }}
          PKR_VAR_sthings_password: ${{ env.STHINGS_PASSWORD_HASH }}
        run: packer build -var-file="${{ matrix.var_file }}" .

      - name: Auto-merge PR (dev only)
        # Dev images auto-merge on a green build+upload. If the PR also touches a
        # golden image it must be reviewed, so auto-merge is suppressed.
        if: >-
          success() &&
          matrix.tier == 'dev' &&
          steps.mode.outputs.upload == 'true' &&
          needs.detect-targets.outputs.has_golden == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Dev build succeeded. Auto-merging PR #${{ github.event.pull_request.number }}..."
          gh pr merge ${{ github.event.pull_request.number }} \
            --auto \
            --squash \
            --delete-branch
