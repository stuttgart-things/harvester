---
name: Packer PR Build

on:
  pull_request:
    branches:
      - main
    paths:
      - "packer/ubuntu22/**"
      - "packer/ubuntu26/**"
      - "packer/opensuse-leap/**"
      - "packer/rocky/**"
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      packer_dir:
        description: "Packer directory to build"
        required: true
        default: "packer/ubuntu22"
        type: choice
        options:
          - packer/ubuntu22
          - packer/ubuntu26
          - packer/opensuse-leap
          - packer/rocky

      upload_to_harvester:
        description: "Upload the built image to Harvester (uncheck for a build-only run)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-targets:
    name: Detect changed packer targets
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      targets: ${{ steps.detect.outputs.targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed packer directories
        id: detect
        run: |
          declare -A IMAGE_NAMES=(
            ["packer/ubuntu22"]="u22-dev"
            ["packer/ubuntu26"]="u26-dev"
            ["packer/opensuse-leap"]="suse15-dev"
            ["packer/rocky"]="rocky9-dev"
          )
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -oP '^packer/(ubuntu22|ubuntu26|opensuse-leap|rocky)/' | sort -u | sed 's|/$||')
          if [ -z "$CHANGED" ]; then
            echo "targets=[]" >> "$GITHUB_OUTPUT"
          else
            JSON=$(echo "$CHANGED" | jq -R -s -c --argjson names '{"packer/ubuntu22":"u22-dev","packer/ubuntu26":"u26-dev","packer/opensuse-leap":"suse15-dev","packer/rocky":"rocky9-dev"}' \
              'split("\n") | map(select(length > 0)) | map({"packer_dir": ., "image_name": $names[.]})')
            echo "targets=$JSON" >> "$GITHUB_OUTPUT"
          fi

  packer-build-pr:
    name: "Build ${{ matrix.packer_dir }} (${{ matrix.image_name }})"
    needs: detect-targets
    if: github.event_name == 'pull_request' && needs.detect-targets.outputs.targets != '[]'
    runs-on: kvm
    environment: harvester
    env:
      PACKER_LOG: 0
      # Set repo/env variable UPLOAD_TO_HARVESTER=false while Harvester is down.
      # Unset/true keeps the normal upload + auto-merge behaviour.
      UPLOAD_TO_HARVESTER: ${{ vars.UPLOAD_TO_HARVESTER != 'false' }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-targets.outputs.targets) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show build parameters
        run: |
          echo "Packer dir            : ${{ matrix.packer_dir }}"
          echo "Image name            : ${{ matrix.image_name }}"
          echo "Upload to Harvester   : ${{ env.UPLOAD_TO_HARVESTER }}"
          echo "Trigger               : ${{ github.event_name }}"
          echo "PR number             : ${{ github.event.pull_request.number || 'N/A' }}"

      - name: Packer init
        working-directory: ${{ matrix.packer_dir }}
        run: packer init .

      - name: Packer build
        working-directory: ${{ matrix.packer_dir }}
        env:
          PKR_VAR_image_name: ${{ matrix.image_name }}
          PKR_VAR_upload_to_harvester: ${{ env.UPLOAD_TO_HARVESTER }}
          PKR_VAR_harvester_vip: ${{ secrets.HARVESTER_VIP }}
          PKR_VAR_harvester_password: ${{ secrets.HARVESTER_PASSWORD }}
        run: packer build .

      - name: Auto-merge PR
        if: success() && github.event_name == 'pull_request' && env.UPLOAD_TO_HARVESTER == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Build succeeded. Auto-merging PR #${{ github.event.pull_request.number }}..."
          gh pr merge ${{ github.event.pull_request.number }} \
            --auto \
            --squash \
            --delete-branch

  packer-build-dispatch:
    name: "Build ${{ inputs.packer_dir }}"
    if: github.event_name == 'workflow_dispatch'
    runs-on: kvm
    environment: ${{ inputs.upload_to_harvester && 'harvester' || '' }}
    env:
      PACKER_LOG: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve image name
        id: resolve
        run: |
          declare -A IMAGE_NAMES=(
            ["packer/ubuntu22"]="u22-dev"
            ["packer/ubuntu26"]="u26-dev"
            ["packer/opensuse-leap"]="suse15-dev"
            ["packer/rocky"]="rocky9-dev"
          )
          echo "image_name=${IMAGE_NAMES[${{ inputs.packer_dir }}]}" >> "$GITHUB_OUTPUT"

      - name: Show build parameters
        run: |
          echo "Packer dir            : ${{ inputs.packer_dir }}"
          echo "Image name            : ${{ steps.resolve.outputs.image_name }}"
          echo "Upload to Harvester   : ${{ inputs.upload_to_harvester }}"
          echo "Trigger               : ${{ github.event_name }}"

      - name: Packer init
        working-directory: ${{ inputs.packer_dir }}
        run: packer init .

      - name: Packer build
        working-directory: ${{ inputs.packer_dir }}
        env:
          PKR_VAR_image_name: ${{ steps.resolve.outputs.image_name }}
          PKR_VAR_upload_to_harvester: ${{ inputs.upload_to_harvester }}
          PKR_VAR_harvester_vip: ${{ secrets.HARVESTER_VIP }}
          PKR_VAR_harvester_password: ${{ secrets.HARVESTER_PASSWORD }}
        run: packer build .
