---
name: Catalog Index

# Keeps the explicit Backstage catalog index in sync because this repo does not
# use GitHub discovery. Runs AFTER merge to main (so it never fights the
# scaffolder's auto-merged PR), regenerates .backstage/catalog-locations.yaml
# from every catalog-info.yaml in the repo, and stamps git-derived provenance
# onto the packer image entities. Opens a PR with the refresh only if something
# actually changed (so it works even when main is protected).

on:
  push:
    branches:
      - main
    paths:
      - "**/catalog-info.yaml"

# Serialize so two quick merges can't race on the index PR.
concurrency:
  group: catalog-index
  cancel-in-progress: false

permissions:
  contents: write          # create-pull-request pushes the branch
  pull-requests: write     # ...and opens/updates the PR

jobs:
  reindex:
    name: Regenerate catalog index + provenance
    runs-on: ubuntu-latest
    # Don't loop on our own commits (squash-merge of the bot PR carries the tag).
    if: ${{ !contains(github.event.head_commit.message, '[catalog-bot]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0          # full history → authoritative provenance

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install deps
        run: pip install --quiet ruamel.yaml

      - name: Regenerate index + stamp provenance
        run: ./.backstage/catalog-index.sh all

      # Opens (or updates) a single rolling PR from a fixed branch. The action
      # no-ops when the working tree is clean, so a no-change run creates nothing
      # and an already-open PR just gets force-updated to the latest refresh.
      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: catalog-bot/refresh
          delete-branch: true
          commit-message: "chore(catalog): refresh index + provenance [catalog-bot]"
          title: "chore(catalog): refresh index + provenance [catalog-bot]"
          body: |
            Automated refresh by `.backstage/catalog-index.sh`:

            - Regenerated `.backstage/catalog-locations.yaml` from a repo-wide
              `catalog-info.yaml` scan (self-heals adds/deletes).
            - Stamped git-derived provenance onto `packer/**` image entities.

            Triggered by ${{ github.sha }}. Safe to squash-merge.
          labels: catalog
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
