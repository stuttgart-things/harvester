ain</text><rect class="selfbox bot" x="386.0" y="552" width="219.5" height="26" rx="4"/><circle class="num bot" cx="396.0" cy="565" r="11"/><text class="nt" x="396.0" y="569">10</text><text class="lab" x="414.0" y="569">dispatch packer-release.yml</text><line class="ar ci" x1="410.0" y1="606" x2="542.0" y2="606" marker-end="url(#h-ci)"/><circle class="num ci" cx="396.0" cy="606" r="11"/><text class="nt" x="396.0" y="610">11</text><text class="lab" x="414.0" y="597" text-anchor="start">build from main (steps 4–6 again)</text><line class="ar ci" x1="562.0" y1="646" x2="846.0" y2="646" marker-end="url(#h-ci)"/><circle class="num ci" cx="548.0" cy="646" r="11"/><text class="nt" x="548.0" y="650">12</text><text class="lab" x="566.0" y="637" text-anchor="start">register u26-dev-YY.MDD.HHMM</text><rect class="band" x="0" y="658" width="1096" height="36"/><text class="ph" x="22" y="681">C · Pin</text><text class="phs" x="96.19999999999999" y="681">move the image into use</text><line class="ar bot" x1="382.0" y1="732" x2="250.0" y2="732" marker-end="url(#h-bot)"/><circle class="num bot" cx="396.0" cy="732" r="11"/><text class="nt" x="396.0" y="736">13</text><text class="lab" x="378.0" y="723" text-anchor="end">pin-bot/u26-dev PR (auto-merges)</text><line class="ar ci" x1="258.0" y1="772" x2="998.0" y2="772" marker-end="url(#h-ci)"/><circle class="num ci" cx="244.0" cy="772" r="11"/><text class="nt" x="244.0" y="776">14</text><text class="lab" x="262.0" y="763" text-anchor="start">Argo CD syncs EnvironmentConfig</text><line class="ar ui" x1="990.0" y1="812" x2="858.0" y2="812" marker-end="url(#h-ui)"/><circle class="num ui" cx="1004.0" cy="812" r="11"/><text class="nt" x="1004.0" y="816">15</text><text class="lab" x="986.0" y="803" text-anchor="end">new VM, os: ubuntu24 → new image</text><rect class="lh" x="22.0" y="10" width="140" height="50" rx="6"/><text class="lt" x="92.0" y="32">Backstage</text><text class="ls" x="92.0" y="48">scaffolder</text><rect class="lh" x="174.0" 