---
name: Flux Kustomizations
functions:
  - name: clusterbook-assign-ip
    type: http
    method: POST
    url: "${CLUSTERBOOK_URL}/api/v1/networks/${networkKey}/reserve"
    headers:
      Content-Type: application/json
    body:
      cluster: "${cluster}"
      status: "${status}"
      create_dns: "${createDns}"
    response:
      extract: "ip"
