# The matrix Pi's display profile -- installed by the play as
# ~/homerun2-led-catcher/profile.yaml (led_profile_src=/src/profile.yaml: the
# Dagger module mounts this directory at /src). Every run overwrites the file
# on the Pi and restarts the catcher if it changed, so edit it here, not there.
#
# The single source of the display rules: homerun2-dev's simulator mounts
# the same rules (clusters/homerun2-dev/homerun2-led-catcher-profile.yaml,
# keep the two identical), so the panel and the simulator agree. The one that matters for table tennis is tabletennis-score:
# the score stays up (hold) until the next point replaces it.
#
# The panel reads `messages` and `tabletennis` at once (led_redis_stream in
# ./README.md): the demo's score stays up while cards for the cluster pass over
# it (clusters/homerun2-dev/README.md, "The demo").
# Notifications are `card`s (homerun2-led-catcher#121): a header bar in the
# severity colour with the system, the title wrapped over 3-4 lines, the
# message as a ticker, tags, and author + HH:MM of the event. strip_prefix
# drops the `[ERROR] prometheus` the demo-pitcher puts in front of every title
# -- the header already says both. No `text`: on a card it would replace the
# message in the ticker line.
#
# duration 10 matches the wled-mock's base profile, which stays on for 10 s
# per event. A card, unlike `text`, honours it -- also mid-scroll: a long
# message does not finish in 10 s.
displayRules:
  error-all:
    systems: ["*"]
    severity: [ERROR, CRITICAL]
    kind: card
    strip_prefix: true
    duration: 10
  warning-all:
    systems: ["*"]
    severity: [WARNING]
    kind: card
    strip_prefix: true
    duration: 10
  # A live score, not a notification: it should stay readable between points
  # rather than scroll past once. `hold` keeps it up until the next point
  # replaces it, and `static` renders the title alone — the panel is 64x64 and
  # a "tabletennis: " prefix would push the score off the edge.
  #
  # Must stay above default-info: first match wins, and the wildcard there
  # would otherwise take it.
  #
  # Fed by stuttgart-things/zaehlwerk, which owns the running match and pitches
  # `system: tabletennis` on its own stream (zaehlwerk ADR-0003). `duration`
  # only applies on a catcher older than v0.5.1, which ignores `hold`.
  tabletennis-score:
    systems: [tabletennis]
    severity: [INFO, SUCCESS]
    kind: static
    text: "{{ title }}"
    font: 6x10.bdf
    hold: true
    duration: 3
  # Green "all fine" cards -- Flux Ready=True flips, mostly -- come in bursts
  # (one reconcile flips several Kustomizations within seconds). The panel
  # shows one display at a time and, before led-catcher's DISPLAY_QUEUE, kept
  # only the newest waiting one: a third flip arriving during a 10 s card
  # replaced the second, which never reached the panel while the simulator
  # listed it. 4 s keeps them short so a burst clears quickly.
  #
  # Below tabletennis-score, which takes the SUCCESS points of a match.
  success-all:
    systems: ["*"]
    severity: [SUCCESS]
    kind: card
    strip_prefix: true
    duration: 4
  default-info:
    systems: ["*"]
    # DEBUG too: the demo-pitcher sends it, and without a rule nothing shows.
    severity: [INFO, DEBUG]
    kind: card
    strip_prefix: true
    duration: 10
colors:
  error: [255, 0, 0]
  critical: [255, 0, 0]
  warning: [255, 165, 0]
  success: [0, 255, 0]
  info: [0, 100, 255]
  debug: [128, 128, 128]
